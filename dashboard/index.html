/* ════════════════════════════════════════════════════════════════════
   AGGREGATION HELPERS
   ════════════════════════════════════════════════════════════════════ */
const EMPTY = Object.freeze({ l: 0, r: 0, l2r: 0 });

function fin(l, r) { return { l, r, l2r: l > 0 ? r / l * 100 : 0 }; }

/* Aggregate a compact-JSON table for ONE specific month, with optional source filter.
   Returns { grand, grandSrc, dimAggs }
   dimKeyFn(row,maps) → string dim key (or null for src-only tables)
   srcKeyFn(row,maps) → string source name
   monthKeyFn(row,maps) → string month
   extraFilter(row,maps) → bool (optional extra filter e.g. model/state filter)
*/
// makeLR: returns a [l,r] accessor for aggregation rows.
// Old format: [..., L, R]          → getLR(row) = [row[-2], row[-1]]
// New format: [..., L, R_all, R_dms, R_co] (rt_cols=1)
function makeLR(rtCols, RT) {
  if (!rtCols) return row => [row[row.length-2], row[row.length-1]];
  const ri = RT === 'dms' ? 2 : RT === 'co' ? 1 : 3; // distance from end for R
  return row => [row[row.length-4], row[row.length-ri]];
}

function aggMonth(table, maps, month, srcFilter, dimKeyFn, srcKeyFn, monthKeyFn, extraFilter, getLR) {
  const _lr = getLR || (row => [row[row.length-2], row[row.length-1]]);
  const allSrcs = !srcFilter || srcFilter.size === 0;
  const byDim = new Map();
  const bySrc = new Map();
  const byDimSrc = new Map();
  let gL = 0, gR = 0;

  for (const row of table) {
    if (monthKeyFn(row, maps) !== month) continue;
    const src = srcKeyFn ? srcKeyFn(row, maps) : null;
    if (!allSrcs && src && !srcFilter.has(src)) continue;
    if (extraFilter && !extraFilter(row, maps)) continue;
    const [l, r] = _lr(row);
    gL += l; gR += r;

    if (src) { const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c); }
    const dim = dimKeyFn ? dimKeyFn(row, maps) : null;
    if (dim) {
      const c = byDim.get(dim)||[0,0]; c[0]+=l; c[1]+=r; byDim.set(dim,c);
      if (src) {
        const k = dim+'\x00'+src;
        const c2 = byDimSrc.get(k)||[0,0]; c2[0]+=l; c2[1]+=r; byDimSrc.set(k,c2);
      }
    }
  }

  const grandSrc = {};
  for (const [s,v] of bySrc) grandSrc[s] = fin(v[0],v[1]);
  const dimAggs = {};
  for (const [d,dv] of byDim) {
    const srcAgg = {};
    for (const s of bySrc.keys()) {
      const v = byDimSrc.get(d+'\x00'+s);
      srcAgg[s] = v ? fin(v[0],v[1]) : EMPTY;
    }
    dimAggs[d] = { total: fin(dv[0],dv[1]), src: srcAgg };
  }
  return { grand: fin(gL,gR), grandSrc, dimAggs };
}

/* Aggregate across ALL (or selected) months — used for Overview KPIs */
function aggAll(table, maps, monthFilter, srcFilter, dimKeyFn, srcKeyFn, monthKeyFn, extraFilter, getLR) {
  const _lr = getLR || (row => [row[row.length-2], row[row.length-1]]);
  const allMonths = !monthFilter || monthFilter.size === 0;
  const allSrcs   = !srcFilter   || srcFilter.size === 0;
  const byDim = new Map();
  const bySrc = new Map();
  const byDimSrc = new Map();
  let gL = 0, gR = 0;

  for (const row of table) {
    const m = monthKeyFn(row, maps);
    if (!allMonths && !monthFilter.has(m)) continue;
    const src = srcKeyFn ? srcKeyFn(row, maps) : null;
    if (!allSrcs && src && !srcFilter.has(src)) continue;
    if (extraFilter && !extraFilter(row, maps)) continue;
    const [l, r] = _lr(row);
    gL += l; gR += r;

    if (src) { const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c); }
    const dim = dimKeyFn ? dimKeyFn(row, maps) : null;
    if (dim) {
      const c = byDim.get(dim)||[0,0]; c[0]+=l; c[1]+=r; byDim.set(dim,c);
      if (src) {
        const k = dim+'\x00'+src;
        const c2 = byDimSrc.get(k)||[0,0]; c2[0]+=l; c2[1]+=r; byDimSrc.set(k,c2);
      }
    }
  }

  const grandSrc = {};
  for (const [s,v] of bySrc) grandSrc[s] = fin(v[0],v[1]);
  const dimAggs = {};
  for (const [d,dv] of byDim) {
    const srcAgg = {};
    for (const s of bySrc.keys()) {
      const v = byDimSrc.get(d+'\x00'+s);
      srcAgg[s] = v ? fin(v[0],v[1]) : EMPTY;
    }
    dimAggs[d] = { total: fin(dv[0],dv[1]), src: srcAgg };
  }
  return { grand: fin(gL,gR), grandSrc, dimAggs };
}

/* Returns an extraFilter for univ rows [mi,si,sti,tti,li,...] enforcing
   model/state/leadType filters. Returns null when none are active. */
function makeUnivFilter(filters) {
  const allMdl = !filters.models    || filters.models.size    === 0;
  const allSt  = !filters.states    || filters.states.size    === 0;
  const allLT  = !filters.leadTypes || filters.leadTypes.size === 0;
  if (allMdl && allSt && allLT) return null;
  return (row, maps) => {
    if (!allMdl && !filters.models.has(maps.mdl[row[0]]))    return false;
    if (!allSt  && !filters.states.has(maps.st[row[2]]))     return false;
    if (!allLT  && !filters.leadTypes.has(maps.lt[row[3]])) return false;
    return true;
  };
}

/* ════════════════════════════════════════════════════════════════════
   FORMATTERS
   ════════════════════════════════════════════════════════════════════ */
function Nf(n) { return (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('en-IN'); }
function Pf(n, d=1) { return (n == null || isNaN(n) || n===0) ? '—' : n.toFixed(d) + '%'; }

function formatRetailDate(d) {
  if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '—';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return String(d.getDate()).padStart(2,'0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function SummaryBar({ kpis }) {
  if (!kpis || kpis.length === 0) return null;
  return ce('div', {
    style:{ display:'flex', flexWrap:'wrap', alignItems:'center', gap:0,
            background:'#fff', border:'1px solid #BFDBFE', borderLeft:'4px solid #003087',
            borderRadius:8, padding:'7px 14px', marginBottom:14,
            boxShadow:'0 1px 3px rgba(0,48,135,0.07)' }
  },
    ce('span', { className:'sum-label' }, 'Summary'),
    kpis.map((k, i) => ce('div', {
      key: i,
      style:{ display:'flex', flexDirection:'column', padding:'2px 12px',
              borderLeft: i > 0 ? '1px solid #F1F5F9' : 'none' }
    },
      ce('span', { className:'sum-kpi-lbl' }, k.label),
      ce('span', { className:'sum-kpi-val', style:{color:k.accent||'#0f172a'} }, k.value)
    ))
  );
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthOrder(m) {
  if (!m) return 0;
  const mt = m.match(/([A-Za-z]+)'(\d+)/);
  if (!mt) return 0;
  return parseInt(mt[2]) * 12 + MONTHS.indexOf(mt[1]);
}

function l2rBadge(pct) {
  if (!pct || isNaN(pct) || pct === 0) return ce('span', { className: 'badge-gray' }, '—');
  const cls = pct >= 15 ? 'badge-green' : pct >= 8 ? 'badge-amber' : 'badge-red';
  return ce('span', { className: 'badge ' + cls }, pct.toFixed(1) + '%');
}

function cellClass(pct) {
  if (!pct || pct === 0) return 'cell-nil';
  if (pct >= 15) return 'cell-hot';
  if (pct >= 8)  return 'cell-warm';
  return 'cell-cold';
}

function grpSum(srcMap, srcs) {
  let l = 0, r = 0;
  for (const s of srcs) { const a = srcMap[s] || EMPTY; l += a.l; r += a.r; }
  return fin(l, r);
}

/* ════════════════════════════════════════════════════════════════════
   EXCEL EXPORT
   ════════════════════════════════════════════════════════════════════ */
function exportXlsx(sheetMap, filename) {
  if (!window.XLSX) { alert('XLSX library not loaded'); return; }
  const wb = window.XLSX.utils.book_new();
  for (const [name, aoa] of Object.entries(sheetMap)) {
    const ws = window.XLSX.utils.aoa_to_sheet(aoa);
    const colW = [];
    for (const row of aoa) row.forEach((c, i) => {
      const l = String(c == null ? '' : c).length;
      if (!colW[i] || l > colW[i]) colW[i] = l;
    });
    ws['!cols'] = colW.map(w => ({ wch: Math.min(w + 2, 40) }));
    window.XLSX.utils.book_append_sheet(wb, ws, String(name).slice(0, 31));
  }
  window.XLSX.writeFile(wb, filename + '.xlsx');
}

function ExportBtn({ onClick }) {
  return ce('button', {
    onClick, title: 'Export to Excel',
    style: { padding:'4px 14px', fontSize:10, fontFamily:'inherit', fontWeight:700,
      border:'1px solid #93C5FD', borderRadius:20, background:'#fff',
      color:'#001F5B', cursor:'pointer', display:'inline-flex', alignItems:'center',
      gap:4, whiteSpace:'nowrap' }
  }, '↓ Export Excel');
}

function exportCsv(aoa, filename) {
  const csv = '\uFEFF' + aoa.map(row =>
    row.map(v => {
      const s = v == null ? '' : String(v);
      return (s.includes(',') || s.includes('"') || s.includes('\n'))
        ? '"' + s.replace(/"/g, '""') + '"'
        : s;
    }).join(',')
  ).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function CsvBtn({onClick}) {
  return ce('button', {
    onClick, title:'Export to CSV',
    style:{padding:'5px 10px',fontSize:10,fontWeight:700,border:'1px solid #D1FAE5',borderRadius:6,background:'#ECFDF5',color:'#065F46',cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit',marginLeft:6}
  }, '\u2193 CSV');
}

function DetailedCsvBtn({onClick}) {
  return ce('button', {
    onClick, title:'Export detailed CSV \u2014 one row per lead',
    style:{padding:'5px 10px',fontSize:10,fontWeight:700,border:'1px solid #BFDBFE',borderRadius:6,background:'#EFF6FF',color:'#1E40AF',cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit',marginLeft:6}
  }, '\u2193 Detailed CSV');
}

function isRetailedLead(r) {
  if (!r.isBooked || !r.booking_month || !r.lead_month) return false;
  const d = heroMonthOrder(r.booking_month) - heroMonthOrder(r.lead_month);
  return d >= 0 && d <= 2;
}

function exportDetailedCsv(rawJoined, filters, RT, leadsMode, filename, monthOverride) {
  if (!rawJoined || !rawJoined.length) return;
  const { months:mf, sources:sf, leadTypes:ltf, models:mdf, states:stf, cities:cf } = filters;
  const allM   = !mf  || mf.size  === 0;
  const allS   = !sf  || sf.size  === 0;
  const allLT  = !ltf || ltf.size === 0;
  const allMdl = !mdf || mdf.size === 0;
  const allSt  = !stf || stf.size === 0;
  const allCity= !cf  || cf.size  === 0;
  const fmtD   = d => (d instanceof Date && !isNaN(d.getTime())) ? formatRetailDate(d) : '';
  const hdr = ['encrypt_mobile_number','id_verified_lead','opty_id','Date','Lead_Month',
    'brand','model','verified_dealer','dealerId','oem_crm_id','City','State',
    'Dealer_Name','enquiryId','utm_campaign','lead_type','Medium','Status_Name',
    'purchasedModel','performanceMonth','Call Type','Retail_Attribution_Date'];
  const aoa = [hdr];
  for (const r of rawJoined) {
    const effMonth = (leadsMode === 'update' && r.isBooked && r.booking_month) ? r.booking_month : r.lead_month;
    if (monthOverride) {
      if (effMonth !== monthOverride) continue;
    } else if (!allM) {
      if (mf === FILTER_CLEARED) continue;
      if (!mf.has(effMonth)) continue;
    }
    if (!allS) {
      if (sf === FILTER_CLEARED) continue;
      if (!sf.has(r.source)) continue;
    }
    if (!allLT) {
      if (ltf === FILTER_CLEARED) continue;
      if (!ltf.has(r.lt)) continue;
    }
    if (!allMdl) {
      if (mdf === FILTER_CLEARED) continue;
      if (!mdf.has(r.model)) continue;
    }
    if (!allSt) {
      if (stf === FILTER_CLEARED) continue;
      if (!stf.has(r.state)) continue;
    }
    if (!allCity) {
      if (cf === FILTER_CLEARED) continue;
      if (!cf.has(r.city)) continue;
    }
    // Status_Name comes directly from Lead Master; gates columns 19-22
    const statusName = r.statusName || '';
    const normalizedStatus = String(statusName).trim().toLowerCase();
    const isRA = normalizedStatus === 'retail attribution';
    aoa.push([
      r.encryptMobile||'', r.idVerifiedLead||'', r.opty_id,
      fmtD(r.leadDate), r.lead_month, r.brand||'', r.model,
      r.verifiedDealer||'', r.dealerId||'', r.oemCrmId||'',
      r.city, r.state, r.dealerName||'', r.enquiryId||'', r.utmCampaign||'',
      r.lt, r.source,
      statusName,
      isRA ? (r.purchasedModel||'') : '',
      isRA ? (r.booking_month||'') : '',
      isRA ? (r.callType||'') : '',
      isRA ? fmtD(r.retailDate) : '',
    ]);
  }
  exportCsv(aoa, filename);
}

function makeAggCsv(agg, dimLabel, filename) {
  if (!agg) return;
  const srcKeys = Object.keys(agg.grandSrc || {});
  const hdr = [dimLabel, 'Leads', 'Retail', 'Contrib%', 'L2R%',
    ...srcKeys.flatMap(s => [s+' L', s+' R', s+' L2R%'])];
  const rows = [hdr];
  const entries = Object.entries(agg.dimAggs).sort((a,b) => b[1].total.l - a[1].total.l);
  for (const [dk, da] of entries) {
    const r = [dk, da.total.l, da.total.r,
      agg.grand.l > 0 ? +(da.total.l/agg.grand.l*100).toFixed(1) : 0,
      +da.total.l2r.toFixed(1)];
    for (const s of srcKeys) { const sv = da.src[s] || {l:0,r:0,l2r:0}; r.push(sv.l, sv.r, +sv.l2r.toFixed(1)); }
    rows.push(r);
  }
  const gt = ['Grand Total', agg.grand.l, agg.grand.r, 100, +agg.grand.l2r.toFixed(1)];
  for (const s of srcKeys) { const sv = agg.grandSrc[s] || {l:0,r:0,l2r:0}; gt.push(sv.l, sv.r, +sv.l2r.toFixed(1)); }
  rows.push(gt);
  exportCsv(rows, filename);
}

/* ════════════════════════════════════════════════════════════════════
   MULTI-SELECT FILTER COMPONENT
   ════════════════════════════════════════════════════════════════════ */

// Sentinel: a frozen Set containing an unmatchable string.
// When used as a filter, aggregation code sees size>0 (not "all") but
// has() returns false for every real option → zero records for that dimension.
const FILTER_CLEARED = Object.freeze(new Set(['\x00']));

const MultiSelect = React.memo(function MultiSelect({ label, options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef();

  useEffect(() => {
    function hdl(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', hdl);
    return () => document.removeEventListener('mousedown', hdl);
  }, []);

  const isClear = selected === FILTER_CLEARED;
  const isAll   = !isClear && (!selected || selected.size === 0);
  const count   = !isClear && selected ? selected.size : 0;

  function toggle(opt) {
    if (isClear) { onChange(new Set([opt])); return; }
    const next = new Set(selected || []);
    if (isAll) {
      options.forEach(o => { if (o !== opt) next.add(o); });
    } else {
      if (next.has(opt)) next.delete(opt); else next.add(opt);
    }
    onChange(next.size === options.length ? new Set() : next);
  }
  function selectAll()  { onChange(new Set()); }
  function clearFilter() { onChange(FILTER_CLEARED); }

  return ce('div', { style: { position:'relative' }, ref },
    ce('button', {
      className: 'ms-btn' + (open ? ' open' : ''),
      onClick: () => setOpen(p => !p)
    },
      label,
      isAll
        ? ce('span', { style:{color:'#94A3B8',fontSize:10} }, 'All ▾')
        : isClear
          ? ce('span', { style:{color:'#64748B',fontSize:10} }, 'None ▾')
          : ce('span', { className:'ms-count' }, count),
      !isAll && !isClear && ce('span', {style:{color:'#94A3B8',fontSize:10}}, '▾')
    ),
    open && ce('div', { className:'ms-dropdown' },
      ce('div', { className:'ms-dropdown-header' },
        ce('span', { style:{fontSize:10,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:'.06em'} }, label),
        ce('div', { style:{display:'flex',gap:8} },
          ce('button', { onClick: selectAll,   style:{fontSize:10,background:'none',border:'none',color:'#EA580C',cursor:'pointer',fontWeight:700} }, 'All'),
          ce('button', { onClick: clearFilter, style:{fontSize:10,background:'none',border:'none',color:'#64748B',cursor:'pointer',fontWeight:700} }, 'Clear')
        )
      ),
      ce('div', { className:'ms-dropdown-list' },
        options.map(opt => ce('label', { key:opt, className:'ms-option' },
          ce('input', {
            type:'checkbox', checked: !isClear && (isAll || selected.has(opt)),
            onChange: () => toggle(opt)
          }),
          ce('span', null, opt)
        ))
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   DIMENSION GRID WITH EXPAND/COLLAPSE SOURCE GROUPS + CONTRIB%
   agg        : { grand, grandSrc, dimAggs }
   srcGroups  : array of { id, label, color, srcs, subGroups }
   dimLabel   : string for the row header column
   expandedGrps : Set of group ids that are expanded
   onToggleGrp : (id) => void
   expandedRows : Set of dim keys where sub-rows are shown (optional)
   subRowsOf   : (dimKey) => array of { label, srcMap } (optional, for LT expand)
   ════════════════════════════════════════════════════════════════════ */
const DimGrid = React.memo(function DimGrid({
  agg, srcGroups, dimLabel, expandedGrps, onToggleGrp,
  expandedRows, onToggleRow, subRowsFn, grandForContrib, noSort, viewerMode, noGroupHeaders
}) {
  if (!agg) return null;
  const { grand, grandSrc, dimAggs } = agg;
  const gL = (grandForContrib || grand).l;
  const gR = (grandForContrib || grand).r;

  function contrib(l) { return gL > 0 ? l / gL * 100 : 0; }
  function rContrib(r) { return gR > 0 ? r / gR * 100 : 0; }

  // Flatten expanded groups → visible column list (sub-groups become top-level headers)
  const visibleCols = [];
  for (const grp of srcGroups) {
    if (expandedGrps && expandedGrps.has(grp.id)) {
      const sgs = grp.subGroups.filter(sg => sg.srcs.length > 0);
      if (sgs.length > 0) {
        sgs.forEach((sg, i) => visibleCols.push({
          ...sg,
          borderLeft: i === 0 ? '2px solid ' + grp.color : null,
          parentId: grp.id,
          isChild: true
        }));
      } else {
        visibleCols.push({ ...grp, isChild: false });
      }
    } else {
      visibleCols.push({ ...grp, isChild: false });
    }
  }

  // 5 data cells for one visible column: Leads | L.Contrib% | Retail | R.Contrib% | L2R%
  function colCells(srcMap, col) {
    const a = grpSum(srcMap, col.srcs);
    const bl = col.borderLeft ? { borderLeft: col.borderLeft } : {};
    return [
      ce('td', { key: col.id+'l', style: bl }, Nf(a.l)),
      ce('td', { key: col.id+'lc' }, a.l > 0 ? Pf(contrib(a.l)) : '—'),
      ce('td', { key: col.id+'r', style:{ color: col.color, fontWeight:700 } }, Nf(a.r)),
      ce('td', { key: col.id+'rc' }, a.r > 0 ? Pf(rContrib(a.r)) : '—'),
      ce('td', { key: col.id+'l2r', style:{ color:'#D97706', fontWeight:600 } }, Pf(a.l2r)),
    ];
  }

  function renderRow(label, tot, srcMap, isTotal, isSection, dimKey, isSub) {
    const rowClass = isTotal ? 'total-row' : isSection ? 'section-row' : isSub ? 'sub-row' : '';
    const canExpand = !isTotal && !isSub && expandedRows !== undefined && onToggleRow;
    const isExpanded = canExpand && expandedRows.has(dimKey);
    const tdClass = isSub ? 'sub-label' : 'label';
    const labelContent = canExpand
      ? ce('span', { style:{display:'flex',alignItems:'center',gap:6} },
          ce('span', { style:{fontSize:10,color:'#94A3B8'} }, isExpanded ? '▾' : '▸'),
          label
        )
      : label;
    return ce('tr', {
      className: rowClass, key: label + (isSub ? '_sub' : ''),
      onClick: canExpand ? () => onToggleRow(dimKey) : undefined,
      style: canExpand ? { cursor:'pointer' } : {}
    },
      ce('td', { className: tdClass, style: isTotal ? { color:'#1A237E' } : {} }, labelContent),
      ce('td', { key:'tl' }, Nf(tot.l)),
      ce('td', { key:'tlc' }, tot.l > 0 ? Pf(contrib(tot.l)) : '—'),
      ce('td', { key:'tr', style:{ color:'#EA580C', fontWeight:700 } }, Nf(tot.r)),
      ce('td', { key:'trc' }, tot.r > 0 ? Pf(rContrib(tot.r)) : '—'),
      ce('td', { key:'tl2r', style:{ color:'#D97706', fontWeight:700 } }, tot.l2r > 0 ? Pf(tot.l2r) : '—'),
      ...(viewerMode ? [] : visibleCols.flatMap(col => colCells(srcMap, col)))
    );
  }

  const dimRows = noSort
    ? Object.entries(dimAggs)
    : Object.entries(dimAggs).sort((a,b) => b[1].total.l - a[1].total.l);

  // Header row 1 — top-level group names (sub-groups shown as peers when parent expanded)
  const hdr1 = [
    ce('th', { key:'dim', className:'left', rowSpan:2, style:{minWidth:160,zIndex:3,background:'#1D4ED8',color:'#fff'} }, dimLabel),
    ce('th', { key:'tot', colSpan:5, style:{background:'#1D4ED8',color:'#fff'} }, 'TOTAL'),
    ...(viewerMode ? [] : visibleCols.map(col => {
      const hasChildren = !col.isChild && col.subGroups && col.subGroups.filter(sg=>sg.srcs.length>0).length > 1;
      const canToggle = onToggleGrp && (hasChildren || col.isChild);
      const toggleId = col.isChild ? col.parentId : col.id;
      const arrow = hasChildren ? '▾ ' : col.isChild ? '▴ ' : '';
      return ce('th', {
        key: col.id, colSpan: 5,
        className: canToggle ? 'grp-toggle' : '',
        style: {
          background: col.color,
          color: '#fff',
          borderTop: '2px solid ' + col.color + '88',
          ...(col.borderLeft ? { borderLeft: col.borderLeft } : {})
        },
        onClick: canToggle ? () => onToggleGrp(toggleId) : undefined
      }, arrow + col.label);
    }))
  ];

  // Header row 2 — LEADS | L.CONTRIB% | RETAIL | R.CONTRIB% | L2R% per visible col
  const hdr2 = [
    ...(noGroupHeaders ? [ce('th', { key:'dim', className:'left', style:{minWidth:160,zIndex:3,background:'#1D4ED8',color:'#fff'} }, dimLabel)] : []),
    ce('th', { key:'tl', className:'sub' }, 'Leads'),
    ce('th', { key:'tlc', className:'sub' }, 'L.Contrib%'),
    ce('th', { key:'tr', className:'sub' }, 'Retail'),
    ce('th', { key:'trc', className:'sub' }, 'R.Contrib%'),
    ce('th', { key:'tl2r', className:'sub' }, 'L2R%'),
    ...(viewerMode ? [] : visibleCols.flatMap(col => [
      ce('th', { key:col.id+'l', className:'sub', style: col.borderLeft ? {borderLeft:col.borderLeft} : {} }, 'Leads'),
      ce('th', { key:col.id+'lc', className:'sub' }, 'L.Contrib%'),
      ce('th', { key:col.id+'r', className:'sub' }, 'Retail'),
      ce('th', { key:col.id+'rc', className:'sub' }, 'R.Contrib%'),
      ce('th', { key:col.id+'l2r', className:'sub' }, 'L2R%'),
    ]))
  ];

  const rows = [];

  for (const [dimKey, da] of dimRows) {
    rows.push(renderRow(dimKey, da.total, da.src, false, false, dimKey, false));
    // Sub-rows if this dim is expanded
    if (expandedRows && expandedRows.has(dimKey) && subRowsFn) {
      const subRows = subRowsFn(dimKey, da);
      for (const sr of subRows) {
        rows.push(renderRow(sr.label, sr.tot, sr.srcMap, false, false, null, true));
      }
    }
  }
  rows.push(renderRow('∑ Grand Total', grand, grandSrc, true, false, null, false));

  return ce('div', { className:'scroll-x' },
    ce('table', null,
      ce('thead', null,
        ...(noGroupHeaders ? [] : [ce('tr', null, ...hdr1)]),
        ce('tr', null, ...hdr2),
      ),
      ce('tbody', null, ...rows)
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   MONTHLY GRIDS WRAPPER
   Renders one DimGrid per selected month.
   ════════════════════════════════════════════════════════════════════ */
function MonthlyGrids({ title, months, renderAgg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, noPrefix, viewerMode, noGroupHeaders, onDetailedCsv }) {
  const aggs = useMemo(() => months.map(M => ({ M, agg: renderAgg(M) })), [months, renderAgg]);
  const summaryAgg = useMemo(() => {
    let gL=0, gR=0;
    const gsAcc={}, daAcc={};
    for (const { agg } of aggs) {
      if (!agg || (agg.grand.l===0 && agg.grand.r===0)) continue;
      gL+=agg.grand.l; gR+=agg.grand.r;
      for (const [s,sv] of Object.entries(agg.grandSrc)) {
        if (!gsAcc[s]) gsAcc[s]=[0,0]; gsAcc[s][0]+=sv.l; gsAcc[s][1]+=sv.r;
      }
      for (const [d,da] of Object.entries(agg.dimAggs)) {
        if (!daAcc[d]) daAcc[d]={total:[0,0],src:{}};
        daAcc[d].total[0]+=da.total.l; daAcc[d].total[1]+=da.total.r;
        for (const [s,sv] of Object.entries(da.src)) {
          if (!daAcc[d].src[s]) daAcc[d].src[s]=[0,0];
          daAcc[d].src[s][0]+=sv.l; daAcc[d].src[s][1]+=sv.r;
        }
      }
    }
    if (gL===0) return null;
    const grandSrc={};
    for (const [s,v] of Object.entries(gsAcc)) grandSrc[s]=fin(v[0],v[1]);
    const dimAggs={};
    for (const [d,dv] of Object.entries(daAcc)) {
      const srcAgg={};
      for (const [s,sv] of Object.entries(dv.src)) srcAgg[s]=fin(sv[0],sv[1]);
      dimAggs[d]={total:fin(dv.total[0],dv.total[1]),src:srcAgg};
    }
    return {grand:fin(gL,gR),grandSrc,dimAggs};
  }, [aggs]);
  return ce('div', { className:'fade-up' },
    summaryAgg && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, '∑ All Months — Summary'),
        ce('div',{style:{display:'flex',gap:0}},
          ce(CsvBtn, { onClick:()=>makeAggCsv(summaryAgg, dimLabel, (title||dimLabel).replace(/[^a-z0-9]/gi,'_')+'_AllMonths.csv') }),
          onDetailedCsv && ce(DetailedCsvBtn, { onClick:()=>onDetailedCsv((title||dimLabel).replace(/\s/g,'_'), null) })
        )
      ),
      ce(DimGrid, { agg:summaryAgg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, viewerMode, noGroupHeaders })
    ),
    aggs.map(({ M, agg }) => {
      if (!agg || (agg.grand.l === 0 && agg.grand.r === 0)) return null;
      return ce('div', { key: M, className:'card', style:{ padding:'16px 18px', marginBottom:14 } },
        ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10} },
          ce('div', { className:'section-title', style:{marginBottom:0} }, noPrefix ? M : (title || dimLabel) + ' — ' + M),
          ce('div',{style:{display:'flex',gap:0}},
            ce(CsvBtn, { onClick:()=>makeAggCsv(agg, dimLabel, (title||dimLabel).replace(/[^a-z0-9]/gi,'_')+'_'+M.replace(/[^a-z0-9]/gi,'_')+'.csv') }),
            onDetailedCsv && ce(DetailedCsvBtn, { onClick:()=>onDetailedCsv((title||dimLabel).replace(/\s/g,'_'), M) })
          )
        ),
        ce(DimGrid, { agg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, viewerMode, noGroupHeaders })
      );
    })
  );
}

/* ════════════════════════════════════════════════════════════════════
   OVERVIEW TAB
   ════════════════════════════════════════════════════════════════════ */
const OverviewTab = React.memo(function OverviewTab({ data, filters, RT }) {
  const { maps, monthly, sm, cm, mxst, univ: univRaw, csm: csmRaw } = data;
  const csm = csmRaw || [];
  const univ = univRaw || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const chartRef = useRef(); const chartInst = useRef();

  const allSrcs = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const paidGrp = srcGroups.find(g => g.id === 'paid');
  const orgGrp  = srcGroups.find(g => g.id === 'organic');
  const hasCityFilter = filters.cities && filters.cities.size > 0 && cm && maps.city;

  const totals = useMemo(() => {
    const allM = !filters.months || filters.months.size === 0;
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    let gL=0,gR=0,pL=0,pR=0,oL=0,oR=0,dL=0,coL=0;
    if (hasCityFilter) {
      for (const row of cm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[1]];
        if (!allM && !filters.months.has(m)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; }
      }
    } else if (univF) {
      for (const row of univ) {
        const m = maps.lm[row[4]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; }
        if (paidGrp && paidGrp.srcs.includes(src)) { pL+=l; pR+=r; }
        if (orgGrp  && orgGrp.srcs.includes(src))  { oL+=l; oR+=r; }
      }
    } else {
      for (const row of sm) {
        const m = maps.lm[row[1]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[0]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; }
        if (paidGrp && paidGrp.srcs.includes(src)) { pL+=l; pR+=r; }
        if (orgGrp  && orgGrp.srcs.includes(src))  { oL+=l; oR+=r; }
      }
    }
    return { l:gL,r:gR,l2r:gL>0?gR/gL*100:0, pL,pR,pL2r:pL>0?pR/pL*100:0, oL,oR,oL2r:oL>0?oR/oL*100:0, dL, coL };
  }, [sm, univ, cm, maps, filters, paidGrp, orgGrp, hasCityFilter, getLR]);

  const trendData = useMemo(() => {
    const byMonth = new Map();
    const univF = makeUnivFilter(filters);
    if (hasCityFilter) {
      for (const row of cm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[1]];
        const cur = byMonth.get(m) || [0,0];
        const [l,r] = getLR(row); cur[0]+=l; cur[1]+=r; byMonth.set(m, cur);
      }
    } else if (univF) {
      const allM = !filters.months || filters.months.size === 0;
      const allS = !filters.sources || filters.sources.size === 0;
      for (const row of univ) {
        const m = maps.lm[row[4]];
        if (!allM && !filters.months.has(m)) continue;
        if (!allS && !filters.sources.has(maps.src[row[1]])) continue;
        if (!univF(row, maps)) continue;
        const cur = byMonth.get(m) || [0,0];
        const [l,r] = getLR(row); cur[0]+=l; cur[1]+=r; byMonth.set(m, cur);
      }
    } else {
      for (const row of monthly) {
        const m = maps.lm[row[0]];
        const [l,r] = getLR(row); byMonth.set(m, [l, r]);
      }
    }
    return [...byMonth.entries()]
      .sort((a,b) => monthOrder(a[0]) - monthOrder(b[0]))
      .map(([m, v]) => ({ m, l: v[0], r: v[1], l2r: v[0]>0 ? v[1]/v[0]*100 : 0 }));
  }, [monthly, univ, cm, maps, filters, hasCityFilter, getLR]);

  const srcBreak = useMemo(() => {
    const allM = !filters.months || filters.months.size === 0;
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    const bySrc = new Map();
    if (hasCityFilter && !univF && csm.length > 0) {
      // city-only filter: use city×src×month matrix [city,src,lm,l,r,d,c]
      for (const row of csm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[2]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row);
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else {
      const table  = univF ? univ : sm;
      const getSrc = univF ? (row => maps.src[row[1]]) : (row => maps.src[row[0]]);
      const getM   = univF ? (row => maps.lm[row[4]])  : (row => maps.lm[row[1]]);
      for (const row of table) {
        const m = getM(row);
        if (!allM && !filters.months.has(m)) continue;
        const src = getSrc(row);
        if (!allS && !filters.sources.has(src)) continue;
        if (univF && !univF(row, maps)) continue;
        const [l,r] = getLR(row);
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    }
    return [...bySrc.entries()]
      .map(([s,v]) => ({ src:s, l:v[0], r:v[1], l2r:v[0]>0?v[1]/v[0]*100:0 }))
      .sort((a,b) => b.l-a.l);
  }, [sm, csm, univ, maps, filters, getLR, hasCityFilter]);

  const heatData = useMemo(() => {
    const allM   = !filters.months || filters.months.size === 0;
    const allMdl = !filters.models || filters.models.size === 0;
    const allSt  = !filters.states || filters.states.size === 0;
    const allLT  = !filters.leadTypes || filters.leadTypes.size === 0;
    const modelTot = new Map(), stateTot = new Map(), cell = new Map();
    if (!allLT) {
      // leadType filter active — derive from univ (has all 5 dims)
      for (const row of univ) {
        const mdl = maps.mdl[row[0]], st = maps.st[row[2]], m = maps.lm[row[4]];
        const lt  = maps.lt[row[3]];
        if (!allM   && !filters.months.has(m))    continue;
        if (!allMdl && !filters.models.has(mdl))  continue;
        if (!allSt  && !filters.states.has(st))   continue;
        if (!allLT  && !filters.leadTypes.has(lt)) continue;
        const l = getLR(row)[0];
        const k = mdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + l);
        modelTot.set(mdl, (modelTot.get(mdl) || 0) + l);
        stateTot.set(st,  (stateTot.get(st)  || 0) + l);
      }
    } else {
      for (const row of mxst || []) {
        const mdl = maps.mdl[row[0]], st = maps.st[row[1]], m = maps.lm[row[2]], v = row[3];
        if (!allM   && !filters.months.has(m))   continue;
        if (!allMdl && !filters.models.has(mdl)) continue;
        if (!allSt  && !filters.states.has(st))  continue;
        const k = mdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + v);
        modelTot.set(mdl, (modelTot.get(mdl) || 0) + v);
        stateTot.set(st,  (stateTot.get(st)  || 0) + v);
      }
    }
    const top10 = [...modelTot.entries()].sort((a,b) => b[1]-a[1]).map(e=>e[0]);
    const top15 = [...stateTot.entries()].sort((a,b) => b[1]-a[1]).slice(0,15).map(e=>e[0]);
    const maxV  = Math.max(1, ...[...cell.values()]);
    return { cell, top10, top15, maxV };
  }, [mxst, univ, maps, filters, getLR]);

  // Chart
  useEffect(() => {
    const canvas = chartRef.current;
    if (!canvas || !window.Chart) return;
    if (chartInst.current) { try { chartInst.current.destroy(); } catch(e){} }
    chartInst.current = new Chart(canvas, {
      type:'bar',
      data:{
        labels: trendData.map(d => d.m),
        datasets:[
          { label:'Leads',   data:trendData.map(d=>d.l), backgroundColor:'#0030872a', borderColor:'#003087', borderWidth:1.5, borderRadius:3, yAxisID:'y' },
          { label:'Retails', data:trendData.map(d=>d.r), backgroundColor:'#EA580C55', borderColor:'#EA580C', borderWidth:1.5, borderRadius:3, yAxisID:'y' },
          { label:'L2R%',    data:trendData.map(d=>parseFloat(d.l2r.toFixed(2))), type:'line', borderColor:'#F5A623', backgroundColor:'transparent', borderWidth:2.5, pointRadius:5, pointBackgroundColor:'#F5A623', yAxisID:'y2', tension:.3 },
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{position:'top',labels:{boxWidth:10,boxHeight:10,font:{size:10,family:'DM Mono,monospace'},color:'#475569'}},
          tooltip:{backgroundColor:'rgba(11,22,41,.92)',titleColor:'#DBEAFE',bodyColor:'#93C5FD',padding:10,cornerRadius:8},
        },
        scales:{
          x:{grid:{color:'rgba(100,116,139,.1)'},ticks:{color:'#475569',font:{size:10}}},
          y:{grid:{color:'rgba(100,116,139,.1)'},ticks:{color:'#475569',font:{size:10}},position:'left',beginAtZero:true,title:{display:true,text:'Volume',color:'#94a3b8',font:{size:9}}},
          y2:{position:'right',ticks:{color:'#F5A623',font:{size:10},callback:v=>v+'%'},grid:{display:false},title:{display:true,text:'L2R%',color:'#F5A623',font:{size:9}},beginAtZero:true},
        }
      }
    });
    return () => { try { if(chartInst.current) chartInst.current.destroy(); } catch(e){} };
  }, [trendData]);

  const KPIs = [
    { label:'Total Leads',        value:Nf(totals.l),                      sub:'All sources',             color:'#003087' },
    { label:'Total Retails',      value:Nf(totals.r),                      sub:'Converted',               color:'#EA580C' },
    { label:'L2R %',              value:totals.l2r.toFixed(1)+'%',         sub:'Retails ÷ Leads',         color:'#F5A623' },
    { label:'Paid L2R%',          value:totals.pL2r.toFixed(1)+'%',        sub:Nf(totals.pL)+' paid leads',  color:'#7C3AED' },
    { label:'Organic L2R%',       value:totals.oL2r.toFixed(1)+'%',        sub:Nf(totals.oL)+' organic leads', color:'#059669' },
    { label:'Retail Till Date',   value:data.retailTillDate ? formatRetailDate(data.retailTillDate) : '—', sub:'Last attribution date', color:'#0369A1' },
  ];

  return ce('div', { className:'fade-up' },
    ce('div', { style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(175px,1fr))',gap:10,marginBottom:20} },
      KPIs.map((k,i) => ce('div', { key:i, className:'kpi' },
        ce('div', { style:{position:'absolute',top:0,left:0,right:0,height:3,background:k.color,borderRadius:'12px 12px 0 0'} }),
        ce('div', { className:'kpi-label' }, k.label),
        ce('div', { className:'kpi-value'+(k.value.length>7?' kpi-long':' kpi-med'), style:{color:k.color} }, k.value),
        ce('div', { className:'kpi-sub', style:{color:k.color} }, k.sub)
      ))
    ),
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { className:'section-title' }, 'Month-wise Trend — Leads, Retails & L2R%'),
      ce('div', { style:{height:260,position:'relative'} }, ce('canvas', { ref:chartRef }))
    ),
    totals.l > 0 && ce('div', { className:'card', style:{padding:'10px 18px',marginBottom:14,borderTop:'3px solid #6366F1'} },
      ce('div', { style:{display:'flex',flexWrap:'wrap',alignItems:'stretch'} },
        ...[
          ...(data.rt_cols ? [
            { label:'DMS Retails', value:Nf(totals.dL),  color:'#7C3AED' },
            { label:'Call Out',    value:Nf(totals.coL), color:'#0891B2' },
          ] : []),
          { label:'Paid %',       value:totals.l>0?Pf(totals.pL/totals.l*100):'—', color:'#6366F1' },
          { label:'Organic %',    value:totals.l>0?Pf(totals.oL/totals.l*100):'—', color:'#059669' },
          { label:'Active Sources', value:String(srcBreak.filter(s=>s.l>0).length), color:'#475569' },
          { label:'Models',        value:String(heatData.top10.length),              color:'#475569' },
          { label:'States',        value:String(heatData.top15.length),              color:'#475569' },
        ].map((s,i) => ce('div', { key:i, style:{
          padding:'6px 16px', borderLeft:i>0?'1px solid #E2E8F0':'none',
          display:'flex', flexDirection:'column', gap:2
        }},
          ce('div',{style:{fontSize:9,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap'}},s.label),
          ce('div',{style:{fontSize:15,fontWeight:700,color:s.color,fontFamily:'DM Mono,monospace'}},s.value)
        ))
      )
    ),
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, 'Source Summary'),
        ce(ExportBtn, { onClick:() => {
          const aoa=[['Source','Leads','Retails','Contrib%','L2R%']];
          for (const s of srcBreak) aoa.push([s.src,s.l,s.r,+(s.l/totals.l*100).toFixed(2),+s.l2r.toFixed(2)]);
          aoa.push(['∑ Total',totals.l,totals.r,'100.0%',+totals.l2r.toFixed(2)]);
          exportXlsx({'Source Summary':aoa},'Hero_Overview_Source');
        }})
      ),
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null, ce('tr', null,
            ce('th', { className:'left', style:{minWidth:140} }, 'Source'),
            ce('th', null, 'Leads'),
            ce('th', null, 'L.Contrib%'),
            ce('th', null, 'Retails'),
            ce('th', null, 'R.Contrib%'),
            ce('th', null, 'L2R%'),
          )),
          ce('tbody', null,
            ...srcBreak.map((s,i) => ce('tr', { key:i },
              ce('td', { className:'label' }, s.src),
              ce('td', null, Nf(s.l)),
              ce('td', null, totals.l > 0 ? Pf(s.l/totals.l*100) : '—'),
              ce('td', { style:{color:'#EA580C',fontWeight:700} }, Nf(s.r)),
              ce('td', null, totals.r > 0 ? Pf(s.r/totals.r*100) : '—'),
              ce('td', { style:{color:'#D97706',fontWeight:600} }, Pf(s.l2r)),
            )),
            ce('tr', { className:'total-row' },
              ce('td', { className:'label' }, '∑ Grand Total'),
              ce('td', null, Nf(totals.l)),
              ce('td', null, '100.0%'),
              ce('td', { style:{color:'#EA580C',fontWeight:700} }, Nf(totals.r)),
              ce('td', null, '100.0%'),
              ce('td', null, ce('span', { style:{color:'#D97706',fontWeight:700} }, totals.l2r.toFixed(1)+'%')),
            )
          )
        )
      )
    ),
    heatData.top10.length > 0 && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, '🔥 Model × State — Lead Volume (All Models × Top 15 States)'),
        ce(ExportBtn, { onClick:() => {
          const aoa = [['Model', ...heatData.top15]];
          for (const mdl of heatData.top10) {
            aoa.push([mdl, ...heatData.top15.map(st => heatData.cell.get(mdl+'\x00'+st) || 0)]);
          }
          exportXlsx({'Model×State':aoa}, 'Hero_Model_State_Heatmap');
        }})
      ),
      ce('div', { style:{fontSize:11,color:'#94A3B8',marginBottom:10} }, 'Cell shows lead count. Darker = higher volume. Month / Model / State filters apply.'),
      ce('div', { className:'scroll-x' },
        ce('table', { style:{borderCollapse:'collapse',fontSize:11,fontFamily:'DM Mono,monospace'} },
          ce('thead', null,
            ce('tr', null,
              ce('th', { style:{minWidth:130,textAlign:'left',padding:'4px 8px',background:'#F8FAFC',fontWeight:700,fontSize:11,color:'#475569',borderBottom:'2px solid #E2E8F0',position:'sticky',left:0,zIndex:1} }, 'MODEL  STATE'),
              ...heatData.top15.map(st => ce('th', { key:st, style:{
                padding:'4px 6px', background:'#F8FAFC', fontWeight:600, fontSize:10, color:'#475569',
                borderBottom:'2px solid #E2E8F0', whiteSpace:'nowrap', maxWidth:70,
                writingMode:'vertical-rl', transform:'rotate(180deg)', height:90, verticalAlign:'bottom',
              }}, st))
            )
          ),
          ce('tbody', null,
            ...heatData.top10.map((mdl, ri) => ce('tr', { key:mdl, style:{background: ri%2===0?'#fff':'#F8FAFC'} },
              ce('td', { style:{padding:'5px 8px',fontWeight:700,fontSize:11,color:'#1E293B',borderBottom:'1px solid #F1F5F9',position:'sticky',left:0,background:ri%2===0?'#fff':'#F8FAFC',zIndex:1,whiteSpace:'nowrap'} }, mdl),
              ...heatData.top15.map(st => {
                const v = heatData.cell.get(mdl+'\x00'+st) || 0;
                const intensity = v / heatData.maxV;
                const bg = v === 0 ? '#F8FAFC' : `rgba(0,48,135,${0.08 + intensity * 0.82})`;
                const color = intensity > 0.55 ? '#fff' : '#1E293B';
                return ce('td', { key:st, style:{
                  padding:'5px 8px', textAlign:'right', borderBottom:'1px solid #F1F5F9',
                  background:bg, color, fontWeight: intensity > 0.3 ? 700 : 400,
                  minWidth:60, transition:'background 200ms',
                }}, v > 0 ? Nf(v) : '—');
              })
            ))
          )
        )
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   SOURCE ANALYSIS TAB
   ════════════════════════════════════════════════════════════════════ */
const SourceTab = React.memo(function SourceTab({ data, filters, months, RT, onDetailedCsv }) {
  const { maps, sm, univ: univRaw, csm: csmRaw } = data;
  const univ = univRaw || [];
  const csm  = csmRaw  || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const hasCityF = !!(filters.cities && filters.cities.size > 0 && maps.city);

  const renderMonth = useCallback((M) => {
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    const bySrc = new Map();
    let gL=0, gR=0;
    if (univF) {
      for (const row of univ) {
        if (maps.lm[row[4]] !== M) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r] = getLR(row);
        gL+=l; gR+=r;
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else if (hasCityF && csm.length > 0) {
      // city-only filter: use city×src×month matrix [city,src,lm,l,r,d,c]
      for (const row of csm) {
        if (maps.lm[row[2]] !== M) continue;
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row);
        gL+=l; gR+=r;
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else {
      for (const row of sm) {
        if (maps.lm[row[1]] !== M) continue;
        const src = maps.src[row[0]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row);
        gL+=l; gR+=r;
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    }
    if (gL === 0 && gR === 0) return null;
    const sorted = [...bySrc.entries()].sort((a,b) => b[1][0]-a[1][0]);
    const grand = fin(gL, gR);
    const csvSorted = [...bySrc.entries()].sort((a,b)=>b[1][0]-a[1][0]);
    return ce('div', { key:M, className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, M),
        ce('div',{style:{display:'flex',gap:0}},
          ce(CsvBtn, { onClick:()=>{
            const aoa=[['Source','Leads','Retail','Contrib%','L2R%']];
            csvSorted.forEach(([src,[l,r]])=>{const tot=fin(l,r);aoa.push([src,tot.l,tot.r,gL>0?+(tot.l/gL*100).toFixed(1):0,+tot.l2r.toFixed(1)]);});
            aoa.push(['Grand Total',gL,gR,100,gL>0?+(gR/gL*100).toFixed(1):0]);
            exportCsv(aoa,'Hero_Source_'+M.replace(/[^a-z0-9]/gi,'_')+'.csv');
          }}),
          onDetailedCsv && ce(DetailedCsvBtn, { onClick:()=>onDetailedCsv('Source', M) })
        )
      ),
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null,
            ce('tr', null,
              ce('th',{className:'left',style:{minWidth:160}},'Source'),
              ce('th',null,'Leads'),
              ce('th',null,'L.Contrib%'),
              ce('th',null,'Retail'),
              ce('th',null,'R.Contrib%'),
              ce('th',null,'L2R%'),
            )
          ),
          ce('tbody', null,
            ...sorted.map(([src,[l,r]]) => {
              const tot = fin(l,r);
              return ce('tr',{key:src},
                ce('td',{className:'label'},src),
                ce('td',null,Nf(tot.l)),
                ce('td',null,gL>0?Pf(tot.l/gL*100):'—'),

/* ════════════════════════════════════════════════════════════════════
   GEO & DEALER TAB
   ════════════════════════════════════════════════════════════════════ */
const GeoAndDealerTab = React.memo(function GeoAndDealerTab({ data, filters, months, RT, rawJoined, leadsMode }) {
  const [sortCol, setSortCol] = React.useState('leads');
  const [sortDir, setSortDir] = React.useState('desc');
  const [search, setSearch] = React.useState('');

  const mSet = useMemo(() => new Set(months), [months]);

  const allRows = useMemo(() => {
    if (!rawJoined || !rawJoined.length) return [];
    const { sources:sf, leadTypes:ltf, models:mdf, states:stf, cities:cf } = filters;
    const allS   = !sf  || sf.size  === 0;
    const allLT  = !ltf || ltf.size === 0;
    const allMdl = !mdf || mdf.size === 0;
    const allSt  = !stf || stf.size === 0;
    const allCity= !cf  || cf.size  === 0;
    const acc = new Map();
    for (const r of rawJoined) {
      const effMonth = (leadsMode === 'update' && r.isBooked && r.booking_month) ? r.booking_month : r.lead_month;
      if (!mSet.has(effMonth)) continue;
      if (!allS   && (sf  === FILTER_CLEARED || !sf.has(r.source)))  continue;
      if (!allLT  && (ltf === FILTER_CLEARED || !ltf.has(r.lt)))     continue;
      if (!allMdl && (mdf === FILTER_CLEARED || !mdf.has(r.model)))  continue;
      if (!allSt  && (stf === FILTER_CLEARED || !stf.has(r.state)))  continue;
      if (!allCity&& (cf  === FILTER_CLEARED || !cf.has(r.city)))    continue;
      const dealer = r.dealerName || 'Unknown';
      const ao     = r.ao         || 'Unknown';
      const state  = r.state      || 'Unknown';
      const region = r.region     || 'Unknown';
      const key = dealer + '\x00' + ao + '\x00' + state + '\x00' + region;
      let e = acc.get(key);
      if (!e) { e = { dealer, ao, state, region, leads:0, retail:0, wip:0, dp:0, l1:0, lost:0 }; acc.set(key, e); }
      e.leads++;
      const isR = isRetailedLead(r);
      if (RT === 'dms' ? (isR && r.callType === 'dms') : RT === 'co' ? (isR && r.callType === 'co') : isR) e.retail++;
      const wid = String(r.webId || '').trim().toLowerCase();
      if (wid === 'wip') e.wip++;
      else if (wid === 'direct push') e.dp++;
      else if (wid === 'l1 nurtured') e.l1++;
      const sn = String(r.statusName || '').trim().toLowerCase();
      if (sn === 'lost not contactable' || sn === 'lost not purchased' || sn === 'lost purchased') e.lost++;
    }
    return [...acc.values()];
  }, [rawJoined, filters, mSet, RT, leadsMode]);

  const filteredRows = useMemo(() => {
    if (!search.trim()) return allRows;
    const q = search.trim().toLowerCase();
    return allRows.filter(r =>
      r.dealer.toLowerCase().includes(q) || r.ao.toLowerCase().includes(q) ||
      r.state.toLowerCase().includes(q)  || r.region.toLowerCase().includes(q)
    );
  }, [allRows, search]);

  const sortedRows = useMemo(() => {
    const rows = [...filteredRows];
    rows.sort((a, b) => {
      let av, bv;
      if (sortCol === 'conv') { av = a.leads > 0 ? a.retail / a.leads : 0; bv = b.leads > 0 ? b.retail / b.leads : 0; }
      else { av = a[sortCol]; bv = b[sortCol]; }
      const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
      return sortDir === 'asc' ? cmp : -cmp;
    });
    return rows;
  }, [filteredRows, sortCol, sortDir]);

  const totals = useMemo(() => {
    let leads=0, retail=0, wip=0, dp=0, l1=0, lost=0;
    for (const r of filteredRows) { leads+=r.leads; retail+=r.retail; wip+=r.wip; dp+=r.dp; l1+=r.l1; lost+=r.lost; }
    return { dealers: filteredRows.length, leads, retail, wip, dp, l1, lost };
  }, [filteredRows]);

  const pct = (r, l) => l > 0 ? (r / l * 100).toFixed(1) + '%' : '—';
  const fmt = n => n.toLocaleString('en-IN');
  const toggleSort = col => { if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc'); else { setSortCol(col); setSortDir('desc'); } };
  const arrow = col => sortCol === col ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';

  const exportCsv = () => {
    const hdr = ['Dealer','AO','State','Region','Leads','Retail','Conv%','WIP','Direct Push','L1 Nurtured','Lost'];
    const aoa = [hdr, ...sortedRows.map(r => [r.dealer,r.ao,r.state,r.region,r.leads,r.retail,pct(r.retail,r.leads),r.wip,r.dp,r.l1,r.lost])];
    const csv = aoa.map(row => row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = 'Hero_Geo_Dealer_AllMonths.csv'; a.click(); URL.revokeObjectURL(url);
  };

  const thStyle = (align) => ({
    cursor:'pointer', textAlign:align||'center', padding:'9px 10px', background:'#1E3A8A',
    color:'#fff', fontWeight:700, fontSize:9.5, textTransform:'uppercase', letterSpacing:'.08em',
    userSelect:'none', whiteSpace:'nowrap', border:'1px solid rgba(255,255,255,.15)',
    position:'sticky', top:0, zIndex:2
  });
  const TH = (col, label, align) => ce('th', { key:col, onClick:()=>toggleSort(col), style:thStyle(align) }, label + arrow(col));

  const kpis = [
    { label:'Dealers',      val: fmt(totals.dealers) },
    { label:'Leads',        val: fmt(totals.leads) },
    { label:'Retail',       val: fmt(totals.retail) },
    { label:'Conv%',        val: pct(totals.retail, totals.leads) },
    { label:'WIP',          val: fmt(totals.wip) },
    { label:'Direct Push',  val: fmt(totals.dp) },
    { label:'L1 Nurtured',  val: fmt(totals.l1) },
    { label:'Lost',         val: fmt(totals.lost) },
  ];

  return ce('div', { style:{ maxWidth:1440, margin:'0 auto', padding:'16px 16px' } },
    ce('div', { style:{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap' } },
      kpis.map(({ label, val }) =>
        ce('div', { key:label, className:'card', style:{ padding:'10px 14px', minWidth:88, textAlign:'center', flex:'1 1 80px' } },
          ce('div', { style:{ fontSize:11, color:'#64748b', fontWeight:600, marginBottom:2 } }, label),
          ce('div', { style:{ fontSize:20, fontWeight:700, color:'#1e293b' } }, val)
        )
      )
    ),
    ce('div', { className:'card', style:{ padding:'16px 18px' } },
      ce('div', { style:{ display:'flex', alignItems:'center', gap:10, marginBottom:12 } },
        ce('input', {
          type:'text', placeholder:'Search dealer / AO / state / region…',
          value:search, onChange:e=>setSearch(e.target.value),
          style:{ flex:1, padding:'7px 11px', border:'1px solid #e2e8f0', borderRadius:6, fontSize:13, outline:'none', minWidth:0 }
        }),
        search && ce('button', {
          onClick:()=>setSearch(''),
          style:{ padding:'7px 11px', border:'1px solid #e2e8f0', borderRadius:6, background:'#f1f5f9', cursor:'pointer', fontSize:12, color:'#64748b' }
        }, 'Clear'),
        ce('button', {
          onClick:exportCsv,
          style:{ padding:'7px 13px', background:'#9A3412', color:'#fff', border:'none', borderRadius:6, cursor:'pointer', fontSize:12, fontWeight:600, whiteSpace:'nowrap' }
        }, 'Export CSV')
      ),
      ce('div', { style:{ overflowX:'auto' } },
        ce('table', { style:{ width:'100%', borderCollapse:'collapse', fontSize:12 } },
          ce('thead', null,
            ce('tr', null,
              TH('dealer','Dealer','left'), TH('ao','AO','left'), TH('state','State','left'), TH('region','Region','left'),
              TH('leads','Leads'), TH('retail','Retail'), TH('conv','Conv%'),
              TH('wip','WIP'), TH('dp','Direct Push'), TH('l1','L1 Nurtured'), TH('lost','Lost')
            )
          ),
          ce('tbody', null,
            sortedRows.length === 0
              ? ce('tr', null, ce('td', { colSpan:11, style:{ textAlign:'center', padding:24, color:'#94a3b8' } }, 'No data for selected filters'))
              : [
                  ...sortedRows.map((r, i) =>
                    ce('tr', { key: r.dealer+r.ao+r.state+r.region,
                      style:{ background: i%2===0?'#fff':'#f8fafc', borderBottom:'1px solid #e2e8f0' } },
                      ce('td',{style:{padding:'7px 10px',textAlign:'left',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},r.dealer),

                      ce('td',{style:{padding:'7px 10px',textAlign:'center'}},fmt(r.wip)),

                    )
                  ),
                  ce('tr', { key:'__totals__', style:{ background:'#1e293b', color:'#fff', fontWeight:700 } },
                    ce('td',{colSpan:4,style:{padding:'8px 10px',textAlign:'left',fontSize:12}},'Total ('+fmt(totals.dealers)+' Dealers)'),
                    ce('td',{style:{padding:'8px 10px',textAlign:'center'}},fmt(totals.leads)),
                    ce('td',{style:{padding:'8px 10px',textAlign:'center'}},fmt(totals.retail)),
                    ce('td',{style:{padding:'8px 10px',textAlign:'center'}},pct(totals.retail,totals.leads)),
                    ce('td',{style:{padding:'8px 10px',textAlign:'center'}},fmt(totals.wip)),
                    ce('td',{style:{padding:'8px 10px',textAlign:'center'}},fmt(totals.dp)),
                    ce('td',{style:{padding:'8px 10px',textAlign:'center'}},fmt(totals.l1)),
                    ce('td',{style:{padding:'8px 10px',textAlign:'center'}},fmt(totals.lost))
                  )
                ]
          )
        )
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   STATE × SOURCE TAB  (Zone → State → City → Dealer drill-down)
   ════════════════════════════════════════════════════════════════════ */
const StateSourceTab = React.memo(function StateSourceTab({ data, filters, months, RT, viewerMode, onDetailedCsv, rawJoined, leadsMode }) {
  const { maps } = data;

  const allSrcs   = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const [expandedGrps, setExpandedGrps] = useState(new Set());
  const onToggleGrp = useCallback(id => setExpandedGrps(prev => {
    const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n;
  }), []);

  // Region accordion only — State is leaf row. AO inactive.
  const [openRegion, setOpenRegion] = useState(null);
  const onClickRegion = useCallback(r => setOpenRegion(p => p===r?null:r), []);

  const mSet = useMemo(() => new Set(months), [months]);

  // Build Region→State hierarchy from rawJoined.
  // M=null aggregates all selected months; M=string aggregates that exact month.
  const buildHierarchy = useCallback((M) => {
    if (!rawJoined || !rawJoined.length) return { regionMap: new Map(), gL:0, gR:0, grandSrc: new Map() };
    const { sources:sf, leadTypes:ltf, models:mdf, states:stf, cities:cf } = filters;
    const allS   = !sf  || sf.size  === 0;
    const allLT  = !ltf || ltf.size === 0;
    const allMdl = !mdf || mdf.size === 0;
    const allSt  = !stf || stf.size === 0;
    const allCity= !cf  || cf.size  === 0;
    const regionMap = new Map();
    let gL = 0, gR = 0;
    const grandSrc = new Map();
    for (const r of rawJoined) {
      const effMonth = (leadsMode==='update' && r.isBooked && r.booking_month) ? r.booking_month : r.lead_month;
      if (M !== null) { if (effMonth !== M) continue; }
      else            { if (!mSet.has(effMonth)) continue; }
      if (!allS   && (sf  === FILTER_CLEARED || !sf.has(r.source)))  continue;
      if (!allLT  && (ltf === FILTER_CLEARED || !ltf.has(r.lt)))     continue;
      if (!allMdl && (mdf === FILTER_CLEARED || !mdf.has(r.model)))  continue;
      if (!allSt  && (stf === FILTER_CLEARED || !stf.has(r.state)))  continue;
      if (!allCity&& (cf  === FILTER_CLEARED || !cf.has(r.city)))    continue;
      const region = (r.region || '').trim() || 'Unknown';
      const state  = (r.state  || '').trim() || 'Unknown';
      const src    = r.source  || 'Unknown';
      const isR    = isRetailedLead(r);
      const ret    = RT==='dms' ? (isR&&r.callType==='dms'?1:0) : RT==='co' ? (isR&&r.callType==='co'?1:0) : isR?1:0;
      gL++; gR += ret;
      const gc = grandSrc.get(src)||[0,0]; gc[0]++; gc[1]+=ret; grandSrc.set(src,gc);
      if (!regionMap.has(region)) regionMap.set(region, {l:0,r:0,bySrc:new Map(),stateMap:new Map()});
      const reg = regionMap.get(region);
      reg.l++; reg.r+=ret;
      const rsc=reg.bySrc.get(src)||[0,0]; rsc[0]++; rsc[1]+=ret; reg.bySrc.set(src,rsc);
      if (!reg.stateMap.has(state)) reg.stateMap.set(state, {l:0,r:0,bySrc:new Map()});
      const stEntry = reg.stateMap.get(state);
      stEntry.l++; stEntry.r+=ret;
      const ssc=stEntry.bySrc.get(src)||[0,0]; ssc[0]++; ssc[1]+=ret; stEntry.bySrc.set(src,ssc);
    }
    return { regionMap, gL, gR, grandSrc };
  }, [rawJoined, filters, mSet, RT, leadsMode]);

  // Unified renderer for both All Months (M=null) and individual months (M=string).
  const renderGrid = useCallback((M) => {
    const { regionMap, gL, gR, grandSrc } = buildHierarchy(M);
    if (gL === 0 && gR === 0) return null;
    const grandRL = gR;
    const grand = fin(gL, gR);

    function mkSrcMap(bySrc) {
      const sm = {};
      for (const [s,v] of bySrc) sm[s] = fin(v[0],v[1]);
      return sm;
    }
    const grandSrcMap = mkSrcMap(grandSrc);

    function grpCells(srcMap, grp, denomL, denomR) {
      const denom    = denomL != null ? denomL : gL;
      const denomRet = denomR != null ? denomR : grandRL;
      const exp = expandedGrps.has(grp.id);
      if (!exp) {
        const a = grpSum(srcMap, grp.srcs);
        return [
          ce('td',{key:grp.id+'l',style:{borderLeft:'2px solid '+grp.color+'44'}},Nf(a.l)),
          ce('td',{key:grp.id+'lc'},denom>0?Pf(a.l/denom*100):'—'),
          ce('td',{key:grp.id+'r',style:{color:grp.color,fontWeight:700}},Nf(a.r)),
          ce('td',{key:grp.id+'rc'},denomRet>0?Pf(a.r/denomRet*100):'—'),
          ce('td',{key:grp.id+'l2r',style:{color:'#D97706',fontWeight:600}},Pf(a.l2r)),
        ];
      }
      return grp.subGroups.filter(sg=>sg.srcs.length>0).flatMap((sg,si) => {
        const a = grpSum(srcMap,sg.srcs);
        return [
          ce('td',{key:sg.id+'l',style:si===0?{borderLeft:'2px solid '+grp.color+'44'}:{}},Nf(a.l)),
          ce('td',{key:sg.id+'lc'},denom>0?Pf(a.l/denom*100):'—'),
          ce('td',{key:sg.id+'r',style:{color:sg.color,fontWeight:700}},Nf(a.r)),
          ce('td',{key:sg.id+'rc'},denomRet>0?Pf(a.r/denomRet*100):'—'),
          ce('td',{key:sg.id+'l2r',style:{color:'#D97706',fontWeight:600}},Pf(a.l2r)),
        ];
      });
    }

    // ── Headers ──
    const mk = M===null ? 'all' : M;
    const hdr1 = [
      ce('th',{key:'dim',className:'left',rowSpan:2,style:{minWidth:220,zIndex:3,background:'#1D4ED8',color:'#fff'}},'Region / State'),
      ce('th',{key:'tot',colSpan:5,style:{background:'#1D4ED8',color:'#fff'}},'TOTAL'),
      ...(viewerMode ? [] : srcGroups.map(grp => {
        const exp = expandedGrps.has(grp.id);
        const sgs = grp.subGroups.filter(sg=>sg.srcs.length>0);
        return ce('th',{key:grp.id,colSpan:exp?sgs.length*5:5,
          className:'grp-toggle',style:{background:grp.color,color:'#fff',borderTop:'2px solid rgba(0,0,0,.12)'},
          onClick:()=>onToggleGrp(grp.id)
        },(exp?'▴ ':'▾ ')+grp.label);
      }))
    ];
    const hdr2 = [
      ce('th',{key:'tl',className:'sub'},'Leads'),ce('th',{key:'tlc',className:'sub'},'L.Contrib%'),
      ce('th',{key:'tr',className:'sub'},'Retail'),ce('th',{key:'trc',className:'sub'},'R.Contrib%'),
      ce('th',{key:'tl2r',className:'sub'},'L2R%'),
      ...(viewerMode ? [] : srcGroups.flatMap(grp => {
        const exp = expandedGrps.has(grp.id);
        if (!exp) return [
          ce('th',{key:grp.id+'l',className:'sub',style:{borderLeft:'2px solid '+grp.color+'44'}},'Leads'),
          ce('th',{key:grp.id+'lc',className:'sub'},'L.Contrib%'),
          ce('th',{key:grp.id+'r',className:'sub'},'Retail'),
          ce('th',{key:grp.id+'rc',className:'sub'},'R.Contrib%'),
          ce('th',{key:grp.id+'l2r',className:'sub'},'L2R%'),
        ];
        return grp.subGroups.filter(sg=>sg.srcs.length>0).flatMap((sg,si) => [
          ce('th',{key:sg.id+'l',className:'sub',style:si===0?{borderLeft:'2px solid '+grp.color+'44'}:{},title:sg.label},sg.label+' L'),
          ce('th',{key:sg.id+'lc',className:'sub',title:sg.label},'L.Contrib%'),
          ce('th',{key:sg.id+'r',className:'sub',title:sg.label},sg.label+' R'),
          ce('th',{key:sg.id+'rc',className:'sub',title:sg.label},'R.Contrib%'),
          ce('th',{key:sg.id+'l2r',className:'sub',title:sg.label},'L2R%'),
        ]);
      }))
    ];

    const bodyRows = [];
    const sortedRegions = [...regionMap.keys()].sort();
    for (const region of sortedRegions) {
      const reg = regionMap.get(region);
      if (!reg.l) continue;
      const regSrcMap = mkSrcMap(reg.bySrc);
      const isRegOpen = openRegion === region;
      const regL2R = reg.l > 0 ? reg.r / reg.l * 100 : 0;

      // ── Region row (expandable) ──
      bodyRows.push(ce('tr',{key:'reg_'+mk+'_'+region,className:'section-row',onClick:()=>onClickRegion(region),style:{cursor:'pointer'}},
        ce('td',{className:'label',style:{color:'#0D47A1'}},
          ce('span',{style:{display:'flex',alignItems:'center',gap:6}},
            ce('span',{style:{fontSize:11}},isRegOpen?'▾':'▸'),
            region
          )
        ),
        ce('td',null,Nf(reg.l)),ce('td',null,gL>0?Pf(reg.l/gL*100):'—'),
        ce('td',{style:{color:'#1565C0',fontWeight:700}},Nf(reg.r)),ce('td',null,grandRL>0?Pf(reg.r/grandRL*100):'—'),
        ce('td',{style:{color:'#D97706',fontWeight:700}},regL2R>0?Pf(regL2R):'—'),
        ...(viewerMode ? [] : srcGroups.flatMap(grp=>grpCells(regSrcMap,grp)))
      ));
      if (!isRegOpen) continue;

      const sortedStates = [...reg.stateMap.keys()].sort();
      for (const state of sortedStates) {
        const stEntry = reg.stateMap.get(state);
        if (!stEntry.l) continue;
        const stSrcMap = mkSrcMap(stEntry.bySrc);
        const stL2R = stEntry.l > 0 ? stEntry.r / stEntry.l * 100 : 0;

        // ── State row (leaf — AO inactive) ──
        bodyRows.push(ce('tr',{key:'st_'+mk+'_'+region+'_'+state,className:'sub-row'},
          ce('td',{className:'sub-label',style:{paddingLeft:28}},state),
          ce('td',null,Nf(stEntry.l)),ce('td',null,gL>0?Pf(stEntry.l/gL*100):'—'),
          ce('td',{style:{color:'#EA580C',fontWeight:700}},Nf(stEntry.r)),ce('td',null,grandRL>0?Pf(stEntry.r/grandRL*100):'—'),
          ce('td',{style:{color:'#D97706',fontWeight:600}},stL2R>0?Pf(stL2R):'—'),
          ...(viewerMode ? [] : srcGroups.flatMap(grp=>grpCells(stSrcMap,grp,reg.l,reg.r)))
        ));
      }
    }

    // Grand Total
    bodyRows.push(ce('tr',{key:'gtotal_'+mk,className:'total-row'},
      ce('td',{className:'label',style:{color:'#1A237E'}},'∑ Grand Total'),
      ce('td',null,Nf(gL)),ce('td',null,'100.0%'),
      ce('td',{style:{color:'#EA580C',fontWeight:700}},Nf(gR)),ce('td',null,'100.0%'),
      ce('td',{style:{color:'#D97706',fontWeight:700}},grand.l2r>0?Pf(grand.l2r):'—'),
      ...(viewerMode ? [] : srcGroups.flatMap(grp=>grpCells(grandSrcMap,grp)))
    ));

    return { grand, hdr1, hdr2, bodyRows, regionMap };
  }, [buildHierarchy, expandedGrps, openRegion, srcGroups, viewerMode, onToggleGrp, onClickRegion]);

  // All-months grid drives the summary card (same logic as monthly grids, M=null)
  const allMonthsGrid = useMemo(() => renderGrid(null), [renderGrid]);

  function exportGridCsv(grid, filename) {
    const aoa = [['Region','State','Leads','Retail','L2R%']];
    for (const [reg,rv] of grid.regionMap)
      for (const [st,sv] of rv.stateMap)
        aoa.push([reg, st, sv.l, sv.r, sv.l>0?+(sv.r/sv.l*100).toFixed(1):0]);
    aoa.push(['','Grand Total',grid.grand.l,grid.grand.r,grid.grand.l>0?+(grid.grand.r/grid.grand.l*100).toFixed(1):0]);
    exportCsv(aoa, filename);
  }

  function renderCard(grid, title, onCsvClick, detailedKey) {
    return ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, title),
        ce('div',{style:{display:'flex',gap:0}},
          ce(CsvBtn, { onClick: onCsvClick }),
          onDetailedCsv && ce(DetailedCsvBtn, { onClick:()=>onDetailedCsv('StateSource', detailedKey) })
        )
      ),
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null, ce('tr', null, ...grid.hdr1), ce('tr', null, ...grid.hdr2)),
          ce('tbody', null, ...grid.bodyRows)
        )
      )
    );
  }

  return ce('div', { className:'fade-up' },
    allMonthsGrid && allMonthsGrid.grand.l > 0 &&
      renderCard(allMonthsGrid, '∑ All Months — Region × State',
        ()=>exportGridCsv(allMonthsGrid,'Hero_StateSource_AllMonths.csv'), null),
    months.map(M => {
      const grid = renderGrid(M);
      if (!grid || (grid.grand.l === 0 && grid.grand.r === 0)) return null;
      return ce(React.Fragment, { key:M },
        renderCard(grid, 'Region × State — '+M,
          ()=>exportGridCsv(grid,`Hero_StateSource_${M.replace(/[^a-z0-9]/gi,'_')}.csv`), M)
      );
    })
  );
});

/* ════════════════════════════════════════════════════════════════════
   TARGET VS DELIVERY TAB
   AO × Model: Lead/Retail Target vs Delivered, by Quarter
   ════════════════════════════════════════════════════════════════════ */
const TargetDeliveryTab = React.memo(function TargetDeliveryTab({ data, filters, RT, rawJoined, leadsMode, viewerMode }) {
  const [sortCol, setSortCol] = React.useState('leadTarget');
  const [sortDir, setSortDir] = React.useState('desc');
  const [search, setSearch]   = React.useState('');
  const [selQ,   setSelQ]     = React.useState(new Set(['Q2']));
  const ALL_Q = ['Q2','Q3','Q4'];

  const onToggleQ = useCallback(q => setSelQ(prev => {
    const n = new Set(prev); n.has(q) ? n.delete(q) : n.add(q);
    return n.size ? n : prev;
  }), []);

  const onSort = useCallback(col => {
    setSortCol(prev => {
      if (prev === col) { setSortDir(d => d==='asc'?'desc':'asc'); return col; }
      setSortDir('desc'); return col;
    });
  }, []);

  const allRows = useMemo(() => {
    if (!rawJoined || !rawJoined.length) return [];
    const { sources:sf, leadTypes:ltf, models:mdf, states:stf, cities:cf } = filters;
    const allS   = !sf  || sf.size  === 0;
    const allLT  = !ltf || ltf.size === 0;
    const allMdl = !mdf || mdf.size === 0;
    const allSt  = !stf || stf.size === 0;
    const allCity= !cf  || cf.size  === 0;
    // Aggregate delivered from rawJoined using quarter filter (not the global month filter).
    // Keys use heroNormTargetAo + heroNormTargetModel for case-insensitive, prefix-stripped matching.
    const delMap = new Map();
    for (const r of rawJoined) {
      const effMonth = (leadsMode==='update'&&r.isBooked&&r.booking_month)?r.booking_month:r.lead_month;
      if (!selQ.has(heroMonthToQuarter(effMonth))) continue;
      if (!allS   &&(sf  ===FILTER_CLEARED||!sf.has(r.source))) continue;
      if (!allLT  &&(ltf ===FILTER_CLEARED||!ltf.has(r.lt)))   continue;
      if (!allMdl &&(mdf ===FILTER_CLEARED||!mdf.has(r.model)))continue;
      if (!allSt  &&(stf ===FILTER_CLEARED||!stf.has(r.state)))continue;
      if (!allCity&&(cf  ===FILTER_CLEARED||!cf.has(r.city)))  continue;
      // Normalise AO and model to match target data keys
      const ao    = heroNormTargetAo(r.ao||'');
      const model = heroNormLeadModelForTD(r.model||'');
      const key   = ao+'\x00'+model;
      let d = delMap.get(key);
      if (!d){d={l:0,r:0};delMap.set(key,d);}
      d.l++;
      const isR = isRetailedLead(r);
      if (RT==='dms'?(isR&&r.callType==='dms'):RT==='co'?(isR&&r.callType==='co'):isR) d.r++;
    }
    const rows=[];
    for (const [ao,aoData] of Object.entries(HERO_TARGET_DATA)){
      for (const [model,qData] of Object.entries(aoData.models)){
        let lt=0,rt=0;
        for (const q of selQ){if(qData[q]){lt+=qData[q][0];rt+=qData[q][1];}}
        // Look up using the canonical target keys (ao and model are already canonical here)
        const del=delMap.get(ao+'\x00'+model)||{l:0,r:0};
        // leadAch/retailAch: null when target=0 (to show '–'); otherwise ratio in %
        const la=lt>0?del.l/lt*100:null, ra=rt>0?del.r/rt*100:null;
        rows.push({ao,zone:aoData.zone,model,leadTarget:lt,retailTarget:rt,
          leadsDelivered:del.l,retailsDelivered:del.r,leadAch:la,retailAch:ra});
      }
    }
    return rows;
  },[rawJoined,filters,selQ,leadsMode,RT]);

  const filteredRows = useMemo(()=>{
    if(!search.trim())return allRows;
    const q=search.toLowerCase();
    return allRows.filter(r=>r.ao.toLowerCase().includes(q)||r.model.toLowerCase().includes(q)||r.zone.toLowerCase().includes(q));
  },[allRows,search]);

  const sortedRows = useMemo(()=>{
    const s=[...filteredRows];
    const dir=sortDir==='asc'?1:-1;
    s.sort((a,b)=>{
      const av=a[sortCol],bv=b[sortCol];

  const totals=useMemo(()=>sortedRows.reduce((acc,r)=>({

      console.log('Totals — LeadTarget:'+tot.lt+' LeadDel:'+tot.ld+' ('+((tot.lt?tot.ld/tot.lt*100:0).toFixed(1))+'%)  RetailTarget:'+tot.rt+' RetailDel:'+tot.rd+' ('+((tot.rt?tot.rd/tot.rt*100:0).toFixed(1))+'%)');

      console.groupEnd();
      // Raw AO / Model diagnostics from rawJoined

          console.warn('Unresolvable AOs — Lead Master has no sub-AO field to split into target sub-AOs:',unresolvable,'('+cnt+' lead rows unattributed — Lucknow-1/2 and Patna-1/2 require sub-AO data not present in Lead Master)');

        else console.log('✓ All normalised models match target model keys');
        // Sample rows by quarter

        for(const r of rawJoined.slice(0,500)){

  },[allRows,selQ,rawJoined,leadsMode]);

  const pctColor=p=>p>=100?'#16A34A':p>=75?'#65A30D':p>=50?'#D97706':'#DC2626';
  // Target columns: '—' for zero (no plan), numbers for non-zero

  // Delivered columns: always show a number (0 means no delivery, not missing data)

      ce('span',{style:{fontSize:10,color:'#6B7280'}},sortedRows.length+' rows'),
      !viewerMode&&ce('button',{onClick:onExport,style:{

    ce('div',{style:{overflowX:'auto',borderRadius:10,boxShadow:'0 2px 12px rgba(0,0,0,.08)',background:'#fff'}},
      ce('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:11}},
        ce('thead',null,ce('tr',null,
          ce('th',{style:{...thSt,textAlign:'left'}},'Zone'),

          ce('th',{style:{...thSt,textAlign:'left'}},'Model'),
          mkTh('leadTarget','Lead Target'),
          mkTh('retailTarget','Retail Target'),
          mkTh('leadsDelivered','Leads Delivered'),
          mkTh('retailsDelivered','Retails Delivered'),
          mkTh('leadAch','Lead Ach%'),
          mkTh('retailAch','Retail Ach%'),
        )),
        ce('tbody',null,
          sortedRows.map((r,i)=>ce('tr',{key:r.ao+'\x00'+r.model,style:{background:i%2===0?'#fff':'#f8fafc'}},

              color:r.leadAch!==null?pctColor(r.leadAch):'#94A3B8'}},fmtAch(r.leadAch)),
