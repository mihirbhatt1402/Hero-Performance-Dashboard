});

/* ════════════════════════════════════════════════════════════════════
   PIVOT TABLE TAB
   ════════════════════════════════════════════════════════════════════ */
const thS = {padding:'7px 10px', textAlign:'right', fontWeight:700, fontSize:10, color:'#7C2D12', background:'#FFF7ED', borderBottom:'2px solid #FDBA74', whiteSpace:'nowrap'};
const tdS = {padding:'7px 10px', textAlign:'right', fontSize:11, fontFamily:'DM Mono,monospace'};

const PivotTab = React.memo(function PivotTab({ data, filters, months, RT }) {
  const { maps } = data;
  const COL_SEP = '\x00';

  const [rowDims,    setRowDims]    = useState(['mdl']);
  const [colDims,    setColDims]    = useState(['lm']);
  const [metrics,    setMetrics]    = useState(['leads']);
  const [sortBy,     setSortBy]     = useState('__total__');
  const [sortDir,    setSortDir]    = useState('desc');
  const [topN,       setTopN]       = useState(20);
  const [collapsed,  setCollapsed]  = useState(new Set());
  const [addRowOpen, setAddRowOpen] = useState(false);
  const [addColOpen, setAddColOpen] = useState(false);

  const DIMS = [
    { key:'lm',   label:'Month'     },
    { key:'mdl',  label:'Model'     },
    { key:'src',  label:'Source'    },
    { key:'st',   label:'State'     },
    { key:'lt',   label:'Lead Type' },
    { key:'city', label:'City'      },
  ];

  const METRICS = [
    { key:'leads',  label:'Leads'    },
    { key:'ret',    label:'Retails'  },
    { key:'retpct', label:'Retail %' },
    { key:'dms',    label:'DMS'      },
    { key:'call',   label:'Call-Out' },
  ];

  const ALL_MATS = [
    { key:'sm',   dims:['src','lm']                   },
    { key:'mm',   dims:['mdl','src','lm']            },
    { key:'stm',  dims:['st','src','lm']             },
    { key:'ltm',  dims:['lt','src','lm']             },
    { key:'mxst', dims:['mdl','st','lm']             },
    { key:'cm',   dims:['city','lm']                  },
    { key:'csm',  dims:['city','src','lm']           },
    { key:'cxm',  dims:['city','mdl','lm']           },
    { key:'univ', dims:['mdl','src','st','lt','lm'] },
  ];

  const matConfig = useMemo(() => {
    const needed = [...rowDims, ...colDims];
    if (new Set(needed).size < needed.length) return null;
    const filterDims = [];
    if (filters.models    && filters.models.size    > 0) filterDims.push('mdl');
    if (filters.states    && filters.states.size    > 0) filterDims.push('st');
    if (filters.leadTypes && filters.leadTypes.size > 0) filterDims.push('lt');
    if (filters.cities    && filters.cities.size    > 0) filterDims.push('city');
    const allNeeded = [...new Set([...needed, ...filterDims])];
    let best = null, bestExtra = 99;
    for (const m of ALL_MATS) {
      if (!allNeeded.every(d => m.dims.includes(d))) continue;
      const extra = m.dims.filter(d => !needed.includes(d) && d !== 'lm').length;
      if (extra < bestExtra || (extra === bestExtra && m.dims.length < (best?.dims.length ?? 99))) {
        bestExtra = extra; best = m;
      }
    }
    return best;
  }, [rowDims, colDims, filters]);

  const rawMatrix = useMemo(() => {
    if (!matConfig) return [];
    return data[matConfig.key] || [];
  }, [data, matConfig]);

  const filterSets = useMemo(() => {
    if (!matConfig) return {};
    const { dims } = matConfig;
    const mk = (dim, fSet, arr) => {
      if (!dims.includes(dim) || !fSet || fSet.size === 0) return null;
      const s = new Set();
      (arr || []).forEach((v, i) => { if (fSet.has(v)) s.add(i); });
      return s.size ? s : null;
    };
    const sets = {};
    const a = mk('lm',  filters.months,    maps.lm);  if (a) sets.lm  = a;
    const b = mk('src', filters.sources,   maps.src); if (b) sets.src = b;
    const c = mk('st',  filters.states,    maps.st);  if (c) sets.st  = c;
    const d = mk('mdl', filters.models,    maps.mdl); if (d) sets.mdl = d;
    const e = mk('lt',  filters.leadTypes, maps.lt);  if (e) sets.lt  = e;
    if (dims.includes('city') && filters.cities?.size > 0) {
      const cs = new Set();
      (maps.city || []).forEach((v, i) => { if (filters.cities.has(v)) cs.add(i); });
      if (cs.size) sets.city = cs;
    }
    return sets;
  }, [matConfig, filters, maps]);

  function getMetricVal(vals, m) {
    if (!vals) return 0;
    if (m === 'leads')  return vals[0] || 0;
    if (m === 'ret')    return vals[1] || 0;
    if (m === 'retpct') return vals[0] > 0 ? (vals[1] / vals[0]) * 100 : 0;
    if (m === 'dms')    return vals[2] || 0;
    if (m === 'call')   return vals[3] || 0;
    return 0;
  }

  function fmtV(vals, m) {
    const v = getMetricVal(vals, m);
    if (m === 'retpct') return v > 0 ? v.toFixed(1) + '%' : '—';
    return v === 0 ? '—' : v.toLocaleString();
  }

  function rowTotal(cMap, m) {
    let tl = 0, tr = 0;
    for (const v of cMap.values()) { tl += v[0]; tr += v[1]; }
    if (m === 'retpct') return tl > 0 ? (tr / tl) * 100 : 0;
    let t = 0;
    for (const v of cMap.values()) t += getMetricVal(v, m);
    return t;
  }

  function fmtTotal(cMap, m) {
    const v = rowTotal(cMap, m);
    if (m === 'retpct') return v > 0 ? v.toFixed(1) + '%' : '—';
    return v === 0 ? '—' : v.toLocaleString();
  }

  function accVals(tgt, cKey, row, nDims) {
    if (!tgt.has(cKey)) tgt.set(cKey, [0, 0, 0, 0]);
    const c = tgt.get(cKey);
    c[0] += row[nDims]     || 0;
    c[1] += row[nDims + 1] || 0;
    c[2] += row[nDims + 2] || 0;
    c[3] += row[nDims + 3] || 0;
  }

  const pivotResult = useMemo(() => {
    if (!matConfig || rawMatrix.length === 0) return null;
    const { dims } = matConfig;
    const nDims = dims.length;
    const rPos0 = dims.indexOf(rowDims[0]);
    const rPos1 = rowDims[1] ? dims.indexOf(rowDims[1]) : -1;
    const cPos0 = dims.indexOf(colDims[0]);
    const cPos1 = colDims[1] ? dims.indexOf(colDims[1]) : -1;
    const lbl   = (dim, idx) => (maps[dim] || [])[idx] ?? '#' + idx;
    const tbl   = new Map();
    const colSet = new Set();
    for (const row of rawMatrix) {
      let ok = true;
      for (const [dim, allowed] of Object.entries(filterSets)) {
        const pos = dims.indexOf(dim);
        if (pos < 0) continue;
        if (!allowed.has(row[pos])) { ok = false; break; }
      }
      if (!ok) continue;
      const r1 = lbl(rowDims[0], row[rPos0]);
      const r2 = rPos1 >= 0 ? lbl(rowDims[1], row[rPos1]) : null;
      const c0 = lbl(colDims[0], row[cPos0]);
      const ck = cPos1 >= 0 ? c0 + COL_SEP + lbl(colDims[1], row[cPos1]) : c0;
      colSet.add(ck);
      if (!tbl.has(r1)) tbl.set(r1, { sub: new Map(), children: new Map() });
      const e = tbl.get(r1);
      accVals(e.sub, ck, row, nDims);
      if (r2 !== null) {
        if (!e.children.has(r2)) e.children.set(r2, new Map());
        accVals(e.children.get(r2), ck, row, nDims);
      }
    }
    return { tbl, colLabels: [...colSet] };
  }, [rawMatrix, matConfig, rowDims, colDims, filterSets, maps]);

  const pm = metrics[0] || 'leads';

  const orderedCols = useMemo(() => {
    if (!pivotResult) return [];
    const { tbl, colLabels } = pivotResult;
    if (colDims.length === 1) {
      if (colDims[0] === 'lm') return [...colLabels].sort((a, b) => heroMonthOrder(a) - heroMonthOrder(b));
      const cTot = {};
      for (const { sub } of tbl.values())
        for (const [c, v] of sub) cTot[c] = (cTot[c] || 0) + getMetricVal(v, pm);
      return [...colLabels].sort((a, b) => (cTot[b] || 0) - (cTot[a] || 0));
    }
    const groups = new Map();
    for (const ck of colLabels) {
      const sep = ck.indexOf(COL_SEP);
      const c0 = ck.slice(0, sep), c1 = ck.slice(sep + 1);
      if (!groups.has(c0)) groups.set(c0, new Set());
      groups.get(c0).add(c1);
    }
    let c0vals = [...groups.keys()];
    if (colDims[0] === 'lm') { c0vals.sort((a, b) => heroMonthOrder(a) - heroMonthOrder(b)); }
    else {
      const c0Tot = {};
      for (const { sub } of tbl.values())
        for (const [ck, v] of sub) {
          const c0 = ck.slice(0, ck.indexOf(COL_SEP));
          c0Tot[c0] = (c0Tot[c0] || 0) + getMetricVal(v, pm);
        }
      c0vals.sort((a, b) => (c0Tot[b] || 0) - (c0Tot[a] || 0));
    }
    const result = [];
    for (const c0 of c0vals) {
      let c1vals = [...groups.get(c0)];
      if (colDims[1] === 'lm') { c1vals.sort((a, b) => heroMonthOrder(a) - heroMonthOrder(b)); }
      else {
        const c1Tot = {};
        for (const { sub } of tbl.values())
          for (const [ck, v] of sub) {
            const sep = ck.indexOf(COL_SEP);
            if (ck.slice(0, sep) === c0) {
              const c1 = ck.slice(sep + 1);
              c1Tot[c1] = (c1Tot[c1] || 0) + getMetricVal(v, pm);
            }
          }
        c1vals.sort((a, b) => (c1Tot[b] || 0) - (c1Tot[a] || 0));
      }
      for (const c1 of c1vals) result.push(c0 + COL_SEP + c1);
    }
    return result;
  }, [pivotResult, colDims, pm]);

  const colGroups = useMemo(() => {
    if (colDims.length < 2) return [];
    const groups = [];
    let i = 0;
    while (i < orderedCols.length) {
      const c0 = orderedCols[i].slice(0, orderedCols[i].indexOf(COL_SEP));
      let span = 0;
      while (i < orderedCols.length && orderedCols[i].slice(0, orderedCols[i].indexOf(COL_SEP)) === c0) { span++; i++; }
      groups.push({ c0, span });
    }
    return groups;
  }, [orderedCols, colDims]);

  const sortedRows = useMemo(() => {
    if (!pivotResult) return [];
    const rows = [];
    for (const [label, entry] of pivotResult.tbl) {
      const total = rowTotal(entry.sub, pm);
      rows.push({ label, entry, total });
    }
    rows.sort((a, b) => {
      let av, bv;
      if (sortBy === '__total__') { av = a.total; bv = b.total; }
      else if (sortBy === '__label__') { av = a.label; bv = b.label; }
      else { av = getMetricVal(a.entry.sub.get(sortBy), pm); bv = getMetricVal(b.entry.sub.get(sortBy), pm); }
      if (av === bv) return 0;
      if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === 'asc' ? av - bv : bv - av;
    });
    return topN > 0 ? rows.slice(0, topN) : rows;
  }, [pivotResult, pm, sortBy, sortDir, topN]);

  const grandTotals = useMemo(() => {
    if (!pivotResult) return { colVals: {}, gl: 0, gr: 0 };
    const colVals = {};
    let gl = 0, gr = 0;
    for (const { sub } of pivotResult.tbl.values()) {
      for (const [c, v] of sub) {
        if (!colVals[c]) colVals[c] = [0, 0, 0, 0];
        for (let i = 0; i < 4; i++) colVals[c][i] += v[i];
        gl += v[0]; gr += v[1];
      }
    }
    return { colVals, gl, gr };
  }, [pivotResult]);

  const unapplied = useMemo(() => {
    if (!matConfig) return [];
    const ds  = new Set(matConfig.dims);
    const all = new Set([...rowDims, ...colDims]);
    const out = [];
    if (filters.sources?.size > 0 && !ds.has('src') && !all.has('src')) out.push('Source');
    if (filters.states?.size  > 0 && !ds.has('st')  && !all.has('st'))  out.push('State');
    if (filters.models?.size  > 0 && !ds.has('mdl') && !all.has('mdl')) out.push('Model');
    return out;
  }, [matConfig, filters, rowDims, colDims]);

  function toggleMetric(key) {
    setMetrics(prev =>
      prev.includes(key)
        ? prev.length > 1 ? prev.filter(k => k !== key) : prev
        : [...prev, key]
    );
  }

  function addRowDim(key) {
    if (rowDims.includes(key) || colDims.includes(key)) return;
    setRowDims([...rowDims, key]);
    setAddRowOpen(false);
    setCollapsed(new Set());
  }

  function removeRowDim(idx) {
    if (rowDims.length === 1) return;
    setRowDims(rowDims.filter((_, i) => i !== idx));
    setCollapsed(new Set());
  }

  function addColDim(key) {
    if (colDims.includes(key) || rowDims.includes(key)) return;
    setColDims([...colDims, key]);
    setAddColOpen(false);
    setSortBy('__total__');
  }

  function removeColDim(idx) {
    if (colDims.length === 1) return;
    setColDims(colDims.filter((_, i) => i !== idx));
    setSortBy('__total__');
  }

  function handleExport() {
    if (!pivotResult || sortedRows.length === 0) return;
    const hasR2  = rowDims.length > 1;
    const hasC2  = colDims.length > 1;
    const dimLbl = k => DIMS.find(d => d.key === k)?.label || k;
    const mLbl   = k => METRICS.find(x => x.key === k)?.label || k;
    const colLabel = ck => hasC2
      ? ck.slice(0, ck.indexOf(COL_SEP)) + ' — ' + ck.slice(ck.indexOf(COL_SEP) + 1)
      : ck;
    const hdr = [dimLbl(rowDims[0])];
    if (hasR2) hdr.push(dimLbl(rowDims[1]));
    for (const ck of orderedCols)
      for (const m of metrics)
        hdr.push(metrics.length > 1 ? `${colLabel(ck)} — ${mLbl(m)}` : colLabel(ck));
    for (const m of metrics)
      hdr.push(metrics.length > 1 ? `TOTAL — ${mLbl(m)}` : 'TOTAL');
    const aoa = [hdr];
    const pushCells = (arr, cMap) => {
      for (const ck of orderedCols)
        for (const m of metrics) {
          const v = getMetricVal(cMap.get(ck), m);
          arr.push(m === 'retpct' ? +(v.toFixed(2)) : v);
        }
      for (const m of metrics) {
        const t = rowTotal(cMap, m);
        arr.push(m === 'retpct' ? +(t.toFixed(2)) : t);
      }
    };
    for (const { label, entry } of sortedRows) {
      if (!hasR2) { const r = [label]; pushCells(r, entry.sub); aoa.push(r); }
      else {
        const rSub = [label, 'Subtotal']; pushCells(rSub, entry.sub); aoa.push(rSub);
        for (const [r2Lbl, cMap] of entry.children) {
          const rChild = ['', r2Lbl]; pushCells(rChild, cMap); aoa.push(rChild);
        }
      }
    }
    const gtRow = hasR2 ? ['GRAND TOTAL', ''] : ['GRAND TOTAL'];
    for (const ck of orderedCols)
      for (const m of metrics) {
        const v = getMetricVal(grandTotals.colVals[ck], m);
        gtRow.push(m === 'retpct' ? +(v.toFixed(2)) : v);
      }
    for (const m of metrics) {
      let t = 0;
      if (m === 'retpct') t = grandTotals.gl > 0 ? +(grandTotals.gr/grandTotals.gl*100).toFixed(2) : 0;
      else { for (const { sub } of pivotResult.tbl.values()) for (const v of sub.values()) t += getMetricVal(v, m); t = +t.toFixed(2); }
      gtRow.push(t);
    }
    aoa.push(gtRow);
    exportCsv(aoa, `Hero_Pivot_${Date.now()}.csv`);
  }

  const hasR2       = rowDims.length > 1;
  const hasC2       = colDims.length > 1;
  const multiMetric = metrics.length > 1;
  const allDims     = [...rowDims, ...colDims];
  const unsupported      = new Set(allDims).size < allDims.length || !matConfig;
  const awaitingPipeline = !unsupported && !(data[matConfig?.key]);
  const noData           = !unsupported && !awaitingPipeline && (!pivotResult || pivotResult.tbl.size === 0);

  const selSt = { padding:'6px 10px', fontSize:13, border:'1px solid #CBD5E1', borderRadius:8,
                  background:'#fff', color:'#0f172a', fontFamily:'inherit', cursor:'pointer' };

  const makePill = (dim, onRemove, canRemove) => {
    const label = DIMS.find(d => d.key === dim)?.label || dim;
    return ce('span', { key: dim,
      style:{ display:'inline-flex', alignItems:'center', gap:3, padding:'4px 10px',
              borderRadius:20, fontSize:12, fontWeight:600, background:'#9A3412', color:'#fff' }
    },
      label,
      canRemove && ce('span', {
        onClick: e => { e.stopPropagation(); onRemove(); },
        style:{ marginLeft:2, cursor:'pointer', opacity:0.75, fontSize:15, lineHeight:1 }
      }, '×')
    );
  };

  const addPillBtn = onClick =>
    ce('button', { onClick,
      style:{ padding:'4px 10px', borderRadius:20, fontSize:12, fontWeight:600,
              cursor:'pointer', border:'1.5px dashed #94A3B8',
              background:'#fff', color:'#64748B' }
    }, '+ Add');

  const dimDropdown = (items, onSelect) =>
    ce('div', { style:{ position:'absolute', top:'calc(100% + 4px)', left:0, zIndex:20,
        background:'#fff', border:'1px solid #E2E8F0', borderRadius:8,
        boxShadow:'0 4px 16px rgba(0,0,0,0.12)', minWidth:140, overflow:'hidden' } },
      items.map(d => ce('div', {
        key: d.key, onClick: () => onSelect(d.key),
        style:{ padding:'8px 14px', fontSize:13, cursor:'pointer', color:'#0f172a' },
        onMouseEnter: e => e.currentTarget.style.background = '#F1F5F9',
        onMouseLeave: e => e.currentTarget.style.background = '',
      }, d.label))
    );

  const metricPill = m => {
    const active = metrics.includes(m.key);
    return ce('span', { key: m.key, onClick: () => toggleMetric(m.key),
      style:{ display:'inline-flex', alignItems:'center', padding:'4px 10px',
              borderRadius:20, fontSize:12, fontWeight:600, cursor:'pointer', userSelect:'none',
              border: active ? '1.5px solid #9A3412' : '1.5px solid #CBD5E1',
              background: active ? '#9A3412' : '#fff',
              color: active ? '#fff' : '#475569' }
    }, m.label);
  };

  return ce('div', { style:{ padding:'0 4px' } },

    /* Config bar */
    ce('div', { style:{ display:'flex', gap:14, flexWrap:'wrap', alignItems:'flex-start',
        padding:'16px 18px', background:'#F8FAFC', borderRadius:12,
        border:'1px solid #E2E8F0', marginBottom:14 } },

      /* ROWS */
      ce('div', { style:{ minWidth:80 } },
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Rows'),
        ce('div', { style:{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' } },
          rowDims.map((dim, idx) => makePill(dim, () => removeRowDim(idx), rowDims.length > 1)),
          rowDims.length < 2 &&
            ce('div', { style:{ position:'relative' } },
              addPillBtn(() => setAddRowOpen(o => !o)),
              addRowOpen && dimDropdown(
                DIMS.filter(d => !rowDims.includes(d.key) && !colDims.includes(d.key)),
                addRowDim
              )
            )
        )
      ),

      ce('div', { style:{color:'#CBD5E1',fontSize:22,alignSelf:'center',fontWeight:300,paddingTop:18} }, '×'),

      /* COLUMNS */
      ce('div', { style:{ minWidth:80 } },
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Columns'),
        ce('div', { style:{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' } },
          colDims.map((dim, idx) => makePill(dim, () => removeColDim(idx), colDims.length > 1)),
          colDims.length < 2 &&
            ce('div', { style:{ position:'relative' } },
              addPillBtn(() => setAddColOpen(o => !o)),
              addColOpen && dimDropdown(
                DIMS.filter(d => !colDims.includes(d.key) && !rowDims.includes(d.key)),
                addColDim
              )
            )
        )
      ),

      ce('div', { style:{width:1,height:40,background:'#E2E8F0',alignSelf:'center',marginTop:20} }),

      /* VALUES */
      ce('div', null,
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Values'),
        ce('div', { style:{ display:'flex', gap:6, flexWrap:'wrap' } },
          METRICS.map(metricPill)
        )
      ),

      ce('div', { style:{width:1,height:40,background:'#E2E8F0',alignSelf:'center',marginTop:20} }),

      /* SORT */
      ce('div', null,
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Sort By'),
        ce('select', { value:sortBy, onChange:e=>setSortBy(e.target.value), style:selSt },
          ce('option',{value:'__total__'},'Total'),
          ce('option',{value:'__label__'},'Row Label'),
          ...(!hasC2 ? orderedCols.slice(0,8).map(c => ce('option',{key:c,value:c}, c.length>15?c.slice(0,14)+'…':c)) : [])
        )
      ),

      ce('div', null,
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Order'),
        ce('select', { value:sortDir, onChange:e=>setSortDir(e.target.value), style:selSt },
          ce('option',{value:'desc'},'↓  High → Low'),
          ce('option',{value:'asc' },'↑  Low → High'),
        )
      ),

      ce('div', null,
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Show'),
        ce('select', { value:topN, onChange:e=>setTopN(+e.target.value), style:selSt },
          ce('option',{value:10 },'Top 10'),
          ce('option',{value:20 },'Top 20'),
          ce('option',{value:50 },'Top 50'),
          ce('option',{value:100},'Top 100'),
          ce('option',{value:0  },'All rows'),
        )
      ),

      !unsupported && !noData && !awaitingPipeline &&
        ce('div', { style:{marginLeft:'auto',alignSelf:'flex-end',paddingTop:20} },
          ce('button', { onClick: handleExport,
            style:{ padding:'7px 16px', fontSize:12, fontWeight:700, border:'none',
                    borderRadius:8, background:'#EA580C', color:'#fff', cursor:'pointer' }
          }, '↓ Export CSV')
        ),
    ),

    /* click-away overlays for dropdowns */
    (addRowOpen || addColOpen) && ce('div', {
      style:{position:'fixed',inset:0,zIndex:10},
      onClick:()=>{ setAddRowOpen(false); setAddColOpen(false); }
    }),

    /* Unapplied-filter warning */
    unapplied.length > 0 && ce('div', {
      style:{ padding:'7px 14px', background:'#FFF3CD', border:'1px solid #F5A623',
              borderRadius:8, fontSize:12, color:'#92400E', marginBottom:12 }
    }, `⚠  ${unapplied.join(', ')} filter${unapplied.length>1?'s':''} not applied — not a dimension in this matrix.`),

    /* State messages */
    unsupported && ce('div', { style:{ textAlign:'center', padding:50, color:'#94A3B8', fontSize:14 } },
      new Set(allDims).size < allDims.length
        ? 'A dimension cannot appear in both Rows and Columns.'
        : `The combination ${rowDims.map(k=>DIMS.find(d=>d.key===k)?.label||k).join(' + ')} × ${colDims.map(k=>DIMS.find(d=>d.key===k)?.label||k).join(' + ')} is not supported — no matching data matrix.`
    ),

    awaitingPipeline && ce('div', { style:{ textAlign:'center', padding:50, color:'#94A3B8', fontSize:14 } },
      '📦 This combination will be available after the next data sync.'
    ),

    noData && ce('div', { style:{ textAlign:'center', padding:50, color:'#94A3B8', fontSize:14 } },
      'No data matches the current filters.'
    ),

    /* KPI summary bar */
    !unsupported && !awaitingPipeline && !noData && grandTotals.gl > 0 &&
    ce('div', { className:'card', style:{padding:'10px 18px',marginBottom:14,borderTop:'3px solid #EA580C'} },
      ce('div', { style:{display:'flex',flexWrap:'wrap',alignItems:'stretch'} },
        ...[
          { label:'Total Leads', value:Nf(grandTotals.gl), color:'#9A3412' },
          { label:'Retails',     value:Nf(grandTotals.gr), color:'#B91C1C' },
          { label:'L2R%', value:Pf(grandTotals.gl>0?grandTotals.gr/grandTotals.gl*100:0), color:'#D97706' },
          ...(data.rt_cols ? [
            { label:'DMS',      value:Nf(Object.values(grandTotals.colVals).reduce((s,v)=>s+(v[2]||0),0)), color:'#7C3AED' },
            { label:'Call Out', value:Nf(Object.values(grandTotals.colVals).reduce((s,v)=>s+(v[3]||0),0)), color:'#0891B2' },
          ] : []),
          { label:'Rows (shown)', value:String(sortedRows.length),  color:'#475569' },
          { label:'Columns',      value:String(orderedCols.length), color:'#475569' },
        ].map((s,i) => ce('div', { key:i, style:{
          padding:'6px 16px', borderLeft:i>0?'1px solid #E2E8F0':'none',
          display:'flex', flexDirection:'column', gap:2
        }},
          ce('div',{style:{fontSize:9,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap'}},s.label),
          ce('div',{style:{fontSize:15,fontWeight:700,color:s.color,fontFamily:'DM Mono,monospace'}},s.value)
        ))
      )
    ),

    /* Pivot table */
    !unsupported && !awaitingPipeline && !noData &&
    ce('div', { style:{ overflowX:'auto', borderRadius:12, border:'1px solid #E2E8F0' } },
      ce('table', { style:{ width:'100%', borderCollapse:'collapse', fontSize:13 } },

        ce('thead', null, (() => {
          const showOuterRow = hasC2 || multiMetric;
          const showMidRow   = hasC2 && multiMetric;
          const topBg   = '#1D4ED8'; const topTxt  = '#fff';
          const midBg   = '#3B82F6'; const midTxt  = '#fff';
          const botBg   = '#EA580C'; const botTxt  = '#fff';

          const rowLabelTh = (dim, i, bg, txt, small) =>
            ce('th', { key:`rl_${dim}`,
              style:{ padding: small?'6px 16px':'10px 16px', textAlign:'left', fontWeight:700,
                      whiteSpace:'nowrap', color: txt,
                      position: i===0 ? 'sticky' : undefined, left: i===0 ? 0 : undefined,
                      zIndex: i===0 ? 3 : undefined, background: bg,
                      minWidth: i===0 ? 140 : 110,
                      borderRight: i===rowDims.length-1 ? `1px solid ${txt==='#fff'?'rgba(255,255,255,0.15)':'rgba(0,0,0,0.1)'}` : 'none',
                      cursor: i===0 ? 'pointer' : 'default', userSelect:'none' },
              onClick: i===0 ? ()=>{ setSortBy('__label__'); setSortDir(d=>d==='asc'?'desc':'asc'); } : undefined
            }, (DIMS.find(d=>d.key===dim)?.label||dim) + (i===0&&sortBy==='__label__'?(sortDir==='asc'?' ↑':' ↓'):''));

          const rows = [];

          if (showOuterRow) {
            rows.push(ce('tr', { key:'hdr0', style:{ background:topBg } },
              ce('th', { colSpan: rowDims.length,
                style:{ padding:'7px 16px', textAlign:'left', fontWeight:700, color:topTxt,
                        position:'sticky', left:0, zIndex:3, background:topBg,
                        borderRight:'1px solid rgba(0,0,0,0.1)' }
              }, rowDims.map(k=>DIMS.find(d=>d.key===k)?.label||k).join(' → ')),
              ...(hasC2
                ? colGroups.map(({c0, span}, gi) =>
                    ce('th', { key:`cg_${c0}`, colSpan: span * metrics.length,
                      style:{ padding:'7px 12px', textAlign:'center', fontWeight:700, whiteSpace:'nowrap',
                              color:topTxt, background:topBg,
                              borderLeft: gi===0 ? 'none' : '1px solid rgba(0,0,0,0.1)' }
                    }, c0)
                  )
                : orderedCols.map((col, ci) =>
                    ce('th', { key:`cv_${col}`, colSpan: metrics.length,
                      style:{ padding:'7px 12px', textAlign:'center', fontWeight:700, whiteSpace:'nowrap',
                              color:topTxt, background:topBg,
                              borderLeft: ci===0 ? 'none' : '1px solid rgba(0,0,0,0.1)' }
                    }, col)
                  )
              ),
              ce('th', { colSpan: metrics.length,
                style:{ padding:'7px 12px', textAlign:'center', fontWeight:700,
                        color:topTxt, background:topBg,
                        borderLeft:'2px solid rgba(0,0,0,0.15)' }
              }, 'TOTAL')
            ));
          }

          if (showMidRow) {
            rows.push(ce('tr', { key:'hdr1', style:{ background:midBg } },
              ce('th', { colSpan: rowDims.length,
                style:{ padding:'6px 16px', position:'sticky', left:0, zIndex:3, background:midBg,
                        borderRight:'1px solid rgba(0,0,0,0.1)' }
              }, ''),
              ...orderedCols.map((ck, ci) => {
                const c1 = ck.slice(ck.indexOf(COL_SEP) + 1);
                const prevC0 = ci > 0 ? orderedCols[ci-1].slice(0, orderedCols[ci-1].indexOf(COL_SEP)) : null;
                const thisC0 = ck.slice(0, ck.indexOf(COL_SEP));
                return ce('th', { key:`cm_${ck}`, colSpan: metrics.length,
                  style:{ padding:'6px 10px', textAlign:'center', fontWeight:600, whiteSpace:'nowrap',
                          color:midTxt, background:midBg, fontSize:12,
                          borderLeft: (ci===0||thisC0!==prevC0) ? '1px solid rgba(0,0,0,0.1)' : 'none' }
                }, c1);
              }),
              ce('th', { colSpan: metrics.length,
                style:{ padding:'6px 12px', textAlign:'center', fontWeight:700,
                        color:midTxt, background:midBg,
                        borderLeft:'2px solid rgba(0,0,0,0.15)' }
              }, '')
            ));
          }

          // Bottom header row
          rows.push(ce('tr', { key:'hdrBot', style:{ background:botBg } },
            rowDims.map((dim, i) => rowLabelTh(dim, i, botBg, botTxt, showOuterRow)),
            ...(showOuterRow
              ? (hasC2
                  ? orderedCols.flatMap((ck, ci) => {
                      const c1 = ck.slice(ck.indexOf(COL_SEP)+1);
                      const prevC0 = ci>0?orderedCols[ci-1].slice(0,orderedCols[ci-1].indexOf(COL_SEP)):null;
                      const thisC0 = ck.slice(0,ck.indexOf(COL_SEP));
                      return metrics.map((m,mi) => ce('th',{ key:`bh_${ck}_${m.key}`,
                        style:{padding:'8px 10px',textAlign:'center',fontWeight:700,whiteSpace:'nowrap',color:botTxt,background:botBg,fontSize:12,
                               borderLeft:(mi===0&&(ci===0||thisC0!==prevC0))?'1px solid rgba(255,255,255,.15)':'none'} },
                        m.label));
                    })
                  : orderedCols.flatMap((col, ci) =>
                      metrics.map((m,mi) => ce('th',{ key:`bh_${col}_${m.key}`,
                        style:{padding:'8px 10px',textAlign:'center',fontWeight:700,whiteSpace:'nowrap',color:botTxt,background:botBg,fontSize:12,
                               borderLeft:(mi===0&&ci===0)?'none':(mi===0)?'1px solid rgba(255,255,255,.15)':'none'} },
                        m.label))
                    )
              )
              : orderedCols.map((col, ci) => ce('th',{key:`bh_${col}`,
                  style:{padding:'10px 12px',textAlign:'center',fontWeight:700,whiteSpace:'nowrap',color:botTxt,background:botBg,
                         borderLeft:ci===0?'1px solid rgba(255,255,255,.15)':'none',cursor:'pointer',userSelect:'none'},
                  onClick:()=>{ setSortBy(col); setSortDir(d=>d==='asc'?'desc':'asc'); }
                }, col+(sortBy===col?(sortDir==='asc'?' ↑':' ↓'):'')))
            ),
            metrics.map((m,mi) => ce('th',{ key:`tot_${m.key}`,
              style:{padding:'8px 12px',textAlign:'center',fontWeight:700,color:botTxt,background:'#7C2D12',
                     borderLeft:mi===0?'2px solid rgba(255,255,255,.3)':'none',whiteSpace:'nowrap'} },
              metrics.length>1?m.label:'TOTAL'))
          ));

          return rows;
        })()),

        ce('tbody', null,
          sortedRows.map(({ label, entry }, ri) => {
            const isCol = collapsed.has(label);
            const hasCh = hasR2 && entry.children.size > 0;
            return [
              ce('tr', { key:`r_${label}`, style:{ background: ri%2===0?'#fff':'#FFF7ED' } },
                ce('td', {
                  style:{ padding:'8px 16px', fontWeight:hasCh?700:600, position:'sticky', left:0, zIndex:1,
                          background: ri%2===0?'#fff':'#FFF7ED',
                          borderRight:'1px solid #E2E8F0', cursor: hasCh?'pointer':'default',
                          whiteSpace:'nowrap' },
                  onClick: hasCh ? () => { setCollapsed(prev => { const n=new Set(prev); n.has(label)?n.delete(label):n.add(label); return n; }) } : undefined
                }, hasCh ? (isCol?'▶ ':'▼ ')+label : label),
                hasR2 && ce('td',{style:{padding:'8px 12px',fontWeight:600,borderRight:'1px solid #E2E8F0',whiteSpace:'nowrap'}}, hasR2?'Subtotal':''),
                orderedCols.flatMap((ck,ci) =>
                  metrics.map((m,mi) => ce('td',{ key:`${label}_${ck}_${m.key}`,
                    style:{padding:'7px 12px',textAlign:'right',whiteSpace:'nowrap',
                           borderLeft:(mi===0&&ci===0)?'none':(mi===0)?'1px solid #F1F5F9':'none'} },
                    fmtV(entry.sub.get(ck), m.key)))
                ),
                metrics.map((m,mi) => ce('td',{ key:`tot_${label}_${m.key}`,
                  style:{padding:'7px 12px',textAlign:'right',fontWeight:700,background:'#FEF3C7',
                         borderLeft:mi===0?'2px solid #F59E0B':'none',whiteSpace:'nowrap'} },
                  fmtTotal(entry.sub, m.key)))
              ),
              ...(hasCh && !isCol
                ? [...entry.children.entries()].map(([r2Lbl, cMap]) =>
                    ce('tr', { key:`r2_${label}_${r2Lbl}`, style:{ background:'#FFFBEB' } },
                      ce('td',{style:{padding:'6px 16px 6px 28px',color:'#6B7280',position:'sticky',left:0,zIndex:1,background:'#FFFBEB',borderRight:'1px solid #E2E8F0'}},''),
                      ce('td',{style:{padding:'6px 12px',color:'#374151',fontSize:12,borderRight:'1px solid #E2E8F0',whiteSpace:'nowrap'}},r2Lbl),
                      orderedCols.flatMap((ck,ci) =>
                        metrics.map((m,mi) => ce('td',{ key:`c2_${r2Lbl}_${ck}_${m.key}`,
                          style:{padding:'6px 12px',textAlign:'right',fontSize:12,whiteSpace:'nowrap',
                                 borderLeft:(mi===0&&ci===0)?'none':(mi===0)?'1px solid #F1F5F9':'none'} },
                          fmtV(cMap.get(ck), m.key)))
                      ),
                      metrics.map((m,mi) => ce('td',{ key:`c2tot_${r2Lbl}_${m.key}`,
                        style:{padding:'6px 12px',textAlign:'right',fontWeight:600,fontSize:12,background:'#FEF3C7',
                               borderLeft:mi===0?'2px solid #F59E0B':'none'} },
                        fmtTotal(cMap, m.key)))
                    )
                  )
                : []
              )
            ];
          }).flat(),

          /* Grand total row */
          ce('tr', { className:'total-row' },
            ce('td', { colSpan: rowDims.length,
              style:{ padding:'8px 16px', fontWeight:800, position:'sticky', left:0, zIndex:1,
                      background:'#1E293B', color:'#fff', whiteSpace:'nowrap',
                      borderRight:'1px solid rgba(255,255,255,.2)' }
            }, '∑ Grand Total'),
            orderedCols.flatMap((ck,ci) =>
              metrics.map((m,mi) => {
                const v = getMetricVal(grandTotals.colVals[ck], m.key);
                return ce('td',{ key:`gt_${ck}_${m.key}`,
                  style:{padding:'8px 12px',textAlign:'right',fontWeight:700,fontFamily:'DM Mono,monospace',fontSize:12,
                         borderLeft:(mi===0&&ci===0)?'none':(mi===0)?'1px solid rgba(255,255,255,.15)':'none'} },
                  m.key==='retpct'?(v>0?v.toFixed(1)+'%':'—'):v===0?'—':Nf(v));
              })
            ),
            metrics.map((m,mi) => {
              let t = 0;
              if (m.key==='retpct') t = grandTotals.gl>0?(grandTotals.gr/grandTotals.gl*100):0;
              else for (const {sub} of pivotResult.tbl.values()) for (const v of sub.values()) t += getMetricVal(v,m.key);
              return ce('td',{ key:`gttot_${m.key}`,
                style:{padding:'8px 12px',textAlign:'right',fontWeight:800,fontFamily:'DM Mono,monospace',fontSize:12,
                       background:'#0F172A',borderLeft:mi===0?'2px solid rgba(255,255,255,.3)':'none'} },
                m.key==='retpct'?(t>0?t.toFixed(1)+'%':'—'):t===0?'—':Nf(t));
            })
          )
        )
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   APP ROOT — Hero MotoCorp LDR (TVS tab components, Hero data)
   ════════════════════════════════════════════════════════════════════ */
const TABS = [
  { id:'overview',    label:'Overview' },
  { id:'source',      label:'Source Analysis' },
  { id:'ltxsrc',      label:'LT \u00d7 Source' },
  { id:'modelxsrc',   label:'Model \u00d7 Source' },
  { id:'statexsrc',   label:'State \u00d7 Source' },
  { id:'cityxsrc',    label:'City \u00d7 Source' },
  { id:'statexmodel', label:'State \u00d7 Model' },
  { id:'cityxmodel',  label:'City \u00d7 Model' },
  { id:'dispersion',  label:'Retail Dispersion' },
  { id:'pivot',       label:'Pivot Table' },
];

function App({fbUser,role,presence,onSignOut,onAdminOpen}){
  const viewerMode=role==='viewer';
  const [data,setData]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const [syncErr,setSyncErr]=useState(null);
  const [lastSynced,setLastSynced]=useState(null);
  const [diagnostics,setDiagnostics]=useState(null);
  const [diagExpanded,setDiagExpanded]=useState(false);
  const [tab,setTab]=useState('overview');
  const [leadsMode,setLeadsMode]=useState('update');
  const [RT,setRT]=useState('all');
  const [filters,setFilters]=useState({months:new Set(),leadTypes:new Set(),sources:new Set(),models:new Set(),states:new Set(),cities:new Set()});
  const [isPending,startT]=useTransition();

  const handleSync=useCallback(async()=>{
    setSyncing(true);setSyncErr(null);
    try{
      const[leadsCSV,retailCSV]=await Promise.all([
        fetchSheetCsv(HERO_SHEETS_CONFIG.LEADS_URL),
        fetchSheetCsv(HERO_SHEETS_CONFIG.RETAIL_URL),
      ]);
      const leadRaw=parseCsvToRows(leadsCSV);
      const retailRaw=parseCsvToRows(retailCSV);
      if(!leadRaw.length)throw new Error('No rows in Leads sheet \u2014 ensure it is shared as Anyone \u2192 Viewer.');
      const leadResult=parseHeroLeadRows(leadRaw);
      const retailResult=parseHeroRetailRows(retailRaw);
      const{rows:joined,diagnostics:diag}=joinHeroData(leadResult,retailResult);
      if(!joined.length)throw new Error('No rows after join. Check opty_id / sourceLeadId column names.');
      const payload=buildPayload(joined);
      // Attach column/sample info to diagnostics for in-page display
      const rd2=retailResult.diagnostics;
      diag.leadCols=leadResult.diagnostics.allLeadCols||[];
      diag.leadSampleDates=leadResult.diagnostics.sampleDateValues||[];
      diag.leadDateCol=leadResult.diagnostics.detectedDateCol||'(not found)';
      diag.retailCols=rd2.allRetailCols||[];
      diag.retailSampleDates=rd2.sampleRetailDateValues||[];
      diag.retailDateCol=rd2.detectedDateCol||'(not found)';
      diag.retailBrandCol=rd2.brandColKey||'(not found)';
      diag.retailBrandValues=rd2.brandValues||[];
      diag.retailHeroBrandCount=rd2.heroBrandCount||0;
      diag.retailExcludedKey=rd2.excludedKey||0;
      diag.retailRawDateSamples=rd2.rawDateSamples||[];
      diag.retailHeroDateCount=rd2.heroDateCount||0;
      setData({...payload, retailTillDate: retailResult.maxRetailDate});
      setDiagnostics(diag);
      setLastSynced(new Date());
      // [HERO QA] full pipeline trace
      const ld=leadResult.diagnostics,rd=retailResult.diagnostics;
      console.group('[HERO QA] Hero LDR — cutoff: 03-Aug-2026');
      console.log('[HERO QA] DATA CUTOFF: 03-Aug-2026');
      console.log('');
      console.log('[HERO QA] ── LEAD MASTER ──');
      console.log('[HERO QA] Lead raw:',ld.totalRows);
      console.log('[HERO QA] Lead included:',ld.included);
      console.log('[HERO QA] Lead excl before cutoff:',ld.excludedBeforeCutoff);
      console.log('[HERO QA] Lead excl invalid/missing date:',ld.excludedInvalidDate);
      console.log('[HERO QA] Lead earliest included:',ld.earliestDate?formatRetailDate(ld.earliestDate):'—');
      console.log('[HERO QA] Lead latest included:',ld.latestDate?formatRetailDate(ld.latestDate):'—');
      console.log('[HERO QA] Lead date col detected:',ld.detectedDateCol);
      console.log('[HERO QA] Lead ALL COLUMNS:',ld.allLeadCols);
      if(ld.sampleDateValues&&ld.sampleDateValues.length)
        ld.sampleDateValues.forEach(x=>console.log('[HERO QA] Lead date sample: raw="'+x.raw+'" → '+(x.parsed||'UNPARSEABLE')));
      else console.log('[HERO QA] Lead date samples: (none — col not detected or empty)');
      console.log('');
      console.log('[HERO QA] ── RETAIL MASTER ──');
      console.log('[HERO QA] Retail raw:',rd.totalRows);
      console.log('[HERO QA] Retail brand col detected:',rd.brandColKey);
      console.log('[HERO QA] Retail unique brand values:',rd.brandValues);
      console.log('[HERO QA] Retail excl (brand filter):',rd.excludedBrand);
      console.log('[HERO QA] Retail hero brand count (after brand filter):',rd.heroBrandCount);
      console.log('[HERO QA] Retail excl (missing key/month):',rd.excludedKey);
      console.log('[HERO QA] Retail date col detected:',rd.detectedDateCol);
      console.log('[HERO QA] Retail ALL COLUMNS:',rd.allRetailCols);
      console.log('[HERO QA] Retail hero date valid (parses OK):',rd.heroDateCount);
      console.log('[HERO QA] Retail excl invalid/missing date:',rd.excludedInvalidDate);
      console.log('[HERO QA] Retail excl before cutoff:',rd.excludedBeforeCutoff);
      console.log('[HERO QA] Retail included (final):',rd.heroRows);
      console.log('[HERO QA] Retail earliest included:',diag.retailEarliestDate?formatRetailDate(diag.retailEarliestDate):'—');
      console.log('[HERO QA] Retail latest included:',diag.retailLatestDate?formatRetailDate(diag.retailLatestDate):'—');
      if(rd.rawDateSamples&&rd.rawDateSamples.length)
        rd.rawDateSamples.forEach(x=>console.log('[HERO QA] Retail date sample (Hero rows): raw="'+x.raw+'" → '+(x.parsed||'UNPARSEABLE')));
      else console.log('[HERO QA] Retail date samples (Hero rows): (none)');
      if(rd.sampleRetailDateValues&&rd.sampleRetailDateValues.length)
        rd.sampleRetailDateValues.forEach(x=>console.log('[HERO QA] Retail date sample (ALL rows): raw="'+x.raw+'" → '+(x.parsed||'UNPARSEABLE')));
      console.log('');
      console.log('[HERO QA] ── MATCHING ──');
      console.log('[HERO QA] Retail valid keys:',diag.retailKeyCount);
      console.log('[HERO QA] Lead valid keys:',diag.leadKeyCount);
      console.log('[HERO QA] Retail keys matched to leads:',diag.matched);
      console.log('[HERO QA] Retail keys unmatched:',diag.retailKeyCount-diag.matched);
      console.log('[HERO QA] Lead keys unmatched:',diag.unmatched);
      if(diag.keyMatchSamples&&diag.keyMatchSamples.length)
        diag.keyMatchSamples.forEach(s=>console.log('[HERO QA] MATCH SAMPLE retail key="'+s.retailKey+'" → inLeads='+s.inLeads));
      if(rd.rawKeySamples&&rd.rawKeySamples.length)
        console.log('[HERO QA] Retail key samples (Hero rows):',rd.rawKeySamples);
      console.log('');
      console.log('[HERO QA] ── RESULTS ──');
      const rAll=joined.filter(r=>r.isBooked).length;
      const rDms=joined.filter(r=>r.isBooked&&r.callType==='dms').length;
      const rCo=joined.filter(r=>r.isBooked&&r.callType==='co').length;
      console.log('[HERO QA] Booked/joined rows:',rAll);
      console.log('[HERO QA] R_all:',rAll,'| R_dms:',rDms,'| R_co:',rCo);
      console.log('[HERO QA] Retail Till Date:',retailResult.maxRetailDate?formatRetailDate(retailResult.maxRetailDate):'— (no valid retail dates found)');
      console.log('[HERO QA] Booked with both dates (bdm eligible):',joined.filter(r=>r.isBooked&&r.leadDate&&r.retailDate).length);
      console.log('[HERO QA] BDM rows:',payload.bdm.length);
      console.groupEnd();
    }catch(e){setSyncErr(e.message);}
    finally{setSyncing(false);}
  },[]);

  useEffect(()=>{if(HERO_SHEETS_CONFIG.AUTO_SYNC_ON_LOAD)handleSync();},[]);

  const effectiveData=useMemo(()=>{
    if(!data)return null;
    // On Create: lead_month dimension (default)
    if(leadsMode==='create')return data;
    // On Update: booking_month dimension (booked leads → booking_month; unbooked → lead_month)
    if(!data.bm_monthly)return data;
    return{
      ...data,
      monthly:data.bm_monthly,sm:data.bm_sm,ltm:data.bm_ltm,mm:data.bm_mm,stm:data.bm_stm,
      mxst:data.bm_mxst,cm:data.bm_cm||[],csm:data.bm_csm||[],cxm:data.bm_cxm||[],univ:data.bm_univ,
      mlt:data.mlt||[],stlt:data.stlt||[],cdm:data.cdm||[],cdsm:data.cdsm||[],stcm:data.stcm||[],
      disp:data.disp||[],
    };
  },[data,leadsMode]);

  const months=useMemo(()=>{
    if(!effectiveData)return[];
    const allM=[...new Set(effectiveData.maps.lm)].sort((a,b)=>heroMonthOrder(b)-heroMonthOrder(a));
    if(!filters.months||filters.months.size===0)return allM;
    if(filters.months===FILTER_CLEARED)return['\x00'];
    return allM.filter(m=>filters.months.has(m));
  },[effectiveData,filters.months]);

  const visibleTabs=viewerMode
    ?TABS.filter(t=>['modelxsrc','statexsrc','cityxsrc','statexmodel','cityxmodel'].includes(t.id))
    :TABS;

  const tabContent=useMemo(()=>{
    if(!effectiveData)return null;
    const props={data:effectiveData,filters,months,RT,viewerMode};
    switch(tab){
      case 'overview':    return ce(OverviewTab,   props);
      case 'source':      return ce(SourceTab,      props);
      case 'ltxsrc':      return ce(LTSourceTab,    props);
      case 'modelxsrc':   return ce(ModelSourceTab, props);
      case 'statexsrc':   return ce(StateSourceTab, props);
      case 'cityxsrc':    return ce(CitySourceTab,  props);
      case 'statexmodel': return ce(StateModelTab,  props);
      case 'cityxmodel':  return ce(CityModelTab,   props);
      case 'dispersion':  return ce(DispersionTab,  props);
      case 'pivot':       return ce(PivotTab,       props);
      default: return null;
    }
  },[tab,effectiveData,filters,months,RT,viewerMode]);

  if(!effectiveData)return ce(HeroSyncScreen,{onSync:handleSync,syncing,syncErr});

  return ce('div',{style:{minHeight:'100vh',background:'#f8fafc'}},
    /* Header */
    ce('div',{style:{background:'#9A3412',padding:'0 24px',position:'sticky',top:0,zIndex:100,boxShadow:'0 2px 16px rgba(124,45,18,.35)'}},
      ce('div',{style:{maxWidth:1440,margin:'0 auto',display:'flex',alignItems:'center',gap:16}},
        ce('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 0',flexShrink:0}},
          ce('div',{style:{width:34,height:34,borderRadius:8,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:900,color:'#EA580C',boxShadow:'0 2px 8px rgba(0,0,0,.15)'}},'H'),
          ce('div',null,
            ce('div',{style:{fontSize:13,fontWeight:800,color:'#fff',letterSpacing:'-.02em'}},'Hero \u00b7 LDR'),
            ce('div',{style:{fontSize:9,color:'#FED7AA',letterSpacing:'.07em',fontWeight:600}},'LEAD DISPOSITION DASHBOARD v2.0 \u00b7 BikeDekho')
          )
        ),
        (()=>{
          let gL=0,gR=0;
          for(const row of effectiveData.monthly){gL+=row[1];gR+=row[2];}
          return ce('div',{style:{flex:1,display:'flex',gap:16,overflowX:'auto',padding:'8px 0',borderLeft:'1px solid rgba(255,255,255,.3)',paddingLeft:16,marginLeft:4}},
            [{l:'Leads',v:gL.toLocaleString('en-IN')},{l:'Bookings',v:gR.toLocaleString('en-IN')},
             {l:'L2R%',v:gL>0?(gR/gL*100).toFixed(1)+'%':'\u2014'},{l:'Months',v:effectiveData.maps.lm.length},
             {l:'Retail Till',v:data&&data.retailTillDate?formatRetailDate(data.retailTillDate):'\u2014'}]
            .map((k,i)=>ce('div',{key:i,style:{flexShrink:0,textAlign:'center',minWidth:56}},
              ce('div',{style:{fontSize:8,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'#FED7AA'}},k.l),
              ce('div',{style:{fontSize:13,fontWeight:800,color:'#fff',fontFamily:'DM Mono,monospace',letterSpacing:'-.02em'}},k.v)
            ))
          );
        })(),
        ce('button',{onClick:handleSync,disabled:syncing,
          style:{flexShrink:0,padding:'6px 16px',background:syncing?'rgba(255,255,255,.7)':'#fff',border:'none',borderRadius:20,color:'#7C2D12',fontSize:10,cursor:syncing?'default':'pointer',fontFamily:'inherit',fontWeight:700,boxShadow:'0 2px 8px rgba(0,0,0,.12)',display:'flex',alignItems:'center',gap:5}},
          syncing?ce('span',{style:{display:'inline-block',animation:'spin .8s linear infinite',fontSize:11}},'\u27f3'):'\ud83d\udd04',
          syncing?'Syncing\u2026':'Sync Sheets'
        ),
        ce('div',{style:{display:'flex',alignItems:'center',background:'#F1F5F9',borderRadius:20,padding:'2px',border:'1px solid #E2E8F0',gap:2,flexShrink:0}},
          ce('button',{onClick:()=>setLeadsMode('create'),
            style:{padding:'4px 12px',fontSize:10,fontWeight:700,fontFamily:'inherit',border:'none',borderRadius:18,cursor:'pointer',transition:'all 120ms',
              background:leadsMode==='create'?'#9A3412':'transparent',color:leadsMode==='create'?'#fff':'#64748B',whiteSpace:'nowrap'}},'On Create'),
          ce('button',{onClick:()=>setLeadsMode('update'),
            style:{padding:'4px 12px',fontSize:10,fontWeight:700,fontFamily:'inherit',border:'none',borderRadius:18,cursor:'pointer',transition:'all 120ms',
              background:leadsMode==='update'?'#9A3412':'transparent',color:leadsMode==='update'?'#fff':'#64748B',whiteSpace:'nowrap'}},'On Update'),
        ),
        ce('div',{style:{borderLeft:'1px solid rgba(255,255,255,.25)',paddingLeft:10,marginLeft:4,flexShrink:0}},
          ce(PresenceStrip,{presence,fbUser,role,onSignOut,onAdminOpen})
        )
      )
    ),
    syncErr&&ce('div',{style:{background:'#fef2f2',borderBottom:'1px solid #fecaca',padding:'5px 24px',display:'flex',alignItems:'center',gap:8}},
      ce('span',{style:{fontSize:10,color:'#dc2626',flex:1}},'\u26a0 Sync error: '+syncErr),
      ce('button',{onClick:handleSync,style:{fontSize:10,padding:'3px 10px',borderRadius:8,border:'1px solid #fecaca',background:'#fff',color:'#dc2626',cursor:'pointer',fontFamily:'inherit',fontWeight:600}},'Retry')
    ),
    lastSynced&&!syncErr&&ce('div',{style:{background:'#f0fdf4',borderBottom:'1px solid #bbf7d0',padding:'4px 24px',fontSize:10,color:'#166534'}},
      '\u2713 Synced '+lastSynced.toLocaleString()+(diagnostics?' \u00b7 '+diagnostics.matched.toLocaleString('en-IN')+' bookings matched':'')
    ),
    diagnostics&&ce(HeroDiagnostics,{d:diagnostics,visible:diagExpanded,onToggle:()=>setDiagExpanded(p=>!p)}),
    /* Tab nav */
    ce('div',{style:{background:'#fff',borderBottom:'2px solid #FED7AA',position:'sticky',top:54,zIndex:99,boxShadow:'0 2px 8px rgba(124,45,18,.08)'}},
      ce('div',{style:{maxWidth:1440,margin:'0 auto',display:'flex',alignItems:'center',gap:0,padding:'0 24px',opacity:isPending?0.6:1,transition:'opacity .15s'}},
        visibleTabs.map(t=>ce('button',{key:t.id,className:'tab-pill'+(tab===t.id?' active':''),onClick:()=>startT(()=>setTab(t.id))},t.label)),
        isPending&&ce('span',{style:{marginLeft:12,fontSize:12,color:'#6B7280'}},'Loading\u2026')
      )
    ),
    /* Filter bar */
    ce('div',{style:{maxWidth:1440,margin:'0 auto',padding:'14px 24px 0',opacity:isPending?0.6:1,transition:'opacity .15s'}},
      ce(FilterBar,{data:effectiveData,filters,onFiltersChange:f=>startT(()=>setFilters(f)),RT,setRT,viewerMode})
    ),
    /* Tab content */
    ce('div',{style:{maxWidth:1440,margin:'0 auto',padding:'14px 24px 32px'}},
      tabContent
    )
  );
}

var _fbApp=null;
function getFirebase(){
  if(!_fbApp){
    try{_fbApp=firebase.initializeApp(FIREBASE_CONFIG,'hero');}
    catch(e){_fbApp=firebase.apps.find(function(a){return a.name==='hero';})||firebase.app('hero');}
  }
  return _fbApp;
}
function getFbAuth(){return firebase.auth(getFirebase());}
function getFbDb(){return firebase.firestore(getFirebase());}
function getFbRTDB(){
  try{return firebase.database(getFirebase());}
  catch(e){console.warn('[HERO AUTH] Realtime Database not configured — presence disabled');return null;}
}

function isAdminEmail(email){return ADMIN_EMAILS.includes((email||'').toLowerCase());}
function ensureUserDoc(user){
  var ref=getFbDb().collection(USERS_COL).doc(user.uid);
  var isAdmin=isAdminEmail(user.email);
  return ref.get().then(function(snap){
    if(!snap.exists){
      return ref.set({email:user.email,displayName:user.displayName||user.email,photoURL:user.photoURL||'',
        role:isAdmin?'admin':'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    var updates={};
    if(snap.data().email!==user.email)Object.assign(updates,{email:user.email,displayName:user.displayName||user.email,photoURL:user.photoURL||''});
    if(isAdmin&&snap.data().role!=='admin')updates.role='admin';
    if(Object.keys(updates).length)return ref.update(updates);
  });
}
function setupPresence(user){
  var rtdb=getFbRTDB();
  if(!rtdb)return null;
  var presRef=rtdb.ref(PRESENCE_PATH+'/'+user.uid);
  presRef.set({uid:user.uid,email:user.email,name:user.displayName||user.email,photo:user.photoURL||'',ts:firebase.database.ServerValue.TIMESTAMP});
  presRef.onDisconnect().remove();
  return presRef;
}

function PresenceStrip({presence,fbUser,role,onSignOut,onAdminOpen}){
  var pArr=Object.values(presence||{});
  var others=pArr.filter(function(p){return p.uid!==fbUser.uid;});
  var selfPres=pArr.find(function(p){return p.uid===fbUser.uid;})||{name:fbUser.displayName,photo:fbUser.photoURL,email:fbUser.email,uid:fbUser.uid};
  var COLORS=['#2563eb','#16a34a','#d97706','#7c3aed','#db2777','#0891b2','#ea580c','#0d9488'];
  function colorFor(uid){return COLORS[((uid||'').charCodeAt(0)+((uid||'').charCodeAt(1)||0))%COLORS.length]||COLORS[0];}
  function initials(n){return((n||'?').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2)||'?').toUpperCase();}
  function Av(p,highlight){
    return ce('div',{key:p.uid,className:'avatar',style:{background:colorFor(p.uid),border:highlight?'2px solid #FDBA74':'2px solid rgba(255,255,255,.4)'},title:p.name||p.email},
      ce('div',{className:'avatar-tip'},p.name||p.email),
      p.photo?ce('img',{src:p.photo,style:{width:'100%',height:'100%',borderRadius:'50%',objectFit:'cover'},alt:''}):initials(p.name||p.email)
    );
  }
  return ce('div',{className:'presence-strip'},
    others.length>0&&ce('div',{style:{display:'flex',alignItems:'center',gap:2,marginRight:4}},
      ce('span',{style:{fontSize:8,color:'rgba(255,255,255,.6)',textTransform:'uppercase',letterSpacing:'.07em',marginRight:4}},'Live:'),
      others.slice(0,6).map(function(p){return Av(p,false);}),
      others.length>6&&ce('div',{className:'avatar',style:{background:'rgba(255,255,255,.25)',fontSize:9,color:'#fff'}},'+' +(others.length-6))
    ),
    Av(selfPres,true),
    (role==='admin'||role==='full')&&ce('span',{className:'viewer-badge',style:{background:'rgba(255,255,255,.15)',color:'#FED7AA',borderRadius:20,padding:'2px 8px',fontSize:9,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',marginLeft:4}},role==='admin'?'Admin':'Full'),
    role==='viewer'&&ce('span',{className:'viewer-badge',style:{marginLeft:4}},'Viewer'),
    role==='admin'&&ce('button',{
      style:{marginLeft:6,padding:'4px 10px',borderRadius:6,border:'1px solid rgba(255,255,255,.3)',background:'rgba(255,255,255,.12)',fontSize:11,cursor:'pointer',color:'#fff',fontWeight:600,fontFamily:'inherit',whiteSpace:'nowrap'},
      onClick:onAdminOpen},'\u2699 Admin'),
    ce('button',{
      style:{marginLeft:4,padding:'4px 10px',borderRadius:6,border:'1px solid rgba(255,255,255,.3)',background:'rgba(255,255,255,.1)',fontSize:11,cursor:'pointer',color:'rgba(255,255,255,.85)',fontFamily:'inherit',whiteSpace:'nowrap'},
      onClick:onSignOut},'Sign Out')
  );
}

function AdminPanel({onClose}){
  var[users,setUsers]=useState([]);
  var[saving,setSaving]=useState(null);
  var[panelErr,setPanelErr]=useState('');
  useEffect(function(){
    var unsub=getFbDb().collection(USERS_COL).orderBy('createdAt','asc').onSnapshot(
      function(snap){setUsers(snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},
      function(e){setPanelErr(e.message);}
    );
    return unsub;
  },[]);
  function changeRole(uid,newRole){
    setSaving(uid);
    getFbDb().collection(USERS_COL).doc(uid).update({role:newRole})
      .then(function(){setSaving(null);})
      .catch(function(e){setPanelErr(e.message);setSaving(null);});
  }
  var roleColor={admin:'#92400e',full:'#15803d',viewer:'#1d4ed8',pending:'#6b7280'};
  var roleBg={admin:'#fef3c7',full:'#dcfce7',viewer:'#dbeafe',pending:'#f3f4f6'};
  return ce('div',{className:'admin-panel-overlay',onClick:function(e){if(e.target===e.currentTarget)onClose();}},
    ce('div',{className:'admin-card'},
      ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}},
        ce('span',{style:{fontSize:15,fontWeight:700,color:'#111827'}},'\ud83d\udc65 User Access Management'),
        ce('button',{style:{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#9ca3af',lineHeight:1},onClick:onClose},'\u00d7')
      ),
      ce('p',{style:{fontSize:11,color:'#6b7280',margin:'0 0 14px',lineHeight:1.7}},
        ce('strong',null,'pending'),' \u2014 awaiting access  \u00b7  ',
        ce('strong',null,'viewer'),' \u2014 totals only  \u00b7  ',
        ce('strong',null,'full'),' \u2014 all columns  \u00b7  ',
        ce('strong',null,'admin'),' \u2014 full + manage users'
      ),
      panelErr&&ce('div',{style:{background:'#fef2f2',color:'#dc2626',padding:'8px 12px',borderRadius:8,fontSize:12,marginBottom:12}},panelErr),
      ce('div',{style:{overflowX:'auto'}},
        ce('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:480}},
          ce('thead',null,ce('tr',{style:{background:'#fff7ed'}},
            ['Email','Name','Role','Change To'].map(function(h,i){
              return ce('th',{key:i,style:{padding:'8px 10px',textAlign:'left',fontWeight:700,color:'#7C2D12',fontSize:11,borderBottom:'2px solid #FDBA74'}},h);
            })
          )),
          ce('tbody',null,users.map(function(u){
            return ce('tr',{key:u.id,style:{borderBottom:'1px solid #FFF7ED'}},
              ce('td',{style:{padding:'7px 10px',color:'#6b7280',fontSize:11,maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},u.email),
              ce('td',{style:{padding:'7px 10px',color:'#374151',fontSize:11}},u.displayName||'\u2014'),
              ce('td',{style:{padding:'7px 10px'}},
                ce('span',{style:{padding:'2px 8px',borderRadius:20,fontSize:10,fontWeight:700,background:roleBg[u.role]||roleBg.pending,color:roleColor[u.role]||roleColor.pending}},u.role||'pending')
              ),
              ce('td',{style:{padding:'7px 10px'}},
                isAdminEmail(u.email)
                  ?ce('span',{style:{fontSize:11,color:'#9ca3af'}},'\u2014')
                  :saving===u.id
                    ?ce('span',{style:{fontSize:11,color:'#9ca3af'}},'Saving\u2026')
                    :ce('select',{value:u.role||'pending',onChange:function(e){changeRole(u.id,e.target.value);},
                        style:{fontSize:11,padding:'3px 8px',borderRadius:6,border:'1px solid #d1d5db',cursor:'pointer',background:'#fff',fontFamily:'inherit'}},
                      ['pending','viewer','full','admin'].map(function(r){
                        return ce('option',{key:r,value:r},r.charAt(0).toUpperCase()+r.slice(1));
                      })
                    )
              )
            );
          }))
        )
      )
    )
  );
}

function AuthGate(){
  var[authState,setAuthState]=useState('loading');
  var[fbUser,setFbUser]=useState(null);
  var[role,setRole]=useState(null);
  var[presence,setPresence]=useState({});
  var[authErr,setAuthErr]=useState('');
  var[authLoading,setAuthLoading]=useState(false);
  var[showAdmin,setShowAdmin]=useState(false);
  var cleanups=React.useRef([]);
  var handledUid=React.useRef(null); // dedup: track last handled uid

  useEffect(function(){
    var auth=getFbAuth();
    var mounted=true;

    function teardown(){
      cleanups.current.forEach(function(f){try{f();}catch(e){}});
      cleanups.current=[];
    }

    function handleUser(user){
      if(!mounted)return;
      if(!user){
        teardown();
        handledUid.current=null;
        if(mounted){setAuthState('unauth');setFbUser(null);setRole(null);setPresence({});}
        return;
      }
      if(handledUid.current===user.uid){return;}
      teardown();
      handledUid.current=user.uid;
      var email=(user.email||'').toLowerCase().trim();
      if(!email||!ALLOWED_DOMAINS.some(function(d){return email.endsWith(d);})){
        var domainErr='Access denied: '+email+' is not from an allowed domain (@girnarsoft.com or @girnarcare.com).';
        if(mounted)setAuthErr(domainErr);
        handledUid.current=null;
        auth.signOut();
        return;
      }
      if(mounted){setFbUser(user);setAuthState('pending');}
      ensureUserDoc(user).catch(function(e){
        console.error('[HERO AUTH] ensureUserDoc failed:',e.code||e.message);
      });
      var presRef=setupPresence(user);
      if(presRef)cleanups.current.push(function(){try{presRef.remove();}catch(e){}});
      var unsubRole=getFbDb().collection(USERS_COL).doc(user.uid).onSnapshot(
        function(snap){
          if(mounted){
            var r=(snap.data()||{}).role||'pending';
            setRole(r);setAuthState(r==='pending'?'pending':'authed');
          }
        },
        function(e){
          if(mounted){
            var fallbackRole=isAdminEmail(user.email)?'admin':'full';
            setRole(fallbackRole);setAuthState('authed');
          }
        }
      );
      cleanups.current.push(unsubRole);
      var _rtdb=getFbRTDB();
      if(_rtdb){
        var presListenRef=_rtdb.ref(PRESENCE_PATH);
        presListenRef.on('value',function(snap){if(mounted)setPresence(snap.val()||{});});
        cleanups.current.push(function(){presListenRef.off();});
      }
    }

    var unsubAuth=auth.onAuthStateChanged(function(user){handleUser(user);});

    return function(){
      mounted=false;
      unsubAuth();
      teardown();
    };
  },[]);

  function handleLogin(){
    setAuthLoading(true);setAuthErr('');
    var provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    getFbAuth().signInWithPopup(provider)
      .catch(function(e){
        var code=e&&e.code||'';
        var msg='Sign-in error ('+code+'): '+e.message;
        if(code==='auth/popup-blocked'){msg='Pop-up was blocked by your browser. Please allow pop-ups for this site and try again.';}
        else if(code==='auth/unauthorized-domain'){msg='This domain is not authorized. Contact the administrator.';}
        setAuthErr(msg);
        setAuthLoading(false);
      });
  }
  function handleSignOut(){
    cleanups.current.forEach(function(f){try{f();}catch(e){}});
    getFbAuth().signOut();
  }

  if(authState==='loading')return ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#6b7280',fontSize:13,fontFamily:'DM Mono,monospace'}},'Authenticating\u2026');
  if(authState==='unauth')return ce(LoginPage,{onLogin:handleLogin,loading:authLoading,error:authErr});
  if(authState==='pending')return ce(PendingPage,{user:fbUser,onSignOut:handleSignOut});
  return ce(React.Fragment,null,
    showAdmin&&ce(AdminPanel,{onClose:function(){setShowAdmin(false);}}),
    ce(App,{fbUser:fbUser,role:role,presence:presence,onSignOut:handleSignOut,onAdminOpen:function(){setShowAdmin(true);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(AuthGate,null));
</script>
</body>
</html>
