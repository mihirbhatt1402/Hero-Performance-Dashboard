/* ════════════════════════════════════════════════════════════════════
   STATE × SOURCE TAB  (Zone → State → City → Dealer drill-down)
   ════════════════════════════════════════════════════════════════════ */
const StateSourceTab = React.memo(function StateSourceTab({ data, filters, months, RT, viewerMode }) {
  const { maps, stm, univ: univRaw } = data;
  const univ = univRaw || [];
  const cm        = data.cm   || [];
  const cdm       = data.cdm  || [];
  const csm_data  = data.csm  || [];
  const cdsm_data = data.cdsm || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const hasCities    = !!(maps.city && maps.city_state && cm.length > 0);
  const hasDealers   = !!(maps.dl && cdm.length > 0);
  const hasCitySrc   = csm_data.length > 0;
  const hasDealerSrc = cdsm_data.length > 0;

  const allSrcs   = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const [expandedGrps, setExpandedGrps] = useState(new Set());
  const onToggleGrp = useCallback(id => setExpandedGrps(prev => {
    const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n;
  }), []);

  // Exclusive accordion — only one node open per level
  const [openZone,  setOpenZone]  = useState(null);
  const [openState, setOpenState] = useState(null);
  const [openCity,  setOpenCity]  = useState(null);

  const onClickZone  = useCallback(z => { setOpenZone(p => p===z?null:z); setOpenState(null); setOpenCity(null); }, []);
  const onClickState = useCallback(s => { setOpenState(p => p===s?null:s); setOpenCity(null); }, []);
  const onClickCity  = useCallback(c => { setOpenCity(p => p===c?null:c); }, []);

  // Precompute city → index reverse map (O(1) lookup vs indexOf)
  const cityIndexMap = useMemo(() => {
    if (!maps.city) return new Map();
    return new Map(maps.city.map((c,i) => [c,i]));
  }, [maps.city]);

  const renderMonthGrid = useCallback((M) => {
    const allSrcF  = !filters.sources || filters.sources.size === 0;
    const allStateF = !filters.states  || filters.states.size  === 0;
    // Normalize mixed-case state names (e.g. "DELHI" → "Delhi") so duplicates merge
    const normSt = s => (s||'').split(/\s+/).map(w => w ? w[0].toUpperCase()+w.slice(1).toLowerCase() : w).join(' ') || 'Unknown';

    // ── State × Source totals ──
    const stateData = new Map(); // state → { total:[l,r], byS: Map<src,[l,r]> }
    let gL=0, gR=0;
    const grandSrcMap = new Map();
    const univF = makeUnivFilter(filters);

    const hasCityF = !!(filters.cities && filters.cities.size > 0 && maps.city && maps.city_state);
    if (univF) {
      // model or leadType filter active — derive state totals from univ
      for (const row of univ) {
        if (maps.lm[row[4]] !== M) continue;
        const state = normSt(maps.st[row[2]]);
        if (!allStateF && !filters.states.has(state)) continue;
        const src = maps.src[row[1]];
        if (!allSrcF && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r]=getLR(row);
        gL+=l; gR+=r;
        if (!stateData.has(state)) stateData.set(state, { total:[0,0], byS:new Map() });
        const sd = stateData.get(state);
        sd.total[0]+=l; sd.total[1]+=r;
        const c = sd.byS.get(src)||[0,0]; c[0]+=l; c[1]+=r; sd.byS.set(src,c);
        const gc = grandSrcMap.get(src)||[0,0]; gc[0]+=l; gc[1]+=r; grandSrcMap.set(src,gc);
      }
    } else if (hasCityF && csm_data.length > 0) {
      // city-only filter: use city×src×month [city,src,lm,l,r,d,c], group by state
      for (const row of csm_data) {
        if (maps.lm[row[2]] !== M) continue;
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const sti = maps.city_state[row[0]];
        if (sti == null) continue;
        const state = normSt(maps.st[sti]);
        if (!allStateF && !filters.states.has(state)) continue;
        const src = maps.src[row[1]];
        if (!allSrcF && !filters.sources.has(src)) continue;
        const [l,r]=getLR(row);
        gL+=l; gR+=r;
        if (!stateData.has(state)) stateData.set(state, { total:[0,0], byS:new Map() });
        const sd = stateData.get(state);
        sd.total[0]+=l; sd.total[1]+=r;
        const c = sd.byS.get(src)||[0,0]; c[0]+=l; c[1]+=r; sd.byS.set(src,c);
        const gc = grandSrcMap.get(src)||[0,0]; gc[0]+=l; gc[1]+=r; grandSrcMap.set(src,gc);
      }
    } else {
      for (const row of stm) {
        if (maps.lm[row[2]] !== M) continue;
        const state = normSt(maps.st[row[0]]);
        if (!allStateF && !filters.states.has(state)) continue;
        const src = maps.src[row[1]];
        if (!allSrcF && !filters.sources.has(src)) continue;
        const [l,r]=getLR(row);
        gL+=l; gR+=r;
        if (!stateData.has(state)) stateData.set(state, { total:[0,0], byS:new Map() });
        const sd = stateData.get(state);
        sd.total[0]+=l; sd.total[1]+=r;
        const c = sd.byS.get(src)||[0,0]; c[0]+=l; c[1]+=r; sd.byS.set(src,c);
        const gc = grandSrcMap.get(src)||[0,0]; gc[0]+=l; gc[1]+=r; grandSrcMap.set(src,gc);
      }
    }

    // ── City totals for the open state (from cm + city_state map) ──
    const cityData = new Map(); // city → [l,r]
    const hasCityFlt = !!(filters.cities && filters.cities.size > 0 && maps.city);
    if (openState && hasCities) {
      for (const row of cm) {
        if (maps.lm[row[1]] !== M) continue;
        const cti = row[0];
        const sti = maps.city_state[cti];
        if (sti == null || maps.st[sti] !== openState) continue;
        const city = maps.city[cti];
        if (hasCityFlt && !filters.cities.has(city)) continue;
        const cur = cityData.get(city)||[0,0];
        const [cl,cr]=getLR(row); cur[0]+=cl; cur[1]+=cr; cityData.set(city, cur);
      }
    }

    // ── City × Source breakdown ──
    const citySourceByS = new Map(); // city → Map<src,[l,r]>
    if (openState && hasCitySrc) {
      for (const row of csm_data) {
        if (maps.lm[row[2]] !== M) continue;
        const cti = row[0];
        const sti = maps.city_state[cti];
        if (sti == null || maps.st[sti] !== openState) continue;
        const city = maps.city[cti];
        if (hasCityFlt && !filters.cities.has(city)) continue;
        const src  = maps.src[row[1]];
        if (!citySourceByS.has(city)) citySourceByS.set(city, new Map());
        const bySrc = citySourceByS.get(city);
        const cur = bySrc.get(src)||[0,0];
        const [cl,cr]=getLR(row); cur[0]+=cl; cur[1]+=cr; bySrc.set(src,cur);
      }
    }

    // ── Dealer totals for the open city (from cdm) ──
    const dealerData = new Map(); // dealer → [l,r]
    if (openCity && hasDealers) {
      const oci = cityIndexMap.get(openCity) ?? -1;
      if (oci >= 0) {
        for (const row of cdm) {
          if (row[0] !== oci) continue;
          if (maps.lm[row[2]] !== M) continue;
          const dl = maps.dl[row[1]];
          const cur = dealerData.get(dl)||[0,0];
          const [dll,dlr]=getLR(row); cur[0]+=dll; cur[1]+=dlr; dealerData.set(dl, cur);
        }
      }
    }

    // ── Dealer × Source breakdown ──
    const dealerSourceByS = new Map(); // dealer → Map<src,[l,r]>
    if (openCity && hasDealerSrc) {
      const oci = cityIndexMap.get(openCity) ?? -1;
      if (oci >= 0) {
        for (const row of cdsm_data) {
          if (row[0] !== oci) continue;
          if (maps.lm[row[3]] !== M) continue;
          const dl  = maps.dl[row[1]];
          const src = maps.src[row[2]];
          if (!dealerSourceByS.has(dl)) dealerSourceByS.set(dl, new Map());
          const bySrc = dealerSourceByS.get(dl);
          const cur = bySrc.get(src)||[0,0];
          const [dll,dlr]=getLR(row); cur[0]+=dll; cur[1]+=dlr; bySrc.set(src,cur);
        }
      }
    }

    // ── Group states into zones ──
    const zoneData = new Map();
    for (const [state, sd] of stateData) {
      const zone = getZone(state);
      if (!zoneData.has(zone)) zoneData.set(zone, { states:[], total:[0,0], bySrc:new Map() });
      const zd = zoneData.get(zone);
      zd.states.push(state);
      zd.total[0]+=sd.total[0]; zd.total[1]+=sd.total[1];
      for (const [src,[l,r]] of sd.byS) {
        const c = zd.bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; zd.bySrc.set(src,c);
      }
    }

    const grandSrc = {};
    for (const [s,v] of grandSrcMap) grandSrc[s] = fin(v[0],v[1]);
    const grand = fin(gL,gR);
    const ZONE_ORDER = ['North','West','South','East','Central','Northeast','Other'];

    function buildSrcMap(bySrc) {
      const sm = {};
      for (const [s,v] of bySrc) sm[s] = fin(v[0],v[1]);
      return sm;
    }

    function grpCells(srcMap, grp, denomL) {
      const denom = denomL != null ? denomL : gL;
      const exp = expandedGrps.has(grp.id);
      if (!exp) {
        const a = grpSum(srcMap, grp.srcs);
        return [
          ce('td',{key:grp.id+'l',style:{borderLeft:'2px solid '+grp.color+'44'}},Nf(a.l)),
          ce('td',{key:grp.id+'r',style:{color:grp.color,fontWeight:700}},Nf(a.r)),
          ce('td',{key:grp.id+'c'},denom>0?Pf(a.l/denom*100):'—'),
          ce('td',{key:grp.id+'l2r',style:{color:'#D97706',fontWeight:600}},Pf(a.l2r)),
        ];
      }
      return grp.subGroups.filter(sg=>sg.srcs.length>0).flatMap((sg,si) => {
        const a = grpSum(srcMap,sg.srcs);
        return [
          ce('td',{key:sg.id+'l',style:si===0?{borderLeft:'2px solid '+grp.color+'44'}:{}},Nf(a.l)),
          ce('td',{key:sg.id+'r',style:{color:sg.color,fontWeight:700}},Nf(a.r)),
          ce('td',{key:sg.id+'c'},denom>0?Pf(a.l/denom*100):'—'),
          ce('td',{key:sg.id+'l2r',style:{color:'#D97706',fontWeight:600}},Pf(a.l2r)),
        ];
      });
    }

    // Blank source cells for city/dealer rows (no source breakdown at those levels)
    function blankSrcCells(bgColor) {
      return srcGroups.flatMap((grp,gi) => {
        const exp = expandedGrps.has(grp.id);
        const slots = exp ? grp.subGroups.filter(sg=>sg.srcs.length>0).length : 1;
        return Array.from({length:slots},(_,i) => [
          ce('td',{key:grp.id+i+'l',style:{color:'#CBD5E1',background:bgColor,borderLeft:i===0?'2px solid '+grp.color+'22':undefined}},''),
          ce('td',{key:grp.id+i+'r',style:{color:'#CBD5E1',background:bgColor}},''),
          ce('td',{key:grp.id+i+'c',style:{color:'#CBD5E1',background:bgColor}},''),
          ce('td',{key:grp.id+i+'q',style:{color:'#CBD5E1',background:bgColor}},''),
        ]).flat();
      });
    }

    // ── Headers ──
    const hdr1 = [
      ce('th',{key:'dim',className:'left',rowSpan:2,style:{minWidth:220,zIndex:3,background:'#E8EAF6',color:'#1A237E'}},'Zone / State / City / Dealer'),
      ce('th',{key:'tot',colSpan:4,style:{background:'#E8EAF6',color:'#1A237E'}},'TOTAL'),
      ...(viewerMode ? [] : srcGroups.map(grp => {
        const exp = expandedGrps.has(grp.id);
        const sgs = grp.subGroups.filter(sg=>sg.srcs.length>0);
        return ce('th',{key:grp.id,colSpan:exp?sgs.length*4:4,
          className:'grp-toggle',style:{background:grp.lightColor||'#F3F4F6',color:grp.color,borderTop:'2px solid '+grp.color},
          onClick:()=>onToggleGrp(grp.id)
        },(exp?'▴ ':'▾ ')+grp.label);
      }))
    ];
    const hdr2 = [
      ce('th',{key:'tl',className:'sub'},'Leads'),ce('th',{key:'tr',className:'sub'},'Retail'),
      ce('th',{key:'tc',className:'sub'},'Contrib%'),ce('th',{key:'tl2r',className:'sub'},'L2R%'),
      ...(viewerMode ? [] : srcGroups.flatMap(grp => {
        const exp = expandedGrps.has(grp.id);
        if (!exp) return [
          ce('th',{key:grp.id+'l',className:'sub',style:{borderLeft:'2px solid '+grp.color+'44'}},'Leads'),
          ce('th',{key:grp.id+'r',className:'sub'},'Retail'),
          ce('th',{key:grp.id+'c',className:'sub'},'Contrib%'),
          ce('th',{key:grp.id+'l2r',className:'sub'},'L2R%'),
        ];
        return grp.subGroups.filter(sg=>sg.srcs.length>0).flatMap((sg,si) => [
          ce('th',{key:sg.id+'l',className:'sub',style:si===0?{borderLeft:'2px solid '+grp.color+'44'}:{},title:sg.label},sg.label+' L'),
          ce('th',{key:sg.id+'r',className:'sub',title:sg.label},sg.label+' R'),
          ce('th',{key:sg.id+'c',className:'sub',title:sg.label},'Contrib%'),
          ce('th',{key:sg.id+'l2r',className:'sub',title:sg.label},'L2R%'),
        ]);
      }))
    ];

    const bodyRows = [];

    for (const zone of ZONE_ORDER) {
      const zd = zoneData.get(zone);
      if (!zd || zd.total[0] === 0) continue;
      const zLeads = zd.total[0];  // zone total leads — denominator for state Contrib%
      const zRets  = zd.total[1];
      const zL2R   = zLeads > 0 ? zRets / zLeads * 100 : 0;
      const zSrcMap = buildSrcMap(zd.bySrc);
      const isZOpen = openZone === zone;

      // ── Zone row ──
      bodyRows.push(ce('tr',{key:'z_'+zone,className:'section-row',onClick:()=>onClickZone(zone),style:{cursor:'pointer'}},
        ce('td',{className:'label',style:{color:'#0D47A1'}},
          ce('span',{style:{display:'flex',alignItems:'center',gap:6}},
            ce('span',{style:{fontSize:11}},isZOpen?'▾':'▸'),
            zone+' Zone'
          )
        ),
        ce('td',null,Nf(zLeads)),ce('td',{style:{color:'#1565C0',fontWeight:700}},Nf(zRets)),
        ce('td',null,gL>0?Pf(zLeads/gL*100):'—'),ce('td',{style:{color:'#D97706',fontWeight:700}},zL2R>0?Pf(zL2R):'—'),
        ...(viewerMode ? [] : srcGroups.flatMap(grp=>grpCells(zSrcMap,grp)))
      ));
      if (!isZOpen) continue;

      for (const state of zd.states.sort()) {
        const sd = stateData.get(state);
        if (!sd) continue;
        const sLeads = sd.total[0];  // state leads — denominator for city Contrib%
        const sRets  = sd.total[1];
        const sL2R   = sLeads > 0 ? sRets / sLeads * 100 : 0;
        const sSrcMap = buildSrcMap(sd.byS);
        const isSOpen = openState === state;

        // ── State row ──
        bodyRows.push(ce('tr',{key:'s_'+state,className:'sub-row',
          onClick:hasCities?()=>onClickState(state):undefined,
          style:{cursor:hasCities?'pointer':'default'}
        },
          ce('td',{className:'sub-label',style:{paddingLeft:28}},
            ce('span',{style:{display:'flex',alignItems:'center',gap:5}},
              hasCities&&ce('span',{style:{fontSize:10,color:'#94A3B8',flexShrink:0}},isSOpen?'▾':'▸'),
              state
            )
          ),
          ce('td',null,Nf(sLeads)),ce('td',{style:{color:'#EA580C',fontWeight:700}},Nf(sRets)),
          ce('td',null,zLeads>0?Pf(sLeads/zLeads*100):'—'),ce('td',{style:{color:'#D97706',fontWeight:600}},sL2R>0?Pf(sL2R):'—'),
          ...(viewerMode ? [] : srcGroups.flatMap(grp=>grpCells(sSrcMap,grp,zLeads)))
        ));
        if (!isSOpen) continue;

        const sortedCities = [...cityData.keys()].sort();
        for (const city of sortedCities) {
          const cv = cityData.get(city);
          const cLeads = cv[0];  // city leads — denominator for dealer Contrib%
          const cRets  = cv[1];
          const cL2R   = cLeads > 0 ? cRets / cLeads * 100 : 0;
          const isCOpen = openCity === city;

          // ── City row ──
          bodyRows.push(ce('tr',{key:'c_'+city,className:'city-row',
            onClick:hasDealers?()=>onClickCity(city):undefined,
            style:{cursor:hasDealers?'pointer':'default'}
          },
            ce('td',{className:'label',style:{paddingLeft:48,fontWeight:500,fontSize:11.5,color:'#166534',background:'#F0FDF4',borderRight:'2px solid #BBF7D0'}},
              ce('span',{style:{display:'flex',alignItems:'center',gap:5}},
                hasDealers&&ce('span',{style:{fontSize:10,color:'#86EFAC',flexShrink:0}},isCOpen?'▾':'▸'),
                city
              )
            ),
            ce('td',{style:{background:'#F0FDF4'}},Nf(cLeads)),
            ce('td',{style:{background:'#F0FDF4',color:'#16A34A',fontWeight:700}},Nf(cRets)),
            ce('td',{style:{background:'#F0FDF4'}},sLeads>0?Pf(cLeads/sLeads*100):'—'),
            ce('td',{style:{background:'#F0FDF4',color:'#D97706',fontWeight:600}},cL2R>0?Pf(cL2R):'—'),
            ...(viewerMode ? [] : hasCitySrc
              ? srcGroups.flatMap(grp => grpCells(buildSrcMap(citySourceByS.get(city) || new Map()), grp, sLeads))
              : blankSrcCells('#F0FDF4'))
          ));
          if (!isCOpen) continue;

          // ── Dealer rows (sorted by leads desc) ──
          const sortedDealers = [...dealerData.keys()].sort((a,b)=>(dealerData.get(b)[0]||0)-(dealerData.get(a)[0]||0));
          for (const dl of sortedDealers) {
            const dv = dealerData.get(dl);
            const dLeads = dv[0];
            const dRets  = dv[1];
            const dL2R   = dLeads > 0 ? dRets / dLeads * 100 : 0;
            bodyRows.push(ce('tr',{key:'d_'+dl,className:'dealer-row'},
              ce('td',{className:'label',style:{paddingLeft:68,fontWeight:400,fontSize:11,color:'#64748B',background:'#FAFAFA',borderRight:'2px solid #F1F5F9'}},dl),
              ce('td',{style:{background:'#FAFAFA'}},Nf(dLeads)),
              ce('td',{style:{background:'#FAFAFA',color:'#0D9488',fontWeight:700}},Nf(dRets)),
              ce('td',{style:{background:'#FAFAFA'}},cLeads>0?Pf(dLeads/cLeads*100):'—'),
              ce('td',{style:{background:'#FAFAFA',color:'#D97706',fontWeight:600}},dL2R>0?Pf(dL2R):'—'),
              ...(viewerMode ? [] : hasDealerSrc
                ? srcGroups.flatMap(grp => grpCells(buildSrcMap(dealerSourceByS.get(dl) || new Map()), grp, cLeads))
                : blankSrcCells('#FAFAFA'))
            ));
          }
        }
      }
    }

    // Grand Total at bottom
    bodyRows.push(ce('tr',{key:'gtotal',className:'total-row'},
      ce('td',{className:'label',style:{color:'#1A237E'}},'∑ Grand Total'),
      ce('td',null,Nf(gL)),ce('td',{style:{color:'#EA580C',fontWeight:700}},Nf(gR)),
      ce('td',null,'100.0%'),ce('td',{style:{color:'#D97706',fontWeight:700}},grand.l2r>0?Pf(grand.l2r):'—'),
      ...(viewerMode ? [] : srcGroups.flatMap(grp=>grpCells(grandSrc,grp)))
    ));

    return { grand, hdr1, hdr2, bodyRows };
  }, [stm, univ, cm, cdm, csm_data, cdsm_data, maps, filters, expandedGrps, openZone, openState, openCity, srcGroups, hasCities, hasDealers, hasCitySrc, hasDealerSrc, cityIndexMap, getLR, viewerMode]);

  const stateSummaryAgg = useMemo(() => {
    const univF = makeUnivFilter(filters);
    const allState = !filters.states || filters.states.size === 0;
    if (univF) {
      return aggAll(
        univ, maps, filters.months, filters.sources,
        (row,m) => m.st[row[2]], (row,m) => m.src[row[1]], (row,m) => m.lm[row[4]],
        allState ? univF : (row,m) => univF(row,m) && filters.states.has(m.st[row[2]]),
        getLR
      );
    }
    return aggAll(
      stm, maps, filters.months, filters.sources,
      (row,m) => m.st[row[0]], (row,m) => m.src[row[1]], (row,m) => m.lm[row[2]],
      allState ? null : (row,m) => filters.states.has(m.st[row[0]]),
      getLR
    );
  }, [stm, univ, maps, filters, getLR]);

  return ce('div', { className:'fade-up' },
    stateSummaryAgg && stateSummaryAgg.grand.l > 0 &&
      ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
        ce('div', { className:'section-title', style:{marginBottom:10} }, '∑ All Months — State Summary'),
        ce(DimGrid, { agg:stateSummaryAgg, srcGroups, dimLabel:'State', expandedGrps, onToggleGrp, viewerMode })
      ),
    months.map(M => {
      const grid = renderMonthGrid(M);
      if (!grid || (grid.grand.l === 0 && grid.grand.r === 0)) return null;
      return ce('div', { key:M, className:'card', style:{padding:'16px 18px',marginBottom:14} },
        ce('div', { className:'section-title', style:{marginBottom:10} }, 'State × Source — ' + M),
        ce('div', { className:'scroll-x' },
          ce('table', null,
            ce('thead', null,
              ce('tr', null, ...grid.hdr1),
              ce('tr', null, ...grid.hdr2),
            ),
            ce('tbody', null, ...grid.bodyRows)
          )
        )
      );
    })
  );
});

/* ════════════════════════════════════════════════════════════════════
   BUYING INTENT TAB
   ════════════════════════════════════════════════════════════════════ */
const BuyingIntentTab = React.memo(function BuyingIntentTab({ data, filters, months, RT }) {
  const { maps, bdm } = data;
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const allSrcs = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const [expandedGrps, setExpandedGrps] = useState(new Set());
  const onToggleGrp = useCallback(id => setExpandedGrps(prev => {
    const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n;
  }), []);

  const renderAgg = useCallback((M) => {
    const allS = !filters.sources || filters.sources.size === 0;
    const byBucket = new Map();
    const bySrc = new Map();
    const byBucketSrc = new Map();
    let gL=0,gR=0;
    for (const row of bdm) {
      if (maps.lm[row[2]] !== M) continue;
      const src = maps.src[row[1]];
      if (!allS && !filters.sources.has(src)) continue;
      const bucket = bdBucket(row[0]);
      const [l,r]=getLR(row);
      gL+=l; gR+=r;
      const cb = byBucket.get(bucket)||[0,0]; cb[0]+=l; cb[1]+=r; byBucket.set(bucket,cb);
      const cs = bySrc.get(src)||[0,0]; cs[0]+=l; cs[1]+=r; bySrc.set(src,cs);
      const k=bucket+'\x00'+src;
      const cbs = byBucketSrc.get(k)||[0,0]; cbs[0]+=l; cbs[1]+=r; byBucketSrc.set(k,cbs);
    }
    const grandSrc = {};
    for (const [s,v] of bySrc) grandSrc[s] = fin(v[0],v[1]);
    const dimAggs = {};
    for (const [b,bv] of byBucket) {
      const srcAgg = {};
      for (const s of bySrc.keys()) {
        const v = byBucketSrc.get(b+'\x00'+s);
        srcAgg[s] = v ? fin(v[0],v[1]) : EMPTY;
      }
      dimAggs[b] = { total: fin(bv[0],bv[1]), src: srcAgg };
    }
    // Sort by bucket order
    const orderedDimAggs = {};
    for (const bk of BD_BUCKETS) if (dimAggs[bk]) orderedDimAggs[bk] = dimAggs[bk];
    return { grand: fin(gL,gR), grandSrc, dimAggs: orderedDimAggs };
  }, [bdm, maps, filters, getLR]);

  // Override DimGrid sort (buckets should follow BD_BUCKETS order, not desc leads)
  const renderAggWithOrder = useCallback((M) => {
    const agg = renderAgg(M);
    if (!agg) return null;
    // DimGrid sorts by l desc — we want bucket order. Inject rank prefix
    const orderedDimAggs = {};
    BD_BUCKETS.forEach((bk, i) => {
      if (agg.dimAggs[bk]) orderedDimAggs['\x00'+i+bk] = agg.dimAggs[bk];
    });
    return { ...agg, dimAggs: orderedDimAggs, _labels: (k => k.replace(/^\x00\d/, '')) };
  }, [renderAgg]);

  // Summary agg across all months with bucket order preserved
  const bdSummaryAgg = useMemo(() => {
    let gL=0, gR=0;
    const gsAcc={}, daAcc={};
    for (const M of months) {
      const agg = renderAgg(M);
      if (!agg || (agg.grand.l===0 && agg.grand.r===0)) continue;
      gL+=agg.grand.l; gR+=agg.grand.r;
      for (const [s,sv] of Object.entries(agg.grandSrc)) {
        if (!gsAcc[s]) gsAcc[s]=[0,0]; gsAcc[s][0]+=sv.l; gsAcc[s][1]+=sv.r;
      }
      for (const [d,da] of Object.entries(agg.dimAggs)) {
        if (!daAcc[d]) daAcc[d]={total:[0,0],src:{}};
        daAcc[d].total[0]+=da.total.l; daAcc[d].total[1]+=da.total.r;
        for (const [s,sv] of Object.entries(da.src)) {
          if (!daAcc[d].src[s]) daAcc[d].src[s]=[0,0];
          daAcc[d].src[s][0]+=sv.l; daAcc[d].src[s][1]+=sv.r;
        }
      }
    }
    if (gL===0) return null;
    const grandSrc={};
    for (const [s,v] of Object.entries(gsAcc)) grandSrc[s]=fin(v[0],v[1]);
    const dimAggsRaw={};
    for (const [d,dv] of Object.entries(daAcc)) {
      const srcAgg={};
      for (const [s,sv] of Object.entries(dv.src)) srcAgg[s]=fin(sv[0],sv[1]);
      dimAggsRaw[d]={total:fin(dv.total[0],dv.total[1]),src:srcAgg};
    }
    // Restore BD_BUCKETS order with " days" suffix
    const dimAggs={};
    BD_BUCKETS.forEach(bk => { if (dimAggsRaw[bk]) dimAggs[bk+' days']=dimAggsRaw[bk]; });
    return {grand:fin(gL,gR),grandSrc,dimAggs};
  }, [months, renderAgg]);
  return ce('div', { className:'fade-up' },
    bdSummaryAgg && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { className:'section-title', style:{marginBottom:10} }, '∑ All Months — Buying Intent Summary'),
      ce(DimGrid, { agg:bdSummaryAgg, srcGroups, dimLabel:'Intent (Days)', expandedGrps, onToggleGrp, noSort:true })
    ),
    months.map(M => {
      const agg = renderAgg(M);
      if (!agg || (agg.grand.l === 0 && agg.grand.r === 0)) return null;
      // Rebuild dimAggs in canonical bucket order so noSort preserves it
      const orderedAgg = { ...agg, dimAggs: {} };
      BD_BUCKETS.forEach(bk => { if (agg.dimAggs[bk]) orderedAgg.dimAggs[bk + ' days'] = agg.dimAggs[bk]; });

      return ce('div', { key:M, className:'card', style:{padding:'16px 18px',marginBottom:14} },
        ce('div', { className:'section-title', style:{marginBottom:10} }, 'Buying Intent — ' + M),
        ce(DimGrid, { agg: orderedAgg, srcGroups, dimLabel:'Intent (Days)', expandedGrps, onToggleGrp, noSort: true })
      );
    })
  );
});

/* ════════════════════════════════════════════════════════════════════
   CROSS-TAB GRID  (rows × column-values, e.g. State × Model)
   ════════════════════════════════════════════════════════════════════ */
// Builds { grand, colKeys, rowKeys, rowAggs } from a 3-dim compact matrix.
// rowPos/colPos/lmPos are the index positions within a row.
function buildCrossAgg(table, maps, rowMapKey, colMapKey, lmMapKey, rowPos, colPos, lmPos, monthSet, rowFilter, colFilter, getLR, rtCols) {
  const allM   = !monthSet  || monthSet.size  === 0;
  const allRow = !rowFilter || rowFilter.size === 0;
  const allCol = !colFilter || colFilter.size === 0;
  let gL=0,gR=0,gDm=0,gCo=0;
  const rowAcc = new Map();
  const colTotals = {};
  const allCols = new Set();
  for (const row of table) {
    const m = maps[lmMapKey][row[lmPos]];
    if (!allM && !monthSet.has(m)) continue;
    const rLabel = maps[rowMapKey][row[rowPos]];
    if (!allRow && !rowFilter.has(rLabel)) continue;
    const cLabel = maps[colMapKey][row[colPos]];
    if (!allCol && !colFilter.has(cLabel)) continue;
    const [l,r] = getLR(row);
    const dm = rtCols ? (row[row.length-2]||0) : 0;
    const co = rtCols ? (row[row.length-1]||0) : 0;
    gL+=l; gR+=r; gDm+=dm; gCo+=co;
    allCols.add(cLabel);
    colTotals[cLabel]=(colTotals[cLabel]||0)+l;
    if (!rowAcc.has(rLabel)) rowAcc.set(rLabel,{total:[0,0,0,0],colAggs:new Map()});
    const e=rowAcc.get(rLabel);
    e.total[0]+=l; e.total[1]+=r; e.total[2]+=dm; e.total[3]+=co;
    if (!e.colAggs.has(cLabel)) e.colAggs.set(cLabel,[0,0,0,0]);
    const ca=e.colAggs.get(cLabel);
    ca[0]+=l; ca[1]+=r; ca[2]+=dm; ca[3]+=co;
  }
  const colKeys=[...allCols].sort((a,b)=>(colTotals[b]||0)-(colTotals[a]||0));
  const rowEntries=[...rowAcc.entries()].sort((a,b)=>b[1].total[0]-a[1].total[0]);
  const rowKeys=rowEntries.map(([k])=>k);
  const rowAggs={};
  for (const [rk,e] of rowEntries) {
    const ca={};
    for (const [ck,v] of e.colAggs) ca[ck]={l:v[0],r:v[1],dm:v[2],co:v[3],l2r:v[0]>0?v[1]/v[0]*100:0};
    rowAggs[rk]={total:{l:e.total[0],r:e.total[1],dm:e.total[2],co:e.total[3],l2r:e.total[0]>0?e.total[1]/e.total[0]*100:0},colAggs:ca};
  }
  return {grand:{l:gL,r:gR,dm:gDm,co:gCo,l2r:gL>0?gR/gL*100:0},colKeys,rowKeys,rowAggs};
}

// CrossTabGrid: renders a state/city × model cross-tabulation
const CrossTabGrid = React.memo(function CrossTabGrid({ agg, rowLabel, colLabel, rtCols, onExport, title }) {
  if (!agg || agg.grand.l===0) return null;
  const {grand,colKeys,rowKeys,rowAggs}=agg;
  const showRT=!!rtCols;
  const totalColSpan=showRT?6:4;
  const colGrandL=ck=>{let t=0;for(const da of Object.values(rowAggs)){const ca=da.colAggs[ck];if(ca)t+=ca.l;}return t;};
  const colGrandR=ck=>{let t=0;for(const da of Object.values(rowAggs)){const ca=da.colAggs[ck];if(ca)t+=ca.r;}return t;};
  return ce('div',null,
    title && ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}},
      ce('div',{className:'section-title',style:{marginBottom:0}},title),
      onExport && ce(ExportBtn,{onClick:onExport})
    ),
    ce('div',{className:'scroll-x'},
      ce('table',null,
        ce('thead',null,
          ce('tr',null,
            ce('th',{className:'left',rowSpan:2,style:{minWidth:160,position:'sticky',left:0,zIndex:3,background:'#E8EAF6',color:'#1A237E'}},rowLabel),
            ce('th',{colSpan:totalColSpan,style:{background:'#E8EAF6',color:'#1A237E'}},'TOTAL'),
            ...colKeys.map(ck=>ce('th',{key:ck,colSpan:3,style:{borderLeft:'2px solid #BFDBFE',background:'#F3F4F6',whiteSpace:'nowrap',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis'}},ck))
          ),
          ce('tr',null,
            ce('th',{className:'sub'},'Leads'),
            ce('th',{className:'sub'},'Retail'),
            ce('th',{className:'sub'},'Contrib%'),
            ce('th',{className:'sub',style:{color:'#D97706'}},'L2R%'),
            ...(showRT?[ce('th',{className:'sub',style:{color:'#7C3AED'}},'DMS'),ce('th',{className:'sub',style:{color:'#0891B2'}},'Call Out')]:[]),
            ...colKeys.flatMap(ck=>[
              ce('th',{key:ck+'l',className:'sub',style:{borderLeft:'2px solid #BFDBFE'}},'Leads'),
              ce('th',{key:ck+'r',className:'sub'},'Retail'),
              ce('th',{key:ck+'l2r',className:'sub',style:{color:'#D97706'}},'L2R%'),
            ])
          )
        ),
        ce('tbody',null,
          ...rowKeys.map(rk=>{
            const da=rowAggs[rk];
            return ce('tr',{key:rk},
              ce('td',{className:'label',style:{position:'sticky',left:0,background:'#FAFAFA',zIndex:1}},rk),
              ce('td',null,Nf(da.total.l)),
              ce('td',{style:{color:'#EA580C',fontWeight:700}},Nf(da.total.r)),
              ce('td',null,grand.l>0?Pf(da.total.l/grand.l*100):'—'),
              ce('td',{style:{color:'#D97706',fontWeight:700}},da.total.l2r>0?Pf(da.total.l2r):'—'),
              ...(showRT?[ce('td',null,Nf(da.total.dm)),ce('td',null,Nf(da.total.co))]:[]),
              ...colKeys.flatMap(ck=>{
                const ca=da.colAggs[ck]||{l:0,r:0,l2r:0};
                return[
                  ce('td',{key:ck+'l',style:{borderLeft:'2px solid #BFDBFE'}},ca.l>0?Nf(ca.l):'—'),
                  ce('td',{key:ck+'r',style:{color:'#EA580C',fontWeight:700}},ca.r>0?Nf(ca.r):'—'),
                  ce('td',{key:ck+'l2r',style:{color:'#D97706'}},ca.l2r>0?Pf(ca.l2r):'—'),
                ];
              })
            );
          }),
          ce('tr',{className:'total-row'},
            ce('td',{className:'label',style:{color:'#1A237E',position:'sticky',left:0,zIndex:1}},'∑ Grand Total'),
            ce('td',null,Nf(grand.l)),
            ce('td',{style:{color:'#EA580C',fontWeight:700}},Nf(grand.r)),
            ce('td',null,'100.0%'),
            ce('td',{style:{color:'#D97706',fontWeight:700}},grand.l2r>0?Pf(grand.l2r):'—'),
            ...(showRT?[ce('td',null,Nf(grand.dm)),ce('td',null,Nf(grand.co))]:[]),
            ...colKeys.flatMap(ck=>{
              const tL=colGrandL(ck),tR=colGrandR(ck);
              const tL2r=tL>0?tR/tL*100:0;
              return[
                ce('td',{key:ck+'l',style:{borderLeft:'2px solid #BFDBFE'}},tL>0?Nf(tL):'—'),
                ce('td',{key:ck+'r',style:{color:'#EA580C',fontWeight:700}},tR>0?Nf(tR):'—'),
                ce('td',{key:ck+'l2r',style:{color:'#D97706'}},tL2r>0?Pf(tL2r):'—'),
              ];
            })
          )
        )
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   CITY × SOURCE TAB
   ════════════════════════════════════════════════════════════════════ */
const CitySourceTab = React.memo(function CitySourceTab({ data, filters, months, RT, viewerMode }) {
  const { maps } = data;
  const csm = data.csm || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const allSrcs = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const [expandedGrps, setExpandedGrps] = useState(new Set());
  const [expandedRows, setExpandedRows] = useState(new Set());
  const onToggleGrp = useCallback(id => setExpandedGrps(prev => {
    const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n;
  }), []);
  const onToggleRow = useCallback(rk => setExpandedRows(prev => {
    const n=new Set(prev); n.has(rk)?n.delete(rk):n.add(rk); return n;
  }), []);

  // csm format: [city_idx, src_idx, lm_idx, L, R_all, R_dms, R_co]
  // Aggregate across all selected months — no per-month breakdown rendered
  const computeAgg = useCallback((monthSet) => {
    const allS  = !filters.sources || filters.sources.size === 0;
    const allC  = !filters.cities  || filters.cities.size  === 0;
    const allSt = !filters.states  || filters.states.size  === 0;
    const bySrc=new Map(), byCity=new Map(), byCitySrc=new Map();
    let gL=0,gR=0;
    for (const row of csm) {
      if (!monthSet.has(maps.lm[row[2]])) continue;
      const city=maps.city[row[0]], src=maps.src[row[1]];
      if (!allC && !filters.cities.has(city)) continue;
      if (!allS && !filters.sources.has(src)) continue;
      if (!allSt && maps.city_state) {
        const stIdx=maps.city_state[row[0]];
        if (!filters.states.has(maps.st[stIdx])) continue;
      }
      const [l,r]=getLR(row);
      gL+=l; gR+=r;
      const cs=bySrc.get(src)||[0,0]; cs[0]+=l; cs[1]+=r; bySrc.set(src,cs);
      const cc=byCity.get(city)||[0,0]; cc[0]+=l; cc[1]+=r; byCity.set(city,cc);
      const k=city+'\x00'+src;
      const ccs=byCitySrc.get(k)||[0,0]; ccs[0]+=l; ccs[1]+=r; byCitySrc.set(k,ccs);
    }
    if (gL===0&&gR===0) return null;
    const grandSrc={};
    for (const [s,v] of bySrc) grandSrc[s]=fin(v[0],v[1]);
    const dimAggs={};
    for (const [c,cv] of byCity) {
      const srcAgg={};
      for (const s of bySrc.keys()) { const v=byCitySrc.get(c+'\x00'+s); srcAgg[s]=v?fin(v[0],v[1]):EMPTY; }
      dimAggs[c]={total:fin(cv[0],cv[1]),src:srcAgg};
    }
    return {grand:fin(gL,gR),grandSrc,dimAggs};
  }, [csm, maps, filters, getLR]);

  const summaryAgg = useMemo(() => computeAgg(new Set(months)), [computeAgg, months]);

  const exportAll = useCallback(() => {
    if (!summaryAgg || summaryAgg.grand.l===0) return;
    const hdr=['City','Total Leads','Total Retail','Contrib%','L2R%',...allSrcs.flatMap(s=>[s+' Leads',s+' Retail',s+' L2R%'])];
    const rows=[hdr];
    for (const [city,da] of Object.entries(summaryAgg.dimAggs)) {
      const row=[city,da.total.l,da.total.r,summaryAgg.grand.l>0?+(da.total.l/summaryAgg.grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];
      for (const s of allSrcs) { const v=da.src[s]||EMPTY; row.push(v.l,v.r,+v.l2r.toFixed(1)); }
      rows.push(row);
    }
    rows.push(['∑ Grand Total',summaryAgg.grand.l,summaryAgg.grand.r,100,+summaryAgg.grand.l2r.toFixed(1),...allSrcs.flatMap(s=>{const v=summaryAgg.grandSrc[s]||EMPTY;return[v.l,v.r,+v.l2r.toFixed(1)];})]);
    exportXlsx({'City × Source':rows},'Hero_CitySource_All');
  }, [summaryAgg, allSrcs]);

  if (!summaryAgg) return ce('div',{style:{textAlign:'center',padding:50,color:'#94A3B8',fontSize:14}},
    'No data matches the current filters.');

  return ce('div', { className:'fade-up' },
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, 'City × Source'),
        ce(ExportBtn, { onClick: exportAll })
      ),
      ce(DimGrid, { agg:summaryAgg, srcGroups, dimLabel:'City', expandedGrps, onToggleGrp, expandedRows, onToggleRow, viewerMode })
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   STATE × MODEL TAB
   ════════════════════════════════════════════════════════════════════ */
const StateModelTab = React.memo(function StateModelTab({ data, filters, months, RT, viewerMode }) {
  const { maps } = data;
  const mxst = data.mxst || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);

  // mxst format: [mdl_idx, st_idx, lm_idx, L, R_all, R_dms, R_co]
  // rows = states, cols = models
  const buildAgg = useCallback((monthSet) => {
    return buildCrossAgg(
      mxst, maps, 'st', 'mdl', 'lm', 1, 0, 2, monthSet,
      filters.states, filters.models, getLR, data.rt_cols
    );
  }, [mxst, maps, filters, getLR, data.rt_cols]);

  const summaryAgg = useMemo(() => {
    const a=buildAgg(new Set(months)); return a.grand.l>0?a:null;
  }, [buildAgg, months]);

  const monthlyAggs = useMemo(() =>
    months.map(M => ({ M, agg: (() => { const a=buildAgg(new Set([M])); return a.grand.l>0?a:null; })() })),
  [buildAgg, months]);

  const exportAgg = useCallback((agg, label) => {
    if (!agg) return;
    const {colKeys,rowKeys,rowAggs,grand}=agg;
    const hdr=['State','Total Leads','Total Retail','Contrib%','L2R%',...colKeys.flatMap(ck=>[ck+' Leads',ck+' Retail',ck+' L2R%'])];
    const rows=[hdr];
    for (const rk of rowKeys) {
      const da=rowAggs[rk];
      const row=[rk,da.total.l,da.total.r,grand.l>0?+(da.total.l/grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];
      for (const ck of colKeys) { const ca=da.colAggs[ck]||{l:0,r:0,l2r:0}; row.push(ca.l,ca.r,+ca.l2r.toFixed(1)); }
      rows.push(row);
    }
    const gtRow=['∑ Grand Total',grand.l,grand.r,100,+grand.l2r.toFixed(1)];
    for (const ck of colKeys) { let tL=0,tR=0; for(const da of Object.values(rowAggs)){const ca=da.colAggs[ck]||{l:0,r:0};tL+=ca.l;tR+=ca.r;} const tL2r=tL>0?tR/tL*100:0; gtRow.push(tL,tR,+tL2r.toFixed(1)); }
    rows.push(gtRow);
    exportXlsx({[label]:rows},'Hero_StateModel_'+(label==='Summary'?'All':label.replace("'","")));
  }, []);

  return ce('div', { className:'fade-up' },
    summaryAgg && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce(CrossTabGrid, { agg:summaryAgg, rowLabel:'State', colLabel:'Model', rtCols:data.rt_cols,
        title:'∑ All Months — State × Model Summary',
        onExport:()=>exportAgg(summaryAgg,'Summary') })
    ),
    monthlyAggs.map(({M,agg}) => agg ?

/* ════════════════════════════════════════════════════════════════════
   CITY × MODEL TAB
   ════════════════════════════════════════════════════════════════════ */
const CityModelTab = React.memo(function CityModelTab({ data, filters, months, RT, viewerMode }) {
  const { maps } = data;
  const cxm = data.cxm || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);

  // cxm format: [city_idx, mdl_idx, lm_idx, L, R_all, R_dms, R_co]
  // rows = cities, cols = models
  const buildAgg = useCallback((monthSet) => {
    const stFilter = (filters.states && filters.states.size > 0 && maps.city_state)
      ? new Set(
          (maps.city||[]).reduce((acc,city,i) => {
            const stIdx = maps.city_state[i];
            if (filters.states.has(maps.st[stIdx])) acc.push(city);
            return acc;
          }, [])
        )
      : null;
    const cityRowFilter = stFilter
      ? (filters.cities && filters.cities.size > 0
          ? new Set([...stFilter].filter(c => filters.cities.has(c)))
          : stFilter)
      : filters.cities;
    return buildCrossAgg(
      cxm, maps, 'city', 'mdl', 'lm', 0, 1, 2, monthSet,
      cityRowFilter, filters.models, getLR, data.rt_cols
    );
  }, [cxm, maps, filters, getLR, data.rt_cols]);

  const summaryAgg = useMemo(() => {
    if (cxm.length===0) return null;
    const a=buildAgg(new Set(months)); return a.grand.l>0?a:null;
  }, [buildAgg, months, cxm]);

  const exportSummary = useCallback(() => {
    if (!summaryAgg) return;
    const {colKeys,rowKeys,rowAggs,grand}=summaryAgg;
    const hdr=['City','Total Leads','Total Retail','Contrib%','L2R%',...colKeys.flatMap(ck=>[ck+' Leads',ck+' Retail',ck+' L2R%'])];
    const rows=[hdr];
    for (const rk of rowKeys) {
      const da=rowAggs[rk];
      const row=[rk,da.total.l,da.total.r,grand.l>0?+(da.total.l/grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];
      for (const ck of colKeys) { const ca=da.colAggs[ck]||{l:0,r:0,l2r:0}; row.push(ca.l,ca.r,+ca.l2r.toFixed(1)); }
      rows.push(row);
    }
    const gtRow=['∑ Grand Total',grand.l,grand.r,100,+grand.l2r.toFixed(1)];
    for (const ck of colKeys) { let tL=0,tR=0; for(const da of Object.values(rowAggs)){const ca=da.colAggs[ck]||{l:0,r:0};tL+=ca.l;tR+=ca.r;} const tL2r=tL>0?tR/tL*100:0; gtRow.push(tL,tR,+tL2r.toFixed(1)); }
    rows.push(gtRow);
    exportXlsx({'City × Model':rows},'Hero_CityModel_All');
  }, [summaryAgg]);

  if (cxm.length===0) return ce('div',{style:{textAlign:'center',padding:50,color:'#94A3B8',fontSize:14}},
    '📦 City × Model data will be available after the next pipeline run.');

  if (!summaryAgg) return ce('div',{style:{textAlign:'center',padding:50,color:'#94A3B8',fontSize:14}},
    'No data matches the current filters.');

  return ce('div', { className:'fade-up' },
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce(CrossTabGrid, { agg:summaryAgg, rowLabel:'City', colLabel:'Model', rtCols:data.rt_cols,
        title:'City × Model', onExport: exportSummary })
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   APP ROOT — Hero MotoCorp LDR (TVS tab components, Hero data)
   ════════════════════════════════════════════════════════════════════ */
const TABS = [
  { id:'overview',    label:'Overview' },
  { id:'source',      label:'Source Analysis' },
  { id:'ltxsrc',      label:'LT \u00d7 Source' },
  { id:'modelxsrc',   label:'Model \u00d7 Source' },
  { id:'statexsrc',   label:'State \u00d7 Source' },
  { id:'cityxsrc',    label:'City \u00d7 Source' },
  { id:'statexmodel', label:'State \u00d7 Model' },
  { id:'cityxmodel',  label:'City \u00d7 Model' },
  { id:'dispersion',  label:'Retail Dispersion' },
  { id:'pivot',       label:'Pivot Table' },
];

function App({fbUser,role,presence,onSignOut,onAdminOpen}){
  const viewerMode=role==='viewer';
  const [data,setData]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const [syncErr,setSyncErr]=useState(null);
  const [lastSynced,setLastSynced]=useState(null);
  const [diagnostics,setDiagnostics]=useState(null);
  const [diagExpanded,setDiagExpanded]=useState(false);
  const [tab,setTab]=useState('overview');
  const [leadsMode,setLeadsMode]=useState('update');
  const [RT,setRT]=useState('all');
  const [filters,setFilters]=useState({months:new Set(),leadTypes:new Set(),sources:new Set(),models:new Set(),states:new Set(),cities:new Set()});
  const [isPending,startT]=useTransition();

  const handleSync=useCallback(async()=>{
    setSyncing(true);setSyncErr(null);
    try{
      const[leadsCSV,retailCSV]=await Promise.all([
        fetchSheetCsv(HERO_SHEETS_CONFIG.LEADS_URL),
        fetchSheetCsv(HERO_SHEETS_CONFIG.RETAIL_URL),
      ]);
      const leadRaw=parseCsvToRows(leadsCSV);
      const retailRaw=parseCsvToRows(retailCSV);
      if(!leadRaw.length)throw new Error('No rows in Leads sheet \u2014 ensure it is shared as Anyone \u2192 Viewer.');
      const leadResult=parseHeroLeadRows(leadRaw);
      const retailResult=parseHeroRetailRows(retailRaw);
      const{rows:joined,diagnostics:diag}=joinHeroData(leadResult,retailResult);
      if(!joined.length)throw new Error('No rows after join. Check opty_id / sourceLeadId column names.');
      const payload=buildPayload(joined);
      setData(payload);
      setDiagnostics(diag);
      setLastSynced(new Date());
    }catch(e){setSyncErr(e.message);}
    finally{setSyncing(false);}
  },[]);

  useEffect(()=>{if(HERO_SHEETS_CONFIG.AUTO_SYNC_ON_LOAD)handleSync();},[]);

  const effectiveData=useMemo(()=>{
    if(!data)return null;
    if(leadsMode==='create'||!data.u_monthly)return data;
    return{
      ...data,
      monthly:data.u_monthly,sm:data.u_sm,ltm:data.u_ltm,mm:data.u_mm,stm:data.u_stm,
      mxst:data.u_mxst,cm:data.u_cm||[],csm:data.u_csm||[],cxm:data.u_cxm||[],univ:data.u_univ,
      mlt:data.u_mlt||[],stlt:data.u_stlt||[],cdm:data.u_cdm||[],cdsm:data.u_cdsm||[],stcm:data.u_stcm||[],
      disp:data.u_disp||[],
    };
  },[data,leadsMode]);

  const months=useMemo(()=>{
    if(!effectiveData)return[];
    const allM=[...new Set(effectiveData.maps.lm)].sort((a,b)=>heroMonthOrder(b)-heroMonthOrder(a));
    if(!filters.months||filters.months.size===0)return allM;
    if(filters.months===FILTER_CLEARED)return['\x00'];
    return allM.filter(m=>filters.months.has(m));
  },[effectiveData,filters.months]);

  const visibleTabs=viewerMode
    ?TABS.filter(t=>['modelxsrc','statexsrc','cityxsrc','statexmodel','cityxmodel'].includes(t.id))
    :TABS;

  const tabContent=useMemo(()=>{
    if(!effectiveData)return null;
    const props={data:effectiveData,filters,months,RT,viewerMode};
    switch(tab){
      case 'overview':    return ce(OverviewTab,   props);
      case 'source':      return ce(SourceTab,      props);
      case 'ltxsrc':      return ce(LTSourceTab,    props);
      case 'modelxsrc':   return ce(ModelSourceTab, props);
      case 'statexsrc':   return ce(StateSourceTab, props);
      case 'cityxsrc':    return ce(CitySourceTab,  props);
      case 'statexmodel': return ce(StateModelTab,  props);
      case 'cityxmodel':  return ce(CityModelTab,   props);
      case 'dispersion':  return ce(DispersionTab,  props);
      case 'pivot':       return ce(PivotTab,       props);
      default: return null;
    }
  },[tab,effectiveData,filters,months,RT,viewerMode]);

  if(!effectiveData)return ce(HeroSyncScreen,{onSync:handleSync,syncing,syncErr});

  return ce('div',{style:{minHeight:'100vh',background:'#f8fafc'}},
    /* Header */
    ce('div',{style:{background:'#9A3412',padding:'0 24px',position:'sticky',top:0,zIndex:100,boxShadow:'0 2px 16px rgba(124,45,18,.35)'}},
      ce('div',{style:{maxWidth:1440,margin:'0 auto',display:'flex',alignItems:'center',gap:16}},
        ce('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 0',flexShrink:0}},
          ce('div',{style:{width:34,height:34,borderRadius:8,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:900,color:'#EA580C',boxShadow:'0 2px 8px rgba(0,0,0,.15)'}},'H'),
          ce('div',null,
            ce('div',{style:{fontSize:13,fontWeight:800,color:'#fff',letterSpacing:'-.02em'}},'Hero \u00b7 LDR'),
            ce('div',{style:{fontSize:9,color:'#FED7AA',letterSpacing:'.07em',fontWeight:600}},'LEAD DISPOSITION DASHBOARD v2.0 \u00b7 BikeDekho')
          )
        ),
        (()=>{
          let gL=0,gR=0;
          for(const row of effectiveData.monthly){gL+=row[1];gR+=row[2];}
          return ce('div',{style:{flex:1,display:'flex',gap:16,overflowX:'auto',padding:'8px 0',borderLeft:'1px solid rgba(255,255,255,.3)',paddingLeft:16,marginLeft:4}},
            [{l:'Leads',v:gL.toLocaleString('en-IN')},{l:'Bookings',v:gR.toLocaleString('en-IN')},
             {l:'L2R%',v:gL>0?(gR/gL*100).toFixed(1)+'%':'\u2014'},{l:'Months',v:effectiveData.maps.lm.length}]
            .map((k,i)=>ce('div',{key:i,style:{flexShrink:0,textAlign:'center',minWidth:56}},
              ce('div',{style:{fontSize:8,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'#FED7AA'}},k.l),
              ce('div',{style:{fontSize:13,fontWeight:800,color:'#fff',fontFamily:'DM Mono,monospace',letterSpacing:'-.02em'}},k.v)
            ))
          );
        })(),
        ce('button',{onClick:handleSync,disabled:syncing,
          style:{flexShrink:0,padding:'6px 16px',background:syncing?'rgba(255,255,255,.7)':'#fff',border:'none',borderRadius:20,color:'#7C2D12',fontSize:10,cursor:syncing?'default':'pointer',fontFamily:'inherit',fontWeight:700,boxShadow:'0 2px 8px rgba(0,0,0,.12)',display:'flex',alignItems:'center',gap:5}},
          syncing?ce('span',{style:{display:'inline-block',animation:'spin .8s linear infinite',fontSize:11}},'\u27f3'):'\ud83d\udd04',
          syncing?'Syncing\u2026':'Sync Sheets'
        ),
        ce('div',{style:{display:'flex',borderRadius:20,overflow:'hidden',border:'1px solid rgba(255,255,255,.4)',fontSize:10,fontWeight:700,flexShrink:0}},
          ce('button',{onClick:()=>setLeadsMode('create'),
            style:{padding:'4px 10px',background:leadsMode==='create'?'#fff':'transparent',color:leadsMode==='create'?'#7C2D12':'rgba(255,255,255,.85)',border:'none',cursor:'pointer',fontFamily:'inherit',fontWeight:700,whiteSpace:'nowrap'}},'All'),
          ce('button',{onClick:()=>setLeadsMode('update'),
            style:{padding:'4px 10px',background:leadsMode==='update'?'#fff':'transparent',color:leadsMode==='update'?'#7C2D12':'rgba(255,255,255,.85)',border:'none',cursor:'pointer',fontFamily:'inherit',fontWeight:700,borderLeft:'1px solid rgba(255,255,255,.3)',whiteSpace:'nowrap'}},'Unique')
        ),
        ce('div',{style:{borderLeft:'1px solid rgba(255,255,255,.25)',paddingLeft:10,marginLeft:4,flexShrink:0}},
          ce(PresenceStrip,{presence,fbUser,role,onSignOut,onAdminOpen})
        )
      )
    ),
    syncErr&&ce('div',{style:{background:'#fef2f2',borderBottom:'1px solid #fecaca',padding:'5px 24px',display:'flex',alignItems:'center',gap:8}},
      ce('span',{style:{fontSize:10,color:'#dc2626',flex:1}},'\u26a0 Sync error: '+syncErr),
      ce('button',{onClick:handleSync,style:{fontSize:10,padding:'3px 10px',borderRadius:8,border:'1px solid #fecaca',background:'#fff',color:'#dc2626',cursor:'pointer',fontFamily:'inherit',fontWeight:600}},'Retry')
    ),
    lastSynced&&!syncErr&&ce('div',{style:{background:'#f0fdf4',borderBottom:'1px solid #bbf7d0',padding:'4px 24px',fontSize:10,color:'#166534'}},
      '\u2713 Synced '+lastSynced.toLocaleString()+(diagnostics?' \u00b7 '+diagnostics.matched.toLocaleString('en-IN')+' bookings matched':'')
    ),
    diagnostics&&ce(HeroDiagnostics,{d:diagnostics,visible:diagExpanded,onToggle:()=>setDiagExpanded(p=>!p)}),
    /* Tab nav */
    ce('div',{style:{background:'#fff',borderBottom:'2px solid #FED7AA',position:'sticky',top:54,zIndex:99,boxShadow:'0 2px 8px rgba(124,45,18,.08)'}},
      ce('div',{style:{maxWidth:1440,margin:'0 auto',display:'flex',alignItems:'center',gap:0,padding:'0 24px',opacity:isPending?0.6:1,transition:'opacity .15s'}},
        visibleTabs.map(t=>ce('button',{key:t.id,className:'tab-pill'+(tab===t.id?' active':''),onClick:()=>startT(()=>setTab(t.id))},t.label)),
        isPending&&ce('span',{style:{marginLeft:12,fontSize:12,color:'#6B7280'}},'Loading\u2026')
      )
    ),
    /* Filter bar */
    ce('div',{style:{maxWidth:1440,margin:'0 auto',padding:'14px 24px 0',opacity:isPending?0.6:1,transition:'opacity .15s'}},
      ce(FilterBar,{data:effectiveData,filters,onFiltersChange:f=>startT(()=>setFilters(f)),RT,setRT,viewerMode})
    ),
    /* Tab content */
    ce('div',{style:{maxWidth:1440,margin:'0 auto',padding:'14px 24px 32px'}},
      tabContent
    )
  );
}

    role==='viewer'&&ce('span',{className:'viewer-badge',style:{marginLeft:4}},'Viewer'),
    role==='admin'&&ce('button',{
      style:{marginLeft:6,padding:'4px 10px',borderRadius:6,border:'1px solid rgba(255,255,255,.3)',background:'rgba(255,255,255,.12)',fontSize:11,cursor:'pointer',color:'#fff',fontWeight:600,fontFamily:'inherit',whiteSpace:'nowrap'},
      onClick:onAdminOpen},'\u2699 Admin'),
    ce('button',{
      style:{marginLeft:4,padding:'4px 10px',borderRadius:6,border:'1px solid rgba(255,255,255,.3)',background:'rgba(255,255,255,.1)',fontSize:11,cursor:'pointer',color:'rgba(255,255,255,.85)',fontFamily:'inherit',whiteSpace:'nowrap'},
      onClick:onSignOut},'Sign Out')
  );
}

function AdminPanel({onClose}){
  var[users,setUsers]=useState([]);
  var[saving,setSaving]=useState(null);
  var[panelErr,setPanelErr]=useState('');
  useEffect(function(){
    var unsub=getFbDb().collection(USERS_COL).orderBy('createdAt','asc').onSnapshot(
      function(snap){setUsers(snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},
      function(e){setPanelErr(e.message);}
    );
    return unsub;
  },[]);
  function changeRole(uid,newRole){
    setSaving(uid);
    getFbDb().collection(USERS_COL).doc(uid).update({role:newRole})
      .then(function(){setSaving(null);})
      .catch(function(e){setPanelErr(e.message);setSaving(null);});
  }
  var roleColor={admin:'#92400e',full:'#15803d',viewer:'#1d4ed8',pending:'#6b7280'};
  var roleBg={admin:'#fef3c7',full:'#dcfce7',viewer:'#dbeafe',pending:'#f3f4f6'};
  return ce('div',{className:'admin-panel-overlay',onClick:function(e){if(e.target===e.currentTarget)onClose();}},
    ce('div',{className:'admin-card'},
      ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}},
        ce('span',{style:{fontSize:15,fontWeight:700,color:'#111827'}},'\ud83d\udc65 User Access Management'),
        ce('button',{style:{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#9ca3af',lineHeight:1},onClick:onClose},'\u00d7')
      ),
      ce('p',{style:{fontSize:11,color:'#6b7280',margin:'0 0 14px',lineHeight:1.7}},
        ce('strong',null,'pending'),' \u2014 awaiting access  \u00b7  ',
        ce('strong',null,'viewer'),' \u2014 totals only  \u00b7  ',
        ce('strong',null,'full'),' \u2014 all columns  \u00b7  ',
        ce('strong',null,'admin'),' \u2014 full + manage users'
      ),
      panelErr&&ce('div',{style:{background:'#fef2f2',color:'#dc2626',padding:'8px 12px',borderRadius:8,fontSize:12,marginBottom:12}},panelErr),
      ce('div',{style:{overflowX:'auto'}},
        ce('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:12,minWidth:480}},
          ce('thead',null,ce('tr',{style:{background:'#fff7ed'}},
            ['Email','Name','Role','Change To'].map(function(h,i){
              return ce('th',{key:i,style:{padding:'8px 10px',textAlign:'left',fontWeight:700,color:'#7C2D12',fontSize:11,borderBottom:'2px solid #FDBA74'}},h);
            })
          )),
          ce('tbody',null,users.map(function(u){
            return ce('tr',{key:u.id,style:{borderBottom:'1px solid #FFF7ED'}},
              ce('td',{style:{padding:'7px 10px',color:'#6b7280',fontSize:11,maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},u.email),
              ce('td',{style:{padding:'7px 10px',color:'#374151',fontSize:11}},u.displayName||'\u2014'),
              ce('td',{style:{padding:'7px 10px'}},
                ce('span',{style:{padding:'2px 8px',borderRadius:20,fontSize:10,fontWeight:700,background:roleBg[u.role]||roleBg.pending,color:roleColor[u.role]||roleColor.pending}},u.role||'pending')
              ),
              ce('td',{style:{padding:'7px 10px'}},
                isAdminEmail(u.email)
                  ?ce('span',{style:{fontSize:11,color:'#9ca3af'}},'\u2014')
                  :saving===u.id
                    ?ce('span',{style:{fontSize:11,color:'#9ca3af'}},'Saving\u2026')
                    :ce('select',{value:u.role||'pending',onChange:function(e){changeRole(u.id,e.target.value);},
                        style:{fontSize:11,padding:'3px 8px',borderRadius:6,border:'1px solid #d1d5db',cursor:'pointer',background:'#fff',fontFamily:'inherit'}},
                      ['pending','viewer','full','admin'].map(function(r){
                        return ce('option',{key:r,value:r},r.charAt(0).toUpperCase()+r.slice(1));
                      })
                    )
              )
            );
          }))
        )
      )
    )
  );
}

function AuthGate(){
  var[authState,setAuthState]=useState('loading');
  var[fbUser,setFbUser]=useState(null);
  var[role,setRole]=useState(null);
  var[presence,setPresence]=useState({});
  var[authErr,setAuthErr]=useState('');
  var[authLoading,setAuthLoading]=useState(false);
  var[showAdmin,setShowAdmin]=useState(false);
  var cleanups=React.useRef([]);

  useEffect(function(){
    var auth=getFbAuth();
    auth.getRedirectResult().catch(function(e){
      if(e.code==='auth/unauthorized-domain'){
        setAuthErr('Domain not authorized. Admin must add this domain to Firebase Console \u2192 Authentication \u2192 Authorized domains.');
      } else if(e.code&&e.code!=='auth/no-auth-event'){
        setAuthErr(e.message);
      }
      setAuthLoading(false);
    });
    var unsubAuth=auth.onAuthStateChanged(function(user){
      cleanups.current.forEach(function(f){try{f();}catch(e){}});
      cleanups.current=[];
      if(!user){setAuthState('unauth');setFbUser(null);setRole(null);setPresence({});return;}
      if(!user.email||!ALLOWED_DOMAINS.some(function(d){return user.email.endsWith(d);})){
        setAuthErr('Only @girnarsoft.com or @girnarcare.com accounts are allowed.');
        auth.signOut();return;
      }
      setFbUser(user);
      setAuthState('pending');
      ensureUserDoc(user).catch(function(e){console.error('[Auth] ensureUserDoc:',e.code||e.message);});
      var presRef=setupPresence(user);
      cleanups.current.push(function(){try{presRef.remove();}catch(e){}});
      var unsubRole=getFbDb().collection(USERS_COL).doc(user.uid).onSnapshot(
        function(snap){var r=(snap.data()||{}).role||'pending';setRole(r);setAuthState(r==='pending'?'pending':'authed');},
        function(e){console.error('[Auth] role watch:',e.code||e.message);}
      );
      cleanups.current.push(unsubRole);
      var presListenRef=getFbRTDB().ref(PRESENCE_PATH);
      presListenRef.on('value',function(snap){setPresence(snap.val()||{});});
      cleanups.current.push(function(){presListenRef.off();});
    });
    return function(){unsubAuth();cleanups.current.forEach(function(f){try{f();}catch(e){}});};
  },[]);

  function handleLogin(){
    setAuthLoading(true);setAuthErr('');
    var provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    getFbAuth().signInWithRedirect(provider)
      .catch(function(e){setAuthErr(e.message);setAuthLoading(false);});
  }
  function handleSignOut(){
    cleanups.current.forEach(function(f){try{f();}catch(e){}});
    getFbAuth().signOut();
  }

  if(authState==='loading')return ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#6b7280',fontSize:13,fontFamily:'DM Mono,monospace'}},'Authenticating\u2026');
  if(authState==='unauth')return ce(LoginPage,{onLogin:handleLogin,loading:authLoading,error:authErr});
  if(authState==='pending')return ce(PendingPage,{user:fbUser,onSignOut:handleSignOut});
  return ce(React.Fragment,null,
    showAdmin&&ce(AdminPanel,{onClose:function(){setShowAdmin(false);}}),
    ce(App,{fbUser:fbUser,role:role,presence:presence,onSignOut:handleSignOut,onAdminOpen:function(){setShowAdmin(true);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(AuthGate,null));
</script>
</body>
</html>
