/* ════════════════════════════════════════════════════════════════════
   RETAIL DISPERSION TAB
   Enquired Model vs Purchased Model: SAME / CROSS / TOTAL / DISPERSION%
   rdm row format:  [mi, is_same, si, sti, ci, lti, lm_idx, cnt_all, cnt_dms, cnt_co, _]
   rdmx row format: [mi, pur_mi, is_same, si, sti, ci, lti, lm_idx, cnt_all, cnt_dms, cnt_co, _]
   ════════════════════════════════════════════════════════════════════ */
const DispersionTab = React.memo(function DispersionTab({ data, filters, months, RT, onDetailedCsv }) {
  const { maps, rdm, rdmx } = data;
  if (!rdm) return ce('div',{className:'fade-up'},ce('div',{className:'card',style:{padding:32,textAlign:'center',color:'#94A3B8'}},'Retail Dispersion data not yet available. Please sync data.'));

  // RT toggle => which count column for rdm: all=7, dms=8, co=9; for rdmx shift by 1
  const rtCol = RT === 'dms' ? 8 : RT === 'co' ? 9 : 7;
  const rdmxCol = rtCol + 1; // rdmx has purMI at [1], so cnt cols shift by 1

  // Expand/collapse state: Set of enquired model indices (mi)
  const [expandedModels, setExpandedModels] = useState(new Set());
  function toggleExpand(mi) {
    setExpandedModels(prev => {
      const next = new Set(prev);
      if (next.has(mi)) next.delete(mi); else next.add(mi);
      return next;
    });
  }

  // Shared filter check (used by both buildTable and buildDrillDown)
  function passesFilters(mi, si, sti, ci, lti, li) {
    const allMdl = !filters.models    || filters.models.size    === 0;
    const allSrc = !filters.sources   || filters.sources.size   === 0;
    const allSt  = !filters.states    || filters.states.size    === 0;
    const allCi  = !filters.cities    || filters.cities.size    === 0;
    const allLt  = !filters.leadTypes || filters.leadTypes.size === 0;
    if (!allMdl && !filters.models.has(maps.mdl[mi])) return false;
    if (!allSrc && !filters.sources.has(maps.src[si])) return false;
    if (!allSt  && !filters.states.has(maps.st[sti])) return false;
    if (!allCi  && !filters.cities.has(maps.city[ci])) return false;
    if (!allLt  && !filters.leadTypes.has(maps.lt[lti])) return false;
    return true;
  }

  // Build dispersion map for a given set of months, respecting all active filters
  function buildTable(monthSet) {
    const byModel = new Map();
    for (const row of rdm) {
      const mi=row[0],isSame=row[1],si=row[2],sti=row[3],ci=row[4],lti=row[5],li=row[6];
      const cnt = row[rtCol] || 0;
      if (cnt === 0) continue;
      if (!monthSet.has(maps.lm[li])) continue;
      if (!passesFilters(mi,si,sti,ci,lti,li)) continue;
      if (!byModel.has(mi)) byModel.set(mi, { same: 0, cross: 0 });
      const e = byModel.get(mi);
      if (isSame) e.same += cnt; else e.cross += cnt;
    }
    return byModel;
  }

  // Build drill-down map for a given set of months: mi → Map(purMI → {cnt, isSame})
  function buildDrillDown(monthSet) {
    const byEnqModel = new Map();
    if (!rdmx) return byEnqModel;
    for (const row of rdmx) {
      const mi=row[0],purMI=row[1],isSame=row[2],si=row[3],sti=row[4],ci=row[5],lti=row[6],li=row[7];
      const cnt = row[rdmxCol] || 0;
      if (cnt === 0) continue;
      if (!monthSet.has(maps.lm[li])) continue;
      if (!passesFilters(mi,si,sti,ci,lti,li)) continue;
      if (!byEnqModel.has(mi)) byEnqModel.set(mi, new Map());
      const inner = byEnqModel.get(mi);
      if (!inner.has(purMI)) inner.set(purMI, { cnt: 0, isSame });
      inner.get(purMI).cnt += cnt;
    }
    return byEnqModel;
  }

  // Render one dispersion card
  function renderCard(title, byModel, drillDown, csvName, dispMonth) {
    if (!byModel || byModel.size === 0) return null;
    const rows = [...byModel.entries()].map(([mi, v]) => ({
      mi,
      model: maps.mdl[mi],
      same: v.same, cross: v.cross,
      total: v.same + v.cross,
      disp: (v.same + v.cross) > 0 ? v.cross / (v.same + v.cross) * 100 : 0,
    })).filter(r => r.total > 0).sort((a, b) => b.total - a.total);
    if (rows.length === 0) return null;

    const grandSame  = rows.reduce((s, r) => s + r.same, 0);
    const grandCross = rows.reduce((s, r) => s + r.cross, 0);
    const grandTotal = grandSame + grandCross;
    const grandDisp  = grandTotal > 0 ? grandCross / grandTotal * 100 : 0;
    const maxDisp    = Math.max(...rows.map(r => r.disp), 1);

    return ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, title),
        ce('div',{style:{display:'flex',gap:0}},
          ce(CsvBtn, { onClick:() => {
            const aoa = [['Enquired Model','Same','Cross','Total','Dispersion%']];
            rows.forEach(r => aoa.push([r.model, r.same, r.cross, r.total, +r.disp.toFixed(2)]));
            aoa.push(['Σ Grand Total', grandSame, grandCross, grandTotal, +grandDisp.toFixed(2)]);
            exportCsv(aoa, csvName);
          }}),
          onDetailedCsv && ce(DetailedCsvBtn, { onClick:()=>onDetailedCsv('Dispersion', dispMonth||null) })
        )
      ),
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null,
            ce('tr', null,
              ce('th', { className:'left', style:{minWidth:200} }, 'Enquired Model'),
              ce('th', { style:{color:'#fff'} }, 'Same ✓'),
              ce('th', { style:{color:'#fff'} }, 'Cross ✗'),
              ce('th', null, 'Total'),
              ce('th', { style:{minWidth:200} }, 'Dispersion %'),
            )
          ),
          ce('tbody', null,
            ...rows.flatMap(r => {
              const barW = maxDisp > 0 ? Math.min(100, r.disp / maxDisp * 100) : 0;
              const barColor = r.disp < 20 ? '#22C55E' : r.disp < 35 ? '#F59E0B' : r.disp < 50 ? '#F97316' : '#EF4444';
              const isExpanded = expandedModels.has(r.mi);

              // Build sorted child rows for this enquired model
              const childRows = (drillDown && drillDown.has(r.mi))
                ? [...drillDown.get(r.mi).entries()]
                    .map(([purMI, v]) => ({ purModel: maps.purMdl[purMI] || '', cnt: v.cnt, isSame: v.isSame }))
                    .filter(c => c.cnt > 0)
                    .sort((a, b) => {
                      if (a.isSame !== b.isSame) return b.isSame - a.isSame; // Same first
                      return b.cnt - a.cnt; // then by count desc
                    })
                : [];

              const parentRow = ce('tr', {
                key: 'p-' + r.mi,
                style: { cursor: childRows.length > 0 ? 'pointer' : 'default' },
                onClick: childRows.length > 0 ? () => toggleExpand(r.mi) : undefined,
              },
                ce('td', { className:'label' },
                  ce('span', { style:{display:'inline-block',width:14,marginRight:4,fontSize:11,color:'#64748B',userSelect:'none'} },
                    childRows.length > 0 ? (isExpanded ? '▼' : '▶') : ''
                  ),
                  r.model
                ),
                ce('td', { style:{color:'#16A34A',fontWeight:700} }, Nf(r.same)),
                ce('td', { style:{color:'#DC2626',fontWeight:700} }, Nf(r.cross)),
                ce('td', { style:{fontWeight:600} }, Nf(r.total)),
                ce('td', null,
                  ce('div', { style:{display:'flex',alignItems:'center',gap:8} },
                    ce('div', { style:{flex:1,background:'#F1F5F9',borderRadius:4,height:8,overflow:'hidden'} },
                      ce('div', { style:{width:barW+'%',height:'100%',background:barColor,borderRadius:4,transition:'width .3s'} })
                    ),
                    ce('span', { style:{minWidth:42,textAlign:'right',fontWeight:700,color:barColor,fontFamily:'DM Mono,monospace',fontSize:12} },
                      r.disp.toFixed(1)+'%'
                    )
                  )
                )
              );

              if (!isExpanded || childRows.length === 0) return [parentRow];

              const childTrs = childRows.map((c, ci) =>
                ce('tr', { key: 'c-' + r.mi + '-' + ci, style:{background:'var(--drill-bg,#F8FAFC)'} },
                  ce('td', { className:'label', style:{paddingLeft:32,fontSize:12,color:'#475569'} },
                    ce('span', { style:{color:'#94A3B8',marginRight:5} }, '↳'),
                    c.purModel || '(blank)'
                  ),
                  ce('td', { style:{fontSize:12,fontWeight:600,color:'#334155'} }, Nf(c.cnt)),
                  ce('td', { style:{fontSize:12,fontWeight:700,color: c.isSame ? '#16A34A' : '#DC2626'} },
                    c.isSame ? 'Same' : 'Cross'
                  ),
                  ce('td', { style:{fontSize:12,fontWeight:600,color:'#1E40AF',fontFamily:'DM Mono,monospace'} },
                    (c.cnt / r.total * 100).toFixed(1) + '%'
                  ),
                  ce('td', null)
                )
              );

              const subtotalTr = ce('tr', { key: 'st-' + r.mi, style:{background:'var(--drill-sub,#EFF6FF)',borderTop:'1px solid #BFDBFE'} },
                ce('td', { className:'label', style:{paddingLeft:32,fontSize:12,fontWeight:700,color:'#1E40AF'} }, 'Total'),

                ce('td', { style:{fontSize:12,fontWeight:700,color:'#1E40AF',fontFamily:'DM Mono,monospace'} }, '100.0%'),
                ce('td', null)
              );

              return [parentRow, ...childTrs, subtotalTr];
            }),
            ce('tr', { className:'total-row' },
              ce('td', { className:'label', style:{color:'#1A237E'} }, 'Σ Grand Total'),
              ce('td', { style:{color:'#16A34A',fontWeight:700} }, Nf(grandSame)),
              ce('td', { style:{color:'#DC2626',fontWeight:700} }, Nf(grandCross)),
              ce('td', { style:{fontWeight:700} }, Nf(grandTotal)),

          )

      )
    );
  }

  // Determine active month set
  const activeMonths = useMemo(() => {
    if (filters.months && filters.months.size > 0) return filters.months;
    return new Set(months);
  }, [filters.months, months]);

  const allMonthsMap      = useMemo(() => buildTable(activeMonths),  [rdm, maps, filters, activeMonths, rtCol]);
  const monthlyMaps       = useMemo(() => months.map(M => ({ M, byModel: buildTable(new Set([M])) })),  [rdm, maps, filters, months, rtCol]);
  const allDrillDown      = useMemo(() => buildDrillDown(activeMonths), [rdmx, maps, filters, activeMonths, rdmxCol]);

  return ce('div', { className:'fade-up' },
    rdm.length === 0 && ce('div',{className:'card',style:{padding:32,textAlign:'center',color:'#94A3B8'}},

    renderCard(

        M
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   CROSS-TAB GRID  (rows × column-values, e.g. State × Model)
   ════════════════════════════════════════════════════════════════════ */
// Builds { grand, colKeys, rowKeys, rowAggs } from a 3-dim compact matrix.
// rowPos/colPos/lmPos are the index positions within a row.
function buildCrossAgg(table, maps, rowMapKey, colMapKey, lmMapKey, rowPos, colPos, lmPos, monthSet, rowFilter, colFilter, getLR, rtCols) {
  const allM   = !monthSet  || monthSet.size  === 0;
  const allRow = !rowFilter || rowFilter.size === 0;
  const allCol = !colFilter || colFilter.size === 0;
  let gL=0,gR=0,gDm=0,gCo=0;
  const rowAcc = new Map();
  const colTotals = {};
  const allCols = new Set();
  for (const row of table) {
    const m = maps[lmMapKey][row[lmPos]];
    if (!allM && !monthSet.has(m)) continue;
    const rLabel = maps[rowMapKey][row[rowPos]];
    if (!allRow && !rowFilter.has(rLabel)) continue;
    const cLabel = maps[colMapKey][row[colPos]];
    if (!allCol && !colFilter.has(cLabel)) continue;
    const [l,r] = getLR(row);
    const dm = rtCols ? (row[row.length-2]||0) : 0;
    const co = rtCols ? (row[row.length-1]||0) : 0;
    gL+=l; gR+=r; gDm+=dm; gCo+=co;
    allCols.add(cLabel);
    colTotals[cLabel]=(colTotals[cLabel]||0)+l;
    if (!rowAcc.has(rLabel)) rowAcc.set(rLabel,{total:[0,0,0,0],colAggs:new Map()});
    const e=rowAcc.get(rLabel);
    e.total[0]+=l; e.total[1]+=r; e.total[2]+=dm; e.total[3]+=co;
    if (!e.colAggs.has(cLabel)) e.colAggs.set(cLabel,[0,0,0,0]);
    const ca=e.colAggs.get(cLabel);
    ca[0]+=l; ca[1]+=r; ca[2]+=dm; ca[3]+=co;
  }
  const colKeys=[...allCols].sort((a,b)=>(colTotals[b]||0)-(colTotals[a]||0));
  const rowEntries=[...rowAcc.entries()].sort((a,b)=>b[1].total[0]-a[1].total[0]);
  const rowKeys=rowEntries.map(([k])=>k);
  const rowAggs={};
  for (const [rk,e] of rowEntries) {
    const ca={};
    for (const [ck,v] of e.colAggs) ca[ck]={l:v[0],r:v[1],dm:v[2],co:v[3],l2r:v[0]>0?v[1]/v[0]*100:0};
    rowAggs[rk]={total:{l:e.total[0],r:e.total[1],dm:e.total[2],co:e.total[3],l2r:e.total[0]>0?e.total[1]/e.total[0]*100:0},colAggs:ca};
  }
  return {grand:{l:gL,r:gR,dm:gDm,co:gCo,l2r:gL>0?gR/gL*100:0},colKeys,rowKeys,rowAggs};
}

/* ════════════════════════════════════════════════════════════════════
   CITY × SOURCE TAB
   ════════════════════════════════════════════════════════════════════ */
const CitySourceTab = React.memo(function CitySourceTab({ data, filters, months, RT, viewerMode, onDetailedCsv }) {
  const { maps } = data;
  const csm = data.csm || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const allSrcs = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const [expandedGrps, setExpandedGrps] = useState(new Set());
  const [expandedRows, setExpandedRows] = useState(new Set());
  const onToggleGrp = useCallback(id => setExpandedGrps(prev => {
    const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n;
  }), []);
  const onToggleRow = useCallback(rk => setExpandedRows(prev => {
    const n=new Set(prev); n.has(rk)?n.delete(rk):n.add(rk); return n;
  }), []);

  // csm format: [city_idx, src_idx, lm_idx, L, R_all, R_dms, R_co]
  // Aggregate across all selected months — no per-month breakdown rendered
  const computeAgg = useCallback((monthSet) => {
    const allS  = !filters.sources || filters.sources.size === 0;
    const allC  = !filters.cities  || filters.cities.size  === 0;
    const allSt = !filters.states  || filters.states.size  === 0;
    const bySrc=new Map(), byCity=new Map(), byCitySrc=new Map();
    let gL=0,gR=0;
    for (const row of csm) {
      if (!monthSet.has(maps.lm[row[2]])) continue;
      const city=maps.city[row[0]], src=maps.src[row[1]];
      if (!allC && !filters.cities.has(city)) continue;
      if (!allS && !filters.sources.has(src)) continue;
      if (!allSt && maps.city_state) {
        const stIdx=maps.city_state[row[0]];
        if (!filters.states.has(maps.st[stIdx])) continue;
      }
      const [l,r]=getLR(row);
      gL+=l; gR+=r;
      const cs=bySrc.get(src)||[0,0]; cs[0]+=l; cs[1]+=r; bySrc.set(src,cs);
      const cc=byCity.get(city)||[0,0]; cc[0]+=l; cc[1]+=r; byCity.set(city,cc);
      const k=city+'\x00'+src;
      const ccs=byCitySrc.get(k)||[0,0]; ccs[0]+=l; ccs[1]+=r; byCitySrc.set(k,ccs);
    }
    if (gL===0&&gR===0) return null;
    const grandSrc={};
    for (const [s,v] of bySrc) grandSrc[s]=fin(v[0],v[1]);
    const dimAggs={};
    for (const [c,cv] of byCity) {
      const srcAgg={};
      for (const s of bySrc.keys()) { const v=byCitySrc.get(c+'\x00'+s); srcAgg[s]=v?fin(v[0],v[1]):EMPTY; }
      dimAggs[c]={total:fin(cv[0],cv[1]),src:srcAgg};
    }
    return {grand:fin(gL,gR),grandSrc,dimAggs};
  }, [csm, maps, filters, getLR]);

  const summaryAgg = useMemo(() => computeAgg(new Set(months)), [computeAgg, months]);

  const exportAll = useCallback(() => {
    if (!summaryAgg || summaryAgg.grand.l===0) return;
    const hdr=['City','Total Leads','Total Retail','Contrib%','L2R%',...allSrcs.flatMap(s=>[s+' Leads',s+' Retail',s+' L2R%'])];
    const rows=[hdr];
    for (const [city,da] of Object.entries(summaryAgg.dimAggs)) {
      const row=[city,da.total.l,da.total.r,summaryAgg.grand.l>0?+(da.total.l/summaryAgg.grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];
      for (const s of allSrcs) { const v=da.src[s]||EMPTY; row.push(v.l,v.r,+v.l2r.toFixed(1)); }
      rows.push(row);
    }
    rows.push(['∑ Grand Total',summaryAgg.grand.l,summaryAgg.grand.r,100,+summaryAgg.grand.l2r.toFixed(1),...allSrcs.flatMap(s=>{const v=summaryAgg.grandSrc[s]||EMPTY;return[v.l,v.r,+v.l2r.toFixed(1)];})]);
    exportXlsx({'City × Source':rows},'Hero_CitySource_All');
  }, [summaryAgg, allSrcs]);

  if (!summaryAgg) return ce('div',{style:{textAlign:'center',padding:50,color:'#94A3B8',fontSize:14}},
    'No data matches the current filters.');

  return ce('div', { className:'fade-up' },
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, 'City × Source'),
        ce('div', {style:{display:'flex',gap:4}},
          ce(CsvBtn, { onClick:()=>makeAggCsv(summaryAgg,'City','Hero_CitySource_AllMonths.csv') }),
          onDetailedCsv && ce(DetailedCsvBtn, { onClick:()=>onDetailedCsv('CitySource', null) }),
          ce(ExportBtn, { onClick: exportAll })
        )
      ),
      ce(DimGrid, { agg:summaryAgg, srcGroups, dimLabel:'City', expandedGrps, onToggleGrp, expandedRows, onToggleRow, viewerMode })
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   STATE × MODEL TAB
   ════════════════════════════════════════════════════════════════════ */
const StateModelTab = React.memo(function StateModelTab({ data, filters, months, RT, viewerMode, onDetailedCsv }) {
  const { maps } = data;
  const mxst = data.mxst || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);

  // mxst format: [mdl_idx, st_idx, lm_idx, L, R_all, R_dms, R_co]
  // rows = states, cols = models
  const buildAgg = useCallback((monthSet) => {
    return buildCrossAgg(
      mxst, maps, 'st', 'mdl', 'lm', 1, 0, 2, monthSet,
      filters.states, filters.models, getLR, data.rt_cols
    );
  }, [mxst, maps, filters, getLR, data.rt_cols]);

  const summaryAgg = useMemo(() => {
    const a=buildAgg(new Set(months)); return a.grand.l>0?a:null;
  }, [buildAgg, months]);

  const monthlyAggs = useMemo(() =>
    months.map(M => ({ M, agg: (() => { const a=buildAgg(new Set([M])); return a.grand.l>0?a:null; })() })),
  [buildAgg, months]);

  const exportAgg = useCallback((agg, label) => {
    if (!agg) return;
    const {colKeys,rowKeys,rowAggs,grand}=agg;
    const hdr=['State','Total Leads','Total Retail','Contrib%','L2R%',...colKeys.flatMap(ck=>[ck+' Leads',ck+' Retail',ck+' L2R%'])];
    const rows=[hdr];
    for (const rk of rowKeys) {
      const da=rowAggs[rk];
      const row=[rk,da.total.l,da.total.r,grand.l>0?+(da.total.l/grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];
      for (const ck of colKeys) { const ca=da.colAggs[ck]||{l:0,r:0,l2r:0}; row.push(ca.l,ca.r,+ca.l2r.toFixed(1)); }
      rows.push(row);
    }
    const gtRow=['∑ Grand Total',grand.l,grand.r,100,+grand.l2r.toFixed(1)];
    for (const ck of colKeys) { let tL=0,tR=0; for(const da of Object.values(rowAggs)){const ca=da.colAggs[ck]||{l:0,r:0};tL+=ca.l;tR+=ca.r;} const tL2r=tL>0?tR/tL*100:0; gtRow.push(tL,tR,+tL2r.toFixed(1)); }
    rows.push(gtRow);
    exportXlsx({[label]:rows},'Hero_StateModel_'+(label==='Summary'?'All':label.replace("'","")));
  }, []);

  return ce('div', { className:'fade-up' },
    summaryAgg && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce(CrossTabGrid, { agg:summaryAgg, rowLabel:'State', colLabel:'Model', rtCols:data.rt_cols,
        title:'∑ All Months — State × Model Summary',
        onCsvExport:()=>{
          const {colKeys,rowKeys,rowAggs,grand}=summaryAgg;
          const aoa=[['State','Leads','Retail','Contrib%','L2R%',...colKeys.flatMap(ck=>[ck+' L',ck+' R',ck+' L2R%'])]];
          rowKeys.forEach(rk=>{const da=rowAggs[rk];const r=[rk,da.total.l,da.total.r,grand.l>0?+(da.total.l/grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];colKeys.forEach(ck=>{const ca=da.colAggs[ck]||{l:0,r:0,l2r:0};r.push(ca.l,ca.r,+ca.l2r.toFixed(1));});aoa.push(r);});
          const gt=['Grand Total',grand.l,grand.r,100,+grand.l2r.toFixed(1)];colKeys.forEach(ck=>{let tL=0,tR=0;rowKeys.forEach(rk=>{const ca=(rowAggs[rk].colAggs[ck]||{l:0,r:0});tL+=ca.l;tR+=ca.r;});gt.push(tL,tR,tL>0?+(tR/tL*100).toFixed(1):0);});aoa.push(gt);
          exportCsv(aoa,'Hero_StateModel_AllMonths.csv');
        },

const CityModelTab = React.memo(function CityModelTab({ data, filters, months, RT, viewerMode, onDetailedCsv }) {
  const { maps } = data;
  const cxm = data.cxm || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);

  // cxm format: [city_idx, mdl_idx, lm_idx, L, R_all, R_dms, R_co]
  // rows = cities, cols = models
  const buildAgg = useCallback((monthSet) => {
    const stFilter = (filters.states && filters.states.size > 0 && maps.city_state)
      ? new Set(
          (maps.city||[]).reduce((acc,city,i) => {
            const stIdx = maps.city_state[i];
            if (filters.states.has(maps.st[stIdx])) acc.push(city);
            return acc;
          }, [])
        )
      : null;
    const cityRowFilter = stFilter
      ? (filters.cities && filters.cities.size > 0
          ? new Set([...stFilter].filter(c => filters.cities.has(c)))
          : stFilter)
      : filters.cities;
    return buildCrossAgg(
      cxm, maps, 'city', 'mdl', 'lm', 0, 1, 2, monthSet,
      cityRowFilter, filters.models, getLR, data.rt_cols
    );
  }, [cxm, maps, filters, getLR, data.rt_cols]);

  const summaryAgg = useMemo(() => {
    if (cxm.length===0) return null;

    for (const rk of rowKeys) {
      const da=rowAggs[rk];
      const row=[rk,da.total.l,da.total.r,grand.l>0?+(da.total.l/grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];
      for (const ck of colKeys) { const ca=da.colAggs[ck]||{l:0,r:0,l2r:0}; row.push(ca.l,ca.r,+ca.l2r.toFixed(1)); }
      rows.push(row);
    }
    const gtRow=['∑ Grand Total',grand.l,grand.r,100,+grand.l2r.toFixed(1)];
    for (const ck of colKeys) { let tL=0,tR=0; for(const da of Object.values(rowAggs)){const ca=da.colAggs[ck]||{l:0,r:0};tL+=ca.l;tR+=ca.r;} const tL2r=tL>0?tR/tL*100:0; gtRow.push(tL,tR,+tL2r.toFixed(1)); }
    rows.push(gtRow);
    exportXlsx({'City × Model':rows},'Hero_CityModel_All');
  }, [summaryAgg]);

  if (cxm.length===0) return ce('div',{style:{textAlign:'center',padding:50,color:'#94A3B8',fontSize:14}},
    '📦 City × Model data will be available after the next pipeline run.');

  if (!summaryAgg) return ce('div',{style:{textAlign:'center',padding:50,color:'#94A3B8',fontSize:14}},
    'No data matches the current filters.');

  return ce('div', { className:'fade-up' },
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce(CrossTabGrid, { agg:summaryAgg, rowLabel:'City', colLabel:'Model', rtCols:data.rt_cols,
        title:'City × Model',
        onCsvExport:()=>{
          const {colKeys,rowKeys,rowAggs,grand}=summaryAgg;
          const aoa=[['City','Leads','Retail','Contrib%','L2R%',...colKeys.flatMap(ck=>[ck+' L',ck+' R',ck+' L2R%'])]];
          rowKeys.forEach(rk=>{const da=rowAggs[rk];const r=[rk,da.total.l,da.total.r,grand.l>0?+(da.total.l/grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];colKeys.forEach(ck=>{const ca=da.colAggs[ck]||{l:0,r:0,l2r:0};r.push(ca.l,ca.r,+ca.l2r.toFixed(1));});aoa.push(r);});
          const gt=['Grand Total',grand.l,grand.r,100,+grand.l2r.toFixed(1)];colKeys.forEach(ck=>{let tL=0,tR=0;rowKeys.forEach(rk=>{const ca=(rowAggs[rk].colAggs[ck]||{l:0,r:0});tL+=ca.l;tR+=ca.r;});gt.push(tL,tR,tL>0?+(tR/tL*100).toFixed(1):0);});aoa.push(gt);
          exportCsv(aoa,'Hero_CityModel_AllMonths.csv');
        },
        onDetailedCsvExport: onDetailedCsv ? ()=>onDetailedCsv('CityModel', null) : null,

  );
});

/* ════════════════════════════════════════════════════════════════════
   PIVOT TABLE TAB
   ════════════════════════════════════════════════════════════════════ */
const thS = {padding:'7px 10px', textAlign:'right', fontWeight:700, fontSize:10, color:'#7C2D12', background:'#FFF7ED', borderBottom:'2px solid #FDBA74', whiteSpace:'nowrap'};
const tdS = {padding:'7px 10px', textAlign:'right', fontSize:11, fontFamily:'DM Mono,monospace'};

const PivotTab = React.memo(function PivotTab({ data, filters, months, RT, onDetailedCsv, rawJoined, leadsMode }) {
  const { maps } = data;
  const COL_SEP = '\x00';

  const [rowDims,    setRowDims]    = useState(['mdl']);
  const [colDims,    setColDims]    = useState(['lm']);
  const [metrics,    setMetrics]    = useState(['leads']);
  const [sortBy,     setSortBy]     = useState('__total__');
  const [sortDir,    setSortDir]    = useState('desc');
  const [topN,       setTopN]       = useState(20);
  const [collapsed,  setCollapsed]  = useState(new Set());
  const [addRowOpen, setAddRowOpen] = useState(false);
  const [addColOpen, setAddColOpen] = useState(false);

  // QA ref: always holds the latest state for window.heroPivotQA()
  const _pivotQARef = useRef({});

  const DIMS = [
    { key:'lm',   label:'Month'     },
    { key:'mdl',  label:'Model'     },
    { key:'src',  label:'Source'    },
    { key:'st',   label:'State'     },
    { key:'lt',   label:'Lead Type' },
    { key:'city', label:'City'      },
  ];

  const METRICS = [
    { key:'leads',  label:'Leads'    },
    { key:'leadpct', label:'L.Contrib%' },
    { key:'ret',    label:'Retails'  },
    { key:'retlpct', label:'R.Contrib%' },
    { key:'retpct', label:'Retail %' },
    { key:'dms',    label:'DMS'      },
    { key:'call',   label:'Call-Out' },
  ];


  function getRetVal(vals) {
    if (!vals) return 0;
    if (RT === 'dms') return vals[2] || 0;
    if (RT === 'co')  return vals[3] || 0;
    return vals[1] || 0;
  }

  function getMetricVal(vals, m) {
    if (!vals) return 0;
    if (m === 'leads')  return vals[0] || 0;
    if (m === 'ret')    return getRetVal(vals);
    if (m === 'retpct') return vals[0] > 0 ? (getRetVal(vals) / vals[0]) * 100 : 0;
    if (m === 'dms')    return vals[2] || 0;
    if (m === 'call')   return vals[3] || 0;
    return 0;
  }

  function fmtV(vals, m) {
    if (m === 'leadpct') {
      const l = vals ? (vals[0]||0) : 0;
      return (grandTotals.gl > 0 && l > 0) ? (l/grandTotals.gl*100).toFixed(1)+'%' : '—';
    }
    if (m === 'retlpct') {
      const r = vals ? (vals[1]||0) : 0;
      return (grandTotals.gr > 0 && r > 0) ? (r/grandTotals.gr*100).toFixed(1)+'%' : '—';
    }
    const v = getMetricVal(vals, m);
    if (m === 'retpct') return v > 0 ? v.toFixed(1) + '%' : '—';
    return v === 0 ? '—' : v.toLocaleString();
  }

  function rowTotal(cMap, m) {
    let tl = 0, tr = 0;
    for (const v of cMap.values()) { tl += v[0]; tr += v[1]; }
    if (m === 'retpct') return tl > 0 ? (tr / tl) * 100 : 0;
    let t = 0;
    for (const v of cMap.values()) t += getMetricVal(v, m);
    return t;
  }

  function fmtTotal(cMap, m) {
    if (m === 'leadpct') {
      let tl=0; for (const v of cMap.values()) tl+=v[0]||0;
      return (grandTotals.gl>0&&tl>0)?(tl/grandTotals.gl*100).toFixed(1)+'%':'—';
    }
    if (m === 'retlpct') {
      let tr=0; for (const v of cMap.values()) tr+=v[1]||0;
      return (grandTotals.gr>0&&tr>0)?(tr/grandTotals.gr*100).toFixed(1)+'%':'—';
    }
    const v = rowTotal(cMap, m);
    if (m === 'retpct') return v > 0 ? v.toFixed(1) + '%' : '—';
    return v === 0 ? '—' : v.toLocaleString();
  }

  function accVals(tgt, cKey, row, nDims) {
    if (!tgt.has(cKey)) tgt.set(cKey, [0, 0, 0, 0]);
    const c = tgt.get(cKey);
    c[0] += row[nDims]     || 0;
    c[1] += row[nDims + 1] || 0;
    c[2] += row[nDims + 2] || 0;
    c[3] += row[nDims + 3] || 0;
  }

  const pivotResult = useMemo(() => {
    if (!rawJoined || rawJoined.length === 0) return null;
    const { months:mf, sources:sf, leadTypes:ltf, models:mdf, states:stf, cities:cf } = filters;
    const allM   = !mf  || mf.size  === 0 || mf  === FILTER_CLEARED;
    const allS   = !sf  || sf.size  === 0 || sf  === FILTER_CLEARED;
    const allLT  = !ltf || ltf.size === 0 || ltf === FILTER_CLEARED;
    const allMdl = !mdf || mdf.size === 0 || mdf === FILTER_CLEARED;
    const allSt  = !stf || stf.size === 0 || stf === FILTER_CLEARED;
    const allC   = !cf  || cf.size  === 0 || cf  === FILTER_CLEARED;
    const getDimVal = (dim, r, effMonth) => {
      switch(dim) {
        case 'mdl':  return r.model   || 'Unknown';
        case 'src':  return r.source  || 'Unknown';
        case 'lm':   return effMonth  || 'Unknown';
        case 'st':   return r.state   || 'Unknown';
        case 'lt':   return r.lt      || 'Unknown';
        case 'city': return r.city    || 'Unknown';
        default:     return '?';
      }
    };
    const tbl    = new Map();
    const colSet = new Set();
    for (const r of rawJoined) {
      const effMonth = (leadsMode === 'update' && r.isBooked && r.booking_month) ? r.booking_month : r.lead_month;
      if (!allM   && !mf.has(effMonth))   continue;
      if (!allS   && !sf.has(r.source))   continue;
      if (!allLT  && !ltf.has(r.lt))      continue;
      if (!allMdl && !mdf.has(r.model))   continue;
      if (!allSt  && !stf.has(r.state))   continue;
      if (!allC   && !cf.has(r.city))     continue;
      const L  = 1;
      const R  = isRetailedLead(r) ? 1 : 0;
      const Rd = (R && r.callType === 'dms') ? 1 : 0;
      const Rc = (R && r.callType === 'co')  ? 1 : 0;
      const r1 = getDimVal(rowDims[0], r, effMonth);
      const r2 = rowDims[1] ? getDimVal(rowDims[1], r, effMonth) : null;
      const c0 = getDimVal(colDims[0], r, effMonth);
      const ck = colDims[1] ? c0 + COL_SEP + getDimVal(colDims[1], r, effMonth) : c0;
      colSet.add(ck);
      if (!tbl.has(r1)) tbl.set(r1, { sub: new Map(), children: new Map() });
      const e = tbl.get(r1);
      if (!e.sub.has(ck)) e.sub.set(ck, [0, 0, 0, 0]);
      const sv = e.sub.get(ck); sv[0]+=L; sv[1]+=R; sv[2]+=Rd; sv[3]+=Rc;
      if (r2 !== null) {
        if (!e.children.has(r2)) e.children.set(r2, new Map());
        const cm = e.children.get(r2);
        if (!cm.has(ck)) cm.set(ck, [0, 0, 0, 0]);
        const cv = cm.get(ck); cv[0]+=L; cv[1]+=R; cv[2]+=Rd; cv[3]+=Rc;
      }
    }
    return { tbl, colLabels: [...colSet] };
  }, [rawJoined, rowDims, colDims, filters, leadsMode]);

  const pm = metrics[0] || 'leads';

  // Keep QA ref current every render (useRef is mutable — no deps list needed)
  _pivotQARef.current = { rawJoined, pivotResult, rowDims, colDims, filters, leadsMode, RT };

  useEffect(() => {
    window.heroPivotQA = function() {
      const q = _pivotQARef.current;
      const { rawJoined: rj, pivotResult: pr, rowDims: rd, colDims: cd, filters: f, leadsMode: lm, RT: rt } = q;
      console.group('[HERO PIVOT QA]');

      // 1. Records available
      console.log('1. rawJoined records available to Pivot:', rj ? rj.length : 'null/undefined');

      // 2. Available months
      const months2 = rj ? [...new Set(rj.map(r => (lm==='update'&&r.isBooked&&r.booking_month)?r.booking_month:r.lead_month))].filter(Boolean).sort((a,b)=>heroMonthOrder(a)-heroMonthOrder(b)) : [];
      console.log('2. Available months:', months2);

      // 3. Available models
      const models3 = rj ? [...new Set(rj.map(r=>r.model||'Unknown'))].sort() : [];
      console.log('3. Available models (' + models3.length + '):', models3.slice(0,10), models3.length>10?'...(first 10 shown)':'');

      // 4. Total leads
      console.log('4. Total leads in rawJoined:', rj ? rj.length : 0);

      // 5. Total retails
      const totalR = rj ? rj.filter(r=>isRetailedLead(r)).length : 0;
      console.log('5. Total retails (isRetailedLead):', totalR);

      // 6. Sample Model × Month lead aggregation
      if (rj && rj.length) {
        const sampleAgg = new Map();
        rj.slice(0, 1000).forEach(r => {
          const effM = (lm==='update'&&r.isBooked&&r.booking_month)?r.booking_month:r.lead_month;
          const k = (r.model||'Unknown') + '|' + (effM||'Unknown');
          sampleAgg.set(k, (sampleAgg.get(k)||0) + 1);
        });
        const top3 = [...sampleAgg.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3);
        console.log('6. Sample Model×Month lead aggregation (from first 1000 rows):', top3.map(([k,v])=>k+'='+v).join(', '));
      }

      // 7. Sample Model × Month retail aggregation
      if (rj && rj.length) {
        const retAgg = new Map();
        rj.filter(r=>isRetailedLead(r)).slice(0,200).forEach(r => {
          const effM = (lm==='update'&&r.isBooked&&r.booking_month)?r.booking_month:r.lead_month;
          const k = (r.model||'Unknown') + '|' + (effM||'Unknown');
          retAgg.set(k, (retAgg.get(k)||0) + 1);
        });
        const top3r = [...retAgg.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3);
        console.log('7. Sample Model×Month retail aggregation (from first 200 retails):', top3r.map(([k,v])=>k+'='+v).join(', ') || '(none)');
      }

      // 8. Missing/undefined fields
      if (rj && rj.length) {
        const s = rj[0];
        const missing = ['model','source','lead_month','lt','state','city'].filter(fld => s[fld]===undefined);
        console.log('8. Fields undefined in first row:', missing.length ? missing : 'none');
        console.log('   First row sample:', {model:s.model,source:s.source,lead_month:s.lead_month,lt:s.lt,state:s.state,isBooked:s.isBooked,booking_month:s.booking_month});
      }

      // 9. Pivot config non-zero check
      if (pr && pr.tbl.size > 0) {
        let accL = 0, accR = 0;
        for (const {sub} of pr.tbl.values()) for (const v of sub.values()) { accL+=v[0]; accR+=v[1]; }
        console.log('9. Current pivot config: tbl rows='+pr.tbl.size+', accumulated leads='+accL+', retails='+accR, accL>0?'✓ NON-ZERO':'⚠ ALL ZERO');
      } else {
        console.log('9. pivotResult:', pr ? 'tbl empty (size=0)' : 'null');
      }

      // 10. Renderer lookup trace (Model × Month for first model)
      if (pr && pr.tbl.size > 0 && pr.colLabels && pr.colLabels.length > 0) {
        const sampleModel = [...pr.tbl.keys()][0];
        const sampleEntry = pr.tbl.get(sampleModel);
        const sampleCol   = pr.colLabels[0];
        const sampleVals  = sampleEntry.sub.get(sampleCol);
        console.group('10. Renderer lookup trace');
        console.log('  Model:', sampleModel);
        console.log('  Col key (month):', sampleCol);
        console.log('  entry.sub.get(colKey) =', sampleVals, '  [L, R_all, R_dms, R_co]');
        const MKEYS = ['leads','leadpct','ret','retlpct','retpct','dms','call'];
        MKEYS.forEach(mk => {
          const getRetV = (v) => rt==='dms'?v[2]:rt==='co'?v[3]:v[1];
          const raw = sampleVals ? (mk==='leads'?sampleVals[0]:mk==='ret'?getRetV(sampleVals):mk==='retpct'?(sampleVals[0]>0?getRetV(sampleVals)/sampleVals[0]*100:0):mk==='dms'?sampleVals[2]:mk==='call'?sampleVals[3]:null) : 0;
          const rendered = sampleVals ? (raw===0||raw===null?'—':(mk==='retpct'?raw.toFixed(1)+'%':String(raw))) : '—';
          console.log('  metric='+mk+' → raw='+raw+' → rendered='+rendered);
        });
        // TOTAL cell lookup
        let totL=0,totR=0;
        for (const v of sampleEntry.sub.values()) { totL+=v[0]; totR+=v[1]; }
        console.log('  TOTAL leads='+totL+', retails='+totR, totL>0?'✓':'⚠ ZERO');
        console.groupEnd();
      }

      console.log('   Config: rowDims='+rd+', colDims='+cd+', leadsMode='+lm+', RT='+rt);
      console.groupEnd();
      return { rawJoinedCount: rj?rj.length:0, months:months2, modelCount:models3.length, totalLeads:rj?rj.length:0, totalRetails:totalR, pivotTblSize:pr?pr.tbl.size:0 };
    };
    return () => { delete window.heroPivotQA; };
  }, []);

  const orderedCols = useMemo(() => {
    if (!pivotResult) return [];
    const { tbl, colLabels } = pivotResult;
    if (colDims.length === 1) {
      if (colDims[0] === 'lm') return [...colLabels].sort((a, b) => heroMonthOrder(a) - heroMonthOrder(b));
      const cTot = {};
      for (const { sub } of tbl.values())
        for (const [c, v] of sub) cTot[c] = (cTot[c] || 0) + getMetricVal(v, pm);
      return [...colLabels].sort((a, b) => (cTot[b] || 0) - (cTot[a] || 0));
    }
    const groups = new Map();
    for (const ck of colLabels) {
      const sep = ck.indexOf(COL_SEP);
      const c0 = ck.slice(0, sep), c1 = ck.slice(sep + 1);
      if (!groups.has(c0)) groups.set(c0, new Set());
      groups.get(c0).add(c1);
    }
    let c0vals = [...groups.keys()];
    if (colDims[0] === 'lm') { c0vals.sort((a, b) => heroMonthOrder(a) - heroMonthOrder(b)); }
    else {
      const c0Tot = {};
      for (const { sub } of tbl.values())
        for (const [ck, v] of sub) {
          const c0 = ck.slice(0, ck.indexOf(COL_SEP));
          c0Tot[c0] = (c0Tot[c0] || 0) + getMetricVal(v, pm);
        }
      c0vals.sort((a, b) => (c0Tot[b] || 0) - (c0Tot[a] || 0));
    }
    const result = [];
    for (const c0 of c0vals) {
      let c1vals = [...groups.get(c0)];
      if (colDims[1] === 'lm') { c1vals.sort((a, b) => heroMonthOrder(a) - heroMonthOrder(b)); }
      else {
        const c1Tot = {};
        for (const { sub } of tbl.values())
          for (const [ck, v] of sub) {
            const sep = ck.indexOf(COL_SEP);
            if (ck.slice(0, sep) === c0) {
              const c1 = ck.slice(sep + 1);
              c1Tot[c1] = (c1Tot[c1] || 0) + getMetricVal(v, pm);
            }
          }
        c1vals.sort((a, b) => (c1Tot[b] || 0) - (c1Tot[a] || 0));
      }
      for (const c1 of c1vals) result.push(c0 + COL_SEP + c1);
    }
    return result;
  }, [pivotResult, colDims, pm]);

  const colGroups = useMemo(() => {
    if (colDims.length < 2) return [];
    const groups = [];
    let i = 0;
    while (i < orderedCols.length) {
      const c0 = orderedCols[i].slice(0, orderedCols[i].indexOf(COL_SEP));
      let span = 0;
      while (i < orderedCols.length && orderedCols[i].slice(0, orderedCols[i].indexOf(COL_SEP)) === c0) { span++; i++; }
      groups.push({ c0, span });
    }
    return groups;
  }, [orderedCols, colDims]);

  const sortedRows = useMemo(() => {
    if (!pivotResult) return [];
    const rows = [];
    for (const [label, entry] of pivotResult.tbl) {
      const total = rowTotal(entry.sub, pm);
      rows.push({ label, entry, total });
    }
    rows.sort((a, b) => {
      let av, bv;
      if (sortBy === '__total__') { av = a.total; bv = b.total; }
      else if (sortBy === '__label__') { av = a.label; bv = b.label; }
      else { av = getMetricVal(a.entry.sub.get(sortBy), pm); bv = getMetricVal(b.entry.sub.get(sortBy), pm); }
      if (av === bv) return 0;
      if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === 'asc' ? av - bv : bv - av;
    });
    return topN > 0 ? rows.slice(0, topN) : rows;
  }, [pivotResult, pm, sortBy, sortDir, topN]);

  const grandTotals = useMemo(() => {
    if (!pivotResult) return { colVals: {}, gl: 0, gr: 0 };
    const colVals = {};
    let gl = 0, gr = 0;
    for (const { sub } of pivotResult.tbl.values()) {
      for (const [c, v] of sub) {
        if (!colVals[c]) colVals[c] = [0, 0, 0, 0];
        for (let i = 0; i < 4; i++) colVals[c][i] += v[i];
        gl += v[0]; gr += v[1];
      }
    }
    return { colVals, gl, gr };
  }, [pivotResult]);

  const unapplied = [];

  function toggleMetric(key) {
    setMetrics(prev =>
      prev.includes(key)
        ? prev.length > 1 ? prev.filter(k => k !== key) : prev
        : [...prev, key]
    );
  }

  function addRowDim(key) {
    if (rowDims.includes(key) || colDims.includes(key)) return;
    setRowDims([...rowDims, key]);
    setAddRowOpen(false);
    setCollapsed(new Set());
  }

  function removeRowDim(idx) {
    if (rowDims.length === 1) return;
    setRowDims(rowDims.filter((_, i) => i !== idx));
    setCollapsed(new Set());
  }

  function addColDim(key) {
    if (colDims.includes(key) || rowDims.includes(key)) return;
    setColDims([...colDims, key]);
    setAddColOpen(false);
    setSortBy('__total__');
  }

  function removeColDim(idx) {
    if (colDims.length === 1) return;
    setColDims(colDims.filter((_, i) => i !== idx));
    setSortBy('__total__');
  }

  function handleExport() {
    if (!pivotResult || sortedRows.length === 0) return;
    const hasR2  = rowDims.length > 1;
    const hasC2  = colDims.length > 1;
    const dimLbl = k => DIMS.find(d => d.key === k)?.label || k;
    const mLbl   = k => METRICS.find(x => x.key === k)?.label || k;
    const colLabel = ck => hasC2
      ? ck.slice(0, ck.indexOf(COL_SEP)) + ' — ' + ck.slice(ck.indexOf(COL_SEP) + 1)
      : ck;
    const hdr = [dimLbl(rowDims[0])];
    if (hasR2) hdr.push(dimLbl(rowDims[1]));
    for (const ck of orderedCols)
      for (const m of metrics)
        hdr.push(metrics.length > 1 ? `${colLabel(ck)} — ${mLbl(m)}` : colLabel(ck));
    for (const m of metrics)
      hdr.push(metrics.length > 1 ? `TOTAL — ${mLbl(m)}` : 'TOTAL');
    const aoa = [hdr];
    const pushCells = (arr, cMap) => {
      for (const ck of orderedCols)
        for (const m of metrics) {
          const v = getMetricVal(cMap.get(ck), m);
          arr.push(m === 'retpct' ? +(v.toFixed(2)) : v);
        }
      for (const m of metrics) {
        const t = rowTotal(cMap, m);
        arr.push(m === 'retpct' ? +(t.toFixed(2)) : t);
      }
    };
    for (const { label, entry } of sortedRows) {
      if (!hasR2) { const r = [label]; pushCells(r, entry.sub); aoa.push(r); }
      else {
        const rSub = [label, 'Subtotal']; pushCells(rSub, entry.sub); aoa.push(rSub);
        for (const [r2Lbl, cMap] of entry.children) {
          const rChild = ['', r2Lbl]; pushCells(rChild, cMap); aoa.push(rChild);
        }
      }
    }
    const gtRow = hasR2 ? ['GRAND TOTAL', ''] : ['GRAND TOTAL'];
    for (const ck of orderedCols)
      for (const m of metrics) {
        const v = getMetricVal(grandTotals.colVals[ck], m);
        gtRow.push(m === 'retpct' ? +(v.toFixed(2)) : v);
      }
    for (const m of metrics) {
      let t = 0;
      if (m === 'retpct') t = grandTotals.gl > 0 ? +(grandTotals.gr/grandTotals.gl*100).toFixed(2) : 0;
      else { for (const { sub } of pivotResult.tbl.values()) for (const v of sub.values()) t += getMetricVal(v, m); t = +t.toFixed(2); }
      gtRow.push(t);
    }
    aoa.push(gtRow);
    exportCsv(aoa, `Hero_Pivot_${Date.now()}.csv`);
  }

  const activeMetrics = METRICS.filter(x => metrics.includes(x.key));
  const hasR2       = rowDims.length > 1;
  const hasC2       = colDims.length > 1;
  const multiMetric = activeMetrics.length > 1;
  const allDims     = [...rowDims, ...colDims];
  const unsupported      = new Set(allDims).size < allDims.length;
  const awaitingPipeline = !unsupported && (!rawJoined || rawJoined.length === 0);
  const noData           = !unsupported && !awaitingPipeline && (!pivotResult || pivotResult.tbl.size === 0);

  const selSt = { padding:'6px 10px', fontSize:13, border:'1px solid #CBD5E1', borderRadius:8,
                  background:'#fff', color:'#0f172a', fontFamily:'inherit', cursor:'pointer' };

  const makePill = (dim, onRemove, canRemove) => {
    const label = DIMS.find(d => d.key === dim)?.label || dim;
    return ce('span', { key: dim,
      style:{ display:'inline-flex', alignItems:'center', gap:3, padding:'4px 10px',
              borderRadius:20, fontSize:12, fontWeight:600, background:'#9A3412', color:'#fff' }
    },
      label,
      canRemove && ce('span', {
        onClick: e => { e.stopPropagation(); onRemove(); },
        style:{ marginLeft:2, cursor:'pointer', opacity:0.75, fontSize:15, lineHeight:1 }
      }, '×')
    );
  };

  const addPillBtn = onClick =>
    ce('button', { onClick,
      style:{ padding:'4px 10px', borderRadius:20, fontSize:12, fontWeight:600,
              cursor:'pointer', border:'1.5px dashed #94A3B8',
              background:'#fff', color:'#64748B' }
    }, '+ Add');

  const dimDropdown = (items, onSelect) =>
    ce('div', { style:{ position:'absolute', top:'calc(100% + 4px)', left:0, zIndex:20,
        background:'#fff', border:'1px solid #E2E8F0', borderRadius:8,
        boxShadow:'0 4px 16px rgba(0,0,0,0.12)', minWidth:140, overflow:'hidden' } },
      items.map(d => ce('div', {
        key: d.key, onClick: () => onSelect(d.key),
        style:{ padding:'8px 14px', fontSize:13, cursor:'pointer', color:'#0f172a' },
        onMouseEnter: e => e.currentTarget.style.background = '#F1F5F9',
        onMouseLeave: e => e.currentTarget.style.background = '',
      }, d.label))
    );

  const metricPill = m => {
    const active = metrics.includes(m.key);
    return ce('span', { key: m.key, onClick: () => toggleMetric(m.key),
      style:{ display:'inline-flex', alignItems:'center', padding:'4px 10px',
              borderRadius:20, fontSize:12, fontWeight:600, cursor:'pointer', userSelect:'none',
              border: active ? '1.5px solid #9A3412' : '1.5px solid #CBD5E1',
              background: active ? '#9A3412' : '#fff',
              color: active ? '#fff' : '#475569' }
    }, m.label);
  };

  return ce('div', { style:{ padding:'0 4px' } },

    /* Config bar */
    ce('div', { style:{ display:'flex', gap:14, flexWrap:'wrap', alignItems:'flex-start',
        padding:'16px 18px', background:'#F8FAFC', borderRadius:12,
        border:'1px solid #E2E8F0', marginBottom:14 } },

      /* ROWS */
      ce('div', { style:{ minWidth:80 } },
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Rows'),
        ce('div', { style:{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' } },
          rowDims.map((dim, idx) => makePill(dim, () => removeRowDim(idx), rowDims.length > 1)),
          rowDims.length < 2 &&
            ce('div', { style:{ position:'relative' } },
              addPillBtn(() => setAddRowOpen(o => !o)),
              addRowOpen && dimDropdown(
                DIMS.filter(d => !rowDims.includes(d.key) && !colDims.includes(d.key)),
                addRowDim
              )
            )
        )
      ),

      ce('div', { style:{color:'#CBD5E1',fontSize:22,alignSelf:'center',fontWeight:300,paddingTop:18} }, '×'),

      /* COLUMNS */
      ce('div', { style:{ minWidth:80 } },
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Columns'),
        ce('div', { style:{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' } },
          colDims.map((dim, idx) => makePill(dim, () => removeColDim(idx), colDims.length > 1)),
          colDims.length < 2 &&
            ce('div', { style:{ position:'relative' } },
              addPillBtn(() => setAddColOpen(o => !o)),
              addColOpen && dimDropdown(
                DIMS.filter(d => !colDims.includes(d.key) && !rowDims.includes(d.key)),
                addColDim
              )
            )
        )
      ),

      ce('div', { style:{width:1,height:40,background:'#E2E8F0',alignSelf:'center',marginTop:20} }),

      /* VALUES */
      ce('div', null,
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Values'),
        ce('div', { style:{ display:'flex', gap:6, flexWrap:'wrap' } },
          METRICS.map(metricPill)
        )
      ),

      ce('div', { style:{width:1,height:40,background:'#E2E8F0',alignSelf:'center',marginTop:20} }),

      /* SORT */
      ce('div', null,
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Sort By'),
        ce('select', { value:sortBy, onChange:e=>setSortBy(e.target.value), style:selSt },
          ce('option',{value:'__total__'},'Total'),
          ce('option',{value:'__label__'},'Row Label'),
          ...(!hasC2 ? orderedCols.slice(0,8).map(c => ce('option',{key:c,value:c}, c.length>15?c.slice(0,14)+'…':c)) : [])
        )
      ),

      ce('div', null,
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Order'),
        ce('select', { value:sortDir, onChange:e=>setSortDir(e.target.value), style:selSt },
          ce('option',{value:'desc'},'↓  High → Low'),
          ce('option',{value:'asc' },'↑  Low → High'),
        )
      ),

      ce('div', null,
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Show'),
        ce('select', { value:topN, onChange:e=>setTopN(+e.target.value), style:selSt },
          ce('option',{value:10 },'Top 10'),
          ce('option',{value:20 },'Top 20'),
          ce('option',{value:50 },'Top 50'),
          ce('option',{value:100},'Top 100'),
          ce('option',{value:0  },'All rows'),
        )
      ),

      !unsupported && !noData && !awaitingPipeline &&
        ce('div', { style:{marginLeft:'auto',alignSelf:'flex-end',paddingTop:20,display:'flex',gap:6} },
          onDetailedCsv && ce(DetailedCsvBtn, { onClick:()=>onDetailedCsv('Pivot', null) }),
          ce('button', { onClick: handleExport,
            style:{ padding:'7px 16px', fontSize:12, fontWeight:700, border:'none',
                    borderRadius:8, background:'#EA580C', color:'#fff', cursor:'pointer' }
          }, '↓ Export CSV')
        ),
    ),

    /* click-away overlays for dropdowns */
    (addRowOpen || addColOpen) && ce('div', {
      style:{position:'fixed',inset:0,zIndex:10},
      onClick:()=>{ setAddRowOpen(false); setAddColOpen(false); }
    }),

    /* Unapplied-filter warning */
    unapplied.length > 0 && ce('div', {
      style:{ padding:'7px 14px', background:'#FFF3CD', border:'1px solid #F5A623',
              borderRadius:8, fontSize:12, color:'#92400E', marginBottom:12 }
    }, `⚠  ${unapplied.join(', ')} filter${unapplied.length>1?'s':''} not applied — not a dimension in this matrix.`),

    /* State messages */
    unsupported && ce('div', { style:{ textAlign:'center', padding:50, color:'#94A3B8', fontSize:14 } },
      new Set(allDims).size < allDims.length
        ? 'A dimension cannot appear in both Rows and Columns.'
        : `The combination ${rowDims.map(k=>DIMS.find(d=>d.key===k)?.label||k).join(' + ')} × ${colDims.map(k=>DIMS.find(d=>d.key===k)?.label||k).join(' + ')} is not supported — no matching data matrix.`
    ),

    awaitingPipeline && ce('div', { style:{ textAlign:'center', padding:50, color:'#94A3B8', fontSize:14 } },
      '📦 This combination will be available after the next data sync.'
    ),

    noData && ce('div', { style:{ textAlign:'center', padding:50, color:'#94A3B8', fontSize:14 } },
      'No data matches the current filters.'
    ),

    /* KPI summary bar */
    !unsupported && !awaitingPipeline && !noData && grandTotals.gl > 0 &&
    ce('div', { className:'card', style:{padding:'10px 18px',marginBottom:14,borderTop:'3px solid #EA580C'} },
      ce('div', { style:{display:'flex',flexWrap:'wrap',alignItems:'stretch'} },
        ...[
          { label:'Total Leads', value:Nf(grandTotals.gl), color:'#9A3412' },
          { label:'Retails',     value:Nf(grandTotals.gr), color:'#B91C1C' },
          { label:'L2R%', value:Pf(grandTotals.gl>0?grandTotals.gr/grandTotals.gl*100:0), color:'#D97706' },
          ...(data.rt_cols ? [
            { label:'DMS',      value:Nf(Object.values(grandTotals.colVals).reduce((s,v)=>s+(v[2]||0),0)), color:'#7C3AED' },
            { label:'Call Out', value:Nf(Object.values(grandTotals.colVals).reduce((s,v)=>s+(v[3]||0),0)), color:'#0891B2' },
          ] : []),
          { label:'Rows (shown)', value:String(sortedRows.length),  color:'#475569' },
          { label:'Columns',      value:String(orderedCols.length), color:'#475569' },
        ].map((s,i) => ce('div', { key:i, style:{
          padding:'6px 16px', borderLeft:i>0?'1px solid #E2E8F0':'none',
          display:'flex', flexDirection:'column', gap:2
        }},
          ce('div',{style:{fontSize:9,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap'}},s.label),
          ce('div',{style:{fontSize:15,fontWeight:700,color:s.color,fontFamily:'DM Mono,monospace'}},s.value)
        ))
      )
    ),

    /* Pivot table */
    !unsupported && !awaitingPipeline && !noData &&
    ce('div', { style:{ overflowX:'auto', borderRadius:12, border:'1px solid #E2E8F0' } },
      ce('table', { style:{ width:'100%', borderCollapse:'collapse', fontSize:13 } },

        ce('thead', null, (() => {
          const showOuterRow = hasC2 || multiMetric;
          const showMidRow   = hasC2 && multiMetric;
          const topBg   = '#1D4ED8'; const topTxt  = '#fff';
          const midBg   = '#3B82F6'; const midTxt  = '#fff';
          const botBg   = '#EA580C'; const botTxt  = '#fff';

          const rowLabelTh = (dim, i, bg, txt, small) =>
            ce('th', { key:`rl_${dim}`,
              style:{ padding: small?'6px 16px':'10px 16px', textAlign:'left', fontWeight:700,
                      whiteSpace:'nowrap', color: txt,
                      position: i===0 ? 'sticky' : undefined, left: i===0 ? 0 : undefined,
                      zIndex: i===0 ? 3 : undefined, background: bg,
                      minWidth: i===0 ? 140 : 110,
                      borderRight: i===rowDims.length-1 ? `1px solid ${txt==='#fff'?'rgba(255,255,255,0.15)':'rgba(0,0,0,0.1)'}` : 'none',
                      cursor: i===0 ? 'pointer' : 'default', userSelect:'none' },
              onClick: i===0 ? ()=>{ setSortBy('__label__'); setSortDir(d=>d==='asc'?'desc':'asc'); } : undefined
            }, (DIMS.find(d=>d.key===dim)?.label||dim) + (i===0&&sortBy==='__label__'?(sortDir==='asc'?' ↑':' ↓'):''));

          const rows = [];

          if (showOuterRow) {
            rows.push(ce('tr', { key:'hdr0', style:{ background:topBg } },
              ce('th', { colSpan: rowDims.length,
                style:{ padding:'7px 16px', textAlign:'left', fontWeight:700, color:topTxt,
                        position:'sticky', left:0, zIndex:3, background:topBg,
                        borderRight:'1px solid rgba(0,0,0,0.1)' }
              }, rowDims.map(k=>DIMS.find(d=>d.key===k)?.label||k).join(' → ')),
              ...(hasC2
                ? colGroups.map(({c0, span}, gi) =>
                    ce('th', { key:`cg_${c0}`, colSpan: span * metrics.length,
                      style:{ padding:'7px 12px', textAlign:'center', fontWeight:700, whiteSpace:'nowrap',
                              color:topTxt, background:topBg,
                              borderLeft: gi===0 ? 'none' : '1px solid rgba(0,0,0,0.1)' }
                    }, c0)
                  )
                : orderedCols.map((col, ci) =>
                    ce('th', { key:`cv_${col}`, colSpan: metrics.length,
                      style:{ padding:'7px 12px', textAlign:'center', fontWeight:700, whiteSpace:'nowrap',
                              color:topTxt, background:topBg,
                              borderLeft: ci===0 ? 'none' : '1px solid rgba(0,0,0,0.1)' }
                    }, col)
                  )
              ),
              ce('th', { colSpan: metrics.length,
                style:{ padding:'7px 12px', textAlign:'center', fontWeight:700,
                        color:topTxt, background:topBg,
                        borderLeft:'2px solid rgba(0,0,0,0.15)' }
              }, 'TOTAL')
            ));
          }

          if (showMidRow) {
            rows.push(ce('tr', { key:'hdr1', style:{ background:midBg } },
              ce('th', { colSpan: rowDims.length,
                style:{ padding:'6px 16px', position:'sticky', left:0, zIndex:3, background:midBg,
                        borderRight:'1px solid rgba(0,0,0,0.1)' }
              }, ''),
              ...orderedCols.map((ck, ci) => {
                const c1 = ck.slice(ck.indexOf(COL_SEP) + 1);
                const prevC0 = ci > 0 ? orderedCols[ci-1].slice(0, orderedCols[ci-1].indexOf(COL_SEP)) : null;
                const thisC0 = ck.slice(0, ck.indexOf(COL_SEP));
                return ce('th', { key:`cm_${ck}`, colSpan: metrics.length,
                  style:{ padding:'6px 10px', textAlign:'center', fontWeight:600, whiteSpace:'nowrap',
                          color:midTxt, background:midBg, fontSize:12,
                          borderLeft: (ci===0||thisC0!==prevC0) ? '1px solid rgba(0,0,0,0.1)' : 'none' }
                }, c1);
              }),
              ce('th', { colSpan: metrics.length,
                style:{ padding:'6px 12px', textAlign:'center', fontWeight:700,
                        color:midTxt, background:midBg,
                        borderLeft:'2px solid rgba(0,0,0,0.15)' }
              }, '')
            ));
          }

          // Bottom header row
          rows.push(ce('tr', { key:'hdrBot', style:{ background:botBg } },
            rowDims.map((dim, i) => rowLabelTh(dim, i, botBg, botTxt, showOuterRow)),
            ...(showOuterRow
              ? (hasC2
                  ? orderedCols.flatMap((ck, ci) => {
                      const c1 = ck.slice(ck.indexOf(COL_SEP)+1);
                      const prevC0 = ci>0?orderedCols[ci-1].slice(0,orderedCols[ci-1].indexOf(COL_SEP)):null;
                      const thisC0 = ck.slice(0,ck.indexOf(COL_SEP));
                      return activeMetrics.map((m,mi) => ce('th',{ key:`bh_${ck}_${m.key}`,
                        style:{padding:'8px 10px',textAlign:'center',fontWeight:700,whiteSpace:'nowrap',color:botTxt,background:botBg,fontSize:12,
                               borderLeft:(mi===0&&(ci===0||thisC0!==prevC0))?'1px solid rgba(255,255,255,.15)':'none'} },
                        m.label));
                    })
                  : orderedCols.flatMap((col, ci) =>
                      activeMetrics.map((m,mi) => ce('th',{ key:`bh_${col}_${m.key}`,
                        style:{padding:'8px 10px',textAlign:'center',fontWeight:700,whiteSpace:'nowrap',color:botTxt,background:botBg,fontSize:12,
                               borderLeft:(mi===0&&ci===0)?'none':(mi===0)?'1px solid rgba(255,255,255,.15)':'none'} },
                        m.label))
                    )
              )
              : orderedCols.map((col, ci) => ce('th',{key:`bh_${col}`,
                  style:{padding:'10px 12px',textAlign:'center',fontWeight:700,whiteSpace:'nowrap',color:botTxt,background:botBg,
                         borderLeft:ci===0?'1px solid rgba(255,255,255,.15)':'none',cursor:'pointer',userSelect:'none'},
                  onClick:()=>{ setSortBy(col); setSortDir(d=>d==='asc'?'desc':'asc'); }
                }, col+(sortBy===col?(sortDir==='asc'?' ↑':' ↓'):'')))
            ),
            activeMetrics.map((m,mi) => ce('th',{ key:`tot_${m.key}`,
              style:{padding:'8px 12px',textAlign:'center',fontWeight:700,color:botTxt,background:'#7C2D12',
                     borderLeft:mi===0?'2px solid rgba(255,255,255,.3)':'none',whiteSpace:'nowrap'} },
              activeMetrics.length>1?m.label:'TOTAL'))
          ));

          return rows;
        })()),

        ce('tbody', null,
          sortedRows.map(({ label, entry }, ri) => {
            const isCol = collapsed.has(label);
            const hasCh = hasR2 && entry.children.size > 0;
            return [
              ce('tr', { key:`r_${label}`, style:{ background: ri%2===0?'#fff':'#FFF7ED' } },
                ce('td', {
                  style:{ padding:'8px 16px', fontWeight:hasCh?700:600, position:'sticky', left:0, zIndex:1,
                          background: ri%2===0?'#fff':'#FFF7ED',
                          borderRight:'1px solid #E2E8F0', cursor: hasCh?'pointer':'default',
                          whiteSpace:'nowrap' },
                  onClick: hasCh ? () => { setCollapsed(prev => { const n=new Set(prev); n.has(label)?n.delete(label):n.add(label); return n; }) } : undefined
                }, hasCh ? (isCol?'▶ ':'▼ ')+label : label),
                hasR2 && ce('td',{style:{padding:'8px 12px',fontWeight:600,borderRight:'1px solid #E2E8F0',whiteSpace:'nowrap'}}, hasR2?'Subtotal':''),
                orderedCols.flatMap((ck,ci) =>
                  activeMetrics.map((m,mi) => ce('td',{ key:`${label}_${ck}_${m.key}`,
                    style:{padding:'7px 12px',textAlign:'right',whiteSpace:'nowrap',
                           borderLeft:(mi===0&&ci===0)?'none':(mi===0)?'1px solid #F1F5F9':'none'} },
                    fmtV(entry.sub.get(ck), m.key)))
                ),
                activeMetrics.map((m,mi) => ce('td',{ key:`tot_${label}_${m.key}`,
                  style:{padding:'7px 12px',textAlign:'right',fontWeight:700,background:'#FEF3C7',
                         borderLeft:mi===0?'2px solid #F59E0B':'none',whiteSpace:'nowrap'} },
                  fmtTotal(entry.sub, m.key)))
              ),
              ...(hasCh && !isCol
                ? [...entry.children.entries()].map(([r2Lbl, cMap]) =>
                    ce('tr', { key:`r2_${label}_${r2Lbl}`, style:{ background:'#FFFBEB' } },
                      ce('td',{style:{padding:'6px 16px 6px 28px',color:'#6B7280',position:'sticky',left:0,zIndex:1,background:'#FFFBEB',borderRight:'1px solid #E2E8F0'}},''),
                      ce('td',{style:{padding:'6px 12px',color:'#374151',fontSize:12,borderRight:'1px solid #E2E8F0',whiteSpace:'nowrap'}},r2Lbl),

function AuthGate(){
  var[authState,setAuthState]=useState('loading');
  var[fbUser,setFbUser]=useState(null);
  var[role,setRole]=useState(null);
  var[presence,setPresence]=useState({});
  var[authErr,setAuthErr]=useState('');
  var[authLoading,setAuthLoading]=useState(false);
  var[showAdmin,setShowAdmin]=useState(false);
  var cleanups=React.useRef([]);
  var handledUid=React.useRef(null); // dedup: track last handled uid

  useEffect(function(){
    var auth=getFbAuth();
    var mounted=true;

    function teardown(){
      cleanups.current.forEach(function(f){try{f();}catch(e){}});
      cleanups.current=[];
    }

    function handleUser(user){
      if(!mounted)return;
      if(!user){
        teardown();
        handledUid.current=null;
        if(mounted){setAuthState('unauth');setFbUser(null);setRole(null);setPresence({});}
        return;
      }
      if(handledUid.current===user.uid){return;}
      teardown();
      handledUid.current=user.uid;
      var email=(user.email||'').toLowerCase().trim();
      if(!email||!ALLOWED_DOMAINS.some(function(d){return email.endsWith(d);})){
        var domainErr='Access denied: '+email+' is not from an allowed domain (@girnarsoft.com or @girnarcare.com).';
        if(mounted)setAuthErr(domainErr);
        handledUid.current=null;
        auth.signOut();
        return;
      }
      if(mounted){setFbUser(user);setAuthState('pending');}
      ensureUserDoc(user).catch(function(e){
        console.error('[HERO AUTH] ensureUserDoc failed:',e.code||e.message);
      });
      var presRef=setupPresence(user);
      if(presRef)cleanups.current.push(function(){try{presRef.remove();}catch(e){}});
      var unsubRole=getFbDb().collection(USERS_COL).doc(user.uid).onSnapshot(
        function(snap){
          if(mounted){
            var r=(snap.data()||{}).role||'pending';
            setRole(r);setAuthState(r==='pending'?'pending':'authed');
          }
        },
        function(e){
          if(mounted){
            var fallbackRole=isAdminEmail(user.email)?'admin':'full';
            setRole(fallbackRole);setAuthState('authed');
          }
        }
      );
      cleanups.current.push(unsubRole);
      var _rtdb=getFbRTDB();
      if(_rtdb){
        var presListenRef=_rtdb.ref(PRESENCE_PATH);
        presListenRef.on('value',function(snap){if(mounted)setPresence(snap.val()||{});});
        cleanups.current.push(function(){presListenRef.off();});
      }
    }

    var unsubAuth=auth.onAuthStateChanged(function(user){handleUser(user);});

    return function(){
      mounted=false;
      unsubAuth();
      teardown();
    };
  },[]);

  function handleLogin(){
    setAuthLoading(true);setAuthErr('');
    var provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    getFbAuth().signInWithPopup(provider)
      .catch(function(e){
        var code=e&&e.code||'';
        var msg='Sign-in error ('+code+'): '+e.message;
        if(code==='auth/popup-blocked'){msg='Pop-up was blocked by your browser. Please allow pop-ups for this site and try again.';}
        else if(code==='auth/unauthorized-domain'){msg='This domain is not authorized. Contact the administrator.';}
        setAuthErr(msg);
        setAuthLoading(false);
      });
  }
  function handleSignOut(){
    cleanups.current.forEach(function(f){try{f();}catch(e){}});
    getFbAuth().signOut();
  }

  if(authState==='loading')return ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#6b7280',fontSize:13,fontFamily:'DM Mono,monospace'}},'Authenticating\u2026');
  if(authState==='unauth')return ce(LoginPage,{onLogin:handleLogin,loading:authLoading,error:authErr});
  if(authState==='pending')return ce(PendingPage,{user:fbUser,onSignOut:handleSignOut});
  return ce(React.Fragment,null,
    showAdmin&&ce(AdminPanel,{onClose:function(){setShowAdmin(false);}}),
    ce(App,{fbUser:fbUser,role:role,presence:presence,onSignOut:handleSignOut,onAdminOpen:function(){setShowAdmin(true);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(AuthGate,null));
</script>
</body>
</html>
