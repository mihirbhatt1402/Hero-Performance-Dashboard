<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#EA580C;--red-d:#C2410C;--red-m:#F97316;
  --red-50:#FFF7ED;--red-100:#FFEDD5;--red-200:#FED7AA;
  --navy:#7C2D12;--blue:#9A3412;--blue-m:#C2410C;
  --blue-50:#FFF7ED;--blue-100:#FFEDD5;--blue-200:#FED7AA;
  --gold:#D97706;--gold-light:#FEF3C7;
  --teal:#0D9488;--green:#16A34A;--purple:#7C3AED;
  --paid-clr:#7C3AED;--paid-light:#EDE9FE;
  --org-clr:#059669;--org-light:#D1FAE5;
  --dur-fast:120ms;--dur-base:200ms;
  --shadow-1:0 2px 8px rgba(0,0,0,.08),0 0 0 1px rgba(234,88,12,.10);
  --shadow-card:0 4px 16px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.05)
}
body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
.fade-up{animation:fadeUp .25s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ── KPI cards ── */
.kpi{position:relative;background:#fff;border-radius:14px;padding:16px 18px 14px;box-shadow:var(--shadow-card);overflow:hidden;border:1px solid #E2E8F0}
.kpi-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#64748B;margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:800;color:#0f172a;letter-spacing:-.03em;font-family:'DM Mono',monospace}
.kpi-sub{font-size:10px;color:var(--red);margin-top:4px;font-family:'DM Mono',monospace;font-weight:600}
.card{background:#fff;border-radius:14px;border:1px solid #E2E8F0;box-shadow:var(--shadow-card)}

/* ── Tab nav ── */
.tab-pill{padding:10px 22px;font-size:12px;font-weight:600;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;color:#64748B;transition:all var(--dur-fast);font-family:inherit;white-space:nowrap}
.tab-pill.active{color:var(--red-d);border-bottom-color:var(--red)}
.tab-pill:hover:not(.active){color:#0f172a;background:var(--red-50)}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{padding:9px 12px;font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:linear-gradient(135deg,#7C2D12 0%,#9A3412 100%);text-align:center;border:1px solid rgba(255,255,255,.15);white-space:nowrap;position:sticky;top:0;z-index:2}
th.left{text-align:left}
th.sub{background:linear-gradient(90deg,#9A3412,#EA580C);font-size:8.5px;color:#FED7AA;position:sticky;top:33px;z-index:1;font-weight:600;letter-spacing:.06em;border:1px solid rgba(255,255,255,.15)}
th.grp-toggle{cursor:pointer;user-select:none}
th.grp-toggle:hover{filter:brightness(.94)}
td{padding:7px 12px;border:1px solid #E2E8F0;font-size:11.5px;text-align:center;font-family:'DM Mono',monospace;background:#fff;vertical-align:middle}
td.label{text-align:left;font-family:'Inter',system-ui,sans-serif;font-weight:600;font-size:12px;color:#0f172a;background:#fff;position:sticky;left:0;z-index:1;border-right:2px solid #E2E8F0;white-space:nowrap}
td.sub-label{text-align:left;font-family:'Inter',system-ui,sans-serif;font-weight:500;font-size:11px;color:#475569;background:#FAFAFA;position:sticky;left:0;z-index:1;border-right:2px solid #E2E8F0;padding-left:28px;white-space:nowrap}
tr:hover td{background:#FFF7ED}
tr:hover td.label{background:#FFF7ED}
tr:hover td.sub-label{background:#FFF7ED}
tr.total-row td{background:linear-gradient(90deg,#7C2D12,#9A3412);color:#F0FDF4;font-weight:700;border-color:rgba(255,255,255,.15)}
tr.total-row td.label{background:linear-gradient(90deg,#7C2D12,#9A3412);color:#FED7AA;font-family:'Inter',system-ui,sans-serif}
tr.section-row td{background:#FFF7ED;font-weight:700;color:#C2410C;border-top:2px solid #FED7AA;cursor:pointer}
tr.section-row:hover td{background:#FFEDD5}
tr.sub-row td{background:#FAFAFA}
tr.sub-row:hover td{background:#FFF7ED}
tr.city-row td{background:#F0FDF4}
tr.city-row:hover td{background:#DCFCE7}
tr.dealer-row td{background:#FAFAFA;border-top:none}
tr.dealer-row:hover td{background:#FEF3C7}

/* ── Badges ── */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;font-family:'DM Mono',monospace;white-space:nowrap}
.badge-green{background:#DCFCE7;color:#166534}
.badge-amber{background:#FEF3C7;color:#92400E}
.badge-red{background:#FEE2E2;color:#B91C1C}

/* ── Filter bar ── */

.ms-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid #CBD5E1;border-radius:20px;padding:4px 12px;font-size:11px;font-family:inherit;background:#fff;cursor:pointer;color:#0f172a;box-shadow:0 1px 2px rgba(0,0,0,.04);white-space:nowrap;transition:all var(--dur-fast)}
.ms-btn:hover,.ms-btn.open{border-color:var(--red);background:var(--red-50);color:var(--red-d)}
.ms-btn .ms-count{background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;font-size:9px;font-weight:700}
.ms-dropdown{position:absolute;top:calc(100% + 4px);left:0;min-width:200px;max-width:280px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:500;overflow:hidden}

.ms-option:hover{background:var(--red-50)}

.ms-option.all-opt{font-weight:700;border-bottom:1px solid #F1F5F9;margin-bottom:2px}

/* ── Buttons ── */

.btn-ghost:hover{background:var(--red-50);border-color:var(--red);color:var(--red-d)}

/* ── Misc ── */

.section-title::after{content:'';flex:1;height:1px;background:#E2E8F0}
.err-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:11px;color:#B91C1C;margin-top:8px}
.spinner{width:20px;height:20px;border:2px solid #FFD6DB;border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}

/* ── Auth screens ── */

.auth-card{background:#fff;border-radius:20px;padding:40px 44px;max-width:440px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.auth-logo-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#9A3412,#EA580C);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;font-family:'DM Mono',monospace;letter-spacing:-.04em;flex-shrink:0}
.auth-title{font-size:22px;font-weight:800;color:#0f172a;margin-bottom:4px;letter-spacing:-.03em}
.auth-subtitle{font-size:12px;color:#64748B;margin-bottom:24px;line-height:1.5}
.auth-label{display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.auth-input{width:100%;padding:10px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:13px;font-family:inherit;color:#0f172a;outline:none;transition:border-color 160ms}

.auth-input-wrap{margin-bottom:14px}
.auth-btn{width:100%;padding:12px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:background 160ms;margin-top:4px}
.auth-btn:hover{background:var(--red-d)}

.auth-note{font-size:10px;color:#94A3B8;text-align:center;margin-top:16px;line-height:1.5}
.auth-err{background:#FEE2E2;border:1px solid #FECACA;border-radius:8px;padding:8px 12px;font-size:11px;color:#B91C1C;margin-bottom:12px}
.auth-ok{background:#DCFCE7;border:1px solid #BBF7D0;border-radius:8px;padding:8px 12px;font-size:11px;color:#166534;margin-bottom:12px}
.auth-back{background:none;border:none;color:#94A3B8;font-size:11px;cursor:pointer;font-family:inherit;margin-top:12px;text-decoration:underline;display:block;text-align:center}

/* ── Admin modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:900}
.modal-box{background:#fff;border-radius:16px;padding:28px 32px;max-width:660px;width:94%;max-height:82vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}

.modal-sub{font-size:11px;color:#64748B;margin-bottom:18px}
.req-card{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid #E2E8F0;border-radius:10px;margin-bottom:8px;gap:12px;flex-wrap:wrap}
.req-card-info{flex:1;min-width:0}
.req-card-name{font-size:13px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.req-card-time{font-size:10px;color:#94A3B8;margin-top:2px}
.req-card-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.role-sel{border:1px solid #E2E8F0;border-radius:8px;padding:5px 8px;font-size:11px;font-family:inherit;cursor:pointer;background:#fff}
.btn-approve{background:#DCFCE7;color:#166534;border:1px solid #BBF7D0;border-radius:8px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}

.btn-reject{background:#FEE2E2;color:#B91C1C;border:1px solid #FECACA;border-radius:8px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}

/* ── User avatar chip ── */
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;background:#F1F5F9;border:1px solid #E2E8F0;border-radius:20px;cursor:default}

.user-role-badge{font-size:9px;font-weight:700;padding:1px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}
.role-full{background:#DBEAFE;color:#1D4ED8}

/* ── Hero Firebase Auth / Presence ── */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFF7ED 0%,#FFFBF5 100%);padding:24px}
.auth-screen .auth-card{background:#fff;border-radius:20px;padding:44px 40px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(234,88,12,.15);border:1px solid #FFEDD5}
.auth-screen .auth-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 28px;border-radius:12px;border:1px solid #E2E8F0;background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:#374151;font-family:inherit;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:all .15s}

.avatar:hover .avatar-tip{display:block}

<body>
<div id="root"></div>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   GOOGLE SHEETS SYNC CONFIG — Hero MotoCorp LDR Dashboard
   ════════════════════════════════════════════════════════════════════ */
const HERO_SHEETS_CONFIG = Object.freeze({
  LEADS_URL:  "https://docs.google.com/spreadsheets/d/1MdlYzXsJ1rAZ1PfVDNXE7n8IGaHQuoW25QHh3tq6XRc/edit?gid=1691488845#gid=1691488845",
  RETAIL_URL: "https://docs.google.com/spreadsheets/d/1ZWBlzxX-g2R5iCcrsGUWrqSvxIHcchFHtajDDPcFJgE/edit?gid=0#gid=0",
  AUTO_SYNC_ON_LOAD: true,
});

function sheetUrlToCsvUrl(url){
  const u=(url||'').trim();
  if(!u) throw new Error('Sheet URL is empty.');
  const idM=u.match(/\/spreadsheets\/d\/([a-zA-Z0-9_\-]+)/);
  if(!idM) throw new Error('Not a valid Google Sheets URL.');
  const id=idM[1];
  const gidM=u.match(/[#&?]gid=(\d+)/);
  const gid=gidM?gidM[1]:'0';
  return 'https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&gid='+gid;
}

async function fetchSheetCsv(url){
  const csvUrl=sheetUrlToCsvUrl(url);
  let res;
  try{ res=await fetch(csvUrl,{cache:'no-store'}); }
  catch(e){ throw new Error('Network error ('+e.message+')'); }
  if(!res.ok){
    if(res.status===401||res.status===403) throw new Error('Access denied — share sheet as Anyone → Viewer');
    throw new Error('HTTP '+res.status);
  }
  const text=await res.text();
  if(!text||text.trim().length<5) throw new Error('Sheet returned no data.');
  if(text.trim().startsWith('<')) throw new Error('Sheet returned HTML — share as Anyone → Viewer.');
  return text;
}

function parseCsvToRows(csvText){
  let text=csvText;
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[];
  let row=[],field='',inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQuotes=false;}
      else field+=c;
    } else if(c==='"'){ inQuotes=true; }
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\r'){}
    else if(c==='\n'){ row.push(field); field=''; rows.push(row); row=[]; }
    else field+=c;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return[];
  const headers=rows[0];
  const out=[];
  for(let r=1;r<rows.length;r++){
    const rv=rows[r];
    if(rv.length===1&&rv[0]==='') continue;
    const obj={};
    for(let c=0;c<headers.length;c++) obj[headers[c]]=rv[c]!==undefined?rv[c]:'';
    out.push(obj);
  }
  return out;
}

/* ════════════════════════════════════════════════════════════════════
   INDIA ZONE → STATE MAP  (used for State × Source zone grouping)
   ════════════════════════════════════════════════════════════════════ */
const INDIA_ZONE_STATES = {
  'North':     ['Delhi','Haryana','Himachal Pradesh','Jammu & Kashmir','Jammu and Kashmir','Punjab','Rajasthan','Uttarakhand','Uttar Pradesh','Chandigarh','Ladakh'],
  'West':      ['Goa','Gujarat','Maharashtra','Dadra and Nagar Haveli','Daman and Diu'],
  'South':     ['Andhra Pradesh','Karnataka','Kerala','Tamil Nadu','Telangana','Puducherry','Lakshadweep'],
  'East':      ['Bihar','Jharkhand','Odisha','Orissa','West Bengal','Sikkim'],
  'Central':   ['Chhattisgarh','Madhya Pradesh'],
  'Northeast': ['Assam','Meghalaya','Manipur','Mizoram','Nagaland','Tripura','Arunachal Pradesh'],
};
const STATE_TO_ZONE = {};
for (const [zone, states] of Object.entries(INDIA_ZONE_STATES))
  for (const st of states) STATE_TO_ZONE[st.toLowerCase()] = zone;
function getZone(st) { return STATE_TO_ZONE[(st||'').toLowerCase()] || 'Other'; }

/* ════════════════════════════════════════════════════════════════════
   BUYING DAYS BUCKETS
   ════════════════════════════════════════════════════════════════════ */
const BD_BUCKETS = ['0–7','8–14','15–30','31–60','61–90','90+'];
function bdBucket(days) {
  const d = parseInt(days) || 0;
  if (d <= 7)  return '0–7';
  if (d <= 14) return '8–14';
  if (d <= 30) return '15–30';
  if (d <= 60) return '31–60';
  if (d <= 90) return '61–90';
  return '90+';
}

/* ════════════════════════════════════════════════════════════════════
   SOURCE CLASSIFICATION
   ════════════════════════════════════════════════════════════════════ */
function classifySrc(s) {
  const n = (s || '').toLowerCase();
  if (['adword','google','sem','ppc'].some(p => n.includes(p))) return 'adwords';
  if (['facebook','fb','meta','msfb'].some(p => n.includes(p))) return 'msfb';
  if (['organic'].some(p => n.includes(p))) return 'organic';
  return 'nonms';
}
function buildSrcGroups(srcList) {
  const adw = srcList.filter(s => classifySrc(s) === 'adwords');
  const fb  = srcList.filter(s => classifySrc(s) === 'msfb');
  const org = srcList.filter(s => classifySrc(s) === 'organic');
  const nms = srcList.filter(s => classifySrc(s) === 'nonms');
  const groups = [];
  const paidSrcs = [...adw, ...fb];
  const orgSrcs  = [...org, ...nms];
  if (paidSrcs.length) groups.push({
    id:'paid', label:'PAID', color:'#7C3AED', lightColor:'#EDE9FE', srcs: paidSrcs,
    subGroups: [
      ...(adw.length ? [{ id:'adwords', label:'ADWORDS', color:'#7C3AED', lightColor:'#F3F0FF', srcs: adw }] : []),
      ...(fb.length  ? [{ id:'msfb',    label:'MS FB',   color:'#2563EB', lightColor:'#EFF6FF', srcs: fb  }] : []),
    ]
  });
  if (orgSrcs.length) groups.push({
    id:'organic', label:'ORG+NON MS', color:'#059669', lightColor:'#D1FAE5', srcs: orgSrcs,
    subGroups: [
      ...(org.length ? [{ id:'organic', label:'ORGANIC', color:'#059669', lightColor:'#F0FDF4', srcs: org }] : []),
      ...(nms.length ? [{ id:'nonms',   label:'NON MS',  color:'#0D9488', lightColor:'#CCFBF1', srcs: nms }] : []),
    ]
  });
  return groups;
}

/* ════════════════════════════════════════════════════════════════════
   HERO DATA PARSING — Leads + Retail (Google Sheets) + buildPayload
   ════════════════════════════════════════════════════════════════════ */
const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const STATE_GARBAGE=new Set(['#N/A','\\0','\0','N/A','NA']);
const STATE_FIX={'Jammu & Kashmir':'Jammu and Kashmir','Orissa':'Odisha'};
function canonicalState(s){const t=(s||'').trim();if(!t||STATE_GARBAGE.has(t))return'';return STATE_FIX[t]||t;}
const MODEL_FIX={};
function canonicalModel(s){const t=(s||'').trim();return MODEL_FIX[t]||t;}

function heroMonthOrder(m){
  if(!m||m==='-'||m==='')return 0;
  const match=m.match(/([A-Za-z]+)'(\d+)/);
  if(!match)return 0;
  const mi=MONTH_NAMES.indexOf(match[1]);
  return parseInt(match[2])*12+mi;
}

function normalizeHeroMonth(s){
  if(!s||s==='-')return'';
  s=String(s).trim();
  if(/^[A-Za-z]{3}'\d{4}$/.test(s))return s[0].toUpperCase()+s[1].toLowerCase()+s[2].toLowerCase()+"'"+s.slice(4);
  const m1=s.match(/^([A-Za-z]{3,})\s+(\d{4})$/);
  if(m1){const mi=MONTH_NAMES.findIndex(n=>n.toLowerCase()===m1[1].toLowerCase().slice(0,3));if(mi>=0)return MONTH_NAMES[mi]+"'"+m1[2];}
  const m2=s.match(/^(\d{4})-(\d{2})(?:-\d{2})?/);
  if(m2)return MONTH_NAMES[parseInt(m2[2])-1]+"'"+m2[1];
  const m3=s.match(/^(\d{1,2})[\/\-](\d{4})$/);
  if(m3)return MONTH_NAMES[parseInt(m3[1])-1]+"'"+m3[2];
  const m4=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m4)return MONTH_NAMES[parseInt(m4[2])-1]+"'"+m4[3];
  return s;
}

function parseHeroLeadRows(raw){
  if(!raw.length)return{rows:[],diagnostics:{totalRows:0,uniqueIds:0,dupIds:0}};
  const keyMap={};
  Object.keys(raw[0]).forEach(rk=>{keyMap[rk.toLowerCase().replace(/\s+/g,' ').trim()]=rk;});
  const utmAliases=['utm campaign','campaign','utm_campaign'];
  let utmRawKey=null;
  for(const alias of utmAliases){if(keyMap[alias]){utmRawKey=keyMap[alias];break;}}
  if(!utmRawKey){const found=Object.keys(keyMap).find(k=>k.includes('utm'));if(found)utmRawKey=keyMap[found];}
  function get(r,keys){
    for(const k of(Array.isArray(keys)?keys:[keys])){
      const kl=k.toLowerCase().replace(/\s+/g,' ').trim();
      const rk=keyMap[kl];
      if(rk!==undefined)return String(r[rk]||'').trim();
    }
    return'';
  }
  const rows=raw.map(r=>{
    const opty_id=get(r,['opty_id','opty id','lead id','leadid','lead_id','opportunity id','opportunity_id']);
    const lt=get(r,['lt','lead type','leadtype','lead_type']);
    const source=get(r,['medium','source','lead source','leadsource']);
    const model=get(r,['model','vehicle model','vehiclemodel','bike model']);
    const city=get(r,['city','lead city']);
    const state=get(r,['state','lead state']);
    const dup=get(r,['duplicate check','duplicity check','duplicate','is duplicate','isdup','is_duplicate']);
    const lead_month_raw=get(r,['lead month','lead_month','leadmonth','month']);
    const isUnique=dup?dup.toLowerCase()==='unique':true;
    return{
      opty_id,lt:lt||'Unknown',source:source||'Unknown',
      model:canonicalModel(model)||'Unknown',city:city||'Unknown',state:canonicalState(state)||'Unknown',
      lead_month:normalizeHeroMonth(lead_month_raw),isUnique
    };
  }).filter(r=>r.opty_id&&r.lead_month);
  const uniqueIds=new Set(rows.map(r=>r.opty_id)).size;
  return{rows,diagnostics:{totalRows:raw.length,uniqueIds,dupIds:rows.length-uniqueIds}};
}

function parseHeroRetailRows(raw){
  if(!raw.length)return{rows:[],diagnostics:{totalRows:0,heroRows:0,uniqueIds:0}};
  const keyMap={};
  Object.keys(raw[0]).forEach(rk=>{keyMap[rk.toLowerCase().replace(/\s+/g,' ').trim()]=rk;});
  function get(r,keys){
    for(const k of(Array.isArray(keys)?keys:[keys])){
      const kl=k.toLowerCase().replace(/\s+/g,' ').trim();
      const rk=keyMap[kl];
      if(rk!==undefined)return String(r[rk]||'').trim();
    }
    return'';
  }
  const rows=[];
  for(const r of raw){
    const proc=get(r,['process','brand','oem','manufacturer']);
    if(proc&&proc.toLowerCase()!=='hero')continue;
    const sourceLeadId=get(r,['sourcelead id','sourcelead_id','source lead id','source_lead_id','sourceleadid','lead id','leadid']);
    const performanceMonth=normalizeHeroMonth(get(r,['performance month','performancemonth','performance_month','retail month','retailmonth','month']));
    if(!sourceLeadId||!performanceMonth)continue;
    rows.push({sourceLeadId,performanceMonth});
  }
  const uniqueIds=new Set(rows.map(r=>r.sourceLeadId)).size;
  return{rows,diagnostics:{totalRows:raw.length,heroRows:rows.length,uniqueIds}};
}

function joinHeroData(leadResult,retailResult){
  const{rows:leadRows,diagnostics:leadDiag}=leadResult;
  const{rows:retailRows,diagnostics:retailDiag}=retailResult;
  const retailMap=new Map();
  for(const rr of retailRows){
    if(!retailMap.has(rr.sourceLeadId))retailMap.set(rr.sourceLeadId,[]);
    retailMap.get(rr.sourceLeadId).push(rr);
  }
  let matched=0,unmatched=0,multiRetail=0;
  const joined=leadRows.map(lr=>{
    const retail=retailMap.get(lr.opty_id)||[];
    const isBooked=retail.length>0;
    if(isBooked){matched++;if(retail.length>1)multiRetail++;}else unmatched++;
    const booking_month=isBooked
      ?retail.sort((a,b)=>heroMonthOrder(a.performanceMonth)-heroMonthOrder(b.performanceMonth))[0].performanceMonth
      :'';
    return{opty_id:lr.opty_id,lt:lr.lt,source:lr.source,model:lr.model,city:lr.city,state:lr.state,
      lead_month:lr.lead_month,booking_month,isUnique:lr.isUnique,isBooked};
  });
  return{rows:joined,diagnostics:{
    leadTotalRows:leadDiag.totalRows,leadUniqueIds:leadDiag.uniqueIds,leadDupIds:leadDiag.dupIds,
    retailTotalRows:retailDiag.totalRows,retailHeroRows:retailDiag.heroRows,retailUniqueIds:retailDiag.uniqueIds,
    matched,unmatched,multiRetail}};
}

function HeroDiagnostics({d,visible,onToggle}){
  if(!d)return null;
  const items=[
    {l:'Lead rows',v:d.leadTotalRows},{l:'Unique IDs',v:d.leadUniqueIds},

    {l:'Matched',v:d.matched},{l:'Unmatched',v:d.unmatched},

  return ce('div',{style:{background:'#FFF7ED',borderBottom:'1px solid #FDBA74',padding:'5px 24px',fontSize:10,fontFamily:'DM Mono,monospace',color:'#7C2D12',cursor:'pointer'},onClick:onToggle},
    ce('span',{style:{fontWeight:700,marginRight:8}},'Data:'),

      :ce('span',null,d.leadUniqueIds.toLocaleString('en-IN')+' leads · '+d.retailHeroRows.toLocaleString('en-IN')+' retail · '+d.matched.toLocaleString('en-IN')+' matched ',ce('span',{style:{color:'#EA580C'}},'▼'))
  );
}

/* buildPayload: Hero flat rows → TVS compact matrix format */
function buildPayload(joinedRows){
  const now=Date.now();
  const lmArr=[],lmMap=Object.create(null);
  const srcArr=[],srcMap=Object.create(null);
  const mdlArr=[],mdlMap=Object.create(null);
  const stArr=[],stMap=Object.create(null);
  const ltArr=[],ltMap=Object.create(null);
  const cityArr=[],cityMap=Object.create(null);
  function idx(arr,map,val){if(val in map)return map[val];const i=arr.length;arr.push(val);map[val]=i;return i;}
  for(const r of joinedRows){
    idx(lmArr,lmMap,r.lead_month||'Unknown');
    idx(srcArr,srcMap,r.source||'Unknown');
    idx(mdlArr,mdlMap,r.model||'Unknown');
    idx(stArr,stMap,r.state||'Unknown');
    idx(ltArr,ltMap,r.lt||'Unknown');
    idx(cityArr,cityMap,r.city||'Unknown');
  }
  const city_state=new Array(cityArr.length).fill(0);
  for(const r of joinedRows) city_state[cityMap[r.city||'Unknown']]=stMap[r.state||'Unknown'];

  function isRetailed(r){
    if(!r.isBooked||!r.booking_month||!r.lead_month)return false;
    const d=heroMonthOrder(r.booking_month)-heroMonthOrder(r.lead_month);
    return d>=0&&d<=2;
  }

  const monthlyA=new Map(),smA=new Map(),mmA=new Map(),stmA=new Map(),ltmA=new Map();
  const mxstA=new Map(),cmA=new Map(),csmA=new Map(),cxmA=new Map(),univA=new Map();
  const u_mA=new Map(),u_smA=new Map(),u_mmA=new Map(),u_stmA=new Map(),u_ltmA=new Map();
  const u_mxstA=new Map(),u_cmA=new Map(),u_csmA=new Map(),u_cxmA=new Map(),u_univA=new Map();

  function a2(m,k,L,R){const e=m.get(k);if(e){e[0]+=L;e[1]+=R;}else m.set(k,[L,R]);}
  function a1(m,k,L){const e=m.get(k);if(e){e[0]+=L;}else m.set(k,[L]);}

  for(const r of joinedRows){
    const li=lmMap[r.lead_month||'Unknown'];
    const si=srcMap[r.source||'Unknown'];
    const mi=mdlMap[r.model||'Unknown'];
    const sti=stMap[r.state||'Unknown'];
    const lti=ltMap[r.lt||'Unknown'];
    const ci=cityMap[r.city||'Unknown'];
    const L=1,R=isRetailed(r)?1:0;
    a2(monthlyA,li+'',L,R);
    a2(smA,si+'|'+li,L,R);
    a2(mmA,mi+'|'+si+'|'+li,L,R);
    a2(stmA,sti+'|'+si+'|'+li,L,R);
    a2(ltmA,lti+'|'+si+'|'+li,L,R);
    a1(mxstA,mi+'|'+sti+'|'+li,L);
    a2(cmA,ci+'|'+li,L,R);
    a2(csmA,ci+'|'+si+'|'+li,L,R);
    a2(cxmA,ci+'|'+mi+'|'+li,L,R);
    a2(univA,mi+'|'+si+'|'+sti+'|'+lti+'|'+li,L,R);
    if(r.isUnique){
      a2(u_mA,li+'',L,R);
      a2(u_smA,si+'|'+li,L,R);
      a2(u_mmA,mi+'|'+si+'|'+li,L,R);
      a2(u_stmA,sti+'|'+si+'|'+li,L,R);
      a2(u_ltmA,lti+'|'+si+'|'+li,L,R);
      a1(u_mxstA,mi+'|'+sti+'|'+li,L);
      a2(u_cmA,ci+'|'+li,L,R);
      a2(u_csmA,ci+'|'+si+'|'+li,L,R);
      a2(u_cxmA,ci+'|'+mi+'|'+li,L,R);
      a2(u_univA,mi+'|'+si+'|'+sti+'|'+lti+'|'+li,L,R);
    }
  }
  const f1=m=>[...m.entries()].map(([k,v])=>[+k,v[0],v[1]]);
  const f2=m=>[...m.entries()].map(([k,v])=>{const[a,b]=k.split('|');return[+a,+b,v[0],v[1]];});
  const f3=m=>[...m.entries()].map(([k,v])=>{const[a,b,c]=k.split('|');return[+a,+b,+c,v[0],v[1]];});
  const f3L=m=>[...m.entries()].map(([k,v])=>{const[a,b,c]=k.split('|');return[+a,+b,+c,v[0]];});
  const f5=m=>[...m.entries()].map(([k,v])=>{const[a,b,c,d,e]=k.split('|');return[+a,+b,+c,+d,+e,v[0],v[1]];});
  return{
    t:now,
    maps:{lm:lmArr,src:srcArr,mdl:mdlArr,st:stArr,lt:ltArr,city:cityArr,city_state},
    monthly:f1(monthlyA),sm:f2(smA),mm:f3(mmA),stm:f3(stmA),ltm:f3(ltmA),
    mxst:f3L(mxstA),cm:f2(cmA),csm:f3(csmA),cxm:f3(cxmA),univ:f5(univA),
    u_monthly:f1(u_mA),u_sm:f2(u_smA),u_mm:f3(u_mmA),u_stm:f3(u_stmA),u_ltm:f3(u_ltmA),
    u_mxst:f3L(u_mxstA),u_cm:f2(u_cmA),u_csm:f3(u_csmA),u_cxm:f3(u_cxmA),u_univ:f5(u_univA),
    disp:[],u_disp:[],zm:[],u_zm:[],bdm:[],u_bdm:[],
    mlt:[],stlt:[],cdm:[],cdsm:[],stcm:[],
    u_mlt:[],u_stlt:[],u_cdm:[],u_cdsm:[],u_stcm:[],
    stdm:[],mxdl:[],ltdl:[],u_stdm:[],u_mxdl:[],u_ltdl:[],
    rt_cols:0,
  };
}

/* ════════════════════════════════════════════════════════════════════
   AGGREGATION HELPERS
   ════════════════════════════════════════════════════════════════════ */
const EMPTY = Object.freeze({ l: 0, r: 0, l2r: 0 });

function fin(l, r) { return { l, r, l2r: l > 0 ? r / l * 100 : 0 }; }

/* Aggregate a compact-JSON table for ONE specific month, with optional source filter.
   Returns { grand, grandSrc, dimAggs }
   dimKeyFn(row,maps) → string dim key (or null for src-only tables)
   srcKeyFn(row,maps) → string source name
   monthKeyFn(row,maps) → string month
   extraFilter(row,maps) → bool (optional extra filter e.g. model/state filter)
*/
// makeLR: returns a [l,r] accessor for aggregation rows.
// Old format: [..., L, R]          → getLR(row) = [row[-2], row[-1]]
// New format: [..., L, R_all, R_dms, R_co] (rt_cols=1)
function makeLR(rtCols, RT) {
  if (!rtCols) return row => [row[row.length-2], row[row.length-1]];
  const ri = RT === 'dms' ? 2 : RT === 'co' ? 1 : 3; // distance from end for R
  return row => [row[row.length-4], row[row.length-ri]];
}

function aggMonth(table, maps, month, srcFilter, dimKeyFn, srcKeyFn, monthKeyFn, extraFilter, getLR) {
  const _lr = getLR || (row => [row[row.length-2], row[row.length-1]]);
  const allSrcs = !srcFilter || srcFilter.size === 0;
  const byDim = new Map();
  const bySrc = new Map();
  const byDimSrc = new Map();
  let gL = 0, gR = 0;

  for (const row of table) {
    if (monthKeyFn(row, maps) !== month) continue;
    const src = srcKeyFn ? srcKeyFn(row, maps) : null;
    if (!allSrcs && src && !srcFilter.has(src)) continue;
    if (extraFilter && !extraFilter(row, maps)) continue;
    const [l, r] = _lr(row);
    gL += l; gR += r;

    if (src) { const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c); }
    const dim = dimKeyFn ? dimKeyFn(row, maps) : null;
    if (dim) {
      const c = byDim.get(dim)||[0,0]; c[0]+=l; c[1]+=r; byDim.set(dim,c);
      if (src) {
        const k = dim+'\x00'+src;
        const c2 = byDimSrc.get(k)||[0,0]; c2[0]+=l; c2[1]+=r; byDimSrc.set(k,c2);
      }
    }
  }

  const grandSrc = {};
  for (const [s,v] of bySrc) grandSrc[s] = fin(v[0],v[1]);
  const dimAggs = {};
  for (const [d,dv] of byDim) {
    const srcAgg = {};
    for (const s of bySrc.keys()) {
      const v = byDimSrc.get(d+'\x00'+s);
      srcAgg[s] = v ? fin(v[0],v[1]) : EMPTY;
    }
    dimAggs[d] = { total: fin(dv[0],dv[1]), src: srcAgg };
  }
  return { grand: fin(gL,gR), grandSrc, dimAggs };
}

/* Aggregate across ALL (or selected) months — used for Overview KPIs */
function aggAll(table, maps, monthFilter, srcFilter, dimKeyFn, srcKeyFn, monthKeyFn, extraFilter, getLR) {
  const _lr = getLR || (row => [row[row.length-2], row[row.length-1]]);
  const allMonths = !monthFilter || monthFilter.size === 0;
  const allSrcs   = !srcFilter   || srcFilter.size === 0;
  const byDim = new Map();
  const bySrc = new Map();
  const byDimSrc = new Map();
  let gL = 0, gR = 0;

  for (const row of table) {
    const m = monthKeyFn(row, maps);
    if (!allMonths && !monthFilter.has(m)) continue;
    const src = srcKeyFn ? srcKeyFn(row, maps) : null;
    if (!allSrcs && src && !srcFilter.has(src)) continue;
    if (extraFilter && !extraFilter(row, maps)) continue;
    const [l, r] = _lr(row);
    gL += l; gR += r;

    if (src) { const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c); }
    const dim = dimKeyFn ? dimKeyFn(row, maps) : null;
    if (dim) {
      const c = byDim.get(dim)||[0,0]; c[0]+=l; c[1]+=r; byDim.set(dim,c);
      if (src) {
        const k = dim+'\x00'+src;
        const c2 = byDimSrc.get(k)||[0,0]; c2[0]+=l; c2[1]+=r; byDimSrc.set(k,c2);
      }
    }
  }

  const grandSrc = {};
  for (const [s,v] of bySrc) grandSrc[s] = fin(v[0],v[1]);
  const dimAggs = {};
  for (const [d,dv] of byDim) {
    const srcAgg = {};
    for (const s of bySrc.keys()) {
      const v = byDimSrc.get(d+'\x00'+s);
      srcAgg[s] = v ? fin(v[0],v[1]) : EMPTY;
    }
    dimAggs[d] = { total: fin(dv[0],dv[1]), src: srcAgg };
  }
  return { grand: fin(gL,gR), grandSrc, dimAggs };
}

/* Returns an extraFilter for univ rows [mi,si,sti,tti,li,...] enforcing
   model/state/leadType filters. Returns null when none are active. */
function makeUnivFilter(filters) {
  const allMdl = !filters.models    || filters.models.size    === 0;
  const allSt  = !filters.states    || filters.states.size    === 0;
  const allLT  = !filters.leadTypes || filters.leadTypes.size === 0;
  if (allMdl && allSt && allLT) return null;
  return (row, maps) => {
    if (!allMdl && !filters.models.has(maps.mdl[row[0]]))    return false;
    if (!allSt  && !filters.states.has(maps.st[row[2]]))     return false;
    if (!allLT  && !filters.leadTypes.has(maps.lt[row[3]])) return false;
    return true;
  };
}

function Pf(n, d=1) { return (n == null || isNaN(n) || n===0) ? '—' : n.toFixed(d) + '%'; }

function SummaryBar({ kpis }) {
  if (!kpis || kpis.length === 0) return null;
  return ce('div', {
    style:{ display:'flex', flexWrap:'wrap', alignItems:'center', gap:0,
            background:'#fff', border:'1px solid #BFDBFE', borderLeft:'4px solid #003087',
            borderRadius:8, padding:'7px 14px', marginBottom:14,
            boxShadow:'0 1px 3px rgba(0,48,135,0.07)' }
  },
    ce('span', { style:{ fontSize:9, fontWeight:800, color:'#003087', textTransform:'uppercase',
                         letterSpacing:'.1em', paddingRight:12, marginRight:4, alignSelf:'center',
                         borderRight:'1px solid #BFDBFE', whiteSpace:'nowrap', minWidth:52 } },
      'Summary'),
    kpis.map((k, i) => ce('div', {
      key: i,
      style:{ display:'flex', flexDirection:'column', padding:'2px 12px',
              borderLeft: i > 0 ? '1px solid #F1F5F9' : 'none' }
    },
      ce('span', { style:{ fontSize:9, color:'#64748B', fontWeight:600, textTransform:'uppercase',
                           letterSpacing:'.06em', marginBottom:2, whiteSpace:'nowrap' } }, k.label),
      ce('span', { style:{ fontSize:14, fontWeight:700, color:k.accent||'#0f172a',
                           fontFamily:'DM Mono, monospace', whiteSpace:'nowrap' } }, k.value)
    ))
  );
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthOrder(m) {
  if (!m) return 0;
  const mt = m.match(/([A-Za-z]+)'(\d+)/);
  if (!mt) return 0;
  return parseInt(mt[2]) * 12 + MONTHS.indexOf(mt[1]);
}

function l2rBadge(pct) {
  if (!pct || isNaN(pct) || pct === 0) return ce('span', { className: 'badge-gray' }, '—');
  const cls = pct >= 15 ? 'badge-green' : pct >= 8 ? 'badge-amber' : 'badge-red';
  return ce('span', { className: 'badge ' + cls }, pct.toFixed(1) + '%');
}

function cellClass(pct) {
  if (!pct || pct === 0) return 'cell-nil';
  if (pct >= 15) return 'cell-hot';
  if (pct >= 8)  return 'cell-warm';
  return 'cell-cold';
}

function grpSum(srcMap, srcs) {
  let l = 0, r = 0;
  for (const s of srcs) { const a = srcMap[s] || EMPTY; l += a.l; r += a.r; }
  return fin(l, r);
}

/* ════════════════════════════════════════════════════════════════════
   EXCEL EXPORT
   ════════════════════════════════════════════════════════════════════ */
function exportXlsx(sheetMap, filename) {
  if (!window.XLSX) { alert('XLSX library not loaded'); return; }
  const wb = window.XLSX.utils.book_new();
  for (const [name, aoa] of Object.entries(sheetMap)) {
    const ws = window.XLSX.utils.aoa_to_sheet(aoa);
    const colW = [];
    for (const row of aoa) row.forEach((c, i) => {
      const l = String(c == null ? '' : c).length;
      if (!colW[i] || l > colW[i]) colW[i] = l;
    });
    ws['!cols'] = colW.map(w => ({ wch: Math.min(w + 2, 40) }));
    window.XLSX.utils.book_append_sheet(wb, ws, String(name).slice(0, 31));
  }
  window.XLSX.writeFile(wb, filename + '.xlsx');
}

function ExportBtn({ onClick }) {

/* ════════════════════════════════════════════════════════════════════
   MULTI-SELECT FILTER COMPONENT
   ════════════════════════════════════════════════════════════════════ */

// Sentinel: a frozen Set containing an unmatchable string.
// When used as a filter, aggregation code sees size>0 (not "all") but
// has() returns false for every real option → zero records for that dimension.
const FILTER_CLEARED = Object.freeze(new Set(['\x00']));

const MultiSelect = React.memo(function MultiSelect({ label, options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef();

  useEffect(() => {
    function hdl(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', hdl);
    return () => document.removeEventListener('mousedown', hdl);
  }, []);

  const isClear = selected === FILTER_CLEARED;
  const isAll   = !isClear && (!selected || selected.size === 0);
  const count   = !isClear && selected ? selected.size : 0;

  function toggle(opt) {
    if (isClear) { onChange(new Set([opt])); return; }
    const next = new Set(selected || []);
    if (isAll) {
      options.forEach(o => { if (o !== opt) next.add(o); });
    } else {
      if (next.has(opt)) next.delete(opt); else next.add(opt);
    }
    onChange(next.size === options.length ? new Set() : next);
  }
  function selectAll()  { onChange(new Set()); }
  function clearFilter() { onChange(FILTER_CLEARED); }

  return ce('div', { style: { position:'relative' }, ref },
    ce('button', {
      className: 'ms-btn' + (open ? ' open' : ''),
      onClick: () => setOpen(p => !p)
    },
      label,
      isAll
        ? ce('span', { style:{color:'#94A3B8',fontSize:10} }, 'All ▾')
        : isClear
          ? ce('span', { style:{color:'#64748B',fontSize:10} }, 'None ▾')
          : ce('span', { className:'ms-count' }, count),
      !isAll && !isClear && ce('span', {style:{color:'#94A3B8',fontSize:10}}, '▾')
    ),
    open && ce('div', { className:'ms-dropdown' },
      ce('div', { className:'ms-dropdown-header' },
        ce('span', { style:{fontSize:10,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:'.06em'} }, label),
        ce('div', { style:{display:'flex',gap:8} },
          ce('button', { onClick: selectAll,   style:{fontSize:10,background:'none',border:'none',color:'#EA580C',cursor:'pointer',fontWeight:700} }, 'All'),
          ce('button', { onClick: clearFilter, style:{fontSize:10,background:'none',border:'none',color:'#64748B',cursor:'pointer',fontWeight:700} }, 'Clear')
        )
      ),
      ce('div', { className:'ms-dropdown-list' },
        options.map(opt => ce('label', { key:opt, className:'ms-option' },
          ce('input', {
            type:'checkbox', checked: !isClear && (isAll || selected.has(opt)),
            onChange: () => toggle(opt)
          }),
          ce('span', null, opt)
        ))
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   DIMENSION GRID WITH EXPAND/COLLAPSE SOURCE GROUPS + CONTRIB%
   agg        : { grand, grandSrc, dimAggs }
   srcGroups  : array of { id, label, color, srcs, subGroups }
   dimLabel   : string for the row header column
   expandedGrps : Set of group ids that are expanded
   onToggleGrp : (id) => void
   expandedRows : Set of dim keys where sub-rows are shown (optional)
   subRowsOf   : (dimKey) => array of { label, srcMap } (optional, for LT expand)
   ════════════════════════════════════════════════════════════════════ */
const DimGrid = React.memo(function DimGrid({
  agg, srcGroups, dimLabel, expandedGrps, onToggleGrp,
  expandedRows, onToggleRow, subRowsFn, grandForContrib, noSort, viewerMode, noGroupHeaders
}) {
  if (!agg) return null;
  const { grand, grandSrc, dimAggs } = agg;
  const gL = (grandForContrib || grand).l;

  function contrib(l) { return gL > 0 ? l / gL * 100 : 0; }

  // Flatten expanded groups → visible column list (sub-groups become top-level headers)
  const visibleCols = [];
  for (const grp of srcGroups) {
    if (expandedGrps && expandedGrps.has(grp.id)) {
      const sgs = grp.subGroups.filter(sg => sg.srcs.length > 0);
      if (sgs.length > 0) {
        sgs.forEach((sg, i) => visibleCols.push({
          ...sg,
          borderLeft: i === 0 ? '2px solid ' + grp.color : null,
          parentId: grp.id,
          isChild: true
        }));
      } else {
        visibleCols.push({ ...grp, isChild: false });
      }
    } else {
      visibleCols.push({ ...grp, isChild: false });
    }
  }

  // 4 data cells for one visible column
  function colCells(srcMap, col) {
    const a = grpSum(srcMap, col.srcs);
    const bl = col.borderLeft ? { borderLeft: col.borderLeft } : {};
    return [
      ce('td', { key: col.id+'l', style: bl }, Nf(a.l)),
      ce('td', { key: col.id+'r', style:{ color: col.color, fontWeight:700 } }, Nf(a.r)),
      ce('td', { key: col.id+'c' }, a.l > 0 ? Pf(contrib(a.l)) : '—'),
      ce('td', { key: col.id+'l2r', style:{ color:'#D97706', fontWeight:600 } }, Pf(a.l2r)),
    ];
  }

  function renderRow(label, tot, srcMap, isTotal, isSection, dimKey, isSub) {
    const rowClass = isTotal ? 'total-row' : isSection ? 'section-row' : isSub ? 'sub-row' : '';
    const canExpand = !isTotal && !isSub && expandedRows !== undefined && onToggleRow;
    const isExpanded = canExpand && expandedRows.has(dimKey);
    const tdClass = isSub ? 'sub-label' : 'label';
    const labelContent = canExpand
      ? ce('span', { style:{display:'flex',alignItems:'center',gap:6} },
          ce('span', { style:{fontSize:10,color:'#94A3B8'} }, isExpanded ? '▾' : '▸'),
          label
        )
      : label;
    return ce('tr', {
      className: rowClass, key: label + (isSub ? '_sub' : ''),
      onClick: canExpand ? () => onToggleRow(dimKey) : undefined,
      style: canExpand ? { cursor:'pointer' } : {}
    },
      ce('td', { className: tdClass, style: isTotal ? { color:'#1A237E' } : {} }, labelContent),
      ce('td', { key:'tl' }, Nf(tot.l)),
      ce('td', { key:'tr', style:{ color:'#EA580C', fontWeight:700 } }, Nf(tot.r)),
      ce('td', { key:'tc' }, tot.l > 0 ? Pf(contrib(tot.l)) : '—'),
      ce('td', { key:'tl2r', style:{ color:'#D97706', fontWeight:700 } }, tot.l2r > 0 ? Pf(tot.l2r) : '—'),
      ...(viewerMode ? [] : visibleCols.flatMap(col => colCells(srcMap, col)))
    );
  }

  const dimRows = noSort
    ? Object.entries(dimAggs)
    : Object.entries(dimAggs).sort((a,b) => b[1].total.l - a[1].total.l);

  // Header row 1 — top-level group names (sub-groups shown as peers when parent expanded)
  const hdr1 = [
    ce('th', { key:'dim', className:'left', rowSpan:2, style:{minWidth:160,zIndex:3,background:'#E8EAF6',color:'#1A237E'} }, dimLabel),
    ce('th', { key:'tot', colSpan:4, style:{background:'#E8EAF6',color:'#1A237E'} }, 'TOTAL'),
    ...(viewerMode ? [] : visibleCols.map(col => {
      const hasChildren = !col.isChild && col.subGroups && col.subGroups.filter(sg=>sg.srcs.length>0).length > 1;
      const canToggle = onToggleGrp && (hasChildren || col.isChild);
      const toggleId = col.isChild ? col.parentId : col.id;
      const arrow = hasChildren ? '▾ ' : col.isChild ? '▴ ' : '';
      return ce('th', {
        key: col.id, colSpan: 4,
        className: canToggle ? 'grp-toggle' : '',
        style: {
          background: col.lightColor || '#F3F4F6',
          color: col.color,
          borderTop: '2px solid ' + col.color,
          ...(col.borderLeft ? { borderLeft: col.borderLeft } : {})
        },
        onClick: canToggle ? () => onToggleGrp(toggleId) : undefined
      }, arrow + col.label);
    }))
  ];

  // Header row 2 — always LEADS / RETAIL / CONTRIB% / L2R% per visible col
  const hdr2 = [
    ...(noGroupHeaders ? [ce('th', { key:'dim', className:'left', style:{minWidth:160,zIndex:3,background:'#E8EAF6',color:'#1A237E'} }, dimLabel)] : []),
    ce('th', { key:'tl', className:'sub' }, 'Leads'),
    ce('th', { key:'tr', className:'sub' }, 'Retail'),
    ce('th', { key:'tc', className:'sub' }, 'Contrib%'),
    ce('th', { key:'tl2r', className:'sub' }, 'L2R%'),
    ...(viewerMode ? [] : visibleCols.flatMap(col => [
      ce('th', { key:col.id+'l', className:'sub', style: col.borderLeft ? {borderLeft:col.borderLeft} : {} }, 'Leads'),
      ce('th', { key:col.id+'r', className:'sub' }, 'Retail'),
      ce('th', { key:col.id+'c', className:'sub' }, 'Contrib%'),
      ce('th', { key:col.id+'l2r', className:'sub' }, 'L2R%'),
    ]))
  ];

  const rows = [];

  for (const [dimKey, da] of dimRows) {
    rows.push(renderRow(dimKey, da.total, da.src, false, false, dimKey, false));
    // Sub-rows if this dim is expanded
    if (expandedRows && expandedRows.has(dimKey) && subRowsFn) {
      const subRows = subRowsFn(dimKey, da);
      for (const sr of subRows) {
        rows.push(renderRow(sr.label, sr.tot, sr.srcMap, false, false, null, true));
      }
    }
  }
  rows.push(renderRow('∑ Grand Total', grand, grandSrc, true, false, null, false));

  return ce('div', { className:'scroll-x' },
    ce('table', null,
      ce('thead', null,
        ...(noGroupHeaders ? [] : [ce('tr', null, ...hdr1)]),
        ce('tr', null, ...hdr2),
      ),
      ce('tbody', null, ...rows)
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   MONTHLY GRIDS WRAPPER
   Renders one DimGrid per selected month.
   ════════════════════════════════════════════════════════════════════ */
function MonthlyGrids({ title, months, renderAgg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, noPrefix, viewerMode, noGroupHeaders }) {
  const aggs = useMemo(() => months.map(M => ({ M, agg: renderAgg(M) })), [months, renderAgg]);
  const summaryAgg = useMemo(() => {
    let gL=0, gR=0;
    const gsAcc={}, daAcc={};
    for (const { agg } of aggs) {
      if (!agg || (agg.grand.l===0 && agg.grand.r===0)) continue;
      gL+=agg.grand.l; gR+=agg.grand.r;
      for (const [s,sv] of Object.entries(agg.grandSrc)) {
        if (!gsAcc[s]) gsAcc[s]=[0,0]; gsAcc[s][0]+=sv.l; gsAcc[s][1]+=sv.r;
      }
      for (const [d,da] of Object.entries(agg.dimAggs)) {
        if (!daAcc[d]) daAcc[d]={total:[0,0],src:{}};
        daAcc[d].total[0]+=da.total.l; daAcc[d].total[1]+=da.total.r;
        for (const [s,sv] of Object.entries(da.src)) {
          if (!daAcc[d].src[s]) daAcc[d].src[s]=[0,0];
          daAcc[d].src[s][0]+=sv.l; daAcc[d].src[s][1]+=sv.r;
        }
      }
    }
    if (gL===0) return null;
    const grandSrc={};
    for (const [s,v] of Object.entries(gsAcc)) grandSrc[s]=fin(v[0],v[1]);
    const dimAggs={};
    for (const [d,dv] of Object.entries(daAcc)) {
      const srcAgg={};
      for (const [s,sv] of Object.entries(dv.src)) srcAgg[s]=fin(sv[0],sv[1]);
      dimAggs[d]={total:fin(dv.total[0],dv.total[1]),src:srcAgg};
    }
    return {grand:fin(gL,gR),grandSrc,dimAggs};
  }, [aggs]);
  return ce('div', { className:'fade-up' },
    summaryAgg && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { className:'section-title', style:{marginBottom:10} }, '∑ All Months — Summary'),
      ce(DimGrid, { agg:summaryAgg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, viewerMode, noGroupHeaders })
    ),
    aggs.map(({ M, agg }) => {
      if (!agg || (agg.grand.l === 0 && agg.grand.r === 0)) return null;
      return ce('div', { key: M, className:'card', style:{ padding:'16px 18px', marginBottom:14 } },
        ce('div', { className:'section-title', style:{marginBottom:10} }, noPrefix ? M : (title || dimLabel) + ' — ' + M),
        ce(DimGrid, { agg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, viewerMode, noGroupHeaders })
      );
    })
  );
}

/* ════════════════════════════════════════════════════════════════════
   OVERVIEW TAB
   ════════════════════════════════════════════════════════════════════ */
const OverviewTab = React.memo(function OverviewTab({ data, filters, RT }) {
  const { maps, monthly, sm, cm, mxst, univ: univRaw, csm: csmRaw } = data;
  const csm = csmRaw || [];
  const univ = univRaw || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const chartRef = useRef(); const chartInst = useRef();

  const allSrcs = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const paidGrp = srcGroups.find(g => g.id === 'paid');
  const orgGrp  = srcGroups.find(g => g.id === 'organic');
  const hasCityFilter = filters.cities && filters.cities.size > 0 && cm && maps.city;

  const totals = useMemo(() => {
    const allM = !filters.months || filters.months.size === 0;
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    let gL=0,gR=0,pL=0,pR=0,oL=0,oR=0,dL=0,coL=0;
    if (hasCityFilter) {
      for (const row of cm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[1]];
        if (!allM && !filters.months.has(m)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; }
      }
    } else if (univF) {
      for (const row of univ) {
        const m = maps.lm[row[4]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; }
        if (paidGrp && paidGrp.srcs.includes(src)) { pL+=l; pR+=r; }
        if (orgGrp  && orgGrp.srcs.includes(src))  { oL+=l; oR+=r; }
      }
    } else {
      for (const row of sm) {
        const m = maps.lm[row[1]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[0]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; }
        if (paidGrp && paidGrp.srcs.includes(src)) { pL+=l; pR+=r; }
        if (orgGrp  && orgGrp.srcs.includes(src))  { oL+=l; oR+=r; }
      }
    }
    return { l:gL,r:gR,l2r:gL>0?gR/gL*100:0, pL,pR,pL2r:pL>0?pR/pL*100:0, oL,oR,oL2r:oL>0?oR/oL*100:0, dL, coL };
  }, [sm, univ, cm, maps, filters, paidGrp, orgGrp, hasCityFilter, getLR]);

  const trendData = useMemo(() => {
    const byMonth = new Map();
    const univF = makeUnivFilter(filters);
    if (hasCityFilter) {
      for (const row of cm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[1]];
        const cur = byMonth.get(m) || [0,0];
        const [l,r] = getLR(row); cur[0]+=l; cur[1]+=r; byMonth.set(m, cur);
      }
    } else if (univF) {
      const allM = !filters.months || filters.months.size === 0;
      const allS = !filters.sources || filters.sources.size === 0;
      for (const row of univ) {
        const m = maps.lm[row[4]];
        if (!allM && !filters.months.has(m)) continue;
        if (!allS && !filters.sources.has(maps.src[row[1]])) continue;
        if (!univF(row, maps)) continue;
        const cur = byMonth.get(m) || [0,0];
        const [l,r] = getLR(row); cur[0]+=l; cur[1]+=r; byMonth.set(m, cur);
      }
    } else {
      for (const row of monthly) {
        const m = maps.lm[row[0]];
        const [l,r] = getLR(row); byMonth.set(m, [l, r]);
      }
    }
    return [...byMonth.entries()]
      .sort((a,b) => monthOrder(a[0]) - monthOrder(b[0]))
      .map(([m, v]) => ({ m, l: v[0], r: v[1], l2r: v[0]>0 ? v[1]/v[0]*100 : 0 }));
  }, [monthly, univ, cm, maps, filters, hasCityFilter, getLR]);

  const srcBreak = useMemo(() => {
    const allM = !filters.months || filters.months.size === 0;
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    const bySrc = new Map();
    if (hasCityFilter && !univF && csm.length > 0) {
      // city-only filter: use city×src×month matrix [city,src,lm,l,r,d,c]
      for (const row of csm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[2]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row);
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else {
      const table  = univF ? univ : sm;
      const getSrc = univF ? (row => maps.src[row[1]]) : (row => maps.src[row[0]]);
      const getM   = univF ? (row => maps.lm[row[4]])  : (row => maps.lm[row[1]]);
      for (const row of table) {
        const m = getM(row);
        if (!allM && !filters.months.has(m)) continue;
        const src = getSrc(row);
        if (!allS && !filters.sources.has(src)) continue;
        if (univF && !univF(row, maps)) continue;
        const [l,r] = getLR(row);
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    }
    return [...bySrc.entries()]
      .map(([s,v]) => ({ src:s, l:v[0], r:v[1], l2r:v[0]>0?v[1]/v[0]*100:0 }))
      .sort((a,b) => b.l-a.l);
  }, [sm, csm, univ, maps, filters, getLR, hasCityFilter]);

  const heatData = useMemo(() => {
    const allM   = !filters.months || filters.months.size === 0;
    const allMdl = !filters.models || filters.models.size === 0;
    const allSt  = !filters.states || filters.states.size === 0;
    const allLT  = !filters.leadTypes || filters.leadTypes.size === 0;
    const modelTot = new Map(), stateTot = new Map(), cell = new Map();
    if (!allLT) {
      // leadType filter active — derive from univ (has all 5 dims)
      for (const row of univ) {
        const mdl = maps.mdl[row[0]], st = maps.st[row[2]], m = maps.lm[row[4]];
        const lt  = maps.lt[row[3]];
        if (!allM   && !filters.months.has(m))    continue;
        if (!allMdl && !filters.models.has(mdl))  continue;
        if (!allSt  && !filters.states.has(st))   continue;
        if (!allLT  && !filters.leadTypes.has(lt)) continue;
        const l = getLR(row)[0];
        const k = mdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + l);
        modelTot.set(mdl, (modelTot.get(mdl) || 0) + l);
        stateTot.set(st,  (stateTot.get(st)  || 0) + l);
      }
    } else {
      for (const row of mxst || []) {
        const mdl = maps.mdl[row[0]], st = maps.st[row[1]], m = maps.lm[row[2]], v = row[3];
        if (!allM   && !filters.months.has(m))   continue;
        if (!allMdl && !filters.models.has(mdl)) continue;
        if (!allSt  && !filters.states.has(st))  continue;
        const k = mdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + v);
        modelTot.set(mdl, (modelTot.get(mdl) || 0) + v);
        stateTot.set(st,  (stateTot.get(st)  || 0) + v);
      }
    }
    const top10 = [...modelTot.entries()].sort((a,b) => b[1]-a[1]).map(e=>e[0]);
    const top15 = [...stateTot.entries()].sort((a,b) => b[1]-a[1]).slice(0,15).map(e=>e[0]);
    const maxV  = Math.max(1, ...[...cell.values()]);
    return { cell, top10, top15, maxV };
  }, [mxst, univ, maps, filters, getLR]);

  // Chart
  useEffect(() => {
    const canvas = chartRef.current;
    if (!canvas || !window.Chart) return;
    if (chartInst.current) { try { chartInst.current.destroy(); } catch(e){} }
    chartInst.current = new Chart(canvas, {
      type:'bar',
      data:{
        labels: trendData.map(d => d.m),
        datasets:[
          { label:'Leads',   data:trendData.map(d=>d.l), backgroundColor:'#0030872a', borderColor:'#003087', borderWidth:1.5, borderRadius:3, yAxisID:'y' },
          { label:'Retails', data:trendData.map(d=>d.r), backgroundColor:'#EA580C55', borderColor:'#EA580C', borderWidth:1.5, borderRadius:3, yAxisID:'y' },
          { label:'L2R%',    data:trendData.map(d=>parseFloat(d.l2r.toFixed(2))), type:'line', borderColor:'#F5A623', backgroundColor:'transparent', borderWidth:2.5, pointRadius:5, pointBackgroundColor:'#F5A623', yAxisID:'y2', tension:.3 },
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{position:'top',labels:{boxWidth:10,boxHeight:10,font:{size:10,family:'DM Mono,monospace'},color:'#475569'}},
          tooltip:{backgroundColor:'rgba(11,22,41,.92)',titleColor:'#DBEAFE',bodyColor:'#93C5FD',padding:10,cornerRadius:8},
        },
        scales:{
          x:{grid:{color:'rgba(100,116,139,.1)'},ticks:{color:'#475569',font:{size:10}}},
          y:{grid:{color:'rgba(100,116,139,.1)'},ticks:{color:'#475569',font:{size:10}},position:'left',beginAtZero:true,title:{display:true,text:'Volume',color:'#94a3b8',font:{size:9}}},
          y2:{position:'right',ticks:{color:'#F5A623',font:{size:10},callback:v=>v+'%'},grid:{display:false},title:{display:true,text:'L2R%',color:'#F5A623',font:{size:9}},beginAtZero:true},
        }
      }
    });
    return () => { try { if(chartInst.current) chartInst.current.destroy(); } catch(e){} };
  }, [trendData]);

  const KPIs = [
    { label:'Total Leads',        value:Nf(totals.l),                      sub:'All sources',             color:'#003087' },
    { label:'Total Retails',      value:Nf(totals.r),                      sub:'Converted',               color:'#EA580C' },
    { label:'L2R %',              value:totals.l2r.toFixed(1)+'%',         sub:'Retails ÷ Leads',         color:'#F5A623' },
    { label:'Paid L2R%',          value:totals.pL2r.toFixed(1)+'%',        sub:Nf(totals.pL)+' paid leads',  color:'#7C3AED' },
    { label:'Organic L2R%',       value:totals.oL2r.toFixed(1)+'%',        sub:Nf(totals.oL)+' organic leads', color:'#059669' },
  ];

  return ce('div', { className:'fade-up' },
    ce('div', { style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(175px,1fr))',gap:10,marginBottom:20} },
      KPIs.map((k,i) => ce('div', { key:i, className:'kpi' },
        ce('div', { style:{position:'absolute',top:0,left:0,right:0,height:3,background:k.color,borderRadius:'12px 12px 0 0'} }),
        ce('div', { className:'kpi-label' }, k.label),
        ce('div', { className:'kpi-value', style:{fontSize:k.value.length>7?16:20,color:k.color} }, k.value),
        ce('div', { className:'kpi-sub', style:{color:k.color} }, k.sub)
      ))
    ),
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { className:'section-title' }, 'Month-wise Trend — Leads, Retails & L2R%'),
      ce('div', { style:{height:260,position:'relative'} }, ce('canvas', { ref:chartRef }))
    ),
    totals.l > 0 && ce('div', { className:'card', style:{padding:'10px 18px',marginBottom:14,borderTop:'3px solid #6366F1'} },
      ce('div', { style:{display:'flex',flexWrap:'wrap',alignItems:'stretch'} },
        ...[
          ...(data.rt_cols ? [
            { label:'DMS Retails', value:Nf(totals.dL),  color:'#7C3AED' },
            { label:'Call Out',    value:Nf(totals.coL), color:'#0891B2' },
          ] : []),
          { label:'Paid %',       value:totals.l>0?Pf(totals.pL/totals.l*100):'—', color:'#6366F1' },
          { label:'Organic %',    value:totals.l>0?Pf(totals.oL/totals.l*100):'—', color:'#059669' },
          { label:'Active Sources', value:String(srcBreak.filter(s=>s.l>0).length), color:'#475569' },
          { label:'Models',        value:String(heatData.top10.length),              color:'#475569' },
          { label:'States',        value:String(heatData.top15.length),              color:'#475569' },
        ].map((s,i) => ce('div', { key:i, style:{
          padding:'6px 16px', borderLeft:i>0?'1px solid #E2E8F0':'none',
          display:'flex', flexDirection:'column', gap:2
        }},
          ce('div',{style:{fontSize:9,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap'}},s.label),
          ce('div',{style:{fontSize:15,fontWeight:700,color:s.color,fontFamily:'DM Mono,monospace'}},s.value)
        ))
      )
    ),
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, 'Source Summary'),
        ce(ExportBtn, { onClick:() => {
          const aoa=[['Source','Leads','Retails','Contrib%','L2R%']];
          for (const s of srcBreak) aoa.push([s.src,s.l,s.r,+(s.l/totals.l*100).toFixed(2),+s.l2r.toFixed(2)]);
          aoa.push(['∑ Total',totals.l,totals.r,'100.0%',+totals.l2r.toFixed(2)]);
          exportXlsx({'Source Summary':aoa},'Hero_Overview_Source');
        }})
      ),
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null, ce('tr', null,
            ce('th', { className:'left', style:{minWidth:140} }, 'Source'),
            ce('th', null, 'Leads'),
            ce('th', { style:{background:'#FFEBEE',color:'#B71C1C'} }, 'Retails'),
            ce('th', null, 'Contrib%'),
            ce('th', { style:{background:'#FFF8E1',color:'#E65100'} }, 'L2R%'),
          )),
          ce('tbody', null,
            ...srcBreak.map((s,i) => ce('tr', { key:i },
              ce('td', { className:'label' }, s.src),
              ce('td', null, Nf(s.l)),
              ce('td', { style:{color:'#EA580C',fontWeight:700} }, Nf(s.r)),
              ce('td', null, totals.l > 0 ? Pf(s.l/totals.l*100) : '—'),
              ce('td', { style:{color:'#D97706',fontWeight:600} }, Pf(s.l2r)),
            )),
            ce('tr', { className:'total-row' },
              ce('td', { className:'label' }, '∑ Grand Total'),
              ce('td', null, Nf(totals.l)),
              ce('td', { style:{color:'#EA580C',fontWeight:700} }, Nf(totals.r)),
              ce('td', null, '100.0%'),
              ce('td', null, ce('span', { style:{color:'#D97706',fontWeight:700} }, totals.l2r.toFixed(1)+'%')),
            )
          )
        )
      )
    ),
    heatData.top10.length > 0 && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, '🔥 Model × State — Lead Volume (All Models × Top 15 States)'),
        ce(ExportBtn, { onClick:() => {
          const aoa = [['Model', ...heatData.top15]];
          for (const mdl of heatData.top10) {
            aoa.push([mdl, ...heatData.top15.map(st => heatData.cell.get(mdl+'\x00'+st) || 0)]);
          }
          exportXlsx({'Model×State':aoa}, 'Hero_Model_State_Heatmap');
        }})
      ),
      ce('div', { style:{fontSize:11,color:'#94A3B8',marginBottom:10} }, 'Cell shows lead count. Darker = higher volume. Month / Model / State filters apply.'),
      ce('div', { className:'scroll-x' },
        ce('table', { style:{borderCollapse:'collapse',fontSize:11,fontFamily:'DM Mono,monospace'} },
          ce('thead', null,
            ce('tr', null,
              ce('th', { style:{minWidth:130,textAlign:'left',padding:'4px 8px',background:'#F8FAFC',fontWeight:700,fontSize:11,color:'#475569',borderBottom:'2px solid #E2E8F0',position:'sticky',left:0,zIndex:1} }, 'MODEL  STATE'),
              ...heatData.top15.map(st => ce('th', { key:st, style:{
                padding:'4px 6px', background:'#F8FAFC', fontWeight:600, fontSize:10, color:'#475569',
                borderBottom:'2px solid #E2E8F0', whiteSpace:'nowrap', maxWidth:70,
                writingMode:'vertical-rl', transform:'rotate(180deg)', height:90, verticalAlign:'bottom',
              }}, st))
            )
          ),
          ce('tbody', null,
            ...heatData.top10.map((mdl, ri) => ce('tr', { key:mdl, style:{background: ri%2===0?'#fff':'#F8FAFC'} },
              ce('td', { style:{padding:'5px 8px',fontWeight:700,fontSize:11,color:'#1E293B',borderBottom:'1px solid #F1F5F9',position:'sticky',left:0,background:ri%2===0?'#fff':'#F8FAFC',zIndex:1,whiteSpace:'nowrap'} }, mdl),
              ...heatData.top15.map(st => {

                const color = intensity > 0.55 ? '#fff' : '#1E293B';

                  padding:'5px 8px', textAlign:'right', borderBottom:'1px solid #F1F5F9',
                  background:bg, color, fontWeight: intensity > 0.3 ? 700 : 400,

/* ════════════════════════════════════════════════════════════════════
   SOURCE ANALYSIS TAB
   ════════════════════════════════════════════════════════════════════ */
const SourceTab = React.memo(function SourceTab({ data, filters, months, RT }) {
  const { maps, sm, univ: univRaw, csm: csmRaw } = data;
  const univ = univRaw || [];
  const csm  = csmRaw  || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const hasCityF = !!(filters.cities && filters.cities.size > 0 && maps.city);

  const renderMonth = useCallback((M) => {
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    const bySrc = new Map();
    let gL=0, gR=0;
    if (univF) {
      for (const row of univ) {
        if (maps.lm[row[4]] !== M) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r] = getLR(row);
        gL+=l; gR+=r;
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else if (hasCityF && csm.length > 0) {
      // city-only filter: use city×src×month matrix [city,src,lm,l,r,d,c]
      for (const row of csm) {
        if (maps.lm[row[2]] !== M) continue;
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row);
        gL+=l; gR+=r;
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else {
      for (const row of sm) {
        if (maps.lm[row[1]] !== M) continue;
        const src = maps.src[row[0]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row);
        gL+=l; gR+=r;
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    }
    if (gL === 0 && gR === 0) return null;
    const sorted = [...bySrc.entries()].sort((a,b) => b[1][0]-a[1][0]);
    const grand = fin(gL, gR);
    return ce('div', { key:M, className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { className:'section-title', style:{marginBottom:10} }, M),
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null,
            ce('tr', null,
              ce('th',{className:'left',style:{minWidth:160}},'Source'),
              ce('th',null,'Leads'),
              ce('th',null,'Retail'),
              ce('th',null,'Contrib%'),
              ce('th',null,'L2R%'),
            )
          ),
          ce('tbody', null,
            ...sorted.map(([src,[l,r]]) => {
              const tot = fin(l,r);
              return ce('tr',{key:src},
                ce('td',{className:'label'},src),
                ce('td',null,Nf(tot.l)),
                ce('td',{style:{color:'#EA580C',fontWeight:700}},Nf(tot.r)),
                ce('td',null,gL>0?Pf(tot.l/gL*100):'—'),
                ce('td',{style:{color:'#D97706',fontWeight:700}},tot.l2r>0?Pf(tot.l2r):'—'),
              );
            }),
            ce('tr',{key:'gtotal',className:'total-row'},
              ce('td',{className:'label',style:{color:'#1A237E'}},'∑ Grand Total'),
              ce('td',null,Nf(grand.l)),
              ce('td',{style:{color:'#EA580C',fontWeight:700}},Nf(grand.r)),
              ce('td',null,'100.0%'),
              ce('td',{style:{color:'#D97706',fontWeight:700}},grand.l2r>0?Pf(grand.l2r):'—'),
            )
          )
        )
      )
    );
  }, [sm, csm, univ, maps, filters, getLR, hasCityF]);

  const crossMonthTotals = useMemo(() => {
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    let gL=0, gR=0;
    const mSet = new Set(months);
    const bySrc = new Map();
    if (univF) {
      for (const row of univ) {
        if (!mSet.has(maps.lm[row[4]])) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        const c=bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else if (hasCityF && csm.length > 0) {
      for (const row of csm) {
        if (!mSet.has(maps.lm[row[2]])) continue;
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        const c=bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else {
      for (const row of sm) {
        if (!mSet.has(maps.lm[row[1]])) continue;
        const src = maps.src[row[0]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        const c=bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    }
    const sorted = [...bySrc.entries()].sort((a,b)=>b[1][0]-a[1][0]);
    return { l:gL, r:gR, l2r:gL>0?gR/gL*100:0, sorted };
  }, [sm, csm, univ, maps, filters, getLR, hasCityF, months]);

  return ce('div', {className:'fade-up'},
    crossMonthTotals.l > 0 && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { className:'section-title', style:{marginBottom:10} }, '∑ All Months — Source Summary'),
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null, ce('tr', null,
            ce('th',{className:'left',style:{minWidth:160}},'Source'),
            ce('th',null,'Leads'), ce('th',null,'Retail'),
            ce('th',null,'Contrib%'), ce('th',null,'L2R%'),
          )),
          ce('tbody', null,
            ...crossMonthTotals.sorted.map(([src,[l,r]]) => {
              const tot=fin(l,r);
              return ce('tr',{key:src},
                ce('td',{className:'label'},src),
                ce('td',null,Nf(tot.l)),
                ce('td',{style:{color:'#EA580C',fontWeight:700}},Nf(tot.r)),
                ce('td',null,crossMonthTotals.l>0?Pf(tot.l/crossMonthTotals.l*100):'—'),
                ce('td',{style:{color:'#D97706',fontWeight:700}},tot.l2r>0?Pf(tot.l2r):'—'),
              );
            }),
            ce('tr',{key:'gtotal',className:'total-row'},
              ce('td',{className:'label',style:{color:'#1A237E'}},'∑ Grand Total'),
              ce('td',null,Nf(crossMonthTotals.l)),
              ce('td',{style:{color:'#EA580C',fontWeight:700}},Nf(crossMonthTotals.r)),
              ce('td',null,'100.0%'),
              ce('td',{style:{color:'#D97706',fontWeight:700}},crossMonthTotals.l2r>0?Pf(crossMonthTotals.l2r):'—'),
            )
          )
        )
      )
    ),
    months.map(renderMonth)
  );
});

/* ════════════════════════════════════════════════════════════════════
   LT × SOURCE TAB
   ════════════════════════════════════════════════════════════════════ */
const LTSourceTab = React.memo(function LTSourceTab({ data, filters, months, RT }) {
  const { maps, ltm, univ: univRaw } = data;
  const univ = univRaw || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const allSrcs = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const [expandedGrps, setExpandedGrps] = useState(new Set());
  const onToggleGrp = useCallback(id => setExpandedGrps(prev => {
    const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n;
  }), []);

  const renderAgg = useCallback((M) => {
    const allLT = !filters.leadTypes || filters.leadTypes.size === 0;
    const univF = makeUnivFilter(filters);
    if (univF) {
      return aggMonth(
        univ, maps, M, filters.sources,
        (row,maps) => { const lt=maps.lt[row[3]]; return allLT||filters.leadTypes.has(lt) ? lt : null; },
        (row,maps) => maps.src[row[1]],
        (row,maps) => maps.lm[row[4]],
        univF, getLR
      );
    }
    return aggMonth(
      ltm, maps, M, filters.sources,
      (row,maps) => { const lt=maps.lt[row[0]]; return allLT||filters.leadTypes.has(lt) ? lt : null; },
      (row,maps) => maps.src[row[1]],
      (row,maps) => maps.lm[row[2]],
      null, getLR
    );
  }, [ltm, univ, maps, filters, getLR]);

  return ce('div', { className:'fade-up' },
    ce(MonthlyGrids, { title:'Lead Type × Source', months, renderAgg, srcGroups, dimLabel:'Lead Type',
      expandedGrps, onToggleGrp })
  );
});
