<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════

/* ════════════════════════════════════════════════════════════════════
   HERO FIREBASE CONFIG
   Project: re-ldr-dashboard  |  Collections: re_hero_users  |  RTDB: re_hero_presence

var FIREBASE_CONFIG={
  apiKey:'AIzaSyBgqQZ-0-rDhxZQl4ktt433YGzw-MdWT3Y',
  authDomain:'re-ldr-dashboard.firebaseapp.com',
  databaseURL:'https://re-ldr-dashboard-default-rtdb.firebaseio.com',
  projectId:'re-ldr-dashboard',
  storageBucket:'re-ldr-dashboard.firebasestorage.app',
  messagingSenderId:'327269038709',
  appId:'1:327269038709:web:037032749de4cae0b2d63c',
};
var ADMIN_EMAILS=['mihir.bhatt@girnarsoft.com','aditya.kumar@girnarsoft.com'];
var ALLOWED_DOMAINS=['@girnarsoft.com','@girnarcare.com'];
var USERS_COL='re_hero_users';
var PRESENCE_PATH='re_hero_presence';

var _fbApp=null;
function getFirebase(){
  if(!_fbApp){
    try{_fbApp=firebase.initializeApp(FIREBASE_CONFIG,'re-hero');}
    catch(e){_fbApp=firebase.apps.find(function(a){return a.name==='re-hero';})||firebase.app('re-hero');}
  }
  return _fbApp;
}
function getFbAuth(){return firebase.auth(getFirebase());}
function getFbDb(){return firebase.firestore(getFirebase());}
function getFbRTDB(){return firebase.database(getFirebase());}

function isAdminEmail(email){
  return ADMIN_EMAILS.includes((email||'').toLowerCase());
}
function ensureUserDoc(user){
  var ref=getFbDb().collection(USERS_COL).doc(user.uid);
  var isAdmin=isAdminEmail(user.email);
  return ref.get().then(function(snap){
    if(!snap.exists){
      return ref.set({
        email:user.email,
        displayName:user.displayName||user.email,
        photoURL:user.photoURL||'',
        role:isAdmin?'admin':'pending',
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
    var updates={};
    if(snap.data().email!==user.email) Object.assign(updates,{email:user.email,displayName:user.displayName||user.email,photoURL:user.photoURL||''});
    if(isAdmin&&snap.data().role!=='admin') updates.role='admin';
    if(Object.keys(updates).length) return ref.update(updates);
  });
}
function setupPresence(user){
  var presRef=getFbRTDB().ref(PRESENCE_PATH+'/'+user.uid);
  presRef.set({uid:user.uid,email:user.email,name:user.displayName||user.email,photo:user.photoURL||'',ts:firebase.database.ServerValue.TIMESTAMP});
  presRef.onDisconnect().remove();
  return presRef;
}

/* ════════════════════════════════════════════════════════════════════
   HERO GOOGLE SHEETS DATA CONFIG
   ════════════════════════════════════════════════════════════════════ */
const HERO_LEADS_GID = '1691488845';
const HERO_LEADS_SID = '1MdlYzXsJ1rAZ1PfVDNXE7n8IGaHQuoW25QHh3tq6XRc';
const HERO_RETAIL_GID = '0';
const HERO_RETAIL_SID = '1ZWBlzxX-g2R5iCcrsGUWrqSvxIHcchFHtajDDPcFJgE';
const HERO_CACHE_KEY = 'hero_ldr_v1_cache';

function heroSheetUrl(sid, gid) {
  return 'https://docs.google.com/spreadsheets/d/' + sid + '/gviz/tq?tqx=out:csv&gid=' + gid;
}

async function fetchCsv(url) {
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ' fetching sheet');
  return resp.text();
}

function parseCsv(text) {
  const rows = [];
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) {
        row.push(cur.trim()); cur = '';
      } else cur += c;
    }
    row.push(cur.trim());
    rows.push(row);
  }
  return rows;
}

const HERO_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function normalizeHeroMonth(s) {
  if (!s || s === '-') return '';
  s = String(s).trim();
  if (/^[A-Za-z]{3}'\d{4}$/.test(s)) return s[0].toUpperCase()+s[1].toLowerCase()+s[2].toLowerCase()+"'"+s.slice(4);
  const m1 = s.match(/^([A-Za-z]{3,})\s+(\d{4})$/);
  if (m1) { const mi = HERO_MONTHS.findIndex(n => n.toLowerCase() === m1[1].toLowerCase().slice(0,3)); if (mi >= 0) return HERO_MONTHS[mi]+"'"+m1[2]; }
  const m2 = s.match(/^(\d{4})-(\d{2})(?:-\d{2})?/);
  if (m2) return HERO_MONTHS[parseInt(m2[2])-1]+"'"+m2[1];
  const m3 = s.match(/^(\d{1,2})[\/-](\d{4})$/);
  if (m3) return HERO_MONTHS[parseInt(m3[1])-1]+"'"+m3[2];
  const m4 = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if (m4) return HERO_MONTHS[parseInt(m4[2])-1]+"'"+m4[3];
  return s;
}

function parseHeroLeads(rows) {
  if (!rows.length) return [];
  const hdr = rows[0].map(h => h.toLowerCase().replace(/[\s_]/g,''));
  const fi = name => { const keys = Array.isArray(name) ? name : [name]; for (const k of keys) { const i = hdr.indexOf(k); if (i >= 0) return i; } return -1; };
  const IDX = {
    opty:    fi(['opty_id','optyid','lead_id','leadid']),
    lnum:    fi(['lead_number','leadnumber','leadnumber']),
    lmonth:  fi(['lead_month','leadmonth','createdmonth','month']),
    src:     fi(['source','leadsource','lead_source']),
    subsrc:  fi(['subsource','sub_source','campaign']),
    lt:      fi(['leadtype','lead_type','type']),
    model:   fi(['model','modelname','vehiclemodel']),
    state:   fi(['state','statename']),
    city:    fi(['city','cityname']),
    status:  fi(['status','leadstatus','disposition']),
    unique:  fi(['isunique','is_unique','unique']),
  };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const opty = (IDX.opty >= 0 ? r[IDX.opty] : '').trim();
    if (!opty) continue;
    out.push({
      opty_id:    opty,
      lead_month: normalizeHeroMonth(IDX.lmonth >= 0 ? r[IDX.lmonth] : ''),
      source:     (IDX.src   >= 0 ? r[IDX.src]   : '').trim() || 'Unknown',
      sub_source: (IDX.subsrc>= 0 ? r[IDX.subsrc]: '').trim(),
      lead_type:  (IDX.lt    >= 0 ? r[IDX.lt]    : '').trim() || 'Unknown',
      model:      (IDX.model >= 0 ? r[IDX.model] : '').trim() || 'Unknown',
      state:      (IDX.state >= 0 ? r[IDX.state] : '').trim() || 'Unknown',
      city:       (IDX.city  >= 0 ? r[IDX.city]  : '').trim() || 'Unknown',
      is_unique:  IDX.unique >= 0 ? String(r[IDX.unique]).toLowerCase() !== 'false' : true,
      retail_month: '',
      is_retailed: false,
    });
  }
  return out;
}

function parseHeroRetail(rows) {
  if (!rows.length) return new Map();
  const hdr = rows[0].map(h => h.toLowerCase().replace(/[\s_]/g,''));
  const pidx = hdr.findIndex(h => h === 'process' || h === 'processname');
  const sidx = hdr.findIndex(h => h === 'sourceleadid' || h === 'source_lead_id' || h === 'sourcelead_id');
  const midx = hdr.findIndex(h => h === 'performancemonth' || h === 'performance_month' || h === 'retailmonth');
  const m = new Map();
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (pidx >= 0 && String(r[pidx]||'').trim().toLowerCase() !== 'hero') continue;
    const sid = String(r[sidx]||'').trim();
    if (!sid) continue;
    const mon = normalizeHeroMonth(String(r[midx]||'').trim());
    if (!m.has(sid)) m.set(sid, []);
    m.get(sid).push(mon);
  }
  return m;
}

function buildHeroPayload(leads, retailMap) {
  // ── Index maps ───────────────────────────────────────────────────────────
  const srcArr=[], mdlArr=[], stArr=[], ltArr=[], lmArr=[], cityArr=[];
  const srcIdx={}, mdlIdx={}, stIdx={}, ltIdx={}, lmIdx={}, cityIdx={};
  function ensureIdx(arr, idx, val) {
    if (!(val in idx)) { idx[val] = arr.length; arr.push(val); }
    return idx[val];
  }

  // ── Join leads with retail ────────────────────────────────────────────────
  const joined = leads.map(row => {
    const retail = retailMap.get(row.opty_id);
    if (retail && retail.length) {
      return { ...row, retail_month: retail[retail.length-1], is_retailed: true };
    }
    return row;
  });

  // ── Build index maps from joined data ─────────────────────────────────────
  for (const row of joined) {
    ensureIdx(srcArr, srcIdx, row.source || 'Unknown');
    ensureIdx(mdlArr, mdlIdx, row.model  || 'Unknown');
    ensureIdx(stArr,  stIdx,  row.state  || 'Unknown');
    ensureIdx(ltArr,  ltIdx,  row.lead_type || 'Unknown');
    ensureIdx(cityArr,cityIdx,row.city   || 'Unknown');
    if (row.lead_month) ensureIdx(lmArr, lmIdx, row.lead_month);
  }

  // city_state map
  const cityStateArr = new Array(cityArr.length).fill(-1);
  for (const row of joined) {
    const ci = cityIdx[row.city || 'Unknown'];
    if (cityStateArr[ci] < 0) cityStateArr[ci] = stIdx[row.state || 'Unknown'];
  }

  const maps = { src: srcArr, mdl: mdlArr, st: stArr, lt: ltArr, lm: lmArr, city: cityArr, city_state: cityStateArr };

  // ── Generic matrix builder ────────────────────────────────────────────────
  function buildMat(keyFn, onlyRetailed=false, uniqueOnly=false) {
    const acc = new Map();
    for (const row of joined) {
      if (uniqueOnly && !row.is_unique) continue;
      if (!row.lead_month) continue;
      const key = keyFn(row);
      if (key === null) continue;
      const ks = key.join('|');
      if (!acc.has(ks)) acc.set(ks, { key, l: 0, r: 0 });
      const e = acc.get(ks);
      e.l += 1;
      if (row.is_retailed) e.r += 1;
    }
    return [...acc.values()].map(e => [...e.key, e.l, e.r]);
  }

  function buildMatL(keyFn, uniqueOnly=false) {
    // Leads only, no retail col
    const acc = new Map();
    for (const row of joined) {
      if (uniqueOnly && !row.is_unique) continue;
      if (!row.lead_month) continue;
      const key = keyFn(row);
      if (key === null) continue;
      const ks = key.join('|');
      if (!acc.has(ks)) acc.set(ks, { key, l: 0 });
      acc.get(ks).l += 1;
    }
    return [...acc.values()].map(e => [...e.key, e.l]);
  }

  const r = (u=false) => ({
    monthly: buildMat(row => [lmIdx[row.lead_month]], false, u),
    sm:      buildMat(row => [srcIdx[row.source], lmIdx[row.lead_month]], false, u),
    mm:      buildMat(row => [mdlIdx[row.model], srcIdx[row.source], lmIdx[row.lead_month]], false, u),
    stm:     buildMat(row => [stIdx[row.state],  srcIdx[row.source], lmIdx[row.lead_month]], false, u),
    ltm:     buildMat(row => [ltIdx[row.lead_type], srcIdx[row.source], lmIdx[row.lead_month]], false, u),
    mxst:    buildMatL(row => [mdlIdx[row.model], stIdx[row.state], lmIdx[row.lead_month]], u),
    mlt:     buildMat(row => [mdlIdx[row.model], ltIdx[row.lead_type], lmIdx[row.lead_month]], false, u),
    stlt:    buildMat(row => [stIdx[row.state],  ltIdx[row.lead_type], lmIdx[row.lead_month]], false, u),
    cm:      buildMat(row => [cityIdx[row.city], lmIdx[row.lead_month]], false, u),
    csm:     buildMat(row => [cityIdx[row.city], srcIdx[row.source], lmIdx[row.lead_month]], false, u),
    cxm:     buildMat(row => [cityIdx[row.city], mdlIdx[row.model], lmIdx[row.lead_month]], false, u),
    stcm:    buildMat(row => [stIdx[row.state], cityIdx[row.city], lmIdx[row.lead_month]], false, u),
    univ:    buildMat(row => [mdlIdx[row.model], srcIdx[row.source], stIdx[row.state], ltIdx[row.lead_type], lmIdx[row.lead_month]], false, u),
    cdm: [], cdsm: [], stdm: [], mxdl: [], ltdl: [], bdm: [], zm: [],
  });

  const base = r(false);
  const uniq = r(true);

  // ── Retail Dispersion ─────────────────────────────────────────────────────
  // Row: [enquired_model_idx, purchased_model_idx, lead_month_idx, count]
  const dispAcc = new Map();
  for (const row of joined) {
    if (!row.is_retailed || !row.lead_month) continue;
    const mi = mdlIdx[row.model];
    const lmi = lmIdx[row.lead_month];
    const k = mi + '|' + mi + '|' + lmi;
    dispAcc.set(k, (dispAcc.get(k) || 0) + 1);
  }
  const disp = [...dispAcc.entries()].map(([k, cnt]) => {
    const [ei, pi, lmi] = k.split('|').map(Number);
    return [ei, pi, lmi, cnt];
  });

  return {
    maps,
    t: Date.now(),
    rt_cols: 0,
    disp,
    // base (all leads)
    monthly: base.monthly, sm: base.sm, mm: base.mm, stm: base.stm, ltm: base.ltm,
    mxst: base.mxst, mlt: base.mlt, stlt: base.stlt,
    cm: base.cm, csm: base.csm, cxm: base.cxm, stcm: base.stcm,
    univ: base.univ,
    cdm: [], cdsm: [], stdm: [], mxdl: [], ltdl: [], bdm: [], zm: [],
    // unique-lead versions
    u_monthly: uniq.monthly, u_sm: uniq.sm, u_mm: uniq.mm, u_stm: uniq.stm, u_ltm: uniq.ltm,
    u_mxst: uniq.mxst, u_mlt: uniq.mlt, u_stlt: uniq.stlt,
    u_cm: uniq.cm, u_csm: uniq.csm, u_cxm: uniq.cxm, u_stcm: uniq.stcm,
    u_univ: uniq.univ,
    u_cdm: [], u_cdsm: [], u_stdm: [], u_mxdl: [], u_ltdl: [], u_bdm: [], u_zm: [],
  };
}

async function fetchData() {
  const [leadsCsv, retailCsv] = await Promise.all([
    fetchCsv(heroSheetUrl(HERO_LEADS_SID, HERO_LEADS_GID)),
    fetchCsv(heroSheetUrl(HERO_RETAIL_SID, HERO_RETAIL_GID)),
  ]);
  const leadsRows  = parseCsv(leadsCsv);
  const retailRows = parseCsv(retailCsv);
  const leads      = parseHeroLeads(leadsRows);
  const retailMap  = parseHeroRetail(retailRows);
  if (!leads.length) throw new Error('No lead rows found. Check sheet access and column headers.');
  const payload = buildHeroPayload(leads, retailMap);
  try { localStorage.setItem(HERO_CACHE_KEY + '_t', payload.t); } catch(e) {}
  return payload;
}

function classifySrc(s) {
  const n = (s || '').toLowerCase();
  if (['adword','google','sem','ppc'].some(p => n.includes(p))) return 'adwords';
  if (['facebook','fb','meta','msfb'].some(p => n.includes(p))) return 'msfb';
  if (['organic'].some(p => n.includes(p))) return 'organic';
  return 'nonms';
}
function buildSrcGroups(srcList) {
  const adw = srcList.filter(s => classifySrc(s) === 'adwords');
  const fb  = srcList.filter(s => classifySrc(s) === 'msfb');
  const org = srcList.filter(s => classifySrc(s) === 'organic');
  const nms = srcList.filter(s => classifySrc(s) === 'nonms');
  const groups = [];
  const paidSrcs = [...adw, ...fb];
  const orgSrcs  = [...org, ...nms];
  if (paidSrcs.length) groups.push({
    id:'paid', label:'PAID', color:'#7C3AED', lightColor:'#EDE9FE', srcs: paidSrcs,
    subGroups: [
      ...(adw.length ? [{ id:'adwords', label:'ADWORDS', color:'#7C3AED', lightColor:'#F3F0FF', srcs: adw }] : []),
      ...(fb.length  ? [{ id:'msfb',    label:'MS FB',   color:'#2563EB', lightColor:'#EFF6FF', srcs: fb  }] : []),
    ]
  });
  if (orgSrcs.length) groups.push({
    id:'organic', label:'ORG+NON MS', color:'#059669', lightColor:'#D1FAE5', srcs: orgSrcs,
    subGroups: [
      ...(org.length ? [{ id:'organic', label:'ORGANIC', color:'#059669', lightColor:'#F0FDF4', srcs: org }] : []),
      ...(nms.length ? [{ id:'nonms',   label:'NON MS',  color:'#0D9488', lightColor:'#CCFBF1', srcs: nms }] : []),

/* ════════════════════════════════════════════════════════════════════
   CITY NORMALIZATION
   Runs once on payload load. Merges case variants (DELHI→Delhi) and
   known aliases (New Delhi→Delhi) so every city-based tab, filter,
   and aggregation uses a single canonical city name.
   ════════════════════════════════════════════════════════════════════ */
const CITY_ALIAS = {
  'New Delhi':          'Delhi',
  'Bengaluru':          'Bangalore',
  'Prayagraj':          'Allahabad',
  'Thiruvananthapuram': 'Trivandrum',
};

// Title-case: mirrors Python's str.title() — capitalise any letter that is NOT
// preceded by another letter. Handles spaces, hyphens, parentheses, apostrophes.
// e.g. "PORT-BLAIR" → "Port-Blair", "AMBEDKAR NAGAR" → "Ambedkar Nagar".
function cityTitleCase(s) {
  return s.toLowerCase().replace(/(?<![a-z])([a-z])/g, (_, c) => c.toUpperCase());
}

function canonicalCity(raw) {
  const t = cityTitleCase(raw.trim().replace(/\s+/g, ' '));
  return CITY_ALIAS[t] ?? t;
}

function normalizeCities(data) {
  const { maps } = data;
  if (!maps || !maps.city || maps.city.length === 0) return;

  // Map each old city index to a canonical city index in the new deduped array.
  const newCityArr = [];
  const newCityMap = Object.create(null);    // canonical name → new index
  const remap = new Int32Array(maps.city.length);  // old_idx → new_idx
  for (let i = 0; i < maps.city.length; i++) {
    const c = canonicalCity(maps.city[i]);
    if (!(c in newCityMap)) { newCityMap[c] = newCityArr.length; newCityArr.push(c); }
    remap[i] = newCityMap[c];
  }

  // Rebuild city_state with canonical indexes.
  const newCityState = new Array(newCityArr.length).fill(null);
  if (maps.city_state) {
    for (let i = 0; i < maps.city.length; i++) {
      const ni = remap[i];
      if (newCityState[ni] == null) newCityState[ni] = maps.city_state[i];
    }
  }

  // Remap + merge a city-indexed matrix in place.
  // cityCol: which column holds the city index (0 for most; 1 for stcm)
  // numKeys: total number of key columns (remaining cols are L,R,DMS,CO)
  function remapMatrix(key, cityCol, numKeys) {
    const mat = data[key];
    if (!mat || mat.length === 0) return;
    const acc = new Map();
    for (const row of mat) {
      const newCityI = remap[row[cityCol]];
      // Build a string key from the remapped index columns
      let k = '';
      for (let c = 0; c < numKeys; c++) k += (c === cityCol ? newCityI : row[c]) + '|';
      if (!acc.has(k)) {
        const nr = row.slice();
        nr[cityCol] = newCityI;
        acc.set(k, nr);
      } else {
        const ex = acc.get(k);
        for (let c = numKeys; c < row.length; c++) ex[c] += row[c];
      }
    }
    data[key] = [...acc.values()];
  }

  // All matrices that carry a city index column:
  // [matrixKey, cityCol, numKeyColumns]
  const CITY_MATS = [
    ['cm',    0, 2], ['csm',   0, 3], ['cxm',  0, 3],
    ['stcm',  1, 3], ['cdm',   0, 3], ['cdsm', 0, 4],
    ['u_cm',  0, 2], ['u_csm', 0, 3], ['u_cxm',0, 3],
    ['u_stcm',1, 3], ['u_cdm', 0, 3], ['u_cdsm',0,4],
  ];
  for (const [mk, cc, nk] of CITY_MATS) remapMatrix(mk, cc, nk);

  maps.city       = newCityArr;
  maps.city_state = newCityState;
}

/* ════════════════════════════════════════════════════════════════════
   AGGREGATION HELPERS
   ════════════════════════════════════════════════════════════════════ */
const EMPTY = Object.freeze({ l: 0, r: 0, l2r: 0 });

function fin(l, r) { return { l, r, l2r: l > 0 ? r / l * 100 : 0 }; }

/* Aggregate a compact-JSON table for ONE specific month, with optional source filter.
   Returns { grand, grandSrc, dimAggs }
   dimKeyFn(row,maps) → string dim key (or null for src-only tables)
   srcKeyFn(row,maps) → string source name
   monthKeyFn(row,maps) → string month
   extraFilter(row,maps) → bool (optional extra filter e.g. model/state filter)
*/
// makeLR: returns a [l,r] accessor for aggregation rows.
// Old format: [..., L, R]          → getLR(row) = [row[-2], row[-1]]
// New format: [..., L, R_all, R_dms, R_co] (rt_cols=1)
function makeLR(rtCols, RT) {
  if (!rtCols) return row => [row[row.length-2], row[row.length-1]];
  const ri = RT === 'dms' ? 2 : RT === 'co' ? 1 : 3; // distance from end for R
  return row => [row[row.length-4], row[row.length-ri]];
}

function aggMonth(table, maps, month, srcFilter, dimKeyFn, srcKeyFn, monthKeyFn, extraFilter, getLR) {
  const _lr = getLR || (row => [row[row.length-2], row[row.length-1]]);
  const allSrcs = !srcFilter || srcFilter.size === 0;
  const byDim = new Map();
  const bySrc = new Map();
  const byDimSrc = new Map();
  let gL = 0, gR = 0;

  for (const row of table) {
    if (monthKeyFn(row, maps) !== month) continue;
    const src = srcKeyFn ? srcKeyFn(row, maps) : null;
    if (!allSrcs && src && !srcFilter.has(src)) continue;
    if (extraFilter && !extraFilter(row, maps)) continue;
    const [l, r] = _lr(row);
    gL += l; gR += r;

    if (src) { const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c); }
    const dim = dimKeyFn ? dimKeyFn(row, maps) : null;
    if (dim) {
      const c = byDim.get(dim)||[0,0]; c[0]+=l; c[1]+=r; byDim.set(dim,c);
      if (src) {
        const k = dim+'\x00'+src;
        const c2 = byDimSrc.get(k)||[0,0]; c2[0]+=l; c2[1]+=r; byDimSrc.set(k,c2);
      }
    }
  }

  const grandSrc = {};
  for (const [s,v] of bySrc) grandSrc[s] = fin(v[0],v[1]);
  const dimAggs = {};
  for (const [d,dv] of byDim) {
    const srcAgg = {};
    for (const s of bySrc.keys()) {
      const v = byDimSrc.get(d+'\x00'+s);
      srcAgg[s] = v ? fin(v[0],v[1]) : EMPTY;
    }
    dimAggs[d] = { total: fin(dv[0],dv[1]), src: srcAgg };
  }
  return { grand: fin(gL,gR), grandSrc, dimAggs };
}

/* Aggregate across ALL (or selected) months — used for Overview KPIs */
function aggAll(table, maps, monthFilter, srcFilter, dimKeyFn, srcKeyFn, monthKeyFn, extraFilter, getLR) {
  const _lr = getLR || (row => [row[row.length-2], row[row.length-1]]);
  const allMonths = !monthFilter || monthFilter.size === 0;
  const allSrcs   = !srcFilter   || srcFilter.size === 0;
  const byDim = new Map();
  const bySrc = new Map();
  const byDimSrc = new Map();
  let gL = 0, gR = 0;

  for (const row of table) {
    const m = monthKeyFn(row, maps);
    if (!allMonths && !monthFilter.has(m)) continue;
    const src = srcKeyFn ? srcKeyFn(row, maps) : null;
    if (!allSrcs && src && !srcFilter.has(src)) continue;
    if (extraFilter && !extraFilter(row, maps)) continue;
    const [l, r] = _lr(row);
    gL += l; gR += r;

    if (src) { const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c); }
    const dim = dimKeyFn ? dimKeyFn(row, maps) : null;
    if (dim) {
      const c = byDim.get(dim)||[0,0]; c[0]+=l; c[1]+=r; byDim.set(dim,c);
      if (src) {
        const k = dim+'\x00'+src;
        const c2 = byDimSrc.get(k)||[0,0]; c2[0]+=l; c2[1]+=r; byDimSrc.set(k,c2);
      }
    }
  }

  const grandSrc = {};
  for (const [s,v] of bySrc) grandSrc[s] = fin(v[0],v[1]);
  const dimAggs = {};
  for (const [d,dv] of byDim) {
    const srcAgg = {};
    for (const s of bySrc.keys()) {
      const v = byDimSrc.get(d+'\x00'+s);
      srcAgg[s] = v ? fin(v[0],v[1]) : EMPTY;
    }
    dimAggs[d] = { total: fin(dv[0],dv[1]), src: srcAgg };
  }
  return { grand: fin(gL,gR), grandSrc, dimAggs };
}

/* Returns an extraFilter for univ rows [mi,si,sti,tti,li,...] enforcing
   model/state/leadType filters. Returns null when none are active. */
function makeUnivFilter(filters) {
  const allMdl = !filters.models    || filters.models.size    === 0;
  const allSt  = !filters.states    || filters.states.size    === 0;
  const allLT  = !filters.leadTypes || filters.leadTypes.size === 0;
  if (allMdl && allSt && allLT) return null;
  return (row, maps) => {
    if (!allMdl && !filters.models.has(maps.mdl[row[0]]))    return false;
    if (!allSt  && !filters.states.has(maps.st[row[2]]))     return false;
    if (!allLT  && !filters.leadTypes.has(maps.lt[row[3]])) return false;
    return true;
  };
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthOrder(m) {
  if (!m) return 0;
  const mt = m.match(/([A-Za-z]+)'(\d+)/);
  if (!mt) return 0;
  return parseInt(mt[2]) * 12 + MONTHS.indexOf(mt[1]);
}

function l2rBadge(pct) {
  if (!pct || isNaN(pct) || pct === 0) return ce('span', { className: 'badge-gray' }, '—');
  const cls = pct >= 15 ? 'badge-green' : pct >= 8 ? 'badge-amber' : 'badge-red';
  return ce('span', { className: 'badge ' + cls }, pct.toFixed(1) + '%');
}

function cellClass(pct) {
  if (!pct || pct === 0) return 'cell-nil';
  if (pct >= 15) return 'cell-hot';
  if (pct >= 8)  return 'cell-warm';
  return 'cell-cold';
}

function grpSum(srcMap, srcs) {
  let l = 0, r = 0;
  for (const s of srcs) { const a = srcMap[s] || EMPTY; l += a.l; r += a.r; }
  return fin(l, r);
}

/* ════════════════════════════════════════════════════════════════════
   EXCEL EXPORT
   ════════════════════════════════════════════════════════════════════ */
function exportXlsx(sheetMap, filename) {
  if (!window.XLSX) { alert('XLSX library not loaded'); return; }
  const wb = window.XLSX.utils.book_new();
  for (const [name, aoa] of Object.entries(sheetMap)) {
    const ws = window.XLSX.utils.aoa_to_sheet(aoa);
    const colW = [];
    for (const row of aoa) row.forEach((c, i) => {
      const l = String(c == null ? '' : c).length;
      if (!colW[i] || l > colW[i]) colW[i] = l;
    });
    ws['!cols'] = colW.map(w => ({ wch: Math.min(w + 2, 40) }));
    window.XLSX.utils.book_append_sheet(wb, ws, String(name).slice(0, 31));
  }
  window.XLSX.writeFile(wb, filename + '.xlsx');
}

function ExportBtn({ onClick }) {
  return ce('button', {
    onClick, title: 'Export to Excel',
    style: { padding:'4px 14px', fontSize:10, fontFamily:'inherit', fontWeight:700,
      border:'1px solid #93C5FD', borderRadius:20, background:'#fff',
      color:'#001F5B', cursor:'pointer', display:'inline-flex', alignItems:'center',
      gap:4, whiteSpace:'nowrap' }
  }, '↓ Export Excel');
}

/* ════════════════════════════════════════════════════════════════════
   MULTI-SELECT FILTER COMPONENT
   ════════════════════════════════════════════════════════════════════ */

// Sentinel: a frozen Set containing an unmatchable string.
// When used as a filter, aggregation code sees size>0 (not "all") but
// has() returns false for every real option → zero records for that dimension.
const FILTER_CLEARED = Object.freeze(new Set(['\x00']));

const MultiSelect = React.memo(function MultiSelect({ label, options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef();

  useEffect(() => {
    function hdl(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', hdl);
    return () => document.removeEventListener('mousedown', hdl);
  }, []);

  const isClear = selected === FILTER_CLEARED;
  const isAll   = !isClear && (!selected || selected.size === 0);
  const count   = !isClear && selected ? selected.size : 0;

  function toggle(opt) {
    if (isClear) { onChange(new Set([opt])); return; }
    const next = new Set(selected || []);
    if (isAll) {
      options.forEach(o => { if (o !== opt) next.add(o); });
    } else {
      if (next.has(opt)) next.delete(opt); else next.add(opt);
    }
    onChange(next.size === options.length ? new Set() : next);
  }
  function selectAll()  { onChange(new Set()); }
  function clearFilter() { onChange(FILTER_CLEARED); }

  return ce('div', { style: { position:'relative' }, ref },
    ce('button', {
      className: 'ms-btn' + (open ? ' open' : ''),
      onClick: () => setOpen(p => !p)
    },
      label,
      isAll
        ? ce('span', { style:{color:'#94A3B8',fontSize:10} }, 'All ▾')
        : isClear
          ? ce('span', { style:{color:'#64748B',fontSize:10} }, 'None ▾')
          : ce('span', { className:'ms-count' }, count),
      !isAll && !isClear && ce('span', {style:{color:'#94A3B8',fontSize:10}}, '▾')
    ),
    open && ce('div', { className:'ms-dropdown' },
      ce('div', { className:'ms-dropdown-header' },
        ce('span', { style:{fontSize:10,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:'.06em'} }, label),
        ce('div', { style:{display:'flex',gap:8} },
          ce('button', { onClick: selectAll,   style:{fontSize:10,background:'none',border:'none',color:'#E31837',cursor:'pointer',fontWeight:700} }, 'All'),
          ce('button', { onClick: clearFilter, style:{fontSize:10,background:'none',border:'none',color:'#64748B',cursor:'pointer',fontWeight:700} }, 'Clear')
        )
      ),
      ce('div', { className:'ms-dropdown-list' },
        options.map(opt => ce('label', { key:opt, className:'ms-option' },
          ce('input', {
            type:'checkbox', checked: !isClear && (isAll || selected.has(opt)),
            onChange: () => toggle(opt)
          }),
          ce('span', null, opt)
        ))
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   DIMENSION GRID WITH EXPAND/COLLAPSE SOURCE GROUPS + CONTRIB%
   agg        : { grand, grandSrc, dimAggs }
   srcGroups  : array of { id, label, color, srcs, subGroups }
   dimLabel   : string for the row header column
   expandedGrps : Set of group ids that are expanded
   onToggleGrp : (id) => void
   expandedRows : Set of dim keys where sub-rows are shown (optional)
   subRowsOf   : (dimKey) => array of { label, srcMap } (optional, for LT expand)
   ════════════════════════════════════════════════════════════════════ */
const DimGrid = React.memo(function DimGrid({
  agg, srcGroups, dimLabel, expandedGrps, onToggleGrp,
  expandedRows, onToggleRow, subRowsFn, grandForContrib, noSort, viewerMode, noGroupHeaders
}) {
  if (!agg) return null;
  const { grand, grandSrc, dimAggs } = agg;
  const gL = (grandForContrib || grand).l;

  function contrib(l) { return gL > 0 ? l / gL * 100 : 0; }

  // Flatten expanded groups → visible column list (sub-groups become top-level headers)
  const visibleCols = [];
  for (const grp of srcGroups) {
    if (expandedGrps && expandedGrps.has(grp.id)) {
      const sgs = grp.subGroups.filter(sg => sg.srcs.length > 0);
      if (sgs.length > 0) {
        sgs.forEach((sg, i) => visibleCols.push({
          ...sg,
          borderLeft: i === 0 ? '2px solid ' + grp.color : null,
          parentId: grp.id,
          isChild: true
        }));
      } else {
        visibleCols.push({ ...grp, isChild: false });
      }
    } else {
      visibleCols.push({ ...grp, isChild: false });
    }
  }

  // 4 data cells for one visible column
  function colCells(srcMap, col) {
    const a = grpSum(srcMap, col.srcs);
    const bl = col.borderLeft ? { borderLeft: col.borderLeft } : {};
    return [
      ce('td', { key: col.id+'l', style: bl }, Nf(a.l)),
      ce('td', { key: col.id+'r', style:{ color: col.color, fontWeight:700 } }, Nf(a.r)),
      ce('td', { key: col.id+'c' }, a.l > 0 ? Pf(contrib(a.l)) : '—'),
      ce('td', { key: col.id+'l2r', style:{ color:'#D97706', fontWeight:600 } }, Pf(a.l2r)),
    ];
  }

  function renderRow(label, tot, srcMap, isTotal, isSection, dimKey, isSub) {
    const rowClass = isTotal ? 'total-row' : isSection ? 'section-row' : isSub ? 'sub-row' : '';
    const canExpand = !isTotal && !isSub && expandedRows !== undefined && onToggleRow;
    const isExpanded = canExpand && expandedRows.has(dimKey);
    const tdClass = isSub ? 'sub-label' : 'label';
    const labelContent = canExpand
      ? ce('span', { style:{display:'flex',alignItems:'center',gap:6} },
          ce('span', { style:{fontSize:10,color:'#94A3B8'} }, isExpanded ? '▾' : '▸'),
          label
        )
      : label;
    return ce('tr', {
      className: rowClass, key: label + (isSub ? '_sub' : ''),
      onClick: canExpand ? () => onToggleRow(dimKey) : undefined,
      style: canExpand ? { cursor:'pointer' } : {}
    },
      ce('td', { className: tdClass, style: isTotal ? { color:'#1A237E' } : {} }, labelContent),
      ce('td', { key:'tl' }, Nf(tot.l)),
      ce('td', { key:'tr', style:{ color:'#E31837', fontWeight:700 } }, Nf(tot.r)),
      ce('td', { key:'tc' }, tot.l > 0 ? Pf(contrib(tot.l)) : '—'),
      ce('td', { key:'tl2r', style:{ color:'#D97706', fontWeight:700 } }, tot.l2r > 0 ? Pf(tot.l2r) : '—'),
      ...(viewerMode ? [] : visibleCols.flatMap(col => colCells(srcMap, col)))
    );
  }

  const dimRows = noSort
    ? Object.entries(dimAggs)
    : Object.entries(dimAggs).sort((a,b) => b[1].total.l - a[1].total.l);

  // Header row 1 — top-level group names (sub-groups shown as peers when parent expanded)
  const hdr1 = [
    ce('th', { key:'dim', className:'left', rowSpan:2, style:{minWidth:160,zIndex:3,background:'#E8EAF6',color:'#1A237E'} }, dimLabel),
    ce('th', { key:'tot', colSpan:4, style:{background:'#E8EAF6',color:'#1A237E'} }, 'TOTAL'),
    ...(viewerMode ? [] : visibleCols.map(col => {
      const hasChildren = !col.isChild && col.subGroups && col.subGroups.filter(sg=>sg.srcs.length>0).length > 1;
      const canToggle = onToggleGrp && (hasChildren || col.isChild);
      const toggleId = col.isChild ? col.parentId : col.id;
      const arrow = hasChildren ? '▾ ' : col.isChild ? '▴ ' : '';
      return ce('th', {
        key: col.id, colSpan: 4,
        className: canToggle ? 'grp-toggle' : '',
        style: {
          background: col.lightColor || '#F3F4F6',
          color: col.color,
          borderTop: '2px solid ' + col.color,
          ...(col.borderLeft ? { borderLeft: col.borderLeft } : {})
        },
        onClick: canToggle ? () => onToggleGrp(toggleId) : undefined
      }, arrow + col.label);
    }))
  ];

  // Header row 2 — always LEADS / RETAIL / CONTRIB% / L2R% per visible col
  const hdr2 = [
    ...(noGroupHeaders ? [ce('th', { key:'dim', className:'left', style:{minWidth:160,zIndex:3,background:'#E8EAF6',color:'#1A237E'} }, dimLabel)] : []),
    ce('th', { key:'tl', className:'sub' }, 'Leads'),
    ce('th', { key:'tr', className:'sub' }, 'Retail'),
    ce('th', { key:'tc', className:'sub' }, 'Contrib%'),
    ce('th', { key:'tl2r', className:'sub' }, 'L2R%'),
    ...(viewerMode ? [] : visibleCols.flatMap(col => [
      ce('th', { key:col.id+'l', className:'sub', style: col.borderLeft ? {borderLeft:col.borderLeft} : {} }, 'Leads'),
      ce('th', { key:col.id+'r', className:'sub' }, 'Retail'),
      ce('th', { key:col.id+'c', className:'sub' }, 'Contrib%'),
      ce('th', { key:col.id+'l2r', className:'sub' }, 'L2R%'),
    ]))
  ];

  const rows = [];

  for (const [dimKey, da] of dimRows) {
    rows.push(renderRow(dimKey, da.total, da.src, false, false, dimKey, false));
    // Sub-rows if this dim is expanded
    if (expandedRows && expandedRows.has(dimKey) && subRowsFn) {
      const subRows = subRowsFn(dimKey, da);
      for (const sr of subRows) {
        rows.push(renderRow(sr.label, sr.tot, sr.srcMap, false, false, null, true));
      }
    }
  }
  rows.push(renderRow('∑ Grand Total', grand, grandSrc, true, false, null, false));

  return ce('div', { className:'scroll-x' },
    ce('table', null,
      ce('thead', null,
        ...(noGroupHeaders ? [] : [ce('tr', null, ...hdr1)]),
        ce('tr', null, ...hdr2),
      ),
      ce('tbody', null, ...rows)
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   MONTHLY GRIDS WRAPPER
   Renders one DimGrid per selected month.
   ════════════════════════════════════════════════════════════════════ */
function MonthlyGrids({ title, months, renderAgg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, noPrefix, viewerMode, noGroupHeaders }) {
  const aggs = useMemo(() => months.map(M => ({ M, agg: renderAgg(M) })), [months, renderAgg]);
  const summaryAgg = useMemo(() => {
    let gL=0, gR=0;
    const gsAcc={}, daAcc={};
    for (const { agg } of aggs) {
      if (!agg || (agg.grand.l===0 && agg.grand.r===0)) continue;
      gL+=agg.grand.l; gR+=agg.grand.r;
      for (const [s,sv] of Object.entries(agg.grandSrc)) {
        if (!gsAcc[s]) gsAcc[s]=[0,0]; gsAcc[s][0]+=sv.l; gsAcc[s][1]+=sv.r;
      }
      for (const [d,da] of Object.entries(agg.dimAggs)) {
        if (!daAcc[d]) daAcc[d]={total:[0,0],src:{}};
        daAcc[d].total[0]+=da.total.l; daAcc[d].total[1]+=da.total.r;
        for (const [s,sv] of Object.entries(da.src)) {
          if (!daAcc[d].src[s]) daAcc[d].src[s]=[0,0];
          daAcc[d].src[s][0]+=sv.l; daAcc[d].src[s][1]+=sv.r;
        }
      }
    }
    if (gL===0) return null;
    const grandSrc={};
    for (const [s,v] of Object.entries(gsAcc)) grandSrc[s]=fin(v[0],v[1]);
    const dimAggs={};
    for (const [d,dv] of Object.entries(daAcc)) {
      const srcAgg={};
      for (const [s,sv] of Object.entries(dv.src)) srcAgg[s]=fin(sv[0],sv[1]);
      dimAggs[d]={total:fin(dv.total[0],dv.total[1]),src:srcAgg};
    }
    return {grand:fin(gL,gR),grandSrc,dimAggs};
  }, [aggs]);
  return ce('div', { className:'fade-up' },
    summaryAgg && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { className:'section-title', style:{marginBottom:10} }, '∑ All Months — Summary'),
      ce(DimGrid, { agg:summaryAgg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, viewerMode, noGroupHeaders })
    ),
    aggs.map(({ M, agg }) => {
      if (!agg || (agg.grand.l === 0 && agg.grand.r === 0)) return null;
      return ce('div', { key: M, className:'card', style:{ padding:'16px 18px', marginBottom:14 } },
        ce('div', { className:'section-title', style:{marginBottom:10} }, noPrefix ? M : (title || dimLabel) + ' — ' + M),
        ce(DimGrid, { agg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, viewerMode, noGroupHeaders })
      );
    })
  );
}

/* ════════════════════════════════════════════════════════════════════
   OVERVIEW TAB
   ════════════════════════════════════════════════════════════════════ */
const OverviewTab = React.memo(function OverviewTab({ data, filters, RT }) {
  const { maps, monthly, sm, cm, mxst, univ: univRaw, csm: csmRaw } = data;
  const csm = csmRaw || [];
  const univ = univRaw || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const chartRef = useRef(); const chartInst = useRef();

  const allSrcs = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const paidGrp = srcGroups.find(g => g.id === 'paid');
  const orgGrp  = srcGroups.find(g => g.id === 'organic');
  const hasCityFilter = filters.cities && filters.cities.size > 0 && cm && maps.city;

  const totals = useMemo(() => {
    const allM = !filters.months || filters.months.size === 0;
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    let gL=0,gR=0,pL=0,pR=0,oL=0,oR=0,dL=0,coL=0;
    if (hasCityFilter) {
      for (const row of cm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[1]];
        if (!allM && !filters.months.has(m)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; }
      }
    } else if (univF) {
      for (const row of univ) {
        const m = maps.lm[row[4]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; }
        if (paidGrp && paidGrp.srcs.includes(src)) { pL+=l; pR+=r; }
        if (orgGrp  && orgGrp.srcs.includes(src))  { oL+=l; oR+=r; }
      }
    } else {
      for (const row of sm) {
        const m = maps.lm[row[1]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[0]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; }
        if (paidGrp && paidGrp.srcs.includes(src)) { pL+=l; pR+=r; }
        if (orgGrp  && orgGrp.srcs.includes(src))  { oL+=l; oR+=r; }
      }
    }
    return { l:gL,r:gR,l2r:gL>0?gR/gL*100:0, pL,pR,pL2r:pL>0?pR/pL*100:0, oL,oR,oL2r:oL>0?oR/oL*100:0, dL, coL };
  }, [sm, univ, cm, maps, filters, paidGrp, orgGrp, hasCityFilter, getLR]);

  const trendData = useMemo(() => {
    const byMonth = new Map();
    const univF = makeUnivFilter(filters);
    if (hasCityFilter) {
      for (const row of cm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[1]];
        const cur = byMonth.get(m) || [0,0];
        const [l,r] = getLR(row); cur[0]+=l; cur[1]+=r; byMonth.set(m, cur);
      }
    } else if (univF) {
      const allM = !filters.months || filters.months.size === 0;
      const allS = !filters.sources || filters.sources.size === 0;
      for (const row of univ) {
        const m = maps.lm[row[4]];
        if (!allM && !filters.months.has(m)) continue;
        if (!allS && !filters.sources.has(maps.src[row[1]])) continue;
        if (!univF(row, maps)) continue;
        const cur = byMonth.get(m) || [0,0];
        const [l,r] = getLR(row); cur[0]+=l; cur[1]+=r; byMonth.set(m, cur);
      }
    } else {
      for (const row of monthly) {
        const m = maps.lm[row[0]];
        const [l,r] = getLR(row); byMonth.set(m, [l, r]);
      }
    }
    return [...byMonth.entries()]
      .sort((a,b) => monthOrder(a[0]) - monthOrder(b[0]))
      .map(([m, v]) => ({ m, l: v[0], r: v[1], l2r: v[0]>0 ? v[1]/v[0]*100 : 0 }));
  }, [monthly, univ, cm, maps, filters, hasCityFilter, getLR]);

  const srcBreak = useMemo(() => {
    const allM = !filters.months || filters.months.size === 0;
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    const bySrc = new Map();
    if (hasCityFilter && !univF && csm.length > 0) {
      // city-only filter: use city×src×month matrix [city,src,lm,l,r,d,c]
      for (const row of csm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[2]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row);
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else {
      const table  = univF ? univ : sm;
      const getSrc = univF ? (row => maps.src[row[1]]) : (row => maps.src[row[0]]);
      const getM   = univF ? (row => maps.lm[row[4]])  : (row => maps.lm[row[1]]);
      for (const row of table) {
        const m = getM(row);
        if (!allM && !filters.months.has(m)) continue;
        const src = getSrc(row);
        if (!allS && !filters.sources.has(src)) continue;
        if (univF && !univF(row, maps)) continue;
        const [l,r] = getLR(row);
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    }
    return [...bySrc.entries()]
      .map(([s,v]) => ({ src:s, l:v[0], r:v[1], l2r:v[0]>0?v[1]/v[0]*100:0 }))
      .sort((a,b) => b.l-a.l);
  }, [sm, csm, univ, maps, filters, getLR, hasCityFilter]);

  const heatData = useMemo(() => {
    const allM   = !filters.months || filters.months.size === 0;
    const allMdl = !filters.models || filters.models.size === 0;
    const allSt  = !filters.states || filters.states.size === 0;
    const allLT  = !filters.leadTypes || filters.leadTypes.size === 0;
    const modelTot = new Map(), stateTot = new Map(), cell = new Map();
    if (!allLT) {
      // leadType filter active — derive from univ (has all 5 dims)
      for (const row of univ) {
        const mdl = maps.mdl[row[0]], st = maps.st[row[2]], m = maps.lm[row[4]];
        const lt  = maps.lt[row[3]];
        if (!allM   && !filters.months.has(m))    continue;
        if (!allMdl && !filters.models.has(mdl))  continue;
        if (!allSt  && !filters.states.has(st))   continue;
        if (!allLT  && !filters.leadTypes.has(lt)) continue;
        const l = getLR(row)[0];
        const k = mdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + l);
        modelTot.set(mdl, (modelTot.get(mdl) || 0) + l);
        stateTot.set(st,  (stateTot.get(st)  || 0) + l);
      }
    } else {
      for (const row of mxst || []) {
        const mdl = maps.mdl[row[0]], st = maps.st[row[1]], m = maps.lm[row[2]], v = row[3];
        if (!allM   && !filters.months.has(m))   continue;
        if (!allMdl && !filters.models.has(mdl)) continue;
        if (!allSt  && !filters.states.has(st))  continue;
        const k = mdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + v);
        modelTot.set(mdl, (modelTot.get(mdl) || 0) + v);
        stateTot.set(st,  (stateTot.get(st)  || 0) + v);
      }
    }
    const top10 = [...modelTot.entries()].sort((a,b) => b[1]-a[1]).map(e=>e[0]);
    const top15 = [...stateTot.entries()].sort((a,b) => b[1]-a[1]).slice(0,15).map(e=>e[0]);
    const maxV  = Math.max(1, ...[...cell.values()]);
    return { cell, top10, top15, maxV };
  }, [mxst, univ, maps, filters, getLR]);

  useEffect(() => {

        }
      }
    });
    return () => { try { if(chartInst.current) chartInst.current.destroy(); } catch(e){} };
  }, [trendData]);

  const KPIs = [
    { label:'Total Leads',        value:Nf(totals.l),                      sub:'All sources',             color:'#003087' },

    { label:'Organic L2R%',       value:totals.oL2r.toFixed(1)+'%',        sub:Nf(totals.oL)+' organic leads', color:'#059669' },
  ];

  return ce('div', { className:'fade-up' },
    ce('div', { style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(175px,1fr))',gap:10,marginBottom:20} },
      KPIs.map((k,i) => ce('div', { key:i, className:'kpi' },
        ce('div', { style:{position:'absolute',top:0,left:0,right:0,height:3,background:k.color,borderRadius:'12px 12px 0 0'} }),
        ce('div', { className:'kpi-label' }, k.label),

        ce('div', { className:'kpi-sub', style:{color:k.color} }, k.sub)
      ))
    ),
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { className:'section-title' }, 'Month-wise Trend — Leads, Retails & L2R%'),
      ce('div', { style:{height:260,position:'relative'} }, ce('canvas', { ref:chartRef }))
    ),
    totals.l > 0 && ce('div', { className:'card', style:{padding:'10px 18px',marginBottom:14,borderTop:'3px solid #6366F1'} },
      ce('div', { style:{display:'flex',flexWrap:'wrap',alignItems:'stretch'} },
        ...[
          ...(data.rt_cols ? [
            { label:'DMS Retails', value:Nf(totals.dL),  color:'#7C3AED' },
            { label:'Call Out',    value:Nf(totals.coL), color:'#0891B2' },
          ] : []),
          { label:'Paid %',       value:totals.l>0?Pf(totals.pL/totals.l*100):'—', color:'#6366F1' },
          { label:'Organic %',    value:totals.l>0?Pf(totals.oL/totals.l*100):'—', color:'#059669' },
          { label:'Active Sources', value:String(srcBreak.filter(s=>s.l>0).length), color:'#475569' },
          { label:'Models',        value:String(heatData.top10.length),              color:'#475569' },

        ].map((s,i) => ce('div', { key:i, style:{

/* ════════════════════════════════════════════════════════════════════
   SOURCE ANALYSIS TAB
   ════════════════════════════════════════════════════════════════════ */
const SourceTab = React.memo(function SourceTab({ data, filters, months, RT }) {
  const { maps, sm, univ: univRaw, csm: csmRaw } = data;
  const univ = univRaw || [];
  const csm  = csmRaw  || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const hasCityF = !!(filters.cities && filters.cities.size > 0 && maps.city);

  const renderMonth = useCallback((M) => {
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    const bySrc = new Map();
    let gL=0, gR=0;
    if (univF) {
      for (const row of univ) {
        if (maps.lm[row[4]] !== M) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r] = getLR(row);
        gL+=l; gR+=r;
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else if (hasCityF && csm.length > 0) {
      // city-only filter: use city×src×month matrix [city,src,lm,l,r,d,c]
      for (const row of csm) {
        if (maps.lm[row[2]] !== M) continue;
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row);
        gL+=l; gR+=r;
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else {
      for (const row of sm) {
        if (maps.lm[row[1]] !== M) continue;
        const src = maps.src[row[0]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row);
        gL+=l; gR+=r;
        const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    }
    if (gL === 0 && gR === 0) return null;
    const sorted = [...bySrc.entries()].sort((a,b) => b[1][0]-a[1][0]);
    const grand = fin(gL, gR);
    return ce('div', { key:M, className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { className:'section-title', style:{marginBottom:10} }, M),
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null,
            ce('tr', null,
              ce('th',{className:'left',style:{minWidth:160}},'Source'),
              ce('th',null,'Leads'),
              ce('th',null,'Retail'),
              ce('th',null,'Contrib%'),
              ce('th',null,'L2R%'),
            )
          ),
          ce('tbody', null,
            ...sorted.map(([src,[l,r]]) => {
              const tot = fin(l,r);
              return ce('tr',{key:src},
                ce('td',{className:'label'},src),
                ce('td',null,Nf(tot.l)),
                ce('td',{style:{color:'#E31837',fontWeight:700}},Nf(tot.r)),
                ce('td',null,gL>0?Pf(tot.l/gL*100):'—'),
                ce('td',{style:{color:'#D97706',fontWeight:700}},tot.l2r>0?Pf(tot.l2r):'—'),
              );
            }),
            ce('tr',{key:'gtotal',className:'total-row'},
              ce('td',{className:'label',style:{color:'#1A237E'}},'∑ Grand Total'),
              ce('td',null,Nf(grand.l)),
              ce('td',{style:{color:'#E31837',fontWeight:700}},Nf(grand.r)),
              ce('td',null,'100.0%'),
              ce('td',{style:{color:'#D97706',fontWeight:700}},grand.l2r>0?Pf(grand.l2r):'—'),
            )
          )
        )
      )
    );
  }, [sm, csm, univ, maps, filters, getLR, hasCityF]);

  const crossMonthTotals = useMemo(() => {
    const allS = !filters.sources || filters.sources.size === 0;
    const univF = makeUnivFilter(filters);
    let gL=0, gR=0;
    const mSet = new Set(months);
    const bySrc = new Map();
    if (univF) {
      for (const row of univ) {
        if (!mSet.has(maps.lm[row[4]])) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        const c=bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else if (hasCityF && csm.length > 0) {
      for (const row of csm) {
        if (!mSet.has(maps.lm[row[2]])) continue;
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        const c=bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    } else {
      for (const row of sm) {
        if (!mSet.has(maps.lm[row[1]])) continue;
        const src = maps.src[row[0]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row); gL+=l; gR+=r;
        const c=bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c);
      }
    }
    const sorted = [...bySrc.entries()].sort((a,b)=>b[1][0]-a[1][0]);
    return { l:gL, r:gR, l2r:gL>0?gR/gL*100:0, sorted };
  }, [sm, csm, univ, maps, filters, getLR, hasCityF, months]);

  return ce('div', {className:'fade-up'},
    crossMonthTotals.l > 0 && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { className:'section-title', style:{marginBottom:10} }, '∑ All Months — Source Summary'),
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null, ce('tr', null,
            ce('th',{className:'left',style:{minWidth:160}},'Source'),
            ce('th',null,'Leads'), ce('th',null,'Retail'),
            ce('th',null,'Contrib%'), ce('th',null,'L2R%'),
          )),
          ce('tbody', null,
            ...crossMonthTotals.sorted.map(([src,[l,r]]) => {
              const tot=fin(l,r);
              return ce('tr',{key:src},
                ce('td',{className:'label'},src),
                ce('td',null,Nf(tot.l)),
                ce('td',{style:{color:'#E31837',fontWeight:700}},Nf(tot.r)),
                ce('td',null,crossMonthTotals.l>0?Pf(tot.l/crossMonthTotals.l*100):'—'),
                ce('td',{style:{color:'#D97706',fontWeight:700}},tot.l2r>0?Pf(tot.l2r):'—'),
              );
            }),
            ce('tr',{key:'gtotal',className:'total-row'},
              ce('td',{className:'label',style:{color:'#1A237E'}},'∑ Grand Total'),
              ce('td',null,Nf(crossMonthTotals.l)),
              ce('td',{style:{color:'#E31837',fontWeight:700}},Nf(crossMonthTotals.r)),
              ce('td',null,'100.0%'),
              ce('td',{style:{color:'#D97706',fontWeight:700}},crossMonthTotals.l2r>0?Pf(crossMonthTotals.l2r):'—'),
            )
          )
        )
      )
    ),
    months.map(renderMonth)
  );
});

/* ════════════════════════════════════════════════════════════════════

const LTSourceTab = React.memo(function LTSourceTab({ data, filters, months, RT }) {

/* ════════════════════════════════════════════════════════════════════
   STATE × SOURCE TAB  (Zone → State → City → Dealer drill-down)
   ════════════════════════════════════════════════════════════════════ */
const StateSourceTab = React.memo(function StateSourceTab({ data, filters, months, RT, viewerMode }) {
  const { maps, stm, univ: univRaw } = data;
  const univ = univRaw || [];
  const cm        = data.cm   || [];
  const cdm       = data.cdm  || [];
  const csm_data  = data.csm  || [];
  const cdsm_data = data.cdsm || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const hasCities    = !!(maps.city && maps.city_state && cm.length > 0);
  const hasDealers   = !!(maps.dl && cdm.length > 0);
  const hasCitySrc   = csm_data.length > 0;
  const hasDealerSrc = cdsm_data.length > 0;

  const allSrcs   = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const [expandedGrps, setExpandedGrps] = useState(new Set());
  const onToggleGrp = useCallback(id => setExpandedGrps(prev => {
    const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n;
  }), []);

  // Exclusive accordion — only one node open per level
  const [openZone,  setOpenZone]  = useState(null);
  const [openState, setOpenState] = useState(null);
  const [openCity,  setOpenCity]  = useState(null);

  const onClickZone  = useCallback(z => { setOpenZone(p => p===z?null:z); setOpenState(null); setOpenCity(null); }, []);
  const onClickState = useCallback(s => { setOpenState(p => p===s?null:s); setOpenCity(null); }, []);
  const onClickCity  = useCallback(c => { setOpenCity(p => p===c?null:c); }, []);

  // Precompute city → index reverse map (O(1) lookup vs indexOf)
  const cityIndexMap = useMemo(() => {
    if (!maps.city) return new Map();
    return new Map(maps.city.map((c,i) => [c,i]));
  }, [maps.city]);

  const renderMonthGrid = useCallback((M) => {
    const allSrcF  = !filters.sources || filters.sources.size === 0;
    const allStateF = !filters.states  || filters.states.size  === 0;
    // Normalize mixed-case state names (e.g. "DELHI" → "Delhi") so duplicates merge
    const normSt = s => (s||'').split(/\s+/).map(w => w ? w[0].toUpperCase()+w.slice(1).toLowerCase() : w).join(' ') || 'Unknown';

    // ── State × Source totals ──
    const stateData = new Map(); // state → { total:[l,r], byS: Map<src,[l,r]> }
    let gL=0, gR=0;
    const grandSrcMap = new Map();
    const univF = makeUnivFilter(filters);

    const hasCityF = !!(filters.cities && filters.cities.size > 0 && maps.city && maps.city_state);
    if (univF) {
      // model or leadType filter active — derive state totals from univ
      for (const row of univ) {
        if (maps.lm[row[4]] !== M) continue;
        const state = normSt(maps.st[row[2]]);
        if (!allStateF && !filters.states.has(state)) continue;
        const src = maps.src[row[1]];
        if (!allSrcF && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r]=getLR(row);
        gL+=l; gR+=r;
        if (!stateData.has(state)) stateData.set(state, { total:[0,0], byS:new Map() });
        const sd = stateData.get(state);
        sd.total[0]+=l; sd.total[1]+=r;
        const c = sd.byS.get(src)||[0,0]; c[0]+=l; c[1]+=r; sd.byS.set(src,c);
        const gc = grandSrcMap.get(src)||[0,0]; gc[0]+=l; gc[1]+=r; grandSrcMap.set(src,gc);
      }
    } else if (hasCityF && csm_data.length > 0) {
      // city-only filter: use city×src×month [city,src,lm,l,r,d,c], group by state
      for (const row of csm_data) {
        if (maps.lm[row[2]] !== M) continue;
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const sti = maps.city_state[row[0]];
        if (sti == null) continue;
        const state = normSt(maps.st[sti]);
        if (!allStateF && !filters.states.has(state)) continue;
        const src = maps.src[row[1]];
        if (!allSrcF && !filters.sources.has(src)) continue;
        const [l,r]=getLR(row);
        gL+=l; gR+=r;
        if (!stateData.has(state)) stateData.set(state, { total:[0,0], byS:new Map() });
        const sd = stateData.get(state);
        sd.total[0]+=l; sd.total[1]+=r;
        const c = sd.byS.get(src)||[0,0]; c[0]+=l; c[1]+=r; sd.byS.set(src,c);
        const gc = grandSrcMap.get(src)||[0,0]; gc[0]+=l; gc[1]+=r; grandSrcMap.set(src,gc);
      }
    } else {
      for (const row of stm) {
        if (maps.lm[row[2]] !== M) continue;
        const state = normSt(maps.st[row[0]]);
        if (!allStateF && !filters.states.has(state)) continue;
        const src = maps.src[row[1]];
        if (!allSrcF && !filters.sources.has(src)) continue;
        const [l,r]=getLR(row);
        gL+=l; gR+=r;
        if (!stateData.has(state)) stateData.set(state, { total:[0,0], byS:new Map() });
        const sd = stateData.get(state);
        sd.total[0]+=l; sd.total[1]+=r;
        const c = sd.byS.get(src)||[0,0]; c[0]+=l; c[1]+=r; sd.byS.set(src,c);
        const gc = grandSrcMap.get(src)||[0,0]; gc[0]+=l; gc[1]+=r; grandSrcMap.set(src,gc);
      }
    }

    // ── City totals for the open state (from cm + city_state map) ──
    const cityData = new Map(); // city → [l,r]
    const hasCityFlt = !!(filters.cities && filters.cities.size > 0 && maps.city);
    if (openState && hasCities) {
      for (const row of cm) {
        if (maps.lm[row[1]] !== M) continue;
        const cti = row[0];
        const sti = maps.city_state[cti];
        if (sti == null || maps.st[sti] !== openState) continue;
        const city = maps.city[cti];
        if (hasCityFlt && !filters.cities.has(city)) continue;
        const cur = cityData.get(city)||[0,0];
        const [cl,cr]=getLR(row); cur[0]+=cl; cur[1]+=cr; cityData.set(city, cur);
      }
    }

    // ── City × Source breakdown ──
    const citySourceByS = new Map(); // city → Map<src,[l,r]>
    if (openState && hasCitySrc) {
      for (const row of csm_data) {
        if (maps.lm[row[2]] !== M) continue;
        const cti = row[0];
        const sti = maps.city_state[cti];
        if (sti == null || maps.st[sti] !== openState) continue;
        const city = maps.city[cti];
        if (hasCityFlt && !filters.cities.has(city)) continue;
        const src  = maps.src[row[1]];
        if (!citySourceByS.has(city)) citySourceByS.set(city, new Map());
        const bySrc = citySourceByS.get(city);
        const cur = bySrc.get(src)||[0,0];
        const [cl,cr]=getLR(row); cur[0]+=cl; cur[1]+=cr; bySrc.set(src,cur);
      }
    }

    // ── Dealer totals for the open city (from cdm) ──
    const dealerData = new Map(); // dealer → [l,r]
    if (openCity && hasDealers) {
      const oci = cityIndexMap.get(openCity) ?? -1;
      if (oci >= 0) {
        for (const row of cdm) {
          if (row[0] !== oci) continue;
          if (maps.lm[row[2]] !== M) continue;
          const dl = maps.dl[row[1]];
          const cur = dealerData.get(dl)||[0,0];
          const [dll,dlr]=getLR(row); cur[0]+=dll; cur[1]+=dlr; dealerData.set(dl, cur);
        }
      }
    }

    // ── Dealer × Source breakdown ──
    const dealerSourceByS = new Map(); // dealer → Map<src,[l,r]>
    if (openCity && hasDealerSrc) {
      const oci = cityIndexMap.get(openCity) ?? -1;
      if (oci >= 0) {
        for (const row of cdsm_data) {
          if (row[0] !== oci) continue;
          if (maps.lm[row[3]] !== M) continue;
          const dl  = maps.dl[row[1]];
          const src = maps.src[row[2]];
          if (!dealerSourceByS.has(dl)) dealerSourceByS.set(dl, new Map());
          const bySrc = dealerSourceByS.get(dl);
          const cur = bySrc.get(src)||[0,0];
          const [dll,dlr]=getLR(row); cur[0]+=dll; cur[1]+=dlr; bySrc.set(src,cur);
        }
      }
    }

    // ── Group states into zones ──
    const zoneData = new Map();
    for (const [state, sd] of stateData) {
      const zone = getZone(state);
      if (!zoneData.has(zone)) zoneData.set(zone, { states:[], total:[0,0], bySrc:new Map() });
      const zd = zoneData.get(zone);
      zd.states.push(state);
      zd.total[0]+=sd.total[0]; zd.total[1]+=sd.total[1];
      for (const [src,[l,r]] of sd.byS) {
        const c = zd.bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; zd.bySrc.set(src,c);
      }
    }

    const grandSrc = {};
    for (const [s,v] of grandSrcMap) grandSrc[s] = fin(v[0],v[1]);
    const grand = fin(gL,gR);
    const ZONE_ORDER = ['North','West','South','East','Central','Northeast','Other'];

    function buildSrcMap(bySrc) {
      const sm = {};
      for (const [s,v] of bySrc) sm[s] = fin(v[0],v[1]);
      return sm;
    }

    function grpCells(srcMap, grp, denomL) {
      const denom = denomL != null ? denomL : gL;
      const exp = expandedGrps.has(grp.id);
      if (!exp) {
        const a = grpSum(srcMap, grp.srcs);
        return [
          ce('td',{key:grp.id+'l',style:{borderLeft:'2px solid '+grp.color+'44'}},Nf(a.l)),
          ce('td',{key:grp.id+'r',style:{color:grp.color,fontWeight:700}},Nf(a.r)),
          ce('td',{key:grp.id+'c'},denom>0?Pf(a.l/denom*100):'—'),
          ce('td',{key:grp.id+'l2r',style:{color:'#D97706',fontWeight:600}},Pf(a.l2r)),
        ];
      }
      return grp.subGroups.filter(sg=>sg.srcs.length>0).flatMap((sg,si) => {
        const a = grpSum(srcMap,sg.srcs);
        return [
          ce('td',{key:sg.id+'l',style:si===0?{borderLeft:'2px solid '+grp.color+'44'}:{}},Nf(a.l)),
          ce('td',{key:sg.id+'r',style:{color:sg.color,fontWeight:700}},Nf(a.r)),
          ce('td',{key:sg.id+'c'},denom>0?Pf(a.l/denom*100):'—'),
          ce('td',{key:sg.id+'l2r',style:{color:'#D97706',fontWeight:600}},Pf(a.l2r)),
        ];
      });
    }

    // Blank source cells for city/dealer rows (no source breakdown at those levels)
    function blankSrcCells(bgColor) {
      return srcGroups.flatMap((grp,gi) => {
        const exp = expandedGrps.has(grp.id);
        const slots = exp ? grp.subGroups.filter(sg=>sg.srcs.length>0).length : 1;
        return Array.from({length:slots},(_,i) => [
          ce('td',{key:grp.id+i+'l',style:{color:'#CBD5E1',background:bgColor,borderLeft:i===0?'2px solid '+grp.color+'22':undefined}},''),
          ce('td',{key:grp.id+i+'r',style:{color:'#CBD5E1',background:bgColor}},''),
          ce('td',{key:grp.id+i+'c',style:{color:'#CBD5E1',background:bgColor}},''),
          ce('td',{key:grp.id+i+'q',style:{color:'#CBD5E1',background:bgColor}},''),
        ]).flat();
      });
    }

    // ── Headers ──
    const hdr1 = [
      ce('th',{key:'dim',className:'left',rowSpan:2,style:{minWidth:220,zIndex:3,background:'#E8EAF6',color:'#1A237E'}},'Zone / State / City / Dealer'),
      ce('th',{key:'tot',colSpan:4,style:{background:'#E8EAF6',color:'#1A237E'}},'TOTAL'),
      ...(viewerMode ? [] : srcGroups.map(grp => {
        const exp = expandedGrps.has(grp.id);
        const sgs = grp.subGroups.filter(sg=>sg.srcs.length>0);
        return ce('th',{key:grp.id,colSpan:exp?sgs.length*4:4,
          className:'grp-toggle',style:{background:grp.lightColor||'#F3F4F6',color:grp.color,borderTop:'2px solid '+grp.color},
          onClick:()=>onToggleGrp(grp.id)
        },(exp?'▴ ':'▾ ')+grp.label);
      }))
    ];
    const hdr2 = [
      ce('th',{key:'tl',className:'sub'},'Leads'),ce('th',{key:'tr',className:'sub'},'Retail'),
      ce('th',{key:'tc',className:'sub'},'Contrib%'),ce('th',{key:'tl2r',className:'sub'},'L2R%'),
      ...(viewerMode ? [] : srcGroups.flatMap(grp => {
        const exp = expandedGrps.has(grp.id);
        if (!exp) return [
          ce('th',{key:grp.id+'l',className:'sub',style:{borderLeft:'2px solid '+grp.color+'44'}},'Leads'),
          ce('th',{key:grp.id+'r',className:'sub'},'Retail'),
          ce('th',{key:grp.id+'c',className:'sub'},'Contrib%'),
          ce('th',{key:grp.id+'l2r',className:'sub'},'L2R%'),
        ];
        return grp.subGroups.filter(sg=>sg.srcs.length>0).flatMap((sg,si) => [
          ce('th',{key:sg.id+'l',className:'sub',style:si===0?{borderLeft:'2px solid '+grp.color+'44'}:{},title:sg.label},sg.label+' L'),
          ce('th',{key:sg.id+'r',className:'sub',title:sg.label},sg.label+' R'),
          ce('th',{key:sg.id+'c',className:'sub',title:sg.label},'Contrib%'),
          ce('th',{key:sg.id+'l2r',className:'sub',title:sg.label},'L2R%'),
        ]);
      }))
    ];

    const bodyRows = [];

    for (const zone of ZONE_ORDER) {
      const zd = zoneData.get(zone);
      if (!zd || zd.total[0] === 0) continue;
      const zLeads = zd.total[0];  // zone total leads — denominator for state Contrib%
      const zRets  = zd.total[1];
      const zL2R   = zLeads > 0 ? zRets / zLeads * 100 : 0;
      const zSrcMap = buildSrcMap(zd.bySrc);
      const isZOpen = openZone === zone;

      // ── Zone row ──
      bodyRows.push(ce('tr',{key:'z_'+zone,className:'section-row',onClick:()=>onClickZone(zone),style:{cursor:'pointer'}},
        ce('td',{className:'label',style:{color:'#0D47A1'}},
          ce('span',{style:{display:'flex',alignItems:'center',gap:6}},
            ce('span',{style:{fontSize:11}},isZOpen?'▾':'▸'),
            zone+' Zone'
          )
        ),
        ce('td',null,Nf(zLeads)),ce('td',{style:{color:'#1565C0',fontWeight:700}},Nf(zRets)),
        ce('td',null,gL>0?Pf(zLeads/gL*100):'—'),ce('td',{style:{color:'#D97706',fontWeight:700}},zL2R>0?Pf(zL2R):'—'),
        ...(viewerMode ? [] : srcGroups.flatMap(grp=>grpCells(zSrcMap,grp)))
      ));
      if (!isZOpen) continue;

      for (const state of zd.states.sort()) {
        const sd = stateData.get(state);
        if (!sd) continue;
        const sLeads = sd.total[0];  // state leads — denominator for city Contrib%
        const sRets  = sd.total[1];
        const sL2R   = sLeads > 0 ? sRets / sLeads * 100 : 0;
        const sSrcMap = buildSrcMap(sd.byS);
        const isSOpen = openState === state;

        // ── State row ──
        bodyRows.push(ce('tr',{key:'s_'+state,className:'sub-row',
          onClick:hasCities?()=>onClickState(state):undefined,
          style:{cursor:hasCities?'pointer':'default'}
        },
          ce('td',{className:'sub-label',style:{paddingLeft:28}},
            ce('span',{style:{display:'flex',alignItems:'center',gap:5}},
              hasCities&&ce('span',{style:{fontSize:10,color:'#94A3B8',flexShrink:0}},isSOpen?'▾':'▸'),
              state
            )
          ),
          ce('td',null,Nf(sLeads)),ce('td',{style:{color:'#E31837',fontWeight:700}},Nf(sRets)),
          ce('td',null,zLeads>0?Pf(sLeads/zLeads*100):'—'),ce('td',{style:{color:'#D97706',fontWeight:600}},sL2R>0?Pf(sL2R):'—'),
          ...(viewerMode ? [] : srcGroups.flatMap(grp=>grpCells(sSrcMap,grp,zLeads)))
        ));
        if (!isSOpen) continue;

        const sortedCities = [...cityData.keys()].sort();
        for (const city of sortedCities) {
          const cv = cityData.get(city);
          const cLeads = cv[0];  // city leads — denominator for dealer Contrib%
          const cRets  = cv[1];
          const cL2R   = cLeads > 0 ? cRets / cLeads * 100 : 0;
          const isCOpen = openCity === city;

          // ── City row ──
          bodyRows.push(ce('tr',{key:'c_'+city,className:'city-row',
            onClick:hasDealers?()=>onClickCity(city):undefined,
            style:{cursor:hasDealers?'pointer':'default'}
          },
            ce('td',{className:'label',style:{paddingLeft:48,fontWeight:500,fontSize:11.5,color:'#166534',background:'#F0FDF4',borderRight:'2px solid #BBF7D0'}},
              ce('span',{style:{display:'flex',alignItems:'center',gap:5}},
                hasDealers&&ce('span',{style:{fontSize:10,color:'#86EFAC',flexShrink:0}},isCOpen?'▾':'▸'),
                city
              )
            ),
            ce('td',{style:{background:'#F0FDF4'}},Nf(cLeads)),
            ce('td',{style:{background:'#F0FDF4',color:'#16A34A',fontWeight:700}},Nf(cRets)),
            ce('td',{style:{background:'#F0FDF4'}},sLeads>0?Pf(cLeads/sLeads*100):'—'),
            ce('td',{style:{background:'#F0FDF4',color:'#D97706',fontWeight:600}},cL2R>0?Pf(cL2R):'—'),
            ...(viewerMode ? [] : hasCitySrc
              ? srcGroups.flatMap(grp => grpCells(buildSrcMap(citySourceByS.get(city) || new Map()), grp, sLeads))
              : blankSrcCells('#F0FDF4'))
          ));
          if (!isCOpen) continue;

          // ── Dealer rows (sorted by leads desc) ──
          const sortedDealers = [...dealerData.keys()].sort((a,b)=>(dealerData.get(b)[0]||0)-(dealerData.get(a)[0]||0));
          for (const dl of sortedDealers) {
            const dv = dealerData.get(dl);
            const dLeads = dv[0];
            const dRets  = dv[1];
            const dL2R   = dLeads > 0 ? dRets / dLeads * 100 : 0;
            bodyRows.push(ce('tr',{key:'d_'+dl,className:'dealer-row'},
              ce('td',{className:'label',style:{paddingLeft:68,fontWeight:400,fontSize:11,color:'#64748B',background:'#FAFAFA',borderRight:'2px solid #F1F5F9'}},dl),
              ce('td',{style:{background:'#FAFAFA'}},Nf(dLeads)),
              ce('td',{style:{background:'#FAFAFA',color:'#0D9488',fontWeight:700}},Nf(dRets)),
              ce('td',{style:{background:'#FAFAFA'}},cLeads>0?Pf(dLeads/cLeads*100):'—'),
              ce('td',{style:{background:'#FAFAFA',color:'#D97706',fontWeight:600}},dL2R>0?Pf(dL2R):'—'),
              ...(viewerMode ? [] : hasDealerSrc
                ? srcGroups.flatMap(grp => grpCells(buildSrcMap(dealerSourceByS.get(dl) || new Map()), grp, cLeads))
                : blankSrcCells('#FAFAFA'))
            ));
          }
        }
      }
    }

    // Grand Total at bottom
    bodyRows.push(ce('tr',{key:'gtotal',className:'total-row'},
      ce('td',{className:'label',style:{color:'#1A237E'}},'∑ Grand Total'),
      ce('td',null,Nf(gL)),ce('td',{style:{color:'#E31837',fontWeight:700}},Nf(gR)),
      ce('td',null,'100.0%'),ce('td',{style:{color:'#D97706',fontWeight:700}},grand.l2r>0?Pf(grand.l2r):'—'),
      ...(viewerMode ? [] : srcGroups.flatMap(grp=>grpCells(grandSrc,grp)))
    ));

    return { grand, hdr1, hdr2, bodyRows };
  }, [stm, univ, cm, cdm, csm_data, cdsm_data, maps, filters, expandedGrps, openZone, openState, openCity, srcGroups, hasCities, hasDealers, hasCitySrc, hasDealerSrc, cityIndexMap, getLR, viewerMode]);

  const stateSummaryAgg = useMemo(() => {
    const univF = makeUnivFilter(filters);
    const allState = !filters.states || filters.states.size === 0;
    if (univF) {
      return aggAll(
        univ, maps, filters.months, filters.sources,
        (row,m) => m.st[row[2]], (row,m) => m.src[row[1]], (row,m) => m.lm[row[4]],
        allState ? univF : (row,m) => univF(row,m) && filters.states.has(m.st[row[2]]),
        getLR
      );
    }
    return aggAll(
      stm, maps, filters.months, filters.sources,
      (row,m) => m.st[row[0]], (row,m) => m.src[row[1]], (row,m) => m.lm[row[2]],
      allState ? null : (row,m) => filters.states.has(m.st[row[0]]),
      getLR
    );
  }, [stm, univ, maps, filters, getLR]);

  return ce('div', { className:'fade-up' },
    stateSummaryAgg && stateSummaryAgg.grand.l > 0 &&
      ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
        ce('div', { className:'section-title', style:{marginBottom:10} }, '∑ All Months — State Summary'),
        ce(DimGrid, { agg:stateSummaryAgg, srcGroups, dimLabel:'State', expandedGrps, onToggleGrp, viewerMode })
      ),
    months.map(M => {
      const grid = renderMonthGrid(M);
      if (!grid || (grid.grand.l === 0 && grid.grand.r === 0)) return null;
      return ce('div', { key:M, className:'card', style:{padding:'16px 18px',marginBottom:14} },
        ce('div', { className:'section-title', style:{marginBottom:10} }, 'State × Source — ' + M),
        ce('div', { className:'scroll-x' },
          ce('table', null,
            ce('thead', null,
              ce('tr', null, ...grid.hdr1),
              ce('tr', null, ...grid.hdr2),
            ),
            ce('tbody', null, ...grid.bodyRows)
          )
        )
      );
    })
  );
});

/* ════════════════════════════════════════════════════════════════════
   BUYING INTENT TAB
   ════════════════════════════════════════════════════════════════════ */
const BuyingIntentTab = React.memo(function BuyingIntentTab({ data, filters, months, RT }) {
  const { maps, bdm } = data;
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const allSrcs = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const [expandedGrps, setExpandedGrps] = useState(new Set());
  const onToggleGrp = useCallback(id => setExpandedGrps(prev => {
    const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n;
  }), []);

  const renderAgg = useCallback((M) => {
    const allS = !filters.sources || filters.sources.size === 0;
    const byBucket = new Map();
    const bySrc = new Map();
    const byBucketSrc = new Map();
    let gL=0,gR=0;
    for (const row of bdm) {
      if (maps.lm[row[2]] !== M) continue;
      const src = maps.src[row[1]];
      if (!allS && !filters.sources.has(src)) continue;
      const bucket = bdBucket(row[0]);
      const [l,r]=getLR(row);
      gL+=l; gR+=r;
      const cb = byBucket.get(bucket)||[0,0]; cb[0]+=l; cb[1]+=r; byBucket.set(bucket,cb);
      const cs = bySrc.get(src)||[0,0]; cs[0]+=l; cs[1]+=r; bySrc.set(src,cs);
      const k=bucket+'\x00'+src;
      const cbs = byBucketSrc.get(k)||[0,0]; cbs[0]+=l; cbs[1]+=r; byBucketSrc.set(k,cbs);
    }
    const grandSrc = {};
    for (const [s,v] of bySrc) grandSrc[s] = fin(v[0],v[1]);
    const dimAggs = {};
    for (const [b,bv] of byBucket) {
      const srcAgg = {};
      for (const s of bySrc.keys()) {
        const v = byBucketSrc.get(b+'\x00'+s);
        srcAgg[s] = v ? fin(v[0],v[1]) : EMPTY;
      }
      dimAggs[b] = { total: fin(bv[0],bv[1]), src: srcAgg };
    }
    // Sort by bucket order
    const orderedDimAggs = {};
    for (const bk of BD_BUCKETS) if (dimAggs[bk]) orderedDimAggs[bk] = dimAggs[bk];
    return { grand: fin(gL,gR), grandSrc, dimAggs: orderedDimAggs };
  }, [bdm, maps, filters, getLR]);

  // Override DimGrid sort (buckets should follow BD_BUCKETS order, not desc leads)
  const renderAggWithOrder = useCallback((M) => {
    const agg = renderAgg(M);
    if (!agg) return null;
    // DimGrid sorts by l desc — we want bucket order. Inject rank prefix
    const orderedDimAggs = {};
    BD_BUCKETS.forEach((bk, i) => {
      if (agg.dimAggs[bk]) orderedDimAggs['\x00'+i+bk] = agg.dimAggs[bk];
    });
    return { ...agg, dimAggs: orderedDimAggs, _labels: (k => k.replace(/^\x00\d/, '')) };
  }, [renderAgg]);

  // Summary agg across all months with bucket order preserved
  const bdSummaryAgg = useMemo(() => {
    let gL=0, gR=0;
    const gsAcc={}, daAcc={};
    for (const M of months) {
      const agg = renderAgg(M);
      if (!agg || (agg.grand.l===0 && agg.grand.r===0)) continue;
      gL+=agg.grand.l; gR+=agg.grand.r;
      for (const [s,sv] of Object.entries(agg.grandSrc)) {
        if (!gsAcc[s]) gsAcc[s]=[0,0]; gsAcc[s][0]+=sv.l; gsAcc[s][1]+=sv.r;
      }
      for (const [d,da] of Object.entries(agg.dimAggs)) {
        if (!daAcc[d]) daAcc[d]={total:[0,0],src:{}};
        daAcc[d].total[0]+=da.total.l; daAcc[d].total[1]+=da.total.r;
        for (const [s,sv] of Object.entries(da.src)) {
          if (!daAcc[d].src[s]) daAcc[d].src[s]=[0,0];
          daAcc[d].src[s][0]+=sv.l; daAcc[d].src[s][1]+=sv.r;
        }
      }
    }
    if (gL===0) return null;
    const grandSrc={};
    for (const [s,v] of Object.entries(gsAcc)) grandSrc[s]=fin(v[0],v[1]);
    const dimAggsRaw={};
    for (const [d,dv] of Object.entries(daAcc)) {
      const srcAgg={};
      for (const [s,sv] of Object.entries(dv.src)) srcAgg[s]=fin(sv[0],sv[1]);
      dimAggsRaw[d]={total:fin(dv.total[0],dv.total[1]),src:srcAgg};
    }
    // Restore BD_BUCKETS order with " days" suffix
    const dimAggs={};
    BD_BUCKETS.forEach(bk => { if (dimAggsRaw[bk]) dimAggs[bk+' days']=dimAggsRaw[bk]; });
    return {grand:fin(gL,gR),grandSrc,dimAggs};
  }, [months, renderAgg]);
  return ce('div', { className:'fade-up' },
    bdSummaryAgg && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { className:'section-title', style:{marginBottom:10} }, '∑ All Months — Buying Intent Summary'),
      ce(DimGrid, { agg:bdSummaryAgg, srcGroups, dimLabel:'Intent (Days)', expandedGrps, onToggleGrp, noSort:true })
    ),
    months.map(M => {
      const agg = renderAgg(M);
      if (!agg || (agg.grand.l === 0 && agg.grand.r === 0)) return null;
      // Rebuild dimAggs in canonical bucket order so noSort preserves it
      const orderedAgg = { ...agg, dimAggs: {} };
      BD_BUCKETS.forEach(bk => { if (agg.dimAggs[bk]) orderedAgg.dimAggs[bk + ' days'] = agg.dimAggs[bk]; });

      return ce('div', { key:M, className:'card', style:{padding:'16px 18px',marginBottom:14} },
        ce('div', { className:'section-title', style:{marginBottom:10} }, 'Buying Intent — ' + M),
        ce(DimGrid, { agg: orderedAgg, srcGroups, dimLabel:'Intent (Days)', expandedGrps, onToggleGrp, noSort: true })
      );
    })
  );
});
